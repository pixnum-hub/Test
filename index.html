<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsecheck — Website Downtime Checker</title>
<style>
  :root{
    --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --font-sans:'Inter',-apple-system,Segoe UI,sans-serif;
    --radius:10px;
  }
  html[data-theme="dark"]{
    --bg:#0b0e11; --panel:#12161b; --panel2:#181d24; --border:#232a33;
    --text:#e6edf3; --sub:#8b98a5; --up:#00d97e; --down:#ff5c5c; --pend:#ffb020;
    --accent:#00d97e; --focus:#4fd1ff;
  }
  html[data-theme="light"]{
    --bg:#f3f5f7; --panel:#ffffff; --panel2:#eef1f4; --border:#dbe1e6;
    --text:#161b20; --sub:#5b6670; --up:#0a9d5c; --down:#d33b3b; --pend:#b6790a;
    --accent:#0a9d5c; --focus:#0072e0;
  }
  html[data-theme="oled"]{
    --bg:#000000; --panel:#000000; --panel2:#0a0a0a; --border:#1c1c1c;
    --text:#eaeaea; --sub:#7a7a7a; --up:#00e08a; --down:#ff5252; --pend:#ffb020;
    --accent:#00e08a; --focus:#4fd1ff;
  }
  html[data-theme="hc"]{
    --bg:#000000; --panel:#000000; --panel2:#000000; --border:#ffffff;
    --text:#ffffff; --sub:#ffffff; --up:#00ff6a; --down:#ff2a2a; --pend:#ffd400;
    --accent:#ffff00; --focus:#ffff00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-sans);
    min-height:100vh; display:flex; flex-direction:column;
    transition:background .2s,color .2s;
  }
  a{color:var(--accent)}
  header{
    padding:18px 16px 10px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-mono)}
  .dot-logo{width:12px;height:12px;border-radius:50%;background:var(--up);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--up) 25%, transparent);
    animation:beat 1.8s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  .brand h1{font-size:1.05rem; letter-spacing:.03em}
  .brand span{color:var(--sub); font-size:.75rem}
  .theme-toggle{display:flex; gap:4px; background:var(--panel2); border:1px solid var(--border);
    border-radius:999px; padding:3px;}
  .theme-toggle button{
    border:none; background:transparent; color:var(--sub); width:34px; height:30px;
    border-radius:999px; cursor:pointer; font-size:.9rem; font-family:var(--font-mono);
  }
  .theme-toggle button[aria-pressed="true"]{background:var(--accent); color:#04140c; font-weight:700}
  html[data-theme="hc"] .theme-toggle button[aria-pressed="true"]{color:#000}
  main{flex:1; width:100%; max-width:720px; margin:0 auto; padding:6px 16px 24px;}
  form.add{
    display:flex; gap:8px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  form.add input{
    flex:1 1 160px; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-family:var(--font-mono); font-size:.9rem; min-width:0;
  }
  form.add input:focus, .theme-toggle button:focus-visible, .sitebtn:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  form.add button{
    background:var(--accent); color:#04140c; border:none; border-radius:8px;
    padding:0 18px; font-weight:700; cursor:pointer; font-family:var(--font-mono);
  }
  html[data-theme="hc"] form.add button{color:#000}
  .empty{color:var(--sub); text-align:center; padding:40px 10px; font-family:var(--font-mono); font-size:.85rem}
  .filters{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center}
  .filters button{
    background:var(--panel); border:1px solid var(--border); color:var(--sub);
    border-radius:999px; padding:6px 13px; font-size:.75rem; font-family:var(--font-mono); cursor:pointer;
  }
  .filters button[aria-pressed="true"]{background:var(--accent); color:#04140c; border-color:var(--accent); font-weight:700}
  html[data-theme="hc"] .filters button[aria-pressed="true"]{color:#000}
  .filters .count{margin-left:auto; color:var(--sub); font-size:.72rem; font-family:var(--font-mono)}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .card-top{display:flex; align-items:center; gap:10px}
  .status-dot{width:11px;height:11px;border-radius:50%; flex:none; background:var(--sub)}
  .status-dot.up{background:var(--up); box-shadow:0 0 8px color-mix(in srgb, var(--up) 60%, transparent)}
  .status-dot.down{background:var(--down); box-shadow:0 0 8px color-mix(in srgb, var(--down) 60%, transparent)}
  .status-dot.pend{background:var(--pend); animation:beat 1s ease-in-out infinite}
  .card-info{flex:1; min-width:0}
  .card-info .name{font-weight:600; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px}
  .tag{font-size:.6rem; font-family:var(--font-mono); color:var(--sub); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px; flex:none; letter-spacing:.03em}
  .card-info .url{color:var(--sub); font-size:.75rem; font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card-meta{text-align:right; font-family:var(--font-mono); font-size:.75rem; color:var(--sub)}
  .card-meta .code.up{color:var(--up)}
  .card-meta .code.down{color:var(--down)}
  .sitebtn{background:none; border:1px solid var(--border); color:var(--sub); border-radius:6px;
    width:28px;height:28px; cursor:pointer; font-size:.85rem;}
  .pulse{display:flex; gap:2px; margin-top:12px; height:26px; align-items:flex-end}
  .pulse i{flex:1; background:var(--panel2); border-radius:2px; height:100%; display:block}
  .pulse i.up{background:var(--up)}
  .pulse i.down{background:var(--down)}
  .pulse i.pend{background:var(--pend); animation:beat 1s ease-in-out infinite}
  footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; text-align:center; padding:20px 16px 26px; border-top:1px solid var(--border);
    color:var(--sub); font-family:var(--font-mono); font-size:.75rem;
  }
  @media (min-width:600px){
    .card-top{gap:14px}
    main{padding-top:10px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot-logo"></span>
    <div><h1>PULSECHECK</h1><span>live status console</span></div>
  </div>
  <div class="theme-toggle" role="group" aria-label="Theme">
    <button data-theme="dark" aria-pressed="true" title="Dark">D</button>
    <button data-theme="light" aria-pressed="false" title="Light">L</button>
    <button data-theme="oled" aria-pressed="false" title="OLED True Black">O</button>
    <button data-theme="hc" aria-pressed="false" title="High Contrast">HC</button>
  </div>
</header>

<main>
  <form class="add" id="addForm">
    <input id="urlInput" type="text" placeholder="example.com or https://example.com" required autocomplete="off">
    <button type="submit">Add Site</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="world" aria-pressed="false">World</button>
    <button data-f="in" aria-pressed="false">India</button>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</main>

<footer>
  <div>© Manik Roy <span id="year"></span>. All Rights Reserved.</div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Theme ----------
const themeBtns = document.querySelectorAll('.theme-toggle button');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
}
themeBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));

// ---------- Seed data: 50 world's most popular + 25 India's most popular sites ----------
const WORLD = ['google.com','youtube.com','facebook.com','instagram.com','whatsapp.com','wikipedia.org',
  'x.com','amazon.com','yahoo.com','tiktok.com','netflix.com','reddit.com','linkedin.com','bing.com',
  'baidu.com','yandex.ru','live.com','microsoft.com','apple.com','pinterest.com','temu.com','canva.com',
  'cnn.com','bbc.com','nytimes.com','ebay.com','twitch.tv','spotify.com','zoom.us','openai.com',
  'discord.com','telegram.org','quora.com','github.com','stackoverflow.com','dropbox.com','adobe.com',
  'salesforce.com','paypal.com','walmart.com','aliexpress.com','samsung.com','weather.com','indeed.com',
  'booking.com','imdb.com','espn.com','roblox.com','duckduckgo.com','wordpress.com'];
const INDIA = ['flipkart.com','hotstar.com','irctc.co.in','ndtv.com','timesofindia.indiatimes.com',
  'hindustantimes.com','indiatimes.com','zomato.com','swiggy.com','paytm.com','myntra.com','bookmyshow.com',
  'naukri.com','rediff.com','moneycontrol.com','jiocinema.com','sbi.co.in','icicibank.com','hdfcbank.com',
  'olx.in','shaadi.com','quikr.com','makemytrip.com','cleartrip.com','indianrail.gov.in'];

// ---------- State ----------
const sites = [];         // {id, name, url, tag, status:'pend'|'up'|'down', code, time, history:[]}
const HISTORY_LEN = 24;
const REFRESH_MS = 60000;
let uid = 0;
let filter = 'all';

const listEl = document.getElementById('list');
const form = document.getElementById('addForm');
const input = document.getElementById('urlInput');
const countEl = document.getElementById('count');

function makeSite(domain, tag){
  return { id: uid++, url: 'https://' + domain, name: domain, tag,
    status:'pend', code:null, time:null, history:[] };
}
WORLD.forEach(d => sites.push(makeSite(d, 'world')));
INDIA.forEach(d => sites.push(makeSite(d, 'in')));

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x===b)));
  render();
});

function normalizeUrl(raw){
  let u = raw.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return new URL(u).toString(); } catch(e){ return null; }
}

function render(){
  const visible = sites.filter(s => filter === 'all' || s.tag === filter);
  countEl.textContent = visible.length + ' / ' + sites.length + ' sites';
  if(visible.length === 0){
    listEl.innerHTML = '<div class="empty">No sites monitored yet. Add one above to start pinging.</div>';
    return;
  }
  listEl.innerHTML = visible.map(s => `
    <div class="card">
      <div class="card-top">
        <span class="status-dot ${s.status}"></span>
        <div class="card-info">
          <div class="name">${s.name}${s.tag==='world'?'<span class="tag">WORLD</span>':s.tag==='in'?'<span class="tag">IN</span>':''}</div>
          <div class="url">${s.url}</div>
        </div>
        <div class="card-meta">
          <div class="code ${s.status}">${s.code ? 'HTTP ' + s.code : (s.status==='pend' ? 'checking…' : 'no response')}</div>
          <div>${s.time != null ? s.time + ' ms' : '—'}</div>
        </div>
        <button class="sitebtn" title="Recheck now" onclick="recheck(${s.id})">↻</button>
        <button class="sitebtn" title="Remove" onclick="removeSite(${s.id})">×</button>
      </div>
      <div class="pulse">${renderPulse(s.history)}</div>
    </div>
  `).join('');
}

function renderPulse(history){
  const bars = history.slice(-HISTORY_LEN);
  const pad = HISTORY_LEN - bars.length;
  let out = '';
  for(let i=0;i<pad;i++) out += '<i></i>';
  out += bars.map(h => `<i class="${h}"></i>`).join('');
  return out;
}

// ---------- Checking (free, no key, no signup CORS proxies) ----------
async function pingUrl(url){
  const t0 = performance.now();
  try{
    const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url), { cache:'no-store' });
    const time = Math.round(performance.now() - t0);
    if(!r.ok) throw new Error('proxy error');
    const data = await r.json();
    const code = data && data.status ? data.status.http_code : null;
    return { up: !!code && code < 400, code, time };
  }catch(e1){
    try{
      const t1 = performance.now();
      const r2 = await fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), { cache:'no-store' });
      const time2 = Math.round(performance.now() - t1);
      return { up: r2.ok, code: r2.status || null, time: time2 };
    }catch(e2){
      return { up:false, code:null, time:null };
    }
  }
}

async function checkSite(site){
  site.status = 'pend';
  render();
  const result = await pingUrl(site.url);
  site.status = result.up ? 'up' : 'down';
  site.code = result.code;
  site.time = result.time;
  site.history.push(site.status);
  if(site.history.length > HISTORY_LEN) site.history.shift();
  render();
}

function recheck(id){
  const s = sites.find(x => x.id === id);
  if(s) checkSite(s);
}

function removeSite(id){
  const i = sites.findIndex(x => x.id === id);
  if(i > -1){ sites.splice(i,1); render(); }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const url = normalizeUrl(input.value);
  if(!url) return alert('Please enter a valid domain or URL.');
  const site = makeSite(url.replace(/^https?:\/\//,'').replace(/\/$/,''), 'custom');
  site.url = url;
  sites.unshift(site);
  input.value = '';
  render();
  checkSite(site);
});

// Run checks through a small concurrency pool so 75+ sites don't fire at once
async function checkAll(){
  const POOL = 6;
  let i = 0;
  async function worker(){
    while(i < sites.length){
      const site = sites[i++];
      await checkSite(site);
    }
  }
  await Promise.all(Array.from({length: POOL}, worker));
}

render();
checkAll();
setInterval(checkAll, REFRESH_MS);
</script>
</body>
</html>
