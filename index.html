<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postiq — Medium Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"]{--bg:#FAF7F2;--surface:#FFFFFF;--ink:#1A1815;--sub:#726A5C;--accent:#A8790E;--border:#E4DDCC;--shadow:0 2px 10px rgba(26,24,21,.06);--bw:1px;--err:#B3261E;}
:root[data-theme="dark"]{--bg:#15130F;--surface:#1E1B15;--ink:#EEE8DA;--sub:#A99E88;--accent:#D8AE52;--border:#332E22;--shadow:0 2px 14px rgba(0,0,0,.35);--bw:1px;--err:#E5766B;}
:root[data-theme="oled"]{--bg:#000000;--surface:#000000;--ink:#EAEAEA;--sub:#8F8F8F;--accent:#CBA135;--border:#232323;--shadow:none;--bw:1px;--err:#E5766B;}
:root[data-theme="hc"]{--bg:#000000;--surface:#000000;--ink:#FFFFFF;--sub:#FFFFFF;--accent:#FFD400;--border:#FFFFFF;--shadow:none;--bw:2px;--err:#FF6B6B;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;transition:background .2s,color .2s;}
h1,h2,.serif{font-family:'Source Serif 4',Georgia,serif;}
main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:1.25rem 1rem 2rem;}
header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;max-width:780px;margin:0 auto;padding:1rem 1rem 0;width:100%;}
.brand h1{font-size:1.15rem;font-weight:600;margin:0;letter-spacing:.01em;}
.brand small{color:var(--sub);font-size:.7rem;display:block;letter-spacing:.08em;text-transform:uppercase;}
#themeBtn{background:var(--surface);border:var(--bw) solid var(--border);color:var(--ink);border-radius:999px;padding:.5rem .9rem;font-size:.75rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;}
#themeBtn:focus-visible,input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.hero{text-align:center;margin:1.5rem 0 1.5rem;}
.hero h2{font-size:clamp(1.35rem,5vw,1.85rem);font-weight:600;margin:0 0 .4rem;}
.hero p{color:var(--sub);font-size:.88rem;margin:0;}
.searchCard{background:var(--surface);border:var(--bw) solid var(--border);border-radius:14px;padding:1rem;box-shadow:var(--shadow);display:flex;gap:.5rem;flex-wrap:wrap;}
.searchCard input{flex:1 1 180px;min-width:0;background:transparent;border:none;color:var(--ink);font-size:1rem;padding:.5rem .25rem;font-family:inherit;}
.searchCard input::placeholder{color:var(--sub);}
.searchCard button{background:var(--accent);color:#1A1815;border:none;border-radius:9px;padding:.65rem 1.1rem;font-weight:700;font-size:.9rem;cursor:pointer;flex-shrink:0;}
.hidden{display:none !important;}
.rowControls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-top:.65rem;}
.seg{display:flex;border:var(--bw) solid var(--border);border-radius:9px;overflow:hidden;}
.seg button{background:var(--surface);color:var(--sub);border:none;padding:.4rem .8rem;font-size:.74rem;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--accent);color:#1A1815;}
.compareLink{background:none;border:none;color:var(--accent);font-weight:600;font-size:.78rem;cursor:pointer;padding:.3rem 0;}
#compareRow{margin-top:.6rem;}
.fieldError{color:var(--err);font-size:.78rem;margin:.4rem .1rem 0;display:none;}
.hint{color:var(--sub);font-size:.75rem;margin:.6rem .1rem 0;}
.histChips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem;}
.histChip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:.25rem .65rem;font-size:.72rem;cursor:pointer;color:var(--sub);}
#status{text-align:center;padding:2rem 0;color:var(--sub);font-size:.9rem;display:none;}
#status.show{display:block;}
#errorBox{display:none;background:var(--surface);border:var(--bw) solid var(--err);border-radius:12px;padding:1rem;margin-top:1rem;font-size:.9rem;}
#errorBox.show{display:block;}
#results{display:none;}
#results.show{display:block;}
.profiles{display:flex;flex-direction:column;gap:1.75rem;margin-top:1.5rem;}
@media(min-width:760px){.profiles.two{flex-direction:row;align-items:flex-start;}.profiles.two .profile{flex:1;min-width:0;}}
.profileLabel{font-family:'Source Serif 4',serif;font-weight:700;color:var(--accent);font-size:1.05rem;margin-bottom:.6rem;}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;}
.stat{background:var(--surface);border:var(--bw) solid var(--border);border-radius:12px;padding:.85rem .9rem;box-shadow:var(--shadow);}
.stat .num{font-family:'Source Serif 4',serif;font-size:1.4rem;font-weight:700;color:var(--accent);line-height:1;}
.stat .lbl{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-top:.3rem;}
.highlights{display:flex;flex-direction:column;gap:.5rem;background:var(--surface);border:var(--bw) solid var(--border);border-radius:12px;padding:.85rem 1rem;box-shadow:var(--shadow);margin-top:.75rem;}
.hrow{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;}
.hrow .hlbl{color:var(--sub);flex-shrink:0;}
.hrow .hval{text-align:right;font-weight:600;}
.block{margin:1.25rem 0;}
.block h3{font-size:.73rem;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);margin:0 0 .65rem;font-weight:600;}
.distBar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--border);}
.distLegend{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-top:.4rem;}
.histRow{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--sub);margin:.3rem 0;}
.histRow .lbl{width:2.6rem;flex-shrink:0;}
.histRow .bar{flex:1;background:var(--border);border-radius:4px;height:8px;}
.histRow .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;}
.histRow .n{width:1.4rem;text-align:right;color:var(--ink);font-weight:600;}
.dowRow{display:flex;gap:.35rem;align-items:flex-end;height:56px;}
.dowRow .bar{flex:1;background:var(--border);border-radius:3px 3px 0 0;display:flex;align-items:flex-end;height:100%;}
.dowRow .bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;}
.dowLabels{display:flex;gap:.35rem;font-size:.6rem;color:var(--sub);margin-top:.3rem;}
.dowLabels span{flex:1;text-align:center;}
.ledger{background:var(--surface);border:var(--bw) solid var(--border);border-radius:12px;padding:.9rem 1.1rem;box-shadow:var(--shadow);}
.tag-row{display:flex;align-items:baseline;gap:.35rem;padding:.35rem 0;font-size:.88rem;cursor:pointer;}
.tag-row .leader{flex:1;border-bottom:1px dotted var(--sub);margin-bottom:5px;opacity:.6;}
.tag-row .count{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
.cloud{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem;}
.cchip{border:1px solid var(--border);border-radius:999px;padding:.2rem .6rem;color:var(--ink);cursor:pointer;background:var(--surface);}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.chip{border:1px solid var(--border);border-radius:999px;padding:.15rem .55rem;font-size:.7rem;color:var(--sub);}
.postControls{display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap;}
.postControls input{flex:1 1 140px;background:var(--surface);border:var(--bw) solid var(--border);border-radius:8px;padding:.5rem .6rem;color:var(--ink);font-size:.85rem;}
.postControls select{background:var(--surface);border:var(--bw) solid var(--border);border-radius:8px;padding:.5rem .5rem;color:var(--ink);font-size:.8rem;}
.filterBadge{font-weight:600;color:var(--accent);cursor:pointer;font-size:.72rem;margin-left:.4rem;}
.postList{display:flex;flex-direction:column;gap:.75rem;}
.post{background:var(--surface);border:var(--bw) solid var(--border);border-radius:12px;padding:1rem;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;}
.post .ptitle{font-family:'Source Serif 4',serif;font-weight:600;font-size:1rem;line-height:1.3;margin:0 0 .4rem;}
.post .pmeta{color:var(--sub);font-size:.76rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
.post .pmeta .dot{opacity:.5;}
.post .chips{margin-top:.55rem;}
footer{border-top:var(--bw) solid var(--border);padding:1.25rem 1rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.25rem;}
footer p{margin:0;font-size:.78rem;color:var(--sub);}
footer .legal{font-weight:600;color:var(--ink);}
@media(min-width:600px){.statGrid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Postiq</h1><small>Medium post analytics</small>
  </div>
  <button id="themeBtn" type="button" aria-label="Toggle theme">☀ Light</button>
</header>

<main>
  <div class="hero">
    <h2>Read the numbers behind your words</h2>
    <p>Enter a public Medium handle to see publishing stats, pulled live from its RSS feed.</p>
  </div>

  <form class="searchCard" id="searchForm">
    <input id="handleInput" type="text" placeholder="@yourhandle or profile URL" autocomplete="off" required>
    <button type="submit">Analyze</button>
  </form>
  <div class="rowControls">
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="user" class="active">Writer</button>
      <button type="button" data-mode="pub">Publication</button>
    </div>
    <button type="button" class="compareLink" id="compareToggle">+ Compare another writer</button>
  </div>
  <div class="searchCard hidden" id="compareRow">
    <input id="handleInput2" type="text" placeholder="Second @handle to compare" autocomplete="off">
  </div>
  <p class="fieldError" id="fieldError"></p>
  <p class="hint">No login or API key needed — try <strong>@amanhimself</strong> or <strong>@Medium</strong>.</p>
  <div class="histChips" id="histChips"></div>

  <div id="status"></div>
  <div id="errorBox"></div>

  <div id="results">
    <div class="profiles" id="profiles"></div>
  </div>
</main>

<footer>
  <p class="legal">© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
  <p>Data via public RSS feeds · No signup required</p>
</footer>

<script>
const THEMES = [
  {id:'light', label:'☀ Light'},
  {id:'dark', label:'☾ Dark'},
  {id:'oled', label:'● OLED'},
  {id:'hc', label:'◐ HC'}
];
const root = document.documentElement;
const savedTheme = localStorage.getItem('postiq-theme');
let themeIdx = savedTheme ? THEMES.findIndex(t => t.id === savedTheme) : THEMES.findIndex(t => t.id === 'dark');
if (themeIdx < 0) themeIdx = 0;
applyTheme();
document.getElementById('themeBtn').addEventListener('click', () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  localStorage.setItem('postiq-theme', THEMES[themeIdx].id);
  applyTheme();
});
function applyTheme(){
  root.setAttribute('data-theme', THEMES[themeIdx].id);
  document.getElementById('themeBtn').textContent = THEMES[themeIdx].label;
}
document.getElementById('year').textContent = new Date().getFullYear();

const form = document.getElementById('searchForm');
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('errorBox');
const results = document.getElementById('results');

let mode = 'user';
let compareOn = false;
let primary = null;
const filterState = {tag:null, query:'', sort:'newest'};

document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); mode = b.dataset.mode;
  });
});
document.getElementById('compareToggle').addEventListener('click', ()=>{
  compareOn = !compareOn;
  document.getElementById('compareRow').classList.toggle('hidden', !compareOn);
  document.getElementById('compareToggle').textContent = compareOn ? '− Remove comparison' : '+ Compare another writer';
});

function getHistory(){ try{ return JSON.parse(localStorage.getItem('postiq-history')||'[]'); }catch(e){ return []; } }
function addHistory(h){
  let hist = getHistory().filter(x=>x!==h);
  hist.unshift(h);
  localStorage.setItem('postiq-history', JSON.stringify(hist.slice(0,5)));
  renderHistory();
}
function renderHistory(){
  const hist = getHistory();
  document.getElementById('histChips').innerHTML = hist.map(h=>`<span class="histChip">${escapeHtml(h)}</span>`).join('');
  document.querySelectorAll('.histChip').forEach(c=>c.addEventListener('click', ()=>{
    document.getElementById('handleInput').value = c.textContent;
    form.requestSubmit();
  }));
}
renderHistory();

function validateInput(s){
  if (!s || !s.trim()) return 'Enter a handle or URL.';
  if (/\s/.test(s.trim())) return 'Handles or URLs cannot contain spaces.';
  return '';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const raw = document.getElementById('handleInput').value.trim();
  const err = validateInput(raw);
  const fe = document.getElementById('fieldError');
  fe.textContent = err; fe.style.display = err ? 'block' : 'none';
  if (err) return;
  const raw2 = compareOn ? document.getElementById('handleInput2').value.trim() : '';
  runAnalysis(raw, raw2);
});

function feedUrlFor(raw, m){
  let s = raw.trim().replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/+$/,'').split('?')[0];
  if (/^medium\.com\//i.test(s)) s = s.slice('medium.com/'.length);
  s = s.split('/')[0];
  if (s.includes('.') && !/medium\.com/i.test(raw)) return `https://${s}/feed`;
  if (s.startsWith('@')) return `https://medium.com/feed/${s}`;
  if (m === 'pub') return `https://medium.com/feed/${s}`;
  return `https://medium.com/feed/@${s}`;
}

async function fetchFeed(raw, m){
  const feedUrl = feedUrlFor(raw, m);
  const api = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl);
  const res = await fetch(api);
  const data = await res.json();
  if (data.status !== 'ok' || !data.items || !data.items.length) throw new Error('no public posts found for "' + raw + '"');
  return data;
}

function setStatus(msg){
  statusEl.textContent = msg;
  statusEl.classList.toggle('show', !!msg);
  if (msg){ errorBox.classList.remove('show'); results.classList.remove('show'); }
}
function setError(msg){
  errorBox.textContent = msg;
  errorBox.classList.toggle('show', !!msg);
  if (msg) results.classList.remove('show');
}

async function runAnalysis(raw, raw2){
  setStatus('Fetching feed…'); setError('');
  try{
    const data1 = await fetchFeed(raw, mode);
    let data2 = null;
    if (raw2){ data2 = await fetchFeed(raw2, mode); }
    buildProfiles(raw, data1, raw2, data2);
    addHistory(raw.startsWith('@') ? raw : '@' + raw.split('/')[0]);
    updateUrl(raw, raw2);
    setStatus('');
  }catch(err){
    setStatus('');
    setError('Could not load stats — check the handle and try again (' + err.message + ').');
  }
}

function updateUrl(raw1, raw2){
  const params = new URLSearchParams();
  params.set('u', raw1);
  if (raw2) params.set('u2', raw2);
  if (mode === 'pub') params.set('mode', 'pub');
  history.replaceState(null, '', '?' + params.toString());
}

function profileTemplate(idx){
  return `<div class="profile">
    <div class="profileLabel" id="profileLabel${idx}"></div>
    <div class="statGrid" id="statGrid${idx}"></div>
    <div class="highlights" id="hl${idx}"></div>
    <div class="block"><h3>Reading time mix</h3><div class="distBar" id="dist${idx}"></div><div class="distLegend" id="distLeg${idx}"></div></div>
    <div class="block"><h3>Posts per month</h3><div id="hist${idx}"></div></div>
    <div class="block"><h3>Day of week</h3><div class="dowRow" id="dow${idx}"></div><div class="dowLabels" id="dowLbl${idx}"></div></div>
    <div class="block"><h3>Top tags</h3><div class="ledger" id="tagLedger${idx}"></div><div class="cloud" id="tagCloud${idx}"></div></div>
    ${idx===0 ? `
    <div class="block"><h3>Headline keywords</h3><div class="chips" id="kwChips"></div></div>
    <div class="block">
      <h3>Posts<span id="filterTag"></span></h3>
      <div class="postControls">
        <input id="postSearch" placeholder="Search titles…">
        <select id="postSort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="longest">Longest</option></select>
      </div>
      <div class="postList" id="postList"></div>
    </div>` : ''}
  </div>`;
}

function buildProfiles(raw1, data1, raw2, data2){
  const container = document.getElementById('profiles');
  container.classList.toggle('two', !!data2);
  container.innerHTML = profileTemplate(0) + (data2 ? profileTemplate(1) : '');
  filterState.tag = null; filterState.query = ''; filterState.sort = 'newest';
  renderProfile(0, raw1, data1.items);
  if (data2) renderProfile(1, raw2, data2.items);
  results.classList.add('show');
  document.getElementById('postSearch').addEventListener('input', e=>{ filterState.query = e.target.value; updatePostList(); });
  document.getElementById('postSort').addEventListener('change', e=>{ filterState.sort = e.target.value; updatePostList(); });
}

function computeProfile(items){
  const words = items.map(it => wordCount(it.content || it.description));
  const totalWords = words.reduce((a,b)=>a+b,0);
  const avgWords = Math.round(totalWords/items.length);
  const avgRead = Math.max(1, Math.round(avgWords/200));
  const readTimes = words.map(w => Math.max(1, Math.round(w/200)));
  const dates = items.map(it => new Date(it.pubDate));

  const tagCount = {};
  items.forEach(it => (it.categories||[]).forEach(c => tagCount[c] = (tagCount[c]||0)+1));
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const sortedDates = [...dates].sort((a,b)=>a-b);
  const spanDays = Math.max(1, (sortedDates[sortedDates.length-1] - sortedDates[0]) / 86400000);
  const perMonth = (items.length / (spanDays/30.44)).toFixed(1);

  let longest = {w:-1}, shortest = {w:Infinity};
  items.forEach((it,i)=>{
    if (words[i] > longest.w) longest = {t:it.title, w:words[i]};
    if (words[i] < shortest.w) shortest = {t:it.title, w:words[i]};
  });
  const recentIdx = dates.reduce((bi,d,i,arr)=> d > arr[bi] ? i : bi, 0);
  const mostRecent = {t: items[recentIdx].title, d: dates[recentIdx]};

  const weekNums = [...new Set(dates.map(d=>{
    const onejan = new Date(d.getFullYear(),0,1);
    return d.getFullYear()*100 + Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  }))].sort((a,b)=>b-a);
  let streak = 1;
  for (let i=1;i<weekNums.length;i++){ if (weekNums[i] === weekNums[i-1]-1) streak++; else break; }

  const avgTitleLen = Math.round(items.reduce((a,it)=>a+it.title.length,0)/items.length);

  const dist = {short:0, medium:0, long:0};
  readTimes.forEach(rt => { if (rt<4) dist.short++; else if (rt<=8) dist.medium++; else dist.long++; });

  const monthMap = {};
  dates.forEach(d => { const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); monthMap[k]=(monthMap[k]||0)+1; });
  const months = Object.entries(monthMap).sort((a,b)=> a[0]<b[0]?-1:1).slice(-6);

  const dow = [0,0,0,0,0,0,0];
  dates.forEach(d => dow[d.getDay()]++);

  const linkCounts = items.map(it => {
    const div = document.createElement('div'); div.innerHTML = it.content || it.description || '';
    return div.querySelectorAll('a').length;
  });

  return {words, readTimes, totalWords, avgRead, topTags, perMonth, longest, shortest, mostRecent, streak, avgTitleLen, dist, months, dow, linkCounts};
}

function keywordFreq(items){
  const stop = new Set(['the','a','an','and','or','of','to','in','on','for','is','are','with','my','how','why','this','that','your','you','it','at','by','from','as','be','was','were','but','not','we','our','us','if','so','do','did','just','can','will','new','what']);
  const freq = {};
  items.forEach(it => it.title.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).forEach(w=>{
    if (w.length>2 && !stop.has(w)) freq[w]=(freq[w]||0)+1;
  }));
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

function renderProfile(idx, label, items){
  const p = computeProfile(items);
  document.getElementById('profileLabel'+idx).textContent = label;

  const stats = [
    [items.length,'Posts in feed'],
    [p.avgRead+' min','Avg read time'],
    [p.totalWords.toLocaleString(),'Total words'],
    [p.perMonth,'Posts / month'],
    [p.streak,'Week streak'],
    [p.avgTitleLen,'Avg title chars']
  ];
  document.getElementById('statGrid'+idx).innerHTML = stats.map(([n,l])=>`<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');

  document.getElementById('hl'+idx).innerHTML = `
    <div class="hrow"><span class="hlbl">Longest</span><span class="hval">${escapeHtml(trunc(p.longest.t,32))} · ${p.longest.w}w</span></div>
    <div class="hrow"><span class="hlbl">Shortest</span><span class="hval">${escapeHtml(trunc(p.shortest.t,32))} · ${p.shortest.w}w</span></div>
    <div class="hrow"><span class="hlbl">Latest</span><span class="hval">${escapeHtml(trunc(p.mostRecent.t,32))} · ${relTime(p.mostRecent.d)}</span></div>`;

  const total = items.length;
  document.getElementById('dist'+idx).innerHTML = `<span style="width:${p.dist.short/total*100}%;background:#7BAE7F"></span><span style="width:${p.dist.medium/total*100}%;background:var(--accent)"></span><span style="width:${p.dist.long/total*100}%;background:var(--err)"></span>`;
  document.getElementById('distLeg'+idx).innerHTML = `<span>Short ${p.dist.short}</span><span>Medium ${p.dist.medium}</span><span>Long ${p.dist.long}</span>`;

  const maxMonth = Math.max(...p.months.map(m=>m[1]),1);
  document.getElementById('hist'+idx).innerHTML = p.months.map(([k,c])=>{
    const [y,m] = k.split('-');
    const lbl = new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short'});
    return `<div class="histRow"><span class="lbl">${lbl}</span><span class="bar"><i style="width:${c/maxMonth*100}%"></i></span><span class="n">${c}</span></div>`;
  }).join('');

  const maxDow = Math.max(...p.dow,1);
  document.getElementById('dow'+idx).innerHTML = p.dow.map(c=>`<div class="bar"><i style="height:${c/maxDow*100}%"></i></div>`).join('');
  document.getElementById('dowLbl'+idx).innerHTML = ['S','M','T','W','T','F','S'].map(n=>`<span>${n}</span>`).join('');

  document.getElementById('tagLedger'+idx).innerHTML = p.topTags.length ? p.topTags.map(([t,c])=>`<div class="tag-row" data-tag="${escapeHtml(t)}"><span>${escapeHtml(t)}</span><span class="leader"></span><span class="count">${c}</span></div>`).join('') : '<p style="color:var(--sub);font-size:.85rem;margin:0;">No tags found.</p>';
  const maxTag = p.topTags[0] ? p.topTags[0][1] : 1;
  document.getElementById('tagCloud'+idx).innerHTML = p.topTags.map(([t,c])=>`<span class="cchip" data-tag="${escapeHtml(t)}" style="font-size:${(0.72+(c/maxTag)*0.5).toFixed(2)}rem">${escapeHtml(t)}</span>`).join('');

  if (idx === 0){
    primary = {items, computed:p};
    document.getElementById('kwChips').innerHTML = keywordFreq(items).map(([w,c])=>`<span class="chip">${escapeHtml(w)} (${c})</span>`).join('');
    document.querySelectorAll('#tagLedger0 .tag-row, #tagCloud0 .cchip').forEach(el=>{
      el.addEventListener('click', ()=>{ filterState.tag = filterState.tag === el.dataset.tag ? null : el.dataset.tag; updatePostList(); });
    });
    updatePostList();
  }
}

function updatePostList(){
  if (!primary) return;
  let list = primary.items.map((it,i)=>({it, w:primary.computed.words[i], rt:primary.computed.readTimes[i], links:primary.computed.linkCounts[i]}));
  if (filterState.tag) list = list.filter(x => (x.it.categories||[]).includes(filterState.tag));
  if (filterState.query) list = list.filter(x => x.it.title.toLowerCase().includes(filterState.query.toLowerCase()));
  if (filterState.sort === 'newest') list.sort((a,b)=> new Date(b.it.pubDate) - new Date(a.it.pubDate));
  else if (filterState.sort === 'oldest') list.sort((a,b)=> new Date(a.it.pubDate) - new Date(b.it.pubDate));
  else if (filterState.sort === 'longest') list.sort((a,b)=> b.w - a.w);

  const ft = document.getElementById('filterTag');
  ft.innerHTML = filterState.tag ? `<span class="filterBadge">× ${escapeHtml(filterState.tag)}</span>` : '';
  const badge = ft.querySelector('.filterBadge');
  if (badge) badge.addEventListener('click', ()=>{ filterState.tag = null; updatePostList(); });

  document.getElementById('postList').innerHTML = list.length ? list.slice(0,15).map(({it,rt,links})=>{
    const d = new Date(it.pubDate).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    const chips = (it.categories||[]).slice(0,4).map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('');
    return `<a class="post" href="${it.link}" target="_blank" rel="noopener">
      <div class="ptitle">${escapeHtml(it.title)}</div>
      <div class="pmeta"><span>${d}</span><span class="dot">·</span><span>${rt} min read</span><span class="dot">·</span><span>🔗 ${links}</span></div>
      <div class="chips">${chips}</div>
    </a>`;
  }).join('') : '<p style="color:var(--sub);font-size:.85rem;">No posts match.</p>';
}

function wordCount(html){
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || '').trim().split(/\s+/).filter(Boolean).length;
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function trunc(s,n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }
function relTime(d){
  const days = Math.floor((Date.now()-d)/86400000);
  if (days<1) return 'today';
  if (days<30) return days+'d ago';
  if (days<365) return Math.floor(days/30)+'mo ago';
  return Math.floor(days/365)+'y ago';
}

(function initFromUrl(){
  const params = new URLSearchParams(location.search);
  const u = params.get('u');
  const u2 = params.get('u2');
  const m = params.get('mode');
  if (m === 'pub'){
    mode = 'pub';
    document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.mode === 'pub'));
  }
  if (u) document.getElementById('handleInput').value = u;
  if (u2){
    compareOn = true;
    document.getElementById('compareRow').classList.remove('hidden');
    document.getElementById('compareToggle').textContent = '− Remove comparison';
    document.getElementById('handleInput2').value = u2;
  }
  if (u) runAnalysis(u, u2 || '');
})();
</script>
