<style>
:root{--bg:#0f0c1a;--surface:#1a1630;--surface2:#241e3a;--border:#3a3258;--gold:#c9a84c;--gold2:#e8c97a;--accent:#7b5ea7;--accent2:#a07fd4;--text:#e8e0f5;--muted:#9888c0;--red:#e05c7a;--green:#5cc4a0;--radius:12px;--shadow:0 8px 32px rgba(0,0,0,.5);--font-head:system-ui,-apple-system,'Segoe UI',sans-serif;--font-body:system-ui,-apple-system,'Segoe UI',sans-serif;}

[data-theme="light"] body::before,[data-theme="hc"] body::before{display:none}
header{width:100%;max-width:600px;text-align:center;padding:2rem 1rem 1rem;position:relative;z-index:1;}
.brand{font-family:var(--font-head);font-size:clamp(1.6rem,5vw,2.4rem);color:var(--gold2);letter-spacing:.08em;text-shadow:0 0 24px rgba(201,168,76,.4);line-height:1.2;}
.brand span{color:var(--accent2)}
.tagline{font-family:var(--font-body);font-style:italic;color:var(--muted);font-size:.95rem;margin-top:.3rem;letter-spacing:.04em;}

.theme-bar{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:.5rem;margin-bottom:.5rem;}
.t-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:var(--font-head);font-size:.62rem;letter-spacing:.06em;padding:.3rem .6rem;border-radius:20px;cursor:pointer;transition:all .2s;}
.t-btn.active,.t-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
main{width:100%;max-width:600px;padding:0 1rem 1.5rem;position:relative;z-index:1;flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem;box-shadow:var(--shadow);}
.card-title{font-family:var(--font-head);font-size:.75rem;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.6rem}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-row.full{grid-template-columns:1fr}
label{font-size:.75rem;color:var(--muted);letter-spacing:.05em;display:block;margin-bottom:.25rem;font-family:var(--font-head);}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.55rem .7rem;font-family:var(--font-body);font-size:.95rem;outline:none;transition:border .2s,box-shadow .2s;}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.2)}
select option{background:var(--surface2)}
.city-wrap{position:relative;}
.city-drop{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--gold);border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;z-index:99;display:none;box-shadow:var(--shadow);}

.city-opt{padding:.5rem .75rem;cursor:pointer;font-size:.88rem;border-bottom:1px solid var(--border);line-height:1.3;transition:background .12s;}
.city-opt:last-child{border:none}
.city-opt:hover,.city-opt.hi{background:var(--surface2);color:var(--gold2);}
.city-opt small{display:block;font-size:.7rem;color:var(--muted);font-style:italic}
.coords-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:.6rem}
.btn{width:100%;padding:.75rem;border:none;border-radius:8px;cursor:pointer;font-family:var(--font-head);font-size:.85rem;letter-spacing:.1em;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;font-weight:700;transition:all .2s;margin-top:.3rem;}

.planet-retro{color:var(--red);font-size:.65rem}

.nk-name{font-size:1.1rem;font-weight:500}

let focIdx=-1;
function filterC(){
  const q=document.getElementById('cityQ').value.trim().toLowerCase();
  const dr=document.getElementById('cityD');focIdx=-1;
  if(!q){dr.classList.remove('open');return;}
  const hits=C.filter(c=>c[0].toLowerCase().includes(q)).slice(0,9);
  if(!hits.length){dr.classList.remove('open');return;}
  dr.innerHTML=hits.map(c=>`<div class="city-opt" onclick="pickC(${C.indexOf(c)})">${c[0]}<small>${c[1].toFixed(4)}°N &nbsp;${c[2].toFixed(4)}°E &nbsp;UTC${c[3]>=0?'+':''}${c[3]}</small></div>`).join('');
  dr.classList.add('open');
}
function openD(){if(document.getElementById('cityQ').value.trim())filterC();}
function pickC(i){const c=C[i];document.getElementById('cityQ').value=c[0];document.getElementById('blat').value=c[1];document.getElementById('blon').value=c[2];document.getElementById('btz').value=c[3];document.getElementById('cityD').classList.remove('open');}
function cityKey(e){
  const dr=document.getElementById('cityD'),opts=dr.querySelectorAll('.city-opt');
  if(e.key==='ArrowDown'){e.preventDefault();focIdx=Math.min(focIdx+1,opts.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();focIdx=Math.max(focIdx-1,0);}
  else if(e.key==='Enter'&&focIdx>=0){opts[focIdx].click();return;}
  else if(e.key==='Escape'){dr.classList.remove('open');return;}
  opts.forEach((o,i)=>o.classList.toggle('hi',i===focIdx));
}
document.addEventListener('click',e=>{if(!e.target.closest('.city-wrap'))document.getElementById('cityD').classList.remove('open');});

// Astronomy — Meeus
function jd(y,m,d,h){if(m<=2){y--;m+=12;}const A=Math.floor(y/100);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+h/24+2-A+Math.floor(A/4)-1524.5;}
const n360=a=>((a%360)+360)%360;
// Lahiri (Chitrapaksha) ayanamsa: ~23.85° at J2000.0, rate 1.39722°/century (50.2910 arcsec/yr)
const ayn=j=>23.85045+1.39722*(j-2451545)/36525;
function sunL(j){const T=(j-2451545)/36525,L=280.46646+36000.76983*T,M=(357.52911+35999.05029*T)*Math.PI/180;return n360(L+(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M));}
function moonL(j){
  const T=(j-2451545)/36525,L=218.3164477+481267.88123421*T-0.0015786*T*T;
  const D=(297.8501921+445267.1114034*T-0.001884*T*T)*Math.PI/180;
  const M=(357.5291092+35999.0502909*T)*Math.PI/180;
  const Mp=(93.272095+477198.8675055*T+0.0088553*T*T)*Math.PI/180;
  const F=(93.272099+483202.0175233*T-0.0036539*T*T)*Math.PI/180;
  return n360(L+6.288774*Math.sin(Mp)+1.274027*Math.sin(2*D-Mp)+0.658314*Math.sin(2*D)+0.213618*Math.sin(2*Mp)-0.185116*Math.sin(M)-0.114332*Math.sin(2*F)+0.058793*Math.sin(2*D-2*Mp)+0.057066*Math.sin(2*D-M-Mp)+0.053322*Math.sin(2*D+Mp)+0.045758*Math.sin(2*D-M));
}
function plL(j){const T=(j-2451545)/36525,Ra=n360(125.0445-1934.1363*T);return{Mars:n360(355.433+19140.2993*T),Mercury:n360(252.251+149472.6746*T),Jupiter:n360(34.351+3034.9057*T),Venus:n360(181.979+58517.8156*T),Saturn:n360(50.077+1222.1138*T),Rahu:Ra,Ketu:n360(Ra+180)};}
function asc(j,la,lo){const T=(j-2451545)/36525,e=(23.439291111-0.013004167*T)*Math.PI/180,L=n360(280.46061837+360.98564736629*(j-2451545)+0.000387933*T*T+lo)*Math.PI/180;return n360(Math.atan2(-Math.cos(L),Math.sin(L)*Math.cos(e)+Math.tan(la*Math.PI/180)*Math.sin(e))*180/Math.PI);}
const sid=(l,a)=>n360(l-a),sOf=d=>Math.floor(n360(d)/30),diS=d=>n360(d)%30;
function dms(d){const g=Math.floor(d),m=Math.floor((d-g)*60),s=Math.floor(((d-g)*60-m)*60);return`${g}°${m}'${s}"`;}

const SG='♈,♉,♊,♋,♌,♍,♎,♏,♐,♑,♒,♓'.split(',');
const SN='Mesha,Vrishabha,Mithuna,Karka,Simha,Kanya,Tula,Vrishchika,Dhanu,Makara,Kumbha,Meena'.split(',');
const NK=[['Ashwini','Ketu'],['Bharani','Venus'],['Krittika','Sun'],['Rohini','Moon'],['Mrigashira','Mars'],['Ardra','Rahu'],['Punarvasu','Jupiter'],['Pushya','Saturn'],['Ashlesha','Mercury'],['Magha','Ketu'],['Purva Phalguni','Venus'],['Uttara Phalguni','Sun'],['Hasta','Moon'],['Chitra','Mars'],['Swati','Rahu'],['Vishakha','Jupiter'],['Anuradha','Saturn'],['Jyeshtha','Mercury'],['Mula','Ketu'],['Purva Ashadha','Venus'],['Uttara Ashadha','Sun'],['Shravana','Moon'],['Dhanishtha','Mars'],['Shatabhisha','Rahu'],['Purva Bhadrapada','Jupiter'],['Uttara Bhadrapada','Saturn'],['Revati','Mercury']];
const DY=[6,10,7,18,16,19,17,7,20],DL='Ketu,Venus,Sun,Moon,Mars,Rahu,Jupiter,Saturn,Mercury'.split(',');

// NK span = 13°20' = 13+1/3 degrees exactly. Pada span = 3°20' = 10/3 degrees.
// NK ruling lord sequence (Vimshottari): Ketu(0),Venus(1),Sun(2),Moon(3),Mars(4),Rahu(5),Jupiter(6),Saturn(7),Mercury(8)
// NK index 0=Ashwini→Ketu, 1=Bharani→Venus, 2=Krittika→Sun ... maps directly: lordIdx = nkIdx % 9
const NK_SPAN=40/3; // 13.3333...° exact
function nkOf(sm){const lon=n360(sm),ni=Math.min(Math.floor(lon/NK_SPAN),26),degInNk=lon%NK_SPAN,pada=Math.min(Math.floor(degInNk/(NK_SPAN/4))+1,4);return{ni,pada,degInNk};}
function dashas(sm,bd){
  const{ni,degInNk}=nkOf(sm),li=ni%9,bal=DY[li]*(1-degInNk/NK_SPAN);
  const out=[];let d=new Date(bd),fl=true,cl=li;
  for(let i=0;i<9;i++){const y=fl?bal:DY[cl],e=new Date(d);e.setDate(e.getDate()+Math.round(y*365.25));out.push({l:DL[cl],s:new Date(d),e});d=new Date(e);cl=(cl+1)%9;fl=false;}
  return out;
}

function calc(){
  const er=document.getElementById('errMsg');er.style.display='none';
  const nm=document.getElementById('bname').value.trim();
  const dtVal=document.getElementById('bdatetime').value;
  if(!dtVal){er.textContent='Please enter a birth date & time.';er.style.display='block';return;}
  const dt=new Date(dtVal);
  const dy=dt.getDate(),mo=dt.getMonth()+1,yr=dt.getFullYear(),hr=dt.getHours(),mn=dt.getMinutes();
  const tz=+document.getElementById('btz').value;
  const la=+document.getElementById('blat').value,lo=+document.getElementById('blon').value;
  if(!la&&!lo){er.textContent='Please select a city or enter coordinates.';er.style.display='block';return;}
  const J=jd(yr,mo,dy,hr-tz+mn/60),ay=ayn(J);
  const sS=sid(sunL(J),ay),sM=sid(moonL(J),ay),sA=sid(asc(J,la,lo),ay);
  const pl=plL(J);
  const pd=[{n:'Sun',s:'☉',l:sS},{n:'Moon',s:'☽',l:sM},{n:'Mars',s:'♂',l:sid(pl.Mars,ay)},{n:'Mercury',s:'☿',l:sid(pl.Mercury,ay)},{n:'Jupiter',s:'♃',l:sid(pl.Jupiter,ay)},{n:'Venus',s:'♀',l:sid(pl.Venus,ay)},{n:'Saturn',s:'♄',l:sid(pl.Saturn,ay)},{n:'Rahu',s:'☊',l:sid(pl.Rahu,ay),r:1},{n:'Ketu',s:'☋',l:sid(pl.Ketu,ay),r:1}];
  const rn=document.getElementById('r-name');
  if(nm){rn.textContent=`✦  ${nm}'s Vedic Birth Chart  ✦`;rn.style.display='block';}else rn.style.display='none';
  document.getElementById('r-asc').innerHTML=`${SG[sOf(sA)]} ${SN[sOf(sA)]} <span class="asc-badge">${dms(diS(sA))}</span>`;
  document.getElementById('r-moon').innerHTML=`${SG[sOf(sM)]} ${SN[sOf(sM)]}`;
  document.getElementById('r-sun').innerHTML=`${SG[sOf(sS)]} ${SN[sOf(sS)]}`;
  document.getElementById('r-ay').textContent=`${ay.toFixed(4)}°`;
  const{ni,pada}=nkOf(sM);
  document.getElementById('r-nkn').textContent=`${NK[ni][0]}  (Pada ${pada})`;
  document.getElementById('r-nks').innerHTML=`Ruling Lord: <strong>${NK[ni][1]}</strong> &nbsp;·&nbsp; Moon: ${dms(sM)} sidereal`;
  const pg=document.getElementById('r-planets');pg.innerHTML='';
  pd.forEach(p=>{const s=sOf(p.l);pg.innerHTML+=`<div class="planet-card"><div class="planet-name">${p.s} ${p.n}</div><div class="planet-sign">${SG[s]} ${SN[s]}</div><div class="planet-deg">${dms(diS(p.l))}${p.r?' <span class="planet-retro">℞</span>':''}</div></div>`;});
  const now=new Date(),bd=new Date(yr,mo-1,dy,hr,mn),dl=document.getElementById('r-dasha');dl.innerHTML='';
  dashas(sM,bd).forEach(d=>{const c=now>=d.s&&now<d.e,f=x=>x.toLocaleDateString('en-GB',{year:'numeric',month:'short'});dl.innerHTML+=`<li class="${c?'cur':''}"><span><span class="dot ${c?'a':''}"></span>${d.l} Dasha</span><span style="font-size:.78rem;color:var(--muted)">${f(d.s)}–${f(d.e)}</span></li>`;});
  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}
