<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamHub — Multi-Genre Video Player</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1a1a1a; --sub:#5a5a5a;
    --accent:#6c5ce7; --border:#e2e2e6; --header:#fff;
  }
  [data-theme="dark"]{
    --bg:#15161a; --card:#1e1f25; --text:#f0f0f0; --sub:#a5a5ad;
    --accent:#8b7bff; --border:#2c2d34; --header:#1a1b20;
  }
  [data-theme="oled"]{
    --bg:#000; --card:#0a0a0a; --text:#f5f5f5; --sub:#999;
    --accent:#8b7bff; --border:#1a1a1a; --header:#000;
  }
  [data-theme="hc"]{
    --bg:#000; --card:#000; --text:#fff; --sub:#fff;
    --accent:#ffff00; --border:#fff; --header:#000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; transition:background .2s,color .2s;
  }
  header{
    background:var(--header); border-bottom:1px solid var(--border);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10; gap:10px; flex-wrap:wrap;
  }
  h1{font-size:1.2rem; color:var(--accent);}
  .theme-toggle{display:flex; gap:6px; flex-wrap:wrap;}
  .theme-toggle button{
    background:var(--card); color:var(--text); border:1px solid var(--border);
    padding:6px 10px; border-radius:8px; cursor:pointer; font-size:.75rem;
  }
  .theme-toggle button.active{background:var(--accent); color:#000; border-color:var(--accent); font-weight:bold;}
  [data-theme="dark"] .theme-toggle button.active,
  [data-theme="oled"] .theme-toggle button.active{color:#fff;}

  .search-bar{padding:12px 16px; display:flex; gap:8px;}
  .search-bar input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:.95rem;
  }
  .genre-bar{display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; -webkit-overflow-scrolling:touch;}
  .genre-bar button{
    background:var(--card); color:var(--text); border:1px solid var(--border);
    padding:8px 14px; border-radius:20px; white-space:nowrap; cursor:pointer; font-size:.82rem;
  }
  .genre-bar button.active{background:var(--accent); color:#fff;}

  main{flex:1; padding:8px 16px 24px;}
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  }
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr);}}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;
    cursor:pointer; transition:transform .15s;
  }
  .card:active{transform:scale(0.97);}
  .card img{width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:var(--border);}
  .card .info{padding:8px;}
  .card .info h3{font-size:.85rem; margin-bottom:2px; line-height:1.2;}
  .card .info p{font-size:.72rem; color:var(--sub);}

  .status{text-align:center; padding:30px; color:var(--sub);}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); border-radius:14px; max-width:640px; width:100%;
    max-height:90vh; overflow-y:auto; border:1px solid var(--border);
  }
  .modal video{width:100%; background:#000; display:block;}
  .modal-body{padding:16px;}
  .modal-body h2{font-size:1.15rem; margin-bottom:6px;}
  .modal-body .meta{font-size:.78rem; color:var(--sub); margin-bottom:10px;}
  .modal-body .summary{font-size:.88rem; line-height:1.5; color:var(--text);}
  .close-btn{
    float:right; background:none; border:none; color:var(--text); font-size:1.3rem; cursor:pointer;
  }
  .note{font-size:.72rem; color:var(--sub); margin-top:10px; border-top:1px solid var(--border); padding-top:8px;}

  footer{
    border-top:1px solid var(--border); padding:16px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--sub); font-size:.78rem;
  }
</style>
</head>
<body data-theme="dark">

<header>
  <h1>🎬 StreamHub</h1>
  <div class="theme-toggle" id="themeToggle">
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="oled">OLED</button>
    <button data-theme="hc">HC</button>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search shows across all genres...">
</div>
<div class="genre-bar" id="genreBar"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <video id="player" controls poster="" playsinline></video>
    <div class="modal-body">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2 id="mTitle"></h2>
      <div class="meta" id="mMeta"></div>
      <div class="summary" id="mSummary"></div>
      <div class="note">Demo playback uses a sample video source; metadata (title, genre, poster, summary) is fetched live from the free TVMaze API.</div>
    </div>
  </div>
</div>

<footer>
  <div>© <span id="year"></span> Manik Roy. All Rights Reserved.</div>
</footer>

<script>
// ---------- Theme handling ----------
const body = document.body;
const themeBtns = document.querySelectorAll('.theme-toggle button');
function setTheme(t){
  body.setAttribute('data-theme', t);
  localStorage.setItem('sh_theme', t);
  themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === t));
}
themeBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
setTheme(localStorage.getItem('sh_theme') || 'dark');

// ---------- Footer year ----------
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Sample video sources (rotated for demo playback) ----------
const SAMPLE_VIDEOS = [
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
];

// ---------- App state ----------
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const genreBar = document.getElementById('genreBar');
const searchInput = document.getElementById('searchInput');
let allShows = [];
let activeGenre = 'All';

// ---------- Fetch shows from TVMaze (free, no key) ----------
async function loadShows(){
  statusEl.textContent = 'Loading titles...';
  try{
    const res = await fetch('https://api.tvmaze.com/shows?page=0');
    const data = await res.json();
    allShows = data.filter(s => s.image);
    buildGenres();
    render();
  }catch(e){
    statusEl.textContent = 'Could not load titles. Check your connection.';
  }
}

function buildGenres(){
  const genres = new Set();
  allShows.forEach(s => s.genres.forEach(g => genres.add(g)));
  genreBar.innerHTML = '';
  ['All', ...Array.from(genres).sort()].forEach(g => {
    const btn = document.createElement('button');
    btn.textContent = g;
    if(g === activeGenre) btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeGenre = g;
      document.querySelectorAll('.genre-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    genreBar.appendChild(btn);
  });
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  let list = allShows.filter(s =>
    (activeGenre === 'All' || s.genres.includes(activeGenre)) &&
    (q === '' || s.name.toLowerCase().includes(q))
  );
  grid.innerHTML = '';
  statusEl.textContent = list.length ? '' : 'No titles found.';
  list.forEach(show => grid.appendChild(makeCard(show)));
}

function makeCard(show){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${show.image.medium}" alt="${show.name}" loading="lazy">
    <div class="info">
      <h3>${show.name}</h3>
      <p>${(show.genres||[]).slice(0,2).join(', ') || 'Unknown'}</p>
    </div>`;
  card.addEventListener('click', () => openPlayer(show));
  return card;
}

// ---------- Modal / player ----------
const overlay = document.getElementById('modalOverlay');
const player = document.getElementById('player');
const mTitle = document.getElementById('mTitle');
const mMeta = document.getElementById('mMeta');
const mSummary = document.getElementById('mSummary');

function openPlayer(show){
  mTitle.textContent = show.name;
  mMeta.textContent = `${(show.genres||[]).join(', ') || 'Unknown genre'} • ${show.premiered ? show.premiered.slice(0,4) : 'N/A'} • ★ ${show.rating && show.rating.average ? show.rating.average : 'N/A'}`;
  mSummary.innerHTML = (show.summary || 'No summary available.').replace(/<\/?p>/g, '');
  const src = SAMPLE_VIDEOS[show.id % SAMPLE_VIDEOS.length];
  player.src = src;
  player.poster = show.image.original || show.image.medium;
  overlay.classList.add('open');
  player.play().catch(()=>{});
}
document.getElementById('closeBtn').addEventListener('click', closePlayer);
overlay.addEventListener('click', e => { if(e.target === overlay) closePlayer(); });
function closePlayer(){
  overlay.classList.remove('open');
  player.pause();
  player.src = '';
}

// ---------- Search ----------
let debounce;
searchInput.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(render, 250);
});

loadShows();
</script>
</body>
</html>
