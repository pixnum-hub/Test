<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FRAMED — AI Headshot Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236c5ce7'/%3E%3Ccircle cx='50' cy='40' r='18' fill='white'/%3E%3Cpath d='M20 90 Q50 55 80 90 Z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f5f7; --bg-elev:#ffffff; --fg:#14161a; --fg-dim:#5b6270;
    --accent:#6c5ce7; --accent-fg:#ffffff; --border:#d8dbe0;
    --danger:#e0554f; --radius:14px; --shadow:0 6px 24px rgba(20,22,26,.08);
    --focus:#6c5ce7;
  }
  [data-theme="dark"]{
    --bg:#14161c; --bg-elev:#1e212a; --fg:#eceef2; --fg-dim:#a2a8b4;
    --accent:#8b7cf6; --accent-fg:#0e0f14; --border:#2c3040;
    --shadow:0 6px 24px rgba(0,0,0,.4);
  }
  [data-theme="oled"]{
    --bg:#000000; --bg-elev:#0a0a0a; --fg:#f2f2f2; --fg-dim:#8d8d8d;
    --accent:#7c9dff; --accent-fg:#000000; --border:#1c1c1c;
    --shadow:0 0 0 1px #161616;
  }
  [data-theme="hc"]{
    --bg:#000000; --bg-elev:#000000; --fg:#ffffff; --fg-dim:#ffff00;
    --accent:#ffff00; --accent-fg:#000000; --border:#ffffff;
    --shadow:none; --focus:#ffff00;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; display:flex; flex-direction:column; align-items:center;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    transition:background .2s,color .2s;
  }
  [data-theme="hc"] *{ transition:none !important; }
  a{color:var(--accent);}
  button{font-family:inherit;}
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  header{
    width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 8px; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.15rem; letter-spacing:.02em; }
  .brand-badge{
    width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-fg);
    display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0;
  }
  .theme-toggle{ display:flex; gap:4px; background:var(--bg-elev); border:1px solid var(--border); border-radius:999px; padding:4px; }
  .theme-toggle button{
    width:34px; height:34px; border-radius:999px; border:none; background:transparent; color:var(--fg-dim);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .theme-toggle button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); }

  main{
    width:100%; max-width:760px; flex:1; padding:8px 16px 24px; display:flex; flex-direction:column;
    align-items:center; gap:16px; text-align:center;
  }
  .subtitle{ color:var(--fg-dim); font-size:.95rem; max-width:520px; margin:0; }

  .card{
    width:100%; background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:14px; align-items:center;
  }

  .stage{
    width:100%; max-width:420px; aspect-ratio:4/5; border-radius:12px; border:2px dashed var(--border);
    background:repeating-conic-gradient(var(--bg) 0% 25%, var(--bg-elev) 0% 50%) 50% / 20px 20px;
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  [data-theme="hc"] .stage{ background:#000; border-color:#fff; }
  .stage canvas, .stage video{ width:100%; height:100%; object-fit:contain; display:block; }
  .stage .hint{ color:var(--fg-dim); font-size:.9rem; padding:0 20px; }

  .row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-elev); color:var(--fg);
    padding:10px 16px; border-radius:10px; font-size:.92rem; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:transform .05s;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); color:var(--accent-fg); border-color:transparent; }
  .btn.danger{ color:var(--danger); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  input[type="file"]{ display:none; }

  fieldset{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; width:100%; text-align:left; }
  legend{ padding:0 6px; font-size:.8rem; font-weight:700; color:var(--fg-dim); text-transform:uppercase; letter-spacing:.05em; }
  .opt-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--border); background:var(--bg); color:var(--fg); padding:7px 12px;
    border-radius:999px; font-size:.85rem; cursor:pointer;
  }
  .chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:700; }
  label.toggle-line{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:.9rem; }

  .status{
    width:100%; min-height:20px; font-size:.85rem; color:var(--fg-dim); text-align:center;
  }
  .status[data-level="error"]{ color:var(--danger); font-weight:600; }
  .progress{ width:100%; height:6px; border-radius:6px; background:var(--border); overflow:hidden; display:none; }
  .progress.active{ display:block; }
  .progress > div{ height:100%; width:30%; background:var(--accent); animation:indeterminate 1.1s infinite ease-in-out; }
  @keyframes indeterminate{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(400%);} }

  footer{
    width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));
    text-align:center; color:var(--fg-dim); font-size:.8rem; margin-top:auto;
  }
  footer strong{ color:var(--fg); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  @media (min-width:640px){
    .card{ padding:24px; }
  }
</style>
</head>
<body data-theme="dark">

<header>
  <div class="brand"><span class="brand-badge">F</span> FRAMED</div>
  <div class="theme-toggle" role="group" aria-label="Theme">
    <button type="button" data-theme-btn="light" title="Light" aria-pressed="false">☀️</button>
    <button type="button" data-theme-btn="dark" title="Dark" aria-pressed="true">🌙</button>
    <button type="button" data-theme-btn="oled" title="OLED True Black" aria-pressed="false">⚫</button>
    <button type="button" data-theme-btn="hc" title="High Contrast" aria-pressed="false">◐</button>
  </div>
</header>

<main>
  <p class="subtitle">On-device AI headshots: face alignment, background removal &amp; auto-enhance — nothing leaves your browser.</p>

  <div class="card">
    <div class="stage" id="stage">
      <video id="video" playsinline muted style="display:none;"></video>
      <canvas id="previewCanvas" style="display:none;"></canvas>
      <p class="hint" id="stageHint">Choose a photo or use your camera to begin</p>
    </div>

    <div class="row">
      <label class="btn primary" for="fileInput">📁 Choose Photo</label>
      <input id="fileInput" type="file" accept="image/*">
      <button class="btn" id="cameraBtn" type="button">📷 Use Camera</button>
      <button class="btn" id="captureBtn" type="button" style="display:none;">⏺ Capture</button>
    </div>

    <fieldset>
      <legend>Frame</legend>
      <div class="opt-row" id="aspectOpts">
        <button type="button" class="chip" data-aspect="1" aria-pressed="true">Square 1:1</button>
        <button type="button" class="chip" data-aspect="0.8">Portrait 4:5</button>
        <button type="button" class="chip" data-aspect="0.75">Portrait 3:4</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Background</legend>
      <div class="opt-row" id="bgOpts">
        <button type="button" class="chip" data-bg="transparent" aria-pressed="true">Transparent</button>
        <button type="button" class="chip" data-bg="white">White</button>
        <button type="button" class="chip" data-bg="gray">Studio Gray</button>
        <button type="button" class="chip" data-bg="blur">Blurred Original</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Enhance</legend>
      <label class="toggle-line"><span>Auto-align eyes level</span><input type="checkbox" id="optAlign" checked></label>
      <label class="toggle-line"><span>Auto brightness / contrast</span><input type="checkbox" id="optAutoTone" checked></label>
      <label class="toggle-line"><span>Skin smoothing</span><input type="checkbox" id="optSmooth" checked></label>
      <label class="toggle-line"><span>Sharpen</span><input type="checkbox" id="optSharpen" checked></label>
    </fieldset>

    <div class="row">
      <button class="btn primary" id="processBtn" type="button" disabled>✨ Generate Headshot</button>
      <button class="btn" id="downloadBtn" type="button" disabled>⬇️ Download PNG</button>
      <button class="btn danger" id="resetBtn" type="button">↺ Reset</button>
    </div>

    <div class="progress" id="progress"><div></div></div>
    <p class="status" id="status" role="status" aria-live="polite">Loading AI models…</p>
  </div>
</main>

<footer>
  <div><strong>FRAMED</strong> — AI Headshot Studio</div>
  <div>© Manik Roy <span id="year">2026</span>. All Rights Reserved.</div>
</footer>

<script>
  // ---------- Theme handling ----------
  (function themeInit(){
    const saved = localStorage.getItem('framed-theme');
    const theme = saved || 'dark';
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('[data-theme-btn]').forEach(b=>{
      b.setAttribute('aria-pressed', String(b.dataset.themeBtn === theme));
      b.addEventListener('click', ()=>{
        document.body.setAttribute('data-theme', b.dataset.themeBtn);
        localStorage.setItem('framed-theme', b.dataset.themeBtn);
        document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
      });
    });
  })();

  // ---------- Footer auto year ----------
  (function footerYear(){
    const START = 2026;
    const now = new Date().getFullYear();
    document.getElementById('year').textContent = now > START ? (START + '–' + now) : String(START);
  })();
</script>

<script type="module">
  import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
  import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), progressEl = $('progress'), stageHint = $('stageHint');
  const video = $('video'), previewCanvas = $('previewCanvas'), stage = $('stage');
  const fileInput = $('fileInput'), cameraBtn = $('cameraBtn'), captureBtn = $('captureBtn');
  const processBtn = $('processBtn'), downloadBtn = $('downloadBtn'), resetBtn = $('resetBtn');

  let sourceImage = null;      // HTMLImageElement of the loaded/captured photo
  let outputCanvas = null;     // final rendered canvas
  let faceLandmarker = null;
  let cvReady = false;
  let stream = null;
  let aspect = 1;              // width/height ratio for the output frame
  let bgChoice = 'transparent';

  function setStatus(msg, level){
    statusEl.textContent = msg;
    statusEl.dataset.level = level || 'info';
  }
  function busy(on){
    progressEl.classList.toggle('active', !!on);
    [fileInput, cameraBtn, processBtn, downloadBtn].forEach(el=>{ if(el) el.disabled = !!on || (el===downloadBtn && !outputCanvas); });
    processBtn.disabled = on || !sourceImage;
  }

  // ---------- Load models ----------
  async function initModels(){
    try{
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        outputFaceBlendshapes: false,
        runningMode: "IMAGE",
        numFaces: 1
      });
      setStatus('Ready. Choose a photo or use your camera.');
    }catch(err){
      console.error(err);
      setStatus('Face model failed to load — you can still process without auto-align.', 'error');
    }
  }
  function waitForOpenCV(){
    return new Promise((resolve)=>{
      const check = () => {
        if (window.cv && window.cv.Mat){ cvReady = true; resolve(); }
        else setTimeout(check, 150);
      };
      check();
    });
  }
  initModels();
  waitForOpenCV();

  // ---------- Option chips ----------
  function wireChips(containerId, dataAttr, onPick){
    document.querySelectorAll('#'+containerId+' [data-'+dataAttr+']').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#'+containerId+' [data-'+dataAttr+']').forEach(b=>b.setAttribute('aria-pressed','false'));
        btn.setAttribute('aria-pressed','true');
        onPick(btn.dataset[dataAttr[0].toUpperCase()+dataAttr.slice(1)] ?? btn.dataset[dataAttr]);
      });
    });
  }
  wireChips('aspectOpts','aspect',(v)=>{ aspect = parseFloat(v); });
  wireChips('bgOpts','bg',(v)=>{ bgChoice = v; });

  // ---------- Loading a photo ----------
  fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    stopCamera();
    const url = URL.createObjectURL(file);
    await loadImageFromURL(url);
  });

  function loadImageFromURL(url){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        sourceImage = img;
        showPreview(img);
        outputCanvas = null;
        downloadBtn.disabled = true;
        processBtn.disabled = false;
        setStatus('Photo loaded. Click "Generate Headshot" when ready.');
        resolve();
      };
      img.src = url;
    });
  }

  function showPreview(imgOrCanvas){
    stageHint.style.display = 'none';
    video.style.display = 'none';
    previewCanvas.style.display = 'block';
    const w = imgOrCanvas.width || imgOrCanvas.videoWidth;
    const h = imgOrCanvas.height || imgOrCanvas.videoHeight;
    previewCanvas.width = w; previewCanvas.height = h;
    previewCanvas.getContext('2d').drawImage(imgOrCanvas, 0, 0, w, h);
  }

  // ---------- Camera ----------
  cameraBtn.addEventListener('click', async ()=>{
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
      video.srcObject = stream;
      await video.play();
      stageHint.style.display = 'none';
      previewCanvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'inline-flex';
      setStatus('Camera live. Click Capture when ready.');
    }catch(err){
      setStatus('Camera access denied or unavailable.', 'error');
    }
  });

  captureBtn.addEventListener('click', ()=>{
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    stopCamera();
    c.toBlob((blob)=>{ loadImageFromURL(URL.createObjectURL(blob)); }, 'image/png');
  });

  function stopCamera(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    video.style.display = 'none';
    captureBtn.style.display = 'none';
  }

  // ---------- Reset ----------
  resetBtn.addEventListener('click', ()=>{
    stopCamera();
    sourceImage = null; outputCanvas = null;
    previewCanvas.style.display = 'none';
    stageHint.style.display = 'block';
    stageHint.textContent = 'Choose a photo or use your camera to begin';
    downloadBtn.disabled = true; processBtn.disabled = true;
    setStatus('Ready.');
  });

  // ---------- Face landmarks → alignment ----------
  function getFaceGeometry(img){
    if(!faceLandmarker) return null;
    const result = faceLandmarker.detect(img);
    if(!result.faceLandmarks || !result.faceLandmarks.length) return null;
    const lm = result.faceLandmarks[0];
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    let minX=1, minY=1, maxX=0, maxY=0;
    for(const p of lm){
      if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x;
      if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y;
    }
    // Approx outer eye corners (MediaPipe FaceMesh indices): right=33, left=263
    const rEye = lm[33], lEye = lm[263];
    const angle = Math.atan2((lEye.y - rEye.y)*H, (lEye.x - rEye.x)*W);
    return {
      box:{ x:minX*W, y:minY*H, w:(maxX-minX)*W, h:(maxY-minY)*H },
      eyeCenter:{ x:((lEye.x+rEye.x)/2)*W, y:((lEye.y+rEye.y)/2)*H },
      angleRad: angle
    };
  }

  // Rotates the image about the eye-line center, then crops a padded
  // face-centered box matching the chosen aspect ratio, onto `outSize`.
  function alignAndCrop(img, geometry, doAlign, outSize){
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    const work = document.createElement('canvas');
    work.width = W; work.height = H;
    const wctx = work.getContext('2d');

    let cx = W/2, cy = H*0.45, boxW = W*0.6, boxH = boxW/aspect;

    if(geometry){
      const rot = doAlign ? -geometry.angleRad : 0;
      wctx.save();
      wctx.translate(geometry.eyeCenter.x, geometry.eyeCenter.y);
      wctx.rotate(rot);
      wctx.translate(-geometry.eyeCenter.x, -geometry.eyeCenter.y);
      wctx.drawImage(img, 0, 0, W, H);
      wctx.restore();

      const b = geometry.box;
      cx = b.x + b.w/2;
      cy = b.y + b.h*0.42;
      boxH = b.h * 2.3;
      boxW = boxH * aspect;
      if(boxW < b.w*1.3){ boxW = b.w*1.3; boxH = boxW/aspect; }
    } else {
      wctx.drawImage(img, 0, 0, W, H);
    }

    const out = document.createElement('canvas');
    out.width = outSize; out.height = Math.round(outSize/aspect);
    const octx = out.getContext('2d');
    const sx = Math.max(0, cx - boxW/2), sy = Math.max(0, cy - boxH/2);
    const sw = Math.min(boxW, W - sx), sh = Math.min(boxH, H - sy);
    octx.drawImage(work, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  // ---------- OpenCV enhancement ----------
  function enhanceWithOpenCV(canvas, { autoTone, smooth, sharpen }){
    if(!cvReady) return canvas;
    const cv = window.cv;
    let src = cv.imread(canvas);
    let rgb = new cv.Mat();
    cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);

    if(autoTone){
      const gray = new cv.Mat();
      cv.cvtColor(rgb, gray, cv.COLOR_RGB2GRAY);
      const srcVec = new cv.MatVector();
      srcVec.push_back(gray);
      const mask = new cv.Mat();
      const hist = new cv.Mat();
      cv.calcHist(srcVec, [0], mask, hist, [256], [0, 256]);
      let total = gray.rows * gray.cols, clip = total * 0.01, acc = 0, lo = 0, hi = 255;
      for(let i=0;i<256;i++){ acc += hist.floatAt(i,0); if(acc>clip){ lo=i; break; } }
      acc = 0;
      for(let i=255;i>=0;i--){ acc += hist.floatAt(i,0); if(acc>clip){ hi=i; break; } }
      if(hi<=lo){ hi = lo+1; }
      const alpha = 255/(hi-lo), beta = -lo*alpha;
      const toned = new cv.Mat();
      rgb.convertTo(toned, -1, alpha, beta);
      rgb.delete(); rgb = toned;
      gray.delete(); hist.delete(); mask.delete(); srcVec.delete();
    }
    if(smooth){
      const sm = new cv.Mat();
      cv.bilateralFilter(rgb, sm, 9, 55, 55);
      rgb.delete(); rgb = sm;
    }
    if(sharpen){
      const blurred = new cv.Mat();
      cv.GaussianBlur(rgb, blurred, new cv.Size(0,0), 3);
      const sharp = new cv.Mat();
      cv.addWeighted(rgb, 1.4, blurred, -0.4, 0, sharp);
      blurred.delete(); rgb.delete(); rgb = sharp;
    }

    const rgba = new cv.Mat();
    cv.cvtColor(rgb, rgba, cv.COLOR_RGB2RGBA);
    const out = document.createElement('canvas');
    out.width = canvas.width; out.height = canvas.height;
    cv.imshow(out, rgba);
    src.delete(); rgb.delete(); rgba.delete();
    return out;
  }

  // ---------- Background compositing ----------
  async function applyBackground(cutoutBlob, choice, originalCanvas){
    const cutoutImg = await blobToImage(cutoutBlob);
    const out = document.createElement('canvas');
    out.width = cutoutImg.width; out.height = cutoutImg.height;
    const ctx = out.getContext('2d');

    if(choice === 'white' || choice === 'gray'){
      ctx.fillStyle = choice === 'white' ? '#ffffff' : '#c9ccd1';
      ctx.fillRect(0,0,out.width,out.height);
    } else if(choice === 'blur' && originalCanvas){
      ctx.filter = 'blur(18px)';
      ctx.drawImage(originalCanvas, -20, -20, out.width+40, out.height+40);
      ctx.filter = 'none';
    }
    ctx.drawImage(cutoutImg, 0, 0, out.width, out.height);
    return out;
  }
  function blobToImage(blob){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.src = URL.createObjectURL(blob);
    });
  }

  // ---------- Main pipeline ----------
  processBtn.addEventListener('click', async ()=>{
    if(!sourceImage) return;
    busy(true);
    let framed, composed, final;

    try{
      setStatus('Detecting face…');
      const align = $('optAlign').checked;
      let geometry = null;
      try{ geometry = getFaceGeometry(sourceImage); }catch(e){ console.warn('landmark detect failed', e); }
      if(!geometry) setStatus('No face detected — using center crop.');
      framed = alignAndCrop(sourceImage, geometry, align, 1000);
      showPreview(framed);
    }catch(err){
      console.error('align/crop step failed', err);
      setStatus('Face alignment / crop step failed — see console.', 'error');
      busy(false); return;
    }

    composed = framed;
    if(bgChoice !== 'none'){
      try{
        setStatus('Removing background…');
        const blob = await new Promise(res => framed.toBlob(res, 'image/png'));
        const cutout = await removeBackground(blob);
        setStatus('Compositing background…');
        composed = await applyBackground(cutout, bgChoice, framed);
      }catch(err){
        console.error('background removal step failed', err);
        setStatus('Background removal step failed — see console.', 'error');
        busy(false); return;
      }
    }

    try{
      setStatus('Enhancing…');
      final = enhanceWithOpenCV(composed, {
        autoTone: $('optAutoTone').checked,
        smooth: $('optSmooth').checked,
        sharpen: $('optSharpen').checked
      });
    }catch(err){
      console.error('enhance step failed', err);
      setStatus('Enhancement step failed — see console.', 'error');
      busy(false); return;
    }

    try{
      outputCanvas = final;
      showPreview(final);
      downloadBtn.disabled = false;
      setStatus('Done. Download your headshot below.');
    }catch(err){
      console.error(err);
      setStatus('Something went wrong during processing. See console for details.', 'error');
    }finally{
      busy(false);
    }
  });

  downloadBtn.addEventListener('click', ()=>{
    if(!outputCanvas) return;
    outputCanvas.toBlob((blob)=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'framed-headshot.png';
      a.click();
    }, 'image/png');
  });
</script>
</body>
</html>
