<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation Map</title>
<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#111;--blue:#1677ff;--red:#e53935}
.dark{--bg:#151515;--card:#222;--txt:#fff}
.oled{--bg:#000;--card:#111;--txt:#fff}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;
font-family:system-ui,Arial;background:var(--bg);color:var(--txt)}
header,.tools,footer,#info,#results,#steps,#alerts{
background:var(--card)}
header{padding:8px;display:flex;gap:5px}
input{flex:1;padding:11px;border:0;border-radius:11px;background:#eee}
button{border:0;border-radius:11px;padding:10px;cursor:pointer;font-weight:700}
#map{flex:1;min-height:240px}
.tools{display:flex;gap:5px;padding:7px;overflow-x:auto}
.tools button{white-space:nowrap}
#info,#alerts{padding:8px;font-size:13px}
#results,#steps{max-height:130px;overflow:auto}
.item{padding:9px;border-bottom:1px solid #aaa;cursor:pointer;font-size:13px}
.item:hover{background:#ddd}
.alert{padding:7px;border-radius:8px;margin:3px 0;background:#fee}
footer{text-align:center;padding:9px;font-size:11px}
.dark input{background:#333;color:#fff}
.dark .item:hover{background:#333}
.oled input{background:#111;color:#fff}
</style>
</head>

<body>

<header>
<input id="search" placeholder="Search destination">
<button onclick="searchPlace()">🔍</button>
<button onclick="locateMe()">📍</button>
</header>

<div id="map"></div>

<div class="tools">
<button onclick="nearby('restaurant')">🍴 Food</button>
<button onclick="nearby('hospital')">🏥 Hospital</button>
<button onclick="nearby('fuel')">⛽ Fuel</button>
<button onclick="nearby('atm')">🏧 ATM</button>
<button onclick="nearby('bank')">🏦 Bank</button>
<button onclick="nearby('hotel')">🏨 Hotel</button>
<button onclick="nearby('parking')">🅿️ Parking</button>
<button onclick="nearby('pharmacy')">💊 Pharmacy</button>
</div>

<div class="tools">
<button onclick="setMode('driving')">🚗 Drive</button>
<button onclick="setMode('walking')">🚶 Walk</button>
<button onclick="setMode('cycling')">🚴 Cycle</button>
<button onclick="route()">🧭 Route</button>
<button onclick="showTraffic()">🚦 Traffic</button>
<button onclick="findClosures()">🚧 Closures</button>
<button onclick="reportIncident()">⚠️ Report</button>
<button onclick="emergency()">🆘 SOS</button>
</div>

<div class="tools">
<button onclick="showSpeed()">🛣️ Speed</button>
<button onclick="toggleWarnings()">🔔 Warnings</button>
<button onclick="showDangerZones()">⚠️ Danger</button>
<button onclick="showFavorites()">⭐ Favorites</button>
<button onclick="showRecent()">🕘 Recent</button>
<button onclick="toggleTheme()">🌙</button>
<button onclick="toggleOLED()">🖤</button>
<button onclick="clearMap()">✕</button>
</div>

<div id="info">Select a destination or use GPS.</div>
<div id="alerts"></div>
<div id="results"></div>
<div id="steps"></div>

<footer>
© <span id="year"></span> Manik Roy 2026. All Rights Reserved.
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=x=>document.getElementById(x);
$("year").textContent=new Date().getFullYear();

const map=L.map("map").setView([22.5726,88.3639],13);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19,attribution:"© OpenStreetMap contributors"}
).addTo(map);

let user=null,destination=null,marker=null,userMarker=null;
let routes=[],poiMarkers=[],warningOn=true;
let mode="driving",speedLimit=null;
let favorites=JSON.parse(localStorage.getItem("navFavorites")||"[]");
let recent=JSON.parse(localStorage.getItem("navRecent")||"[]");
let incidents=JSON.parse(localStorage.getItem("navIncidents")||"[]");

function msg(x){$("info").textContent=x}

function setMode(x){
mode=x;
msg(x.toUpperCase()+" navigation selected.");
if(destination&&user)route();
}

function locateMe(){
if(!navigator.geolocation)return msg("GPS unavailable.");

msg("Finding your location...");

navigator.geolocation.getCurrentPosition(p=>{
user=[p.coords.latitude,p.coords.longitude];

if(userMarker)map.removeLayer(userMarker);

userMarker=L.circleMarker(user,{radius:9})
.addTo(map).bindPopup("📍 You are here");

map.setView(user,16);
msg("Current location found.");

loadRoadData();
},()=>msg("Location permission denied."),
{enableHighAccuracy:true,timeout:10000});
}

async function searchPlace(){
let q=$("search").value.trim();
if(!q)return;

msg("Searching...");

try{
let u="https://nominatim.openstreetmap.org/search"+
"?format=jsonv2&limit=6&q="+encodeURIComponent(q);

let data=await fetch(u).then(r=>r.json());

$("results").innerHTML=data.map(x=>`
<div class="item" onclick="selectPlace(
${x.lat},${x.lon},'${safe(x.display_name)}')">
📍 ${safe(x.display_name)}
</div>`).join("");

msg(data.length+" result(s) found.");
}catch(e){msg("Search failed.")}
}

function safe(s){
return String(s).replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function selectPlace(lat,lon,name){
destination=[+lat,+lon];

if(marker)map.removeLayer(marker);

marker=L.marker(destination)
.addTo(map).bindPopup(name).openPopup();

map.setView(destination,16);
saveRecent(name,destination);

$("results").innerHTML=`
<div class="item">
<b>📍 ${name}</b>
<button onclick="saveFavorite()">⭐ Save</button>
</div>`;

msg("Destination selected.");
if(user)route();
}

map.on("click",e=>{
selectPlace(e.latlng.lat,e.latlng.lng,"Map destination");
});

async function route(){
if(!user)return locateMe();

if(!destination)
return msg("Select a destination first.");

msg("Calculating route...");

let host=mode==="walking"
?"https://routing.openstreetmap.de/routed-foot/route/v1/driving/"
:mode==="cycling"
?"https://routing.openstreetmap.de/routed-bike/route/v1/driving/"
:"https://router.project-osrm.org/route/v1/driving/";

let url=host+
`${user[1]},${user[0]};${destination[1]},${destination[0]}`+
"?overview=full&geometries=geojson&steps=true&alternatives=true";

try{
let data=await fetch(url).then(r=>r.json());

if(data.code!=="Ok")throw Error();

routes.forEach(x=>map.removeLayer(x));
routes=[];

data.routes.forEach((r,i)=>{
let line=L.geoJSON(r.geometry,{
style:{weight:i?4:7,opacity:i?0.4:1}
}).addTo(map);

routes.push(line);

if(!i){
map.fitBounds(line.getBounds(),{padding:[25,25]});

let km=(r.distance/1000).toFixed(1);
let min=Math.round(r.duration/60);

$("info").innerHTML=
`<b>${mode.toUpperCase()}</b> · ${km} km · `+
`${min} min · ${data.routes.length} route(s)`;

showSteps(r);
}
});

loadRoadData();
}catch(e){msg("Route unavailable.")}
}

function showSteps(r){
let h="<b>🧭 Turn-by-turn</b>";

r.legs.forEach(l=>l.steps.forEach((s,i)=>{
h+=`<div class="item">${i+1}. ${
s.maneuver.type} ${s.maneuver.modifier||""}
${s.name||"Unnamed road"} · ${Math.round(s.distance)} m</div>`;
}));

$("steps").innerHTML=h;
}

/* 16–23 Nearby POIs */

async function nearby(type){
if(!user){
locateMe();
return;
}

poiMarkers.forEach(x=>map.removeLayer(x));
poiMarkers=[];

let tags={
restaurant:'["amenity"="restaurant"]',
hospital:'["amenity"="hospital"]',
fuel:'["amenity"="fuel"]',
atm:'["amenity"="atm"]',
bank:'["amenity"="bank"]',
hotel:'["tourism"="hotel"]',
parking:'["amenity"="parking"]',
pharmacy:'["amenity"="pharmacy"]'
};

let q=`[out:json][timeout:15];(
node${tags[type]}(around:5000,${user[0]},${user[1]});
way${tags[type]}(around:5000,${user[0]},${user[1]});
);out center tags;`;

msg("Finding nearby "+type+"...");

try{
let d=await fetch(
"https://overpass-api.de/api/interpreter",
{method:"POST",body:q}
).then(r=>r.json());

$("results").innerHTML="";

d.elements.slice(0,30).forEach(x=>{
let lat=x.lat??x.center.lat;
let lon=x.lon??x.center.lon;
let name=x.tags?.name||type;

let m=L.marker([lat,lon]).addTo(map)
.bindPopup(`<b>${safe(name)}</b><br>${type}
<br><button onclick="selectPlace(
${lat},${lon},'${safe(name)}')">Navigate</button>`);

poiMarkers.push(m);

$("results").innerHTML+=`
<div class="item" onclick="focusPOI(${lat},${lon})">
📍 ${safe(name)}
</div>`;
});

msg(`${Math.min(d.elements.length,30)} nearby ${type}(s).`);
}catch(e){msg("Nearby search unavailable.")}
}

function focusPOI(lat,lon){map.setView([lat,lon],17)}

/* 24 Favorites */

function saveFavorite(){
if(!destination)return;

let name=$("results").querySelector("b")?.textContent||"Saved place";

favorites.unshift({
name:name.replace("📍 ",""),
lat:destination[0],
lon:destination[1]
});

favorites=favorites.slice(0,30);
localStorage.setItem("navFavorites",JSON.stringify(favorites));
msg("⭐ Saved to favorites.");
}

function showFavorites(){
$("results").innerHTML=favorites.length?
favorites.map(x=>`
<div class="item" onclick="selectPlace(
${x.lat},${x.lon},'${safe(x.name)}')">
⭐ ${safe(x.name)}
</div>`).join(""):"No favorites.";
}

/* 25 Recent */

function saveRecent(name,pos){
recent=recent.filter(x=>x.lat!==pos[0]||x.lon!==pos[1]);
recent.unshift({name,lat:pos[0],lon:pos[1]});
recent=recent.slice(0,20);
localStorage.setItem("navRecent",JSON.stringify(recent));
}

function showRecent(){
$("results").innerHTML=recent.length?
recent.map(x=>`
<div class="item" onclick="selectPlace(
${x.lat},${x.lon},'${safe(x.name)}')">
🕘 ${safe(x.name)}
</div>`).join(""):"No recent destinations.";
}

/* 26 Traffic-aware routing framework */

function showTraffic(){
if(!user)return locateMe();

$("alerts").innerHTML=
`<div class="alert">
🚦 <b>Traffic status</b><br>
Live traffic is not available from the
free OSM routing service. Route calculation
is active using current road-network data.
</div>`;

msg("Traffic-aware routing framework active.");
route();
}

/* 27 Road closures from OSM */

async function findClosures(){
if(!user)return locateMe();

msg("Checking mapped road restrictions...");

let q=`[out:json][timeout:15];(
way["access"="no"](around:5000,${user[0]},${user[1]});
way["vehicle"="no"](around:5000,${user[0]},${user[1]});
way["motor_vehicle"="no"](around:5000,${user[0]},${user[1]});
);out center tags;`;

try{
let d=await fetch(
"https://overpass-api.de/api/interpreter",
{method:"POST",body:q}
).then(r=>r.json());

$("results").innerHTML=d.elements.slice(0,20).map(x=>{
let lat=x.center?.lat,lon=x.center?.lon;
let n=x.tags?.name||"Restricted road";

if(lat&&lon){
let m=L.marker([lat,lon]).addTo(map)
.bindPopup("🚧 "+safe(n));
poiMarkers.push(m);
}

return `<div class="item">🚧 ${safe(n)}</div>`;
}).join("");

msg(`${d.elements.length} mapped restriction(s) found.`);
}catch(e){msg("Closure data unavailable.")}
}

/* 28 User incident reporting */

function reportIncident(){
if(!user)return locateMe();

let type=prompt(
"Incident type:\n1 Accident\n2 Road blocked\n3 Hazard\n4 Other");

if(!type)return;

let item={
type,
lat:user[0],
lon:user[1],
time:new Date().toISOString()
};

incidents.push(item);
localStorage.setItem("navIncidents",JSON.stringify(incidents));

let m=L.marker(user).addTo(map)
.bindPopup("⚠️ User-reported incident");

poiMarkers.push(m);

msg("⚠️ Incident saved locally.");
}

/* 29 Speed limit */

async function showSpeed(){
if(!user)return locateMe();

await loadRoadData();

msg(speedLimit?
`🛣️ Speed limit: ${speedLimit} km/h`
:"Speed limit not mapped here.");
}

async function loadRoadData(){
if(!user)return;

let q=`[out:json][timeout:10];
way["maxspeed"](around:80,${user[0]},${user[1]});
out tags center 1;`;

try{
let d=await fetch(
"https://overpass-api.de/api/interpreter",
{method:"POST",body:q}
).then(r=>r.json());

let s=d.elements[0]?.tags?.maxspeed;

if(s){
speedLimit=parseInt(s)||null;
$("info").textContent=
`🛣️ Local mapped speed limit: ${s}`;
}
}catch(e){}
}

/* 30 Speed warning */

function toggleWarnings(){
warningOn=!warningOn;
msg(warningOn?
"🔔 Speed warnings ON":
"🔕 Speed warnings OFF");
}

function checkSpeed(){
if(!warningOn||!speedLimit||!navigator.geolocation)return;

navigator.geolocation.getCurrentPosition(p=>{
let kmh=(p.coords.speed||0)*3.6;

if(kmh>speedLimit){
$("alerts").innerHTML=
`<div class="alert">
🔔 <b>Speed warning!</b><br>
Approx. ${kmh.toFixed(0)} km/h ·
Limit ${speedLimit} km/h
</div>`;
}
});
}

/* 31 Danger zones */

function showDangerZones(){
if(!user)return locateMe();

$("alerts").innerHTML=
`<div class="alert">
⚠️ Danger-zone alerts are based on
mapped restrictions and user-reported
incidents available in this prototype.
</div>`;

incidents.forEach(x=>{
if(Math.abs(x.lat-user[0])<.01&&
Math.abs(x.lon-user[1])<.01){
L.circle([x.lat,x.lon],{
radius:100,
color:"red"
}).addTo(map)
.bindPopup("⚠️ Reported "+x.type);
}
});

msg("Danger-zone scan complete.");
}

/* 32 Emergency location sharing */

async function emergency(){
if(!user)return locateMe();

let text=
`🆘 EMERGENCY LOCATION\n`+
`https://www.google.com/maps?q=${user[0]},${user[1]}`;

if(navigator.share){
try{
await navigator.share({
title:"Emergency Location",
text
});
msg("Emergency location sharing opened.");
}catch(e){}
}else{
await navigator.clipboard?.writeText(text);
alert(text);
msg("Emergency location copied.");
}
}

/* 33 Automatic rerouting */

function autoReroute(){
if(destination&&user)route();
}

if(navigator.geolocation){
navigator.geolocation.watchPosition(p=>{
let old=user;

user=[p.coords.latitude,p.coords.longitude];

if(!userMarker)
userMarker=L.circleMarker(user,{radius:9}).addTo(map);
else
userMarker.setLatLng(user);

checkSpeed();

if(destination&&old){
let moved=
Math.abs(user[0]-old[0])+
Math.abs(user[1]-old[1]);

if(moved>.0005)autoReroute();
}
},{enableHighAccuracy:true});
}

function clearMap(){
routes.forEach(x=>map.removeLayer(x));
poiMarkers.forEach(x=>map.removeLayer(x));
routes=[];poiMarkers=[];destination=null;

if(marker)map.removeLayer(marker);

$("results").innerHTML="";
$("steps").innerHTML="";
$("alerts").innerHTML="";
msg("Map cleared.");
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

function toggleOLED(){
document.body.classList.toggle("oled");
}
</script>
</body>
</html>
