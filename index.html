<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NavMap — Free Navigation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#12141a; --surface:#1c1f27; --surface2:#252934; --text:#eef0f4; --muted:#9aa2b1;
  --accent:#4f8cff; --border:#2e3340; --danger:#ff5a5a;
}
[data-theme="light"]{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#eef1f6; --text:#161a22; --muted:#5c6470;
  --accent:#2f6fed; --border:#dde2ea; --danger:#d63b3b;
}
[data-theme="oled"]{
  --bg:#000000; --surface:#0a0a0a; --surface2:#141414; --text:#f2f2f2; --muted:#8a8a8a;
  --accent:#4f8cff; --border:#1f1f1f; --danger:#ff5a5a;
}
[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --surface2:#000000; --text:#ffffff; --muted:#ffffff;
  --accent:#ffff00; --border:#ffffff; --danger:#ff6b6b;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; align-items:center;
  transition:background .2s,color .2s;
}
.app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
header{ padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
header h1{font-size:1.05rem; margin:0; letter-spacing:.2px;}
.theme-toggle{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px;}
.theme-toggle button{
  border:none; background:transparent; color:var(--muted); font-size:.65rem; font-weight:600;
  padding:6px 7px; border-radius:7px; cursor:pointer;
}
.theme-toggle button.active{background:var(--accent); color:#fff;}
[data-theme="hc"] .theme-toggle button.active{color:#000;}

.controls{padding:0 14px 8px; display:flex; flex-direction:column; gap:6px;}
.field-row{display:flex; gap:6px;}
input[type="text"]{
  flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:.9rem; outline:none;
}
input[type="text"]:focus{border-color:var(--accent);}
button.btn{
  border:none; border-radius:10px; padding:11px 14px; font-size:.85rem; font-weight:600;
  cursor:pointer; background:var(--accent); color:#fff; white-space:nowrap;
}
[data-theme="hc"] button.btn{color:#000;}
button.icon-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:10px; padding:11px 12px; cursor:pointer; font-size:.9rem;
}
button.icon-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
[data-theme="hc"] button.icon-btn.active{color:#000;}
.grow{flex:1;}
#map.measuring, #map.tapping{cursor:crosshair;}

.suggestions{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  max-height:170px; overflow-y:auto; display:none;
}
.suggestions div{padding:9px 12px; font-size:.82rem; border-bottom:1px solid var(--border); cursor:pointer;}
.suggestions div:last-child{border-bottom:none;}
.suggestions div:hover{background:var(--surface2);}
.suggestions .tag{font-size:.65rem; color:var(--accent); font-weight:700; margin-right:4px;}

.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0; display:none;}
.chips.show{display:flex;}
.chip{
  display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:6px 10px; font-size:.75rem; white-space:nowrap; cursor:pointer; flex-shrink:0;
}
.chip .x{color:var(--muted); font-weight:700; cursor:pointer;}

#map{flex:1; width:100%; min-height:280px;}

.route-info{
  padding:10px 14px; background:var(--surface); border-top:1px solid var(--border);
  display:none; align-items:center; justify-content:space-between; gap:10px;
}
.route-info.show{display:flex;}
.route-info .stat{font-size:.8rem; color:var(--muted);}
.route-info .stat b{color:var(--text); font-size:.95rem;}
.route-info .clear{color:var(--danger); background:none; border:none; font-size:.8rem; font-weight:600; cursor:pointer;}

.steps-panel{background:var(--surface); border-top:1px solid var(--border); display:none;}
.steps-panel.show{display:block;}
.steps-header{
  padding:9px 14px; font-size:.78rem; font-weight:700; display:flex; justify-content:space-between;
  cursor:pointer; color:var(--text);
}
.steps-list{max-height:180px; overflow-y:auto; display:none; padding:0 14px 10px;}
.steps-list.open{display:block;}
.step-item{font-size:.78rem; padding:6px 0; border-bottom:1px solid var(--border); color:var(--text);}
.step-item:last-child{border-bottom:none;}
.step-item span{color:var(--muted); font-size:.7rem;}

.status{ padding:6px 14px; font-size:.72rem; color:var(--muted); text-align:center; min-height:18px; }

footer{
  padding:10px 14px 16px; text-align:center; font-size:.72rem; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-top:1px solid var(--border);
}
.leaflet-control-attribution{font-size:9px !important;}
.heading-arrow{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.heading-arrow svg{ filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧭 NavMap</h1>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="dark">Dark</button>
      <button data-theme="light">Light</button>
      <button data-theme="oled">OLED</button>
      <button data-theme="hc">HC</button>
    </div>
  </header>

  <div class="controls">
    <div class="field-row">
      <input type="text" id="fromInput" placeholder="Start (or use my location)">
      <button class="icon-btn" id="locBtn" title="Use my location">📍</button>
    </div>
    <div class="suggestions" id="fromSuggest"></div>

    <div class="field-row">
      <button class="icon-btn" id="swapBtn" title="Swap start & destination">⇅</button>
      <div class="theme-toggle grow" id="profileToggle">
        <button data-profile="driving" class="active">🚗 Drive</button>
        <button data-profile="cycling">🚴 Bike</button>
        <button data-profile="walking">🚶 Walk</button>
      </div>
    </div>

    <div class="field-row">
      <input type="text" id="toInput" placeholder="Destination">
      <button class="btn" id="goBtn">Go</button>
    </div>
    <div class="suggestions" id="toSuggest"></div>

    <div class="chips" id="favChips"></div>

    <div class="field-row">
      <button class="icon-btn grow" id="tapSetBtn">📌 Tap map: off</button>
      <button class="icon-btn" id="favBtn" title="Save destination as favorite">⭐</button>
    </div>
    <div class="field-row">
      <button class="icon-btn grow" id="liveBtn">🛰️ Live tracking</button>
      <button class="icon-btn" id="recenterBtn" title="Recenter on me">🎯</button>
      <button class="icon-btn" id="voiceBtn" title="Voice guidance">🔇</button>
    </div>
    <button class="icon-btn" id="measureBtn" style="width:100%;">📏 Measure distance</button>
  </div>

  <div class="status" id="status"></div>

  <div id="map"></div>

  <div class="route-info" id="measureInfo">
    <div class="stat">Points<br><b id="measurePts">0</b></div>
    <div class="stat">Straight-line distance<br><b id="measureDist">–</b></div>
    <button class="clear" id="measureClearBtn">Clear</button>
  </div>

  <div class="route-info" id="routeInfo">
    <div class="stat">Distance<br><b id="distVal">–</b></div>
    <div class="stat">Time<br><b id="timeVal">–</b></div>
    <button class="clear" id="clearBtn">Clear</button>
  </div>

  <div class="steps-panel" id="stepsPanel">
    <div class="steps-header" id="stepsHeader">Turn-by-turn directions <span id="stepsCaret">▾</span></div>
    <div class="steps-list" id="stepsList"></div>
  </div>

  <footer>
    <div>Free routing via OSRM · Map data © OpenStreetMap contributors</div>
    <div>© Manik Roy <span id="year"></span>. All Rights Reserved.</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
if (typeof L === 'undefined') {
  document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
}
</script>
<script>
if (typeof L === 'undefined') {
  document.getElementById('status') && (document.getElementById('status').textContent = 'Map library failed to load. Check your internet connection and reload.');
}
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Theme ----------
const themeBtns = document.querySelectorAll('.theme-toggle#themeToggle button');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('navmap-theme', t);
  themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === t));
}
themeBtns.forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));
applyTheme(localStorage.getItem('navmap-theme') || 'dark');

// ---------- Map ----------
if (typeof L === 'undefined') {
  throw new Error('Leaflet failed to load — check your internet connection and reload the page.');
}
const map = L.map('map', {zoomControl:true}).setView([20.5937,78.9629], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let fromMarker=null, toMarker=null, routeLine=null;
let fromCoords=null, toCoords=null;
let profile = 'driving';

const statusEl = document.getElementById('status');
function setStatus(msg){ statusEl.textContent = msg || ''; }
const mapEl = document.getElementById('map');
const fromInput = document.getElementById('fromInput');
const toInput = document.getElementById('toInput');
const fromSuggest = document.getElementById('fromSuggest');
const toSuggest = document.getElementById('toSuggest');

// ---------- Geocoding & reverse geocoding (Nominatim, free, no key) ----------
async function geocode(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('Geocoding failed');
  return res.json();
}
async function reverseGeocode(lat, lon){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    return data.display_name || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  }catch(e){ return `${lat.toFixed(5)}, ${lon.toFixed(5)}`; }
}

// ---------- Recent searches ----------
function getRecents(){ try{ return JSON.parse(localStorage.getItem('navmap-recents')||'[]'); }catch(e){ return []; } }
function addRecent(item){
  let list = getRecents().filter(r => r.name !== item.name);
  list.unshift(item);
  list = list.slice(0,6);
  localStorage.setItem('navmap-recents', JSON.stringify(list));
}

function wireSuggest(inputEl, suggestEl, onPick){
  let timer=null;
  function renderRecents(){
    const recents = getRecents();
    if(!recents.length){ suggestEl.style.display='none'; return; }
    suggestEl.innerHTML = recents.map((r,i) => `<div data-idx="${i}"><span class="tag">RECENT</span>${r.name}</div>`).join('');
    suggestEl.style.display='block';
    suggestEl.querySelectorAll('div').forEach(div => {
      div.addEventListener('click', () => {
        const r = recents[div.dataset.idx];
        inputEl.value = r.name;
        suggestEl.style.display='none';
        onPick(r);
      });
    });
  }
  inputEl.addEventListener('focus', () => { if(!inputEl.value.trim()) renderRecents(); });
  inputEl.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inputEl.value.trim();
    if(q.length < 3){ if(!q) renderRecents(); else { suggestEl.style.display='none'; suggestEl.innerHTML=''; } return; }
    timer = setTimeout(async () => {
      try{
        const results = await geocode(q);
        if(!results.length){ suggestEl.style.display='none'; return; }
        suggestEl.innerHTML = results.map((r,i) => `<div data-idx="${i}">${r.display_name}</div>`).join('');
        suggestEl.style.display='block';
        suggestEl.querySelectorAll('div').forEach(div => {
          div.addEventListener('click', () => {
            const r = results[div.dataset.idx];
            const loc = {lat:parseFloat(r.lat), lon:parseFloat(r.lon), name:r.display_name};
            inputEl.value = r.display_name;
            suggestEl.style.display='none';
            addRecent(loc);
            onPick(loc);
          });
        });
      }catch(e){ setStatus('Search unavailable, try again.'); }
    }, 500);
  });
}
wireSuggest(fromInput, fromSuggest, (loc) => setPoint('from', loc));
wireSuggest(toInput, toSuggest, (loc) => setPoint('to', loc));

function setPoint(which, loc){
  const latlng = [loc.lat, loc.lon];
  if(which === 'from'){
    fromCoords = latlng;
    if(fromMarker) map.removeLayer(fromMarker);
    fromMarker = L.marker(latlng, {title:'Start'}).addTo(map);
  } else {
    toCoords = latlng;
    if(toMarker) map.removeLayer(toMarker);
    toMarker = L.marker(latlng, {title:'Destination'}).addTo(map);
  }
  map.setView(latlng, 13);
}

// ---------- Swap ----------
document.getElementById('swapBtn').addEventListener('click', () => {
  const tmpCoords = fromCoords; fromCoords = toCoords; toCoords = tmpCoords;
  const tmpVal = fromInput.value; fromInput.value = toInput.value; toInput.value = tmpVal;
  if(fromCoords) setPoint('from', {lat:fromCoords[0], lon:fromCoords[1]}); else if(fromMarker){ map.removeLayer(fromMarker); fromMarker=null; }
  if(toCoords) setPoint('to', {lat:toCoords[0], lon:toCoords[1]}); else if(toMarker){ map.removeLayer(toMarker); toMarker=null; }
});

// ---------- Travel mode ----------
document.querySelectorAll('#profileToggle button').forEach(b => {
  b.addEventListener('click', () => {
    profile = b.dataset.profile;
    document.querySelectorAll('#profileToggle button').forEach(x => x.classList.toggle('active', x===b));
  });
});

// ---------- Geolocation (with reverse geocoding) ----------
let lastKnownPos = null;
document.getElementById('locBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ setStatus('Geolocation not supported.'); return; }
  setStatus('Locating…');
  navigator.geolocation.getCurrentPosition(async pos => {
    const {latitude, longitude} = pos.coords;
    lastKnownPos = [latitude, longitude];
    setPoint('from', {lat:latitude, lon:longitude});
    setStatus('Finding your address…');
    fromInput.value = await reverseGeocode(latitude, longitude);
    setStatus('');
  }, () => setStatus('Could not get your location.'), {enableHighAccuracy:true, timeout:10000});
});

// ---------- Favorites ----------
function getFavorites(){ try{ return JSON.parse(localStorage.getItem('navmap-favorites')||'[]'); }catch(e){ return []; } }
function renderFavorites(){
  const favs = getFavorites();
  const chips = document.getElementById('favChips');
  chips.classList.toggle('show', favs.length > 0);
  chips.innerHTML = favs.map((f,i) => `<div class="chip" data-idx="${i}"><span class="label">⭐ ${f.label}</span><span class="x" data-del="${i}">✕</span></div>`).join('');
  chips.querySelectorAll('.label').forEach(el => {
    el.addEventListener('click', () => {
      const f = favs[el.parentElement.dataset.idx];
      toInput.value = f.label;
      setPoint('to', {lat:f.lat, lon:f.lon});
    });
  });
  chips.querySelectorAll('.x').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const list = getFavorites();
      list.splice(el.dataset.del, 1);
      localStorage.setItem('navmap-favorites', JSON.stringify(list));
      renderFavorites();
    });
  });
}
renderFavorites();
document.getElementById('favBtn').addEventListener('click', () => {
  if(!toCoords){ setStatus('Set a destination first to save it.'); return; }
  const label = prompt('Save this destination as:', toInput.value.split(',')[0] || 'Favorite');
  if(!label) return;
  const list = getFavorites();
  list.unshift({label, lat:toCoords[0], lon:toCoords[1]});
  localStorage.setItem('navmap-favorites', JSON.stringify(list.slice(0,10)));
  renderFavorites();
});

// ---------- Tap map to set start/destination ----------
let tapMode = null; // null -> 'from' -> 'to' -> null
const tapSetBtn = document.getElementById('tapSetBtn');
tapSetBtn.addEventListener('click', () => {
  tapMode = tapMode === null ? 'from' : (tapMode === 'from' ? 'to' : null);
  tapSetBtn.textContent = tapMode === null ? '📌 Tap map: off' : `📌 Tap map: set ${tapMode === 'from' ? 'start' : 'destination'}`;
  tapSetBtn.classList.toggle('active', tapMode !== null);
  mapEl.classList.toggle('tapping', tapMode !== null);
});

// ---------- Live GPS tracking with heading arrow ----------
let watchId = null;
let userMarker = null;
const liveBtn = document.getElementById('liveBtn');
function headingIcon(heading){
  const rot = typeof heading === 'number' ? heading : 0;
  return L.divIcon({
    className:'heading-arrow',
    html:`<div class="heading-arrow"><svg width="22" height="22" viewBox="0 0 24 24" style="transform:rotate(${rot}deg)"><path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#4f8cff" stroke="#fff" stroke-width="1"/></svg></div>`,
    iconSize:[22,22], iconAnchor:[11,11]
  });
}
liveBtn.addEventListener('click', () => {
  if(watchId){
    navigator.geolocation.clearWatch(watchId); watchId = null;
    liveBtn.classList.remove('active'); liveBtn.textContent = '🛰️ Live tracking';
    if(userMarker){ map.removeLayer(userMarker); userMarker = null; }
    return;
  }
  if(!navigator.geolocation){ setStatus('Geolocation not supported.'); return; }
  liveBtn.classList.add('active'); liveBtn.textContent = '🛰️ Tracking…';
  watchId = navigator.geolocation.watchPosition(pos => {
    const {latitude, longitude, heading} = pos.coords;
    lastKnownPos = [latitude, longitude];
    const icon = headingIcon(heading);
    if(userMarker) userMarker.setLatLng(lastKnownPos).setIcon(icon);
    else userMarker = L.marker(lastKnownPos, {icon}).addTo(map);
    checkVoiceAnnouncement(lastKnownPos);
  }, () => setStatus('Live tracking failed — check location permission.'), {enableHighAccuracy:true, maximumAge:2000});
});
document.getElementById('recenterBtn').addEventListener('click', () => {
  if(lastKnownPos) map.setView(lastKnownPos, 16);
  else setStatus('No known location yet — enable live tracking or use 📍.');
});

// ---------- Voice guidance ----------
let voiceEnabled = false;
const voiceBtn = document.getElementById('voiceBtn');
voiceBtn.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  voiceBtn.classList.toggle('active', voiceEnabled);
  voiceBtn.textContent = voiceEnabled ? '🔊' : '🔇';
});
function speak(text){
  if(!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}
let routeStepPoints = []; // [{lat,lon,text}]
let nextStepIdx = 0;
function checkVoiceAnnouncement(pos){
  if(!voiceEnabled || nextStepIdx >= routeStepPoints.length) return;
  const step = routeStepPoints[nextStepIdx];
  const d = haversine(pos, [step.lat, step.lon]) * 1000; // meters
  if(d < 40){
    speak(step.text);
    nextStepIdx++;
  }
}

// ---------- Turn-by-turn instruction text ----------
function maneuverText(step){
  const type = step.maneuver.type;
  const modifier = step.maneuver.modifier;
  const name = step.name ? ` onto ${step.name}` : '';
  if(type === 'depart') return `Head out${name}`;
  if(type === 'arrive') return 'Arrive at your destination';
  if(type === 'roundabout') return `Enter the roundabout${name}`;
  const dir = modifier ? modifier.replace('slight ', 'slight ').replace('sharp ', 'sharp ') : '';
  return `${type === 'turn' ? 'Turn' : type.charAt(0).toUpperCase()+type.slice(1)} ${dir}${name}`.trim();
}

// ---------- Routing (OSRM public demo server, free, no key) ----------
document.getElementById('goBtn').addEventListener('click', async () => {
  if(!fromCoords || !toCoords){
    setStatus('Pick both a start and a destination from the suggestions.');
    return;
  }
  setStatus('Finding route…');
  try{
    const coordsStr = `${fromCoords[1]},${fromCoords[0]};${toCoords[1]},${toCoords[0]}`;
    const url = `https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson&steps=true`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.code !== 'Ok' || !data.routes.length){ setStatus('No route found.'); return; }
    const route = data.routes[0];
    if(routeLine) map.removeLayer(routeLine);
    const latlngs = route.geometry.coordinates.map(c => [c[1], c[0]]);
    routeLine = L.polyline(latlngs, {color:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4f8cff', weight:5}).addTo(map);
    map.fitBounds(routeLine.getBounds(), {padding:[30,30]});

    const km = (route.distance/1000).toFixed(1);
    const mins = Math.round(route.duration/60);
    const hrs = Math.floor(mins/60);
    const remMins = mins%60;
    document.getElementById('distVal').textContent = `${km} km`;
    document.getElementById('timeVal').textContent = hrs > 0 ? `${hrs}h ${remMins}m` : `${mins} min`;
    document.getElementById('routeInfo').classList.add('show');

    const steps = (route.legs[0] && route.legs[0].steps) || [];
    routeStepPoints = steps.map(s => ({lat:s.maneuver.location[1], lon:s.maneuver.location[0], text:maneuverText(s)}));
    nextStepIdx = 0;
    const stepsList = document.getElementById('stepsList');
    stepsList.innerHTML = steps.map((s,i) => `<div class="step-item">${i+1}. ${maneuverText(s)} <span>(${Math.round(s.distance)} m)</span></div>`).join('');
    document.getElementById('stepsPanel').classList.add('show');
    if(voiceEnabled && routeStepPoints.length) speak(routeStepPoints[0].text);
    setStatus('');
  }catch(e){
    setStatus('Routing service unavailable. Try again.');
  }
});

document.getElementById('stepsHeader').addEventListener('click', () => {
  document.getElementById('stepsList').classList.toggle('open');
  const caret = document.getElementById('stepsCaret');
  caret.textContent = document.getElementById('stepsList').classList.contains('open') ? '▴' : '▾';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if(routeLine) map.removeLayer(routeLine);
  if(fromMarker) map.removeLayer(fromMarker);
  if(toMarker) map.removeLayer(toMarker);
  routeLine=fromMarker=toMarker=null;
  fromCoords=toCoords=null;
  fromInput.value=''; toInput.value='';
  document.getElementById('routeInfo').classList.remove('show');
  document.getElementById('stepsPanel').classList.remove('show');
  routeStepPoints = []; nextStepIdx = 0;
  setStatus('');
});

document.addEventListener('click', (e) => {
  if(!fromSuggest.contains(e.target) && e.target !== fromInput) fromSuggest.style.display='none';
  if(!toSuggest.contains(e.target) && e.target !== toInput) toSuggest.style.display='none';
});

// ---------- Distance measurement (straight-line, tap-to-add draggable points) ----------
let measuring = false;
let measurePoints = [];
let measureMarkers = [];
let measureLine = null;
const measureBtn = document.getElementById('measureBtn');
const measureInfo = document.getElementById('measureInfo');
const measurePtsEl = document.getElementById('measurePts');
const measureDistEl = document.getElementById('measureDist');

function haversine(a, b){
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[0]-a[0]);
  const dLon = toRad(b[1]-a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function updateMeasureUI(){
  measurePtsEl.textContent = measurePoints.length;
  let total = 0;
  for(let i=1; i<measurePoints.length; i++) total += haversine(measurePoints[i-1], measurePoints[i]);
  measureDistEl.textContent = total >= 1 ? `${total.toFixed(2)} km` : `${Math.round(total*1000)} m`;
  measureInfo.classList.toggle('show', measurePoints.length > 0);
}

function toggleMeasure(on){
  measuring = on;
  measureBtn.classList.toggle('active', on);
  mapEl.classList.toggle('measuring', on);
  if(on){ tapMode = null; tapSetBtn.textContent = '📌 Tap map: off'; tapSetBtn.classList.remove('active'); mapEl.classList.remove('tapping'); }
  setStatus(on ? 'Tap the map to add measurement points.' : '');
}
measureBtn.addEventListener('click', () => toggleMeasure(!measuring));

const measureIcon = L.divIcon({
  className: 'measure-pin',
  html: '<div style="width:16px;height:16px;border-radius:50%;background:#ff9800;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>',
  iconSize:[16,16], iconAnchor:[8,8]
});
function redrawMeasureLine(){
  if(measureLine) map.removeLayer(measureLine);
  measureLine = measurePoints.length > 1 ? L.polyline(measurePoints, {color:'#ff9800', weight:4, dashArray:'6,6'}).addTo(map) : null;
}

// ---------- Combined map click: measuring OR tap-to-set ----------
map.on('click', async (e) => {
  const pt = [e.latlng.lat, e.latlng.lng];
  if(measuring){
    const idx = measurePoints.length;
    measurePoints.push(pt);
    const marker = L.marker(pt, {icon: measureIcon, draggable:true}).addTo(map);
    marker.on('drag', (ev) => {
      const ll = ev.target.getLatLng();
      measurePoints[idx] = [ll.lat, ll.lng];
      redrawMeasureLine(); updateMeasureUI();
    });
    measureMarkers.push(marker);
    redrawMeasureLine(); updateMeasureUI();
    return;
  }
  if(tapMode){
    setStatus('Finding address…');
    const addr = await reverseGeocode(pt[0], pt[1]);
    if(tapMode === 'from'){ fromInput.value = addr; setPoint('from', {lat:pt[0], lon:pt[1]}); }
    else { toInput.value = addr; setPoint('to', {lat:pt[0], lon:pt[1]}); }
    setStatus('');
  }
});

document.getElementById('measureClearBtn').addEventListener('click', () => {
  measurePoints = [];
  measureMarkers.forEach(m => map.removeLayer(m));
  measureMarkers = [];
  if(measureLine) map.removeLayer(measureLine);
  measureLine = null;
  updateMeasureUI();
});
</script>
</body>
