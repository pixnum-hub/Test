<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Map Explorer</title>
<style>
:root{
  --bg:#f5f7fa; --fg:#1a1d23; --panel:#ffffff; --border:#d8dce3;
  --accent:#2563eb; --tab-bg:#eef1f5; --tab-active:#2563eb; --tab-fg:#1a1d23;
}
[data-theme="dark"]{
  --bg:#14161a; --fg:#e8eaed; --panel:#1d2026; --border:#2c3038;
  --accent:#5b8cff; --tab-bg:#20232a; --tab-active:#5b8cff; --tab-fg:#e8eaed;
}
[data-theme="oled"]{
  --bg:#000000; --fg:#f0f0f0; --panel:#000000; --border:#1a1a1a;
  --accent:#4da3ff; --tab-bg:#0a0a0a; --tab-active:#4da3ff; --tab-fg:#f0f0f0;
}
[data-theme="hc"]{
  --bg:#000000; --fg:#ffffff; --panel:#000000; --border:#ffffff;
  --accent:#ffff00; --tab-bg:#000000; --tab-active:#ffff00; --tab-fg:#000000;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .2s,color .2s;
}
header{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  padding:.6rem .8rem;border-bottom:1px solid var(--border);background:var(--panel);
}
h1{font-size:1rem;margin:0;flex:1 1 auto;white-space:nowrap;}
[data-theme="hc"] h1{font-weight:800;}
.theme-btn{
  border:1px solid var(--border);background:var(--tab-bg);color:var(--fg);
  border-radius:.5rem;padding:.4rem .7rem;font-size:.8rem;cursor:pointer;
}
.theme-btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
nav{
  display:flex;gap:.4rem;overflow-x:auto;padding:.5rem .8rem;background:var(--panel);
  border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;
}
.tab{
  flex:0 0 auto;border:1px solid var(--border);background:var(--tab-bg);color:var(--tab-fg);
  border-radius:999px;padding:.5rem 1rem;font-size:.85rem;cursor:pointer;white-space:nowrap;
}
.tab.active{background:var(--tab-active);border-color:var(--tab-active);color:var(--bg);font-weight:600;}
[data-theme="hc"] .tab.active{color:#000;}
main{flex:1 1 auto;position:relative;min-height:0;}
.engine{position:absolute;inset:0;display:none;width:100%;height:100%;}
.engine.active{display:block;}
#cesiumContainer,#maplibreContainer,#olContainer,#threeContainer,#worldwindWrap{width:100%;height:100%;}
#worldwindCanvas{width:100%;height:100%;display:block;}
.loading,.fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:2rem;color:var(--fg);background:var(--bg);font-size:.95rem;
}
footer{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:.15rem;padding:.7rem 1rem;border-top:1px solid var(--border);
  background:var(--panel);font-size:.78rem;color:var(--fg);
}
footer .years{opacity:.75;}
@media(min-width:640px){
  h1{font-size:1.15rem;}
  .tab{font-size:.9rem;}
}
</style>
</head>
<body data-theme="light">
<header>
  <h1>🌍 3D Map Explorer</h1>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">Theme: Light</button>
</header>
<nav id="tabs">
  <button class="tab active" data-engine="maplibre">MapLibre GL</button>
  <button class="tab" data-engine="cesium">CesiumJS</button>
  <button class="tab" data-engine="worldwind">NASA WorldWind</button>
  <button class="tab" data-engine="three">Three.js</button>
  <button class="tab" data-engine="ol">OpenLayers</button>
</nav>
<main>
  <div class="engine active" id="pane-maplibre"><div id="maplibreContainer"></div></div>
  <div class="engine" id="pane-cesium"><div id="cesiumContainer"></div></div>
  <div class="engine" id="pane-worldwind"><div id="worldwindWrap"><canvas id="worldwindCanvas"></canvas></div></div>
  <div class="engine" id="pane-three"><div id="threeContainer"></div></div>
  <div class="engine" id="pane-ol"><div id="olContainer"></div></div>
</main>
<footer>
  <div>© <span class="years">Manik Roy</span> <span id="year"></span>. All Rights Reserved.</div>
</footer>

<script>
/* ---------- Theme ---------- */
const themes=['light','dark','oled','hc'];
const themeLabels={light:'Light',dark:'Dark',oled:'OLED',hc:'High Contrast'};
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  document.body.setAttribute('data-theme',t);
  themeBtn.textContent='Theme: '+themeLabels[t];
  try{localStorage.setItem('mapexp-theme',t);}catch(e){}
}
let savedTheme='light';
try{savedTheme=localStorage.getItem('mapexp-theme')||'light';}catch(e){}
applyTheme(savedTheme);
themeBtn.addEventListener('click',()=>{
  const i=(themes.indexOf(document.body.getAttribute('data-theme'))+1)%themes.length;
  applyTheme(themes[i]);
});
document.getElementById('year').textContent=new Date().getFullYear();

/* ---------- Asset loader ---------- */
const loaded=new Set();
function loadCSS(href){
  if(loaded.has(href))return Promise.resolve();
  return new Promise((res,rej)=>{
    const l=document.createElement('link');
    l.rel='stylesheet';l.href=href;
    l.onload=()=>{loaded.add(href);res();};l.onerror=rej;
    document.head.appendChild(l);
  });
}
function loadJS(src){
  if(loaded.has(src))return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=()=>{loaded.add(src);res();};s.onerror=rej;
    document.head.appendChild(s);
  });
}
function showMsg(pane,html){
  const p=document.getElementById(pane);
  const d=document.createElement('div');
  d.className='fallback';d.innerHTML=html;
  p.appendChild(d);
}
function showToast(msg){
  console.error(msg);
  let t=document.getElementById('errToast');
  if(!t){
    t=document.createElement('div');
    t.id='errToast';
    t.style.cssText='position:fixed;left:.5rem;right:.5rem;bottom:.5rem;z-index:9999;'+
      'background:#3a0d0d;color:#ffb3b3;border:1px solid #a33;border-radius:.5rem;'+
      'padding:.5rem .7rem;font:12px/1.4 monospace;max-height:30vh;overflow:auto;white-space:pre-wrap;';
    document.body.appendChild(t);
  }
  const line=document.createElement('div');
  line.textContent=msg;
  t.appendChild(line);
}
window.addEventListener('error',e=>showToast('JS error: '+e.message));
window.addEventListener('unhandledrejection',e=>showToast('Promise error: '+(e.reason&&e.reason.message||e.reason)));

/* ---------- Tabs ---------- */
const initFns={maplibre:initMapLibre,cesium:initCesium,worldwind:initWorldWind,three:initThree,ol:initOL};
const initedEngines=new Set();
document.getElementById('tabs').addEventListener('click',e=>{
  const btn=e.target.closest('.tab');if(!btn)return;
  const eng=btn.dataset.engine;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===btn));
  document.querySelectorAll('.engine').forEach(p=>p.classList.toggle('active',p.id==='pane-'+eng));
  if(!initedEngines.has(eng)){
    initedEngines.add(eng);
    initFns[eng]().catch(err=>{
      console.error(eng,err);
      showMsg('pane-'+eng,'Could not load this engine (network/CDN issue). Check your connection and reload.');
    });
  }
  window.dispatchEvent(new Event('resize'));
});

/* Initialize whichever engine is active by default on page load */
(function bootDefaultEngine(){
  const activeTab=document.querySelector('.tab.active');
  const eng=activeTab ? activeTab.dataset.engine : 'maplibre';
  initedEngines.add(eng);
  initFns[eng]().catch(err=>{
    console.error(eng,err);
    showMsg('pane-'+eng,'Could not load this engine (network/CDN issue). Check your connection and reload.');
  });
})();

/* ---------- MapLibre GL JS (free demotiles style, no key) ---------- */
async function initMapLibre(){
  await loadCSS('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css');
  await loadJS('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js');
  const map=new maplibregl.Map({
    container:'maplibreContainer',
    style:'https://demotiles.maplibre.org/style.json',
    center:[0,20],zoom:1.4,projection:'globe'
  });
  map.addControl(new maplibregl.NavigationControl());
  map.on('error',e=>showToast('MapLibre: '+(e.error&&e.error.message||e.error)));
}

/* ---------- OpenLayers (free OSM tiles, no key) ---------- */
async function initOL(){
  await loadCSS('https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css');
  await loadJS('https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js');
  new ol.Map({
    target:'olContainer',
    layers:[new ol.layer.Tile({source:new ol.source.OSM()})],
    view:new ol.View({center:ol.proj.fromLonLat([0,20]),zoom:2})
  });
}

/* ---------- CesiumJS (bundled offline Natural Earth II imagery, no Ion token, no external tile server) ---------- */
async function initCesium(){
  const ver='1.120';
  window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@'+ver+'/Build/Cesium/';
  await loadCSS(window.CESIUM_BASE_URL+'Widgets/widgets.css');
  await loadJS(window.CESIUM_BASE_URL+'Cesium.js');
  Cesium.Ion.defaultAccessToken=undefined;
  const imageryProvider=await Cesium.TileMapServiceImageryProvider.fromUrl(
    Cesium.buildModuleUrl('Assets/Tiles/NaturalEarthII')
  );
  imageryProvider.errorEvent.addEventListener(e=>showToast('Cesium imagery: '+(e.message||e)));
  const viewer=new Cesium.Viewer('cesiumContainer',{
    imageryProvider:imageryProvider,
    terrainProvider:new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,
    navigationHelpButton:false,animation:false,timeline:false,fullscreenButton:false
  });
  viewer.camera.flyHome(0);
  let lastTick=performance.now();
  viewer.scene.postRender.addEventListener(function(){
    try{
      const now=performance.now();
      const dt=(now-lastTick)/1000;
      lastTick=now;
      viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z,-0.12*dt);
    }catch(err){
      showToast('Cesium rotate: '+err.message);
    }
  });
}

/* ---------- Three.js (rotating textured globe, no key) ---------- */
async function initThree(){
  await loadJS('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js');
  const c=document.getElementById('threeContainer');
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,0.1,1000);
  cam.position.z=3;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  c.appendChild(renderer.domElement);
  const tex=new THREE.TextureLoader().load(
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg'
  );
  const earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshStandardMaterial({map:tex}));
  scene.add(earth);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(5,3,5);scene.add(dl);
  let dragging=false,lastX=0,lastY=0,rotY=0,rotX=0;
  c.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('pointerup',()=>dragging=false);
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    rotY+=(e.clientX-lastX)*0.005;rotX+=(e.clientY-lastY)*0.005;
    lastX=e.clientX;lastY=e.clientY;
  });
  function animate(){
    requestAnimationFrame(animate);
    earth.rotation.y=rotY+performance.now()*0.00004;
    earth.rotation.x=rotX;
    renderer.render(scene,cam);
  }
  animate();
  window.addEventListener('resize',()=>{
    if(!document.getElementById('pane-three').classList.contains('active'))return;
    cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix();
    renderer.setSize(c.clientWidth,c.clientHeight);
  });
}

/* ---------- NASA WorldWind (community WorldWindJS fork, bundled offline imagery) ---------- */
async function initWorldWind(){
  await loadJS('https://cdn.jsdelivr.net/npm/worldwindjs@1.9.5/build/dist/worldwind.min.js');
  if(typeof WorldWind==='undefined')throw new Error('WorldWind not available');
  const wwd=new WorldWind.WorldWindow('worldwindCanvas');
  wwd.addLayer(new WorldWind.BMNGOneImageLayer());
  wwd.addLayer(new WorldWind.CompassLayer());
  wwd.addLayer(new WorldWind.CoordinatesDisplayLayer(wwd));
  wwd.addLayer(new WorldWind.ViewControlsLayer(wwd));
}
</script>
</body>
</html>
