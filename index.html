<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>YTX — YouTube Extractor</title>
<meta name="description" content="Pull title, thumbnail and audio/video streams from a public YouTube link. No key, no sign-up." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   YTX — design tokens
   Palette: ink + signal-teal. One accent, used sparingly.
   Type: Space Grotesk (display) / IBM Plex Mono (technical data)
   ============================================================ */
:root {
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-pill: 999px;

  --sp-1: .375rem;
  --sp-2: .625rem;
  --sp-3: 1rem;
  --sp-4: 1.5rem;
  --sp-5: 2.25rem;
  --sp-6: 3.25rem;

  --ease: cubic-bezier(.2, .7, .2, 1);
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f4f0;
  --bg-glow: radial-gradient(1100px 420px at 50% -12%, rgba(15,110,95,.10), transparent 60%);
  --surface: #ffffff;
  --surface-2: #fbfaf7;
  --text: #171712;
  --text-dim: #6d685d;
  --border: #e4e0d5;
  --border-strong: #cfc9ba;
  --accent: #0f6e5f;
  --accent-2: #17967e;
  --accent-text: #ffffff;
  --focus: #0f6e5f;
  --shadow: 0 1px 2px rgba(30,25,10,.04), 0 12px 28px -14px rgba(30,25,10,.16);
  --shadow-sm: 0 1px 2px rgba(30,25,10,.06);
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101317;
  --bg-glow: radial-gradient(1100px 460px at 50% -10%, rgba(47,191,154,.14), transparent 60%);
  --surface: #171b1f;
  --surface-2: #1d2226;
  --text: #edece7;
  --text-dim: #8d938f;
  --border: #262c31;
  --border-strong: #343b41;
  --accent: #2fbf9a;
  --accent-2: #58d8b6;
  --accent-text: #04140f;
  --focus: #2fbf9a;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 20px 40px -22px rgba(0,0,0,.7);
  --shadow-sm: 0 1px 0 rgba(0,0,0,.5);
}

[data-theme="oled"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-glow: radial-gradient(1000px 420px at 50% -10%, rgba(47,191,154,.10), transparent 62%);
  --surface: #060606;
  --surface-2: #0b0c0c;
  --text: #eeeeee;
  --text-dim: #84867f;
  --border: #1a1b1a;
  --border-strong: #262726;
  --accent: #2fe0b4;
  --accent-2: #6dedd0;
  --accent-text: #000000;
  --focus: #2fe0b4;
  --shadow: none;
  --shadow-sm: none;
}

[data-theme="hc"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-glow: none;
  --surface: #000000;
  --surface-2: #000000;
  --text: #ffffff;
  --text-dim: #ffffff;
  --border: #ffffff;
  --border-strong: #ffffff;
  --accent: #ffd400;
  --accent-2: #ffe45c;
  --accent-text: #000000;
  --focus: #ffd400;
  --shadow: none;
  --shadow-sm: none;
}

/* ---- Reset & base ---------------------------------------------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image: var(--bg-glow);
  background-repeat: no-repeat;
  color: var(--text);
  font-family: var(--font-display);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s var(--ease), color .2s var(--ease);
  animation: rise .5s var(--ease) both;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
[data-theme="hc"] * { border-radius: 0 !important; box-shadow: none !important; }
[data-theme="hc"] .panel, [data-theme="hc"] .theme-switch, [data-theme="hc"] #url-input,
[data-theme="hc"] #format-select { border-width: 2px !important; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- Topbar ------------------------------------------------------ */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.wordmark {
  display: flex;
  align-items: baseline;
  gap: .45rem;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -.01em;
}
.wordmark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.wordmark .sub { font-weight: 500; color: var(--text-dim); font-size: .82rem; letter-spacing: 0; }

.theme-switch {
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-sm);
}
.theme-switch button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  background: transparent;
  color: var(--text-dim);
  border: none;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: background-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
}
.theme-switch button svg { width: 17px; height: 17px; }
.theme-switch button:hover { color: var(--text); }
.theme-switch button:active { transform: scale(.9); }
.theme-switch button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-text);
}

/* ---- Stage / panels ------------------------------------------------ */
.stage {
  flex: 1;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: var(--sp-3) var(--sp-3) var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5) var(--sp-4);
  box-shadow: var(--shadow);
}
.panel h1 {
  font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem);
  letter-spacing: -.02em;
  line-height: 1.15;
  margin: 0 0 .5rem;
}
.lede { color: var(--text-dim); margin: 0 0 var(--sp-4); font-size: .95rem; max-width: 52ch; line-height: 1.55; }

.url-row { display: flex; flex-direction: column; gap: var(--sp-2); position: relative; }
@media (min-width: 560px) { .url-row { flex-direction: row; } }

#url-input {
  flex: 1;
  font: inherit;
  font-family: var(--font-mono);
  font-size: .9rem;
  padding: .85rem 1rem;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
#url-input::placeholder { color: var(--text-dim); }
#url-input:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  outline: none;
}

#extract-btn, button.primary {
  position: relative;
  font: inherit;
  font-weight: 600;
  font-size: .9rem;
  letter-spacing: -.005em;
  padding: .85rem 1.3rem;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  color: var(--accent-text);
  border: 1px solid var(--accent);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: transform .1s var(--ease), filter .15s var(--ease), box-shadow .15s var(--ease);
  box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 65%, transparent);
}
#extract-btn:hover, button.primary:hover { filter: brightness(1.05); }
#extract-btn:active, button.primary:active { transform: translateY(1px) scale(.99); }
#extract-btn:disabled, button.primary:disabled { opacity: .55; cursor: progress; filter: none; box-shadow: none; }
button.primary { width: 100%; margin-top: var(--sp-4); display: flex; align-items: center; justify-content: center; gap: .5rem; }

.status { min-height: 1.3rem; font-size: .84rem; color: var(--text-dim); margin: var(--sp-3) 0 0; display: flex; align-items: center; gap: .5rem; }
.status[data-tone="error"] { color: #e2685f; }
.spinner {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Result -------------------------------------------------------- */
.result { animation: rise .35s var(--ease) both; }
.result-head { display: flex; gap: var(--sp-4); align-items: flex-start; }

.kind-switch {
  display: flex;
  gap: 6px;
  margin-top: var(--sp-4);
}
.kind-switch button {
  display: flex;
  align-items: center;
  gap: .4rem;
  font: inherit;
  font-size: .84rem;
  font-weight: 600;
  padding: .5rem .9rem;
  background: var(--surface-2);
  color: var(--text-dim);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.kind-switch button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-text);
  border-color: var(--accent);
}
#thumb {
  width: 148px;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface-2);
}
.result-meta h2 { font-size: 1.08rem; margin: 0 0 .4rem; line-height: 1.35; letter-spacing: -.01em; }
#v-sub { color: var(--text-dim); font-size: .78rem; margin: 0; }

#format-wrap { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: .45rem; }
#format-wrap label { font-size: .76rem; color: var(--text-dim); text-transform: none; }
#format-select {
  font-size: .85rem;
  padding: .7rem .8rem;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 18px) center, calc(100% - 13px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  color: var(--text);
}
.note { font-size: .8rem; color: var(--text-dim); margin-top: var(--sp-3); line-height: 1.5; }

/* ---- Footer: centered, stacked, auto-year --------------------------- */
.site-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: .3rem;
  padding: var(--sp-4) var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--border);
}
.foot-line { margin: 0; font-size: .8rem; color: var(--text-dim); }
.foot-line.small { font-size: .72rem; opacity: .85; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="wordmark">YTX<span class="dot">•</span><span class="sub">extractor</span></div>
  <div class="theme-switch" role="group" aria-label="Theme">
    <button data-theme-btn="light" aria-label="Light theme" title="Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
    </button>
    <button data-theme-btn="dark" aria-label="Dark theme" title="Dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <button data-theme-btn="oled" aria-label="OLED true black theme" title="OLED">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button data-theme-btn="hc" aria-label="High contrast theme" title="HC">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <section class="panel" aria-label="Extract a video">
    <h1>Drop a YouTube link.</h1>
    <p class="lede">Runs on yt-dlp + FFmpeg, with YouTube.js as a metadata fallback. Nothing to key in, nothing to sign up for.</p>

    <form id="extract-form" class="url-row">
      <input id="url-input" type="url" inputmode="url" autocomplete="off"
             placeholder="https://www.youtube.com/watch?v=…" required />
      <button type="submit" id="extract-btn">Extract</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section id="result" class="panel result hidden" aria-label="Extraction result">
    <div class="result-head">
      <img id="thumb" alt="" />
      <div class="result-meta">
        <h2 id="v-title">—</h2>
        <p id="v-sub" class="mono"></p>
      </div>
    </div>

    <div class="kind-switch" role="group" aria-label="Extract as">
      <button type="button" data-kind-btn="video" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="14" height="13" rx="2"/><path d="m20.5 9 1-1v8l-1-1"/></svg>
        Video
      </button>
      <button type="button" data-kind-btn="audio" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        Audio
      </button>
    </div>

    <div id="format-wrap">
      <label for="format-select" id="format-label">Video format</label>
      <select id="format-select" class="mono"></select>
    </div>

    <button id="download-btn" class="primary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5"/><path d="M4 18.5V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5"/></svg>
      Download
    </button>
    <p id="fallback-note" class="note hidden"></p>
  </section>
</main>

<footer class="site-footer">
  <p class="foot-line">© <span id="year"></span> Manik Roy. All Rights Reserved.</p>
  <p class="foot-line small">Use only on videos you own or have permission to save.</p>
</footer>

<script>
// ---- Footer year, always current, zero maintenance ----
document.getElementById("year").textContent = new Date().getFullYear();

// ---- Theme: light / dark / oled / hc, persisted, defaults to system pref ----
const THEMES = ["light", "dark", "oled", "hc"];
const root = document.documentElement;
const saved = localStorage.getItem("ytx-theme");
const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
setTheme(THEMES.includes(saved) ? saved : (systemDark ? "dark" : "light"));

document.querySelectorAll("[data-theme-btn]").forEach((btn) => {
  btn.addEventListener("click", () => setTheme(btn.dataset.themeBtn));
});

function setTheme(name) {
  root.setAttribute("data-theme", name);
  localStorage.setItem("ytx-theme", name);
  document.querySelectorAll("[data-theme-btn]").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.themeBtn === name));
  });
}

// ---- Extraction ----
const form = document.getElementById("extract-form");
const urlInput = document.getElementById("url-input");
const extractBtn = document.getElementById("extract-btn");
const statusEl = document.getElementById("status");
const result = document.getElementById("result");
const thumb = document.getElementById("thumb");
const vTitle = document.getElementById("v-title");
const vSub = document.getElementById("v-sub");
const formatSelect = document.getElementById("format-select");
const formatLabel = document.getElementById("format-label");
const downloadBtn = document.getElementById("download-btn");
const fallbackNote = document.getElementById("fallback-note");
const kindButtons = document.querySelectorAll("[data-kind-btn]");

let current = null;   // { url, title }
let lastFormats = []; // formats from the last successful /api/info call
let kind = "video";   // "video" | "audio"

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  setLoading("Reading video info…");
  extractBtn.disabled = true;
  result.classList.add("hidden");

  try {
    const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
    const ct = res.headers.get("content-type") || "";
    if (!ct.includes("application/json")) {
      throw new Error("The server didn't return data — is `npm start` running? The API lives at the same address as this page, not opened as a plain file.");
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Extraction failed.");
    renderResult(url, data);
    setStatus("");
  } catch (err) {
    setStatus(err.message, "error");
  } finally {
    extractBtn.disabled = false;
  }
});

function setLoading(msg) {
  statusEl.removeAttribute("data-tone");
  statusEl.innerHTML = `<span class="spinner" aria-hidden="true"></span>${msg}`;
}

function renderResult(url, data) {
  current = { url, title: data.title };
  lastFormats = data.formats || [];
  thumb.src = data.thumbnail || "";
  vTitle.textContent = data.title || "Untitled";
  vSub.textContent = [data.uploader, formatDuration(data.duration)].filter(Boolean).join(" · ");

  fallbackNote.textContent = data.note || "";
  fallbackNote.classList.toggle("hidden", !data.note);

  kind = "video";
  kindButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kindBtn === kind)));
  populateFormats();
  result.classList.remove("hidden");
}

kindButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    kind = btn.dataset.kindBtn;
    kindButtons.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    populateFormats();
  });
});

function populateFormats() {
  formatLabel.textContent = kind === "video" ? "Video format" : "Audio format";
  formatSelect.innerHTML = "";

  const pool = kind === "video"
    ? lastFormats.filter((f) => f.hasVideo)
    : lastFormats.filter((f) => f.hasAudio && !f.hasVideo);

  if (kind === "audio") {
    const best = document.createElement("option");
    best.value = "";
    best.textContent = "Best available · MP3";
    formatSelect.appendChild(best);
  }

  if (!pool.length && kind === "video") {
    const opt = document.createElement("option");
    opt.textContent = "No downloadable formats on this server";
    formatSelect.appendChild(opt);
    downloadBtn.disabled = true;
    return;
  }

  pool.forEach((f) => {
    const opt = document.createElement("option");
    opt.value = f.id;
    opt.dataset.hasAudio = String(f.hasAudio);
    const bits = kind === "video"
      ? [f.note, f.ext, f.hasAudio ? "with audio" : "video only", f.filesize && formatSize(f.filesize)]
      : [f.abr ? `${f.abr}kbps` : f.note, f.ext, f.filesize && formatSize(f.filesize)];
    opt.textContent = bits.filter(Boolean).join(" · ");
    formatSelect.appendChild(opt);
  });
  downloadBtn.disabled = false;
}

downloadBtn.addEventListener("click", () => {
  if (!current) return;
  const opt = formatSelect.selectedOptions[0];
  let format = opt ? opt.value : "";

  // Video-only stream picked in "video" mode: mux with the best audio track.
  if (kind === "video" && format && opt.dataset.hasAudio === "false") {
    format = `${format}+bestaudio/best`;
  }

  const q = new URLSearchParams({ url: current.url, format, kind, title: current.title || "video" });
  window.location.href = `/api/download?${q.toString()}`;
});

function setStatus(msg, tone) {
  statusEl.textContent = msg;
  if (tone) statusEl.setAttribute("data-tone", tone);
  else statusEl.removeAttribute("data-tone");
}

function formatDuration(sec) {
  if (!sec && sec !== 0) return "";
  const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function formatSize(bytes) {
  if (!bytes) return "";
  const mb = bytes / (1024 * 1024);
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
}

</script>
</body>
</html>
