<style>
:root{

  --verse-scale:1;
}
[data-theme="dark"]{
  --bg:#1B120A; --surface:#241A10; --text:#F1E4C9; --muted:#C9AE84;
  --accent:#FF7A3D; --gold:#E8B84B; --line:rgba(255,122,61,.3); --shadow:rgba(0,0,0,.4);
}
[data-theme="oled"]{
  --bg:#000000; --surface:#0A0A0A; --text:#EDE0C8; --muted:#B39D7A;
  --accent:#FF8A4C; --gold:#E8B84B; --line:rgba(255,138,76,.3); --shadow:rgba(0,0,0,.6);
}
[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --text:#FFFFFF; --muted:#FFFFFF;
  --accent:#FFD400; --gold:#FFD400; --line:#FFFFFF; --shadow:rgba(0,0,0,0);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
body{
  font-family:"Noto Serif",serif; min-height:100vh; display:flex; flex-direction:column;
  transition:background .3s,color .3s; padding-bottom:env(safe-area-inset-bottom);
}
[lang="hi"] .verse, [lang="hi"] .subtitle{ font-family:"Noto Serif Devanagari","Mangal",serif; }
[lang="bn"] .verse, [lang="bn"] .subtitle{ font-family:"Noto Serif Bengali","Vrinda","Noto Sans Bengali",serif; }
[lang="hi"] h1{ font-family:"Noto Serif Devanagari","Yatra One",cursive; }
[lang="bn"] h1{ font-family:"Noto Serif Bengali","Yatra One",cursive; }

header{ text-align:center; padding:28px 16px 14px; }
h1{
  font-family:"Yatra One",cursive; font-weight:400; font-size:clamp(2.2rem,9vw,3.2rem);
  margin:0; color:var(--accent); letter-spacing:.5px;
}
.subtitle{ color:var(--muted); font-size:1rem; margin-top:4px; letter-spacing:1px; text-transform:uppercase; }
.divider{ width:64px; height:3px; background:var(--gold); margin:14px auto; border-radius:2px; }

.controls{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0 12px 18px; }
.toolbar-group{
  display:flex; align-items:center; background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:4px; box-shadow:0 2px 8px var(--shadow);
}
.toolbar-group button{
  border:none; background:transparent; color:var(--muted); font-size:1rem; font-weight:600;
  padding:9px 16px; border-radius:999px; cursor:pointer; transition:all .25s; font-family:inherit;
}
.toolbar-group button.active{ background:var(--accent); color:var(--bg); }
[data-theme="hc"] .toolbar-group button.active{ color:#000; }

.round-btn{
  border:none; background:var(--accent); color:var(--bg); border-radius:50%;
  cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
}
[data-theme="hc"] .round-btn{ color:#000; }

#sizeGroup button{ font-size:1rem; }
#sizeGroup button:first-child{ font-size:.8rem; }
#sizeGroup button:last-child{ font-size:1.2rem; }

#teleGroup #teleBtn{ width:48px; height:48px; font-size:1.2rem; margin:0 4px; }
#teleGroup .tele-step{ width:42px; height:42px; font-size:1.2rem; font-weight:700; margin:0 6px; }
#teleGroup{ padding:8px 10px; gap:4px; }
#teleSpeedVal{ font-size:1.05rem; font-weight:700; color:var(--text); min-width:44px; text-align:center; }

#installBtn{
  background:var(--accent) !important; color:var(--bg) !important; font-weight:700;
  padding:9px 18px !important; border-radius:999px;
}
[data-theme="hc"] #installBtn{ color:#000 !important; }

.row-break{ flex-basis:100%; height:0; }

main{ flex:1; max-width:640px; width:100%; margin:0 auto; padding:0 16px 30px; }
.doha{
  background:var(--surface); border-left:4px solid var(--gold); border-radius:8px;
  padding:18px 20px; margin:0 0 18px; box-shadow:0 2px 10px var(--shadow); font-style:italic;
}
.chaupai-list{ list-style:none; margin:0; padding:0; counter-reset:v; }
.chaupai-list li{
  position:relative; padding:14px 16px 14px 46px; margin-bottom:10px; border-radius:8px;
  background:var(--surface); box-shadow:0 1px 6px var(--shadow); counter-increment:v;
}
.chaupai-list li::before{
  content:counter(v); position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--bg);
  font-size:.78rem; font-family:"Noto Serif",serif; display:flex; align-items:center; justify-content:center;
}
[data-theme="hc"] .chaupai-list li::before{ color:#000; }
.verse{ font-size:calc(1.18rem * var(--verse-scale)); line-height:1.8; }
@media (min-width:480px){ .verse{ font-size:calc(1.3rem * var(--verse-scale)); } }

.app-error{
  background:#3a0d0d; color:#ffd9d9; border:1px solid #ff6b6b; border-radius:10px;
  padding:16px; margin:16px; font-family:monospace; font-size:.85rem; white-space:pre-wrap;

footer{

  border-top:1px solid var(--line); font-size:.9rem; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
footer strong{ color:var(--accent); }

function showAppError(context, err){
  const main = document.getElementById("main");
  const msg = (err && err.message) ? err.message : String(err);
  if(main) main.innerHTML = '<div class="app-error">' + context + ': ' + msg + '</div>' + main.innerHTML;
  console.error(context, err);
}

    df: "পবনতনয় সংকট হরন মঙ্গল মূরতি রূপ। রাম লখন সীতা সহিত হৃদয় বসহু সুর ভূপ॥"
  }
};
const APP_NAME = { hi:"हनुमा", en:"Hanuma", bn:"হনূমা" };
const TITLES = { hi:["हनुमान चालीसा"], en:["Hanuman Chalisa"], bn:["হনুমান চালিসা"] };
let lang = "bn";

function render(){
  const d = DATA[lang];
  let html = '<div class="doha verse">' + d.d1 + '</div><div class="doha verse">' + d.d2 + '</div><ol class="chaupai-list">';
  for(let i = 0; i < d.c.length; i++){
    html += '<li class="verse">' + d.c[i] + '</li>';
  }
  html += '</ol><div class="doha verse">' + d.df + '</div>';
  document.getElementById("main").innerHTML = html;
  document.getElementById("title").textContent = APP_NAME[lang];
  document.getElementById("subtitle").textContent = TITLES[lang][0];
  document.documentElement.lang = lang;
}

/* ---------- Render the Chalisa text FIRST, before anything else that could fail ---------- */
try{
  document.getElementById("year").textContent = new Date().getFullYear();
  render();
} catch(err){
  showAppError("Could not display the Chalisa text", err);
}

/* ---------- Language toggle ---------- */
try{
  document.getElementById("langGroup").addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    lang = btn.dataset.lang;
    Array.prototype.forEach.call(e.currentTarget.children, function(b){ b.classList.toggle("active", b===btn); });
    if(typeof stopSpeak === "function" && "speechSynthesis" in window) stopSpeak();
    render();
  });
} catch(err){ console.error("Language toggle setup failed:", err); }

/* ---------- Theme toggle ---------- */
try{
  document.getElementById("themeGroup").addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    document.body.setAttribute("data-theme", btn.dataset.theme);
    Array.prototype.forEach.call(e.currentTarget.children, function(b){ b.classList.toggle("active", b===btn); });
  });
} catch(err){ console.error("Theme toggle setup failed:", err); }

/* ---------- Text size ---------- */
try{
  let verseScale = 1;
  document.getElementById("sizeGroup").addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    verseScale = Math.min(1.6, Math.max(0.75, verseScale + parseInt(btn.dataset.step) * 0.1));
    document.documentElement.style.setProperty("--verse-scale", verseScale);
  });
} catch(err){ console.error("Text size control setup failed:", err); }

/* =========================================================
   Teleprompter — auto-scroll with a −/value/+ speed stepper.
   Ignores touches on its own controls so adjusting speed or
   tapping play/pause doesn't self-trigger the "stop on manual
   scroll" behaviour meant for outside interaction.
   ========================================================= */
try{
  let teleRAF = null, teleSpeed = 1;
  const teleBtn = document.getElementById("teleBtn");
  const teleSpeedVal = document.getElementById("teleSpeedVal");

  function teleStep(){
    window.scrollBy(0, teleSpeed);
    const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 2;
    if(atBottom){ stopTele(); return; }
    teleRAF = requestAnimationFrame(teleStep);
  }
  function startTele(){ teleBtn.textContent = "⏸"; teleRAF = requestAnimationFrame(teleStep); }
  function stopTele(){ teleBtn.textContent = "▶"; if(teleRAF) cancelAnimationFrame(teleRAF); teleRAF = null; }

  teleBtn.addEventListener("click", () => { teleRAF ? stopTele() : startTele(); });

  document.querySelectorAll(".tele-step").forEach(btn => {
    btn.addEventListener("click", () => {
      teleSpeed = Math.min(3, Math.max(0.3, Math.round((teleSpeed + parseFloat(btn.dataset.step)) * 10) / 10));
      teleSpeedVal.textContent = teleSpeed.toFixed(1);
    });
  });

  ["wheel","touchstart"].forEach(evt => window.addEventListener(evt, e => {
    if(teleRAF && !e.target.closest("#teleGroup")) stopTele();
  }, {passive:true}));
} catch(err){ console.error("Teleprompter setup failed:", err); }

/* =========================================================
   Speech — reads the current language's verses aloud using the
   free, built-in Web Speech API. Chunked per-verse with a
   persistent utterance reference (Chrome silently garbage-
   collects/halts unreferenced or very long utterances).
   ========================================================= */
let stopSpeak = () => {};
try{
  const speakBtn = document.getElementById("speakBtn");
  const voiceLang = { hi:"hi-IN", en:"en-IN", bn:"bn-IN" };
  let speaking = false;
  const speechOK = ("speechSynthesis" in window) && (typeof SpeechSynthesisUtterance !== "undefined");
  if(!speechOK) speakBtn.style.opacity = "0.6";

  let speechQueue = [];
  let queueIndex = 0;
  let currentUtterance = null;
  let voiceGender = "male";
  let speechRate = 0.80;
  let speechPitch = 0.92;

  const MALE_HINTS = ["male","prabhat","hemant","ravi","david","mark","daniel","rishi","amit","aditya",
    "guy","fred","alex","tom","james","paul","google uk english male","microsoft ravi","arnav","neel"];
  const FEMALE_HINTS = ["female","heera","lekha","kalpana","susan","samantha","zira","priya",
    "google uk english female","victoria","karen","moira","tessa","swara","aria"];

  let voicesReady = null;
  function voicesLoaded(){
    if(voicesReady) return voicesReady;
    voicesReady = new Promise(resolve => {
      const existing = speechSynthesis.getVoices();
      if(existing.length){ resolve(existing); return; }
      speechSynthesis.addEventListener("voiceschanged", () => resolve(speechSynthesis.getVoices()), { once:true });
      setTimeout(() => resolve(speechSynthesis.getVoices()), 1500);
    });
    return voicesReady;
  }

  function pickVoice(langCode, voices){
    if(voices.length === 0) return null;
    const base = langCode.split("-")[0];
    const matching = voices.filter(v => v.lang === langCode || (v.lang && v.lang.startsWith(base)));
    const hints = voiceGender === "male" ? MALE_HINTS : FEMALE_HINTS;
    if(matching.length > 0){
      const preferred = matching.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
      return { voice: preferred || matching[0], exactMatch: true };
    }
    // No voice at all for this language on this device — fall back to any
    // available voice (still gender-preferred if possible) so speech isn't
    // silently dropped. It just won't sound native for this language.
    const anyPreferred = voices.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
    const fallbackDefault = voices.find(v => v.default) || voices[0];
    return { voice: anyPreferred || fallbackDefault, exactMatch: false };
  }

  function speakNextChunk(){
    if(queueIndex >= speechQueue.length){ stopSpeak(); return; }
    const text = speechQueue[queueIndex];
    voicesLoaded().then(voices => {
      const utter = new SpeechSynthesisUtterance(text);
      const langCode = voiceLang[lang];
      const picked = pickVoice(langCode, voices);
      const voiceLabel = document.getElementById("voiceNameLabel");
      if(picked && picked.voice){
        utter.voice = picked.voice;
        utter.lang = picked.exactMatch ? langCode : picked.voice.lang;  // avoid lang/voice mismatch that some engines refuse to speak
        if(queueIndex === 0){
          voiceLabel.textContent = picked.exactMatch
            ? "Voice: " + picked.voice.name
            : "No " + langCode + " voice on this device — using " + picked.voice.name + " instead";
        }
      } else {
        utter.lang = langCode;
        if(queueIndex === 0) voiceLabel.textContent = "No voices installed on this device at all.";
      }
      utter.rate = speechRate;
      utter.pitch = speechPitch;
      utter.onend = () => { queueIndex++; speakNextChunk(); };
      utter.onerror = () => {
        if(queueIndex === 0){
          stopSpeak();
          alert("Couldn't start speech. Your browser may not have any voice installed.");
        } else {
          queueIndex++; speakNextChunk();
        }
      };
      currentUtterance = utter;
      speechSynthesis.speak(utter);
    });
  }

  stopSpeak = function(){
    speechSynthesis.cancel();
    speaking = false;
    currentUtterance = null;
    speakBtn.textContent = "🔊";
  };

  function startSpeak(){
    const d = DATA[lang];
    speechQueue = [d.d1, d.d2, ...d.c, d.df];
    queueIndex = 0;
    speaking = true;
    speakBtn.textContent = "⏸";
    speakNextChunk();
  }

  speakBtn.addEventListener("click", () => {
    if(!speechOK){ alert("Speech isn't supported in this browser. Please open this file in Chrome, Safari or Edge."); return; }
    if(speaking){ stopSpeak(); return; }
    try{ startSpeak(); }
    catch(err){ console.error("Speech error:", err); alert("Speech playback failed to start."); }
  });

  const speechPanel = document.getElementById("speechPanel");
  document.getElementById("speechSettingsBtn").addEventListener("click", () => {
    speechPanel.hidden = !speechPanel.hidden;
  });

  document.getElementById("voiceGenderGroup").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if(!btn) return;
    voiceGender = btn.dataset.gender;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b===btn));
  });

  const rateVal = document.getElementById("rateVal");
  const pitchVal = document.getElementById("pitchVal");
  document.querySelectorAll(".mini-step").forEach(btn => {
    btn.addEventListener("click", () => {
      const step = parseFloat(btn.dataset.step);
      if(btn.dataset.target === "rate"){
        speechRate = Math.min(1.2, Math.max(0.5, Math.round((speechRate + step) * 100) / 100));
        rateVal.textContent = speechRate.toFixed(2);
      } else {
        speechPitch = Math.min(1.4, Math.max(0.6, Math.round((speechPitch + step) * 100) / 100));
        pitchVal.textContent = speechPitch.toFixed(2);
      }
    });
  });
} catch(err){ console.error("Speech feature setup failed:", err); }

/* =========================================================
   PWA — service worker registration + install prompt
   ========================================================= */
try{
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  let deferredInstall = null;
  const installGroup = document.getElementById("installGroup");
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstall = e;
    installGroup.style.display = "flex";
  });

  installBtn.addEventListener("click", async () => {
    if(!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    installGroup.style.display = "none";
  });

  window.addEventListener("appinstalled", () => { installGroup.style.display = "none"; });
} catch(err){ console.error("PWA install setup failed:", err); }
</script>
