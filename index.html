<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TubePlay — No-Key YouTube Player</title>
<style>
  :root{
    --radius:14px;
    --gap:12px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#101114; --bg2:#17181c; --card:#1c1d22; --fg:#eceef2; --muted:#9a9ca6;
    --accent:#ff3b3b; --border:#2a2b31; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg:#f4f5f7; --bg2:#ffffff; --card:#ffffff; --fg:#15161a; --muted:#5c5e68;
    --accent:#e01e1e; --border:#e2e3e8; --shadow:0 6px 18px rgba(20,20,30,.08);
  }
  [data-theme="oled"]{
    --bg:#000000; --bg2:#000000; --card:#050505; --fg:#f2f2f2; --muted:#8a8a8a;
    --accent:#ff2d2d; --border:#1a1a1a; --shadow:0 0 0 1px #1a1a1a;
  }
  [data-theme="hc"]{
    --bg:#000000; --bg2:#000000; --card:#000000; --fg:#ffffff; --muted:#ffff00;
    --accent:#ffff00; --border:#ffffff; --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font);
    min-height:100vh; display:flex; flex-direction:column;
    transition:background .25s ease, color .25s ease;
  }
  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    gap:var(--gap); padding:14px 16px; background:var(--bg2);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.05rem; letter-spacing:.2px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
  #themeBtn{
    border:1px solid var(--border); background:var(--card); color:var(--fg);
    padding:8px 12px; border-radius:999px; font-size:.85rem; cursor:pointer;
    font-weight:600;
  }
  #themeBtn:focus-visible, input:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .search-bar{
    display:flex; gap:8px; padding:14px 16px; background:var(--bg);
  }
  .search-bar input{
    flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--fg); font-size:1rem;
  }
  .search-bar button{
    padding:12px 18px; border-radius:12px; border:none; background:var(--accent);
    color:#fff; font-weight:700; cursor:pointer; font-size:.95rem;
  }
  [data-theme="hc"] .search-bar button{color:#000;}
  .player-wrap{
    margin:0 16px 6px; border-radius:var(--radius); overflow:hidden;
    background:#000; box-shadow:var(--shadow); border:1px solid var(--border);
    aspect-ratio:16/9;
  }
  .player-wrap.hidden{display:none;}
  .player-wrap iframe{width:100%; height:100%; border:0; display:block;}
  .status{padding:0 16px; color:var(--muted); font-size:.9rem; min-height:1.2em;}
  .results-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:var(--gap); padding:12px 16px 24px; flex:1;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible{transform:translateY(-2px); border-color:var(--accent);}
  .card img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#333;}
  .card .info{padding:8px 10px 10px;}
  .card .title{font-size:.85rem; font-weight:600; line-height:1.3; max-height:2.6em; overflow:hidden;}
  .card .channel{font-size:.75rem; color:var(--muted); margin-top:4px;}
  footer{
    padding:18px 12px; border-top:1px solid var(--border); background:var(--bg2);
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  footer p{margin:0; font-size:.8rem; color:var(--muted);}
  @media (max-width:420px){
    .brand{font-size:.95rem;}
    #themeBtn{padding:7px 10px; font-size:.78rem;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> TubePlay</div>
  <button id="themeBtn" type="button">🌓 Theme: Dark</button>
</header>

<div class="search-bar">
  <input id="searchInput" type="text" placeholder="Search YouTube videos…" autocomplete="off">
  <button id="searchBtn" type="button">Search</button>
</div>

<div id="playerWrap" class="player-wrap hidden">
  <iframe id="player" title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen></iframe>
</div>

<p id="status" class="status">Search for a video to get started — no login or API key needed.</p>
<div id="results" class="results-grid"></div>

<footer>
  <p>© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
</footer>

<script>
(function(){
  // ---------- Theme handling ----------
  var THEMES = ["dark","light","oled","hc"];
  var LABELS = {dark:"Dark", light:"Light", oled:"OLED", hc:"High Contrast"};
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");

  function applyTheme(t){
    root.setAttribute("data-theme", t);
    themeBtn.textContent = "🌓 Theme: " + LABELS[t];
    localStorage.setItem("tubeplay-theme", t);
  }
  var saved = localStorage.getItem("tubeplay-theme");
  applyTheme(THEMES.indexOf(saved) > -1 ? saved : "dark");

  themeBtn.addEventListener("click", function(){
    var current = root.getAttribute("data-theme");
    var next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
    applyTheme(next);
  });

  // ---------- Footer year ----------
  document.getElementById("year").textContent = new Date().getFullYear();

  // ---------- Search (no key, no login — public Piped/Invidious mirrors) ----------
  // Piped instances enable CORS by default, so they're tried first.
  var SOURCES = [
    {kind:"piped", base:"https://pipedapi.kavin.rocks"},
    {kind:"piped", base:"https://api.piped.yt"},
    {kind:"piped", base:"https://piped-api.lunar.icu"},
    {kind:"piped", base:"https://pipedapi.adminforge.de"},
    {kind:"invidious", base:"https://yewtu.be"},
    {kind:"invidious", base:"https://invidious.jing.rocks"},
    {kind:"invidious", base:"https://inv.nadeko.net"}
  ];

  var input = document.getElementById("searchInput");
  var searchBtn = document.getElementById("searchBtn");
  var statusEl = document.getElementById("status");
  var resultsEl = document.getElementById("results");
  var playerWrap = document.getElementById("playerWrap");
  var player = document.getElementById("player");

  function setStatus(msg){ statusEl.textContent = msg; }

  function fetchWithTimeout(url, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    return fetch(url, {mode:"cors", signal:controller.signal}).finally(function(){
      clearTimeout(timer);
    });
  }

  // Try a URL directly; if that fails (often a CORS block), retry once
  // through a free, keyless CORS proxy before giving up on this source.
  function fetchJSON(url, ms){
    return fetchWithTimeout(url, ms)
      .then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .catch(function(){
        var proxied = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
        return fetchWithTimeout(proxied, ms)
          .then(function(res){ if(!res.ok) throw new Error("proxy HTTP " + res.status); return res.json(); });
      });
  }

  // Normalize Piped's stream items into a common shape.
  function fromPiped(item){
    if (!item.url) return null;
    var m = item.url.match(/[?&]v=([^&]+)/);
    if (!m) return null;
    return {
      videoId: m[1],
      title: item.title || "Untitled",
      author: item.uploaderName || "",
      thumb: item.thumbnail || ("https://i.ytimg.com/vi/" + m[1] + "/hqdefault.jpg")
    };
  }

  // Normalize Invidious's video items into a common shape.
  function fromInvidious(item){
    if (!item.videoId) return null;
    var thumb = "https://i.ytimg.com/vi/" + item.videoId + "/hqdefault.jpg";
    if (item.videoThumbnails && item.videoThumbnails.length){
      var t = item.videoThumbnails.find(function(x){return x.quality==="medium";});
      thumb = (t || item.videoThumbnails[0]).url;
    }
    return {
      videoId: item.videoId,
      title: item.title || "Untitled",
      author: item.author || "",
      thumb: thumb
    };
  }

  function renderResults(list){
    resultsEl.innerHTML = "";
    list.forEach(function(v){
      if (!v) return;
      var card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.innerHTML =
        '<img loading="lazy" src="' + v.thumb + '" alt="">' +
        '<div class="info">' +
          '<div class="title">' + v.title + '</div>' +
          '<div class="channel">' + v.author + '</div>' +
        '</div>';
      function play(){ playVideo(v.videoId, v.title); }
      card.addEventListener("click", play);
      card.addEventListener("keydown", function(e){ if(e.key==="Enter") play(); });
      resultsEl.appendChild(card);
    });
  }

  function playVideo(id, title){
    player.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
    playerWrap.classList.remove("hidden");
    setStatus("Now playing: " + (title || id));
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function trySource(i, query, lastErr){
    if (i >= SOURCES.length){
      setStatus("Couldn't reach any search source. Last error: " +
        (lastErr ? lastErr.message : "unknown") +
        ". Open the browser console for full details.");
      return;
    }
    var src = SOURCES[i];
    setStatus("Searching… (source " + (i + 1) + " of " + SOURCES.length + ")");
    var url = src.kind === "piped"
      ? src.base + "/search?q=" + encodeURIComponent(query) + "&filter=videos"
      : src.base + "/api/v1/search?q=" + encodeURIComponent(query) + "&type=video";

    fetchJSON(url, 7000)
      .then(function(data){
        var rawList = src.kind === "piped" ? (data.items || []) : data;
        if (!Array.isArray(rawList)) throw new Error("Unexpected response shape");
        var normalize = src.kind === "piped" ? fromPiped : fromInvidious;
        var list = rawList.map(normalize).filter(Boolean);
        if (list.length === 0){
          setStatus("No results found for “" + query + "”.");
          resultsEl.innerHTML = "";
          return;
        }
        setStatus("Results for “" + query + "” — via " + src.base.replace("https://","") + ":");
        renderResults(list);
      })
      .catch(function(err){
        console.warn("Search source failed:", src.base, err);
        trySource(i + 1, query, err);
      });
  }

  function doSearch(){
    var q = input.value.trim();
    if (!q) { setStatus("Type something to search for."); return; }
    resultsEl.innerHTML = "";
    trySource(0, q, null);
  }

  searchBtn.addEventListener("click", doSearch);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") doSearch(); });
})();
</script>
</body>
</html>
