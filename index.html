<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixMin — Image Compressor</title>
<style>
  :root{
    --bg:#F5F2EA; --surface:#FFFFFF; --surface-2:#EFEBE0; --text:#1C1A16; --muted:#8A8272;
    --accent:#C25E2E; --accent-text:#FFF8EF; --border:#DDD6C6; --ring:#C25E2E55;
    --radius:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#16151A; --surface:#1E1D23; --surface-2:#26242C; --text:#EDE9E1; --muted:#948C7C;
    --accent:#E58A4E; --accent-text:#1A1410; --border:#332F38; --ring:#E58A4E55;
  }
  html[data-theme="oled"]{
    --bg:#000000; --surface:#0A0A0A; --surface-2:#131313; --text:#ECE8E0; --muted:#8C867A;
    --accent:#E58A4E; --accent-text:#000000; --border:#232323; --ring:#E58A4E55;
  }
  html[data-theme="hc"]{
    --bg:#000000; --surface:#000000; --surface-2:#000000; --text:#FFFFFF; --muted:#FFFFFF;
    --accent:#FFD400; --accent-text:#000000; --border:#FFFFFF; --ring:#FFD40088;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    min-height:100dvh; display:flex; flex-direction:column; transition:background .2s,color .2s;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 18px 8px; width:100%; flex:1;}
  header.top{text-align:center; padding:18px 0 6px;}
  .eyebrow{font:700 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--accent);}
  h1{font-size:clamp(28px,7vw,40px); margin:8px 0 4px; letter-spacing:-.02em; font-weight:800;}
  .sub{color:var(--muted); font-size:14.5px; margin:0 auto; max-width:46ch;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:16px;}

  .drop{border:2px dashed var(--border); border-radius:var(--radius); padding:34px 16px; text-align:center;
    cursor:pointer; background:var(--surface-2); transition:border-color .15s, background .15s;}
  .drop.drag{border-color:var(--accent); background:var(--ring);}
  .drop .icon{font-size:30px; display:block; margin-bottom:8px;}
  .drop b{color:var(--text);}
  .drop small{display:block; color:var(--muted); margin-top:4px; font-size:12.5px;}
  input[type=file]{display:none;}

  .controls{display:grid; gap:14px; margin-top:16px;}
  .row{display:flex; justify-content:space-between; align-items:baseline; font:700 11px/1 var(--mono);
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .row span.val{color:var(--accent);}
  input[type=range]{width:100%; accent-color:var(--accent); height:22px;}
  select{width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:9px 10px; font-family:var(--sans); font-size:14px;}
  .fmt-row{display:flex; gap:8px;}
  .fmt-row select{flex:1;}

  .filmstrip{margin-top:18px;}
  .reel{position:relative; height:34px; border-radius:8px; background:var(--surface-2); overflow:hidden;
    border:1px solid var(--border);}
  .reel .fill{position:absolute; inset:0; width:0%; background:var(--accent); transition:width .35s ease;}
  .reel .holes{position:absolute; inset:0; display:flex; justify-content:space-between; align-items:center;
    padding:0 6px; pointer-events:none;}
  .reel .holes i{width:6px; height:6px; border-radius:50%; background:var(--bg); opacity:.55;}
  .ratio-label{display:flex; justify-content:space-between; margin-top:8px; font:700 13px/1 var(--mono);}
  .ratio-label .pct{color:var(--accent); font-size:20px;}

  .stats{display:flex; gap:10px; margin-top:14px;}
  .stat{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .stat span{display:block; font:700 10px/1 var(--mono); letter-spacing:.1em; color:var(--muted); margin-bottom:4px;}
  .stat b{font-size:16px;}

  .preview{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .preview figure{margin:0; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .preview img{display:block; width:100%; height:120px; object-fit:cover;}
  .preview figcaption{font:700 10px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    padding:6px 8px;}

  .fallback-hint{margin:10px 0 0; font-size:12px; color:var(--muted); text-align:center;}
  .fallback-hint a{color:var(--accent); font-weight:700;}
  .actions{display:flex; gap:10px; margin-top:16px;}
  button{font:700 13px/1 var(--sans); letter-spacing:.02em; border-radius:10px; padding:13px 16px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); cursor:pointer; flex:1;}
  button:active{transform:scale(.98);}
  button.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button:focus-visible, .drop:focus-visible, .seg button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  footer{margin-top:auto; padding:22px 16px 26px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; border-top:1px solid var(--border);}
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;}
  .seg button{flex:none; padding:7px 12px; border:none; border-radius:999px; background:transparent; font:700 11px/1 var(--mono);
    letter-spacing:.06em;}
  .seg button.active{background:var(--accent); color:var(--accent-text);}
  .copyright{color:var(--muted); font-size:12px; line-height:1.5;}

  @media (min-width:560px){ .wrap{padding-top:36px;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PixMin</h1>
    <p class="sub">Image Compressor Desk</p>
  </header>

  <div class="card">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an image to compress">
      <span class="icon">🖼️</span>
      <b>Tap to choose a photo</b>
      <small>or drag &amp; drop · JPG, PNG, WEBP</small>
      <input type="file" id="file" accept="image/*">
    </div>

    <div class="controls" id="controls" hidden>
      <div>
        <div class="row"><span>Quality</span><span class="val" id="qVal">75%</span></div>
        <input type="range" id="quality" min="1" max="100" value="75">
      </div>
      <div>
        <div class="row"><span>Max Width</span><span class="val" id="wVal">1600px</span></div>
        <input type="range" id="maxw" min="200" max="4000" step="50" value="1600">
      </div>
      <div class="fmt-row">
        <select id="format">
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WEBP</option>
          <option value="image/png">PNG</option>
        </select>
      </div>
    </div>

    <div class="filmstrip" id="filmstrip" hidden>
      <div class="reel"><div class="fill" id="fill"></div>
        <div class="holes" id="holes"></div>
      </div>
      <div class="ratio-label"><span>SAVED</span><span class="pct" id="pct">0%</span></div>

      <div class="stats">
        <div class="stat"><span>Original</span><b id="origSize">–</b></div>
        <div class="stat"><span>Compressed</span><b id="compSize">–</b></div>
      </div>

      <div class="preview">
        <figure><img id="origImg" alt="Original preview"><figcaption>Before</figcaption></figure>
        <figure><img id="compImg" alt="Compressed preview"><figcaption>After</figcaption></figure>
      </div>

      <div class="actions">
        <button id="resetBtn">Choose Another</button>
        <button id="downloadBtn" class="primary" disabled>Download</button>
      </div>
      <p class="fallback-hint">
        Download not starting? <a id="openLink" href="#" target="_blank" rel="noopener">Open image in a new tab</a> and press &amp; hold (or right-click) to save.
      </p>
    </div>
  </div>
</div>

<footer>
  <div class="seg" id="themeSeg" role="group" aria-label="Theme">
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="oled">OLED</button>
    <button data-theme="hc">HC</button>
  </div>
  <div class="copyright">© Manik Roy <span id="year"></span>. All Rights Reserved.</div>
</footer>

<script>
(function(){
  // ---- theme ----
  var root = document.documentElement;
  var seg = document.getElementById('themeSeg');
  var saved = localStorage.getItem('pixmin-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(saved);
  seg.addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    applyTheme(btn.dataset.theme);
  });
  function applyTheme(name){
    root.setAttribute('data-theme', name);
    localStorage.setItem('pixmin-theme', name);
    Array.prototype.forEach.call(seg.children, function(b){
      b.classList.toggle('active', b.dataset.theme === name);
    });
  }

  // ---- footer year ----
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---- filmstrip sprocket holes ----
  var holes = document.getElementById('holes');
  for (var i=0;i<14;i++){ var d=document.createElement('i'); holes.appendChild(d); }

  // ---- compressor ----
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var controls = document.getElementById('controls');
  var filmstrip = document.getElementById('filmstrip');
  var qualityEl = document.getElementById('quality');
  var maxwEl = document.getElementById('maxw');
  var formatEl = document.getElementById('format');
  var qVal = document.getElementById('qVal');
  var wVal = document.getElementById('wVal');
  var origImg = document.getElementById('origImg');
  var compImg = document.getElementById('compImg');
  var origSize = document.getElementById('origSize');
  var compSize = document.getElementById('compSize');
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var downloadBtn = document.getElementById('downloadBtn');
  var resetBtn = document.getElementById('resetBtn');
  var openLink = document.getElementById('openLink');

  var currentImage = null, originalBytes = 0, compressedBlob = null, srcName = 'image';

  drop.addEventListener('click', function(){ fileInput.click(); });
  drop.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') fileInput.click(); });
  fileInput.addEventListener('change', function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); });

  ['dragover','dragenter'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function(e){
    var f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  function loadFile(file){
    srcName = (file.name || 'image').replace(/\.[^.]+$/, '');
    originalBytes = file.size;
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        currentImage = img;
        origImg.src = e.target.result;
        controls.hidden = false;
        filmstrip.hidden = false;
        maxwEl.max = Math.max(img.width, 4000);
        compress();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function onControlChange(){
    qVal.textContent = qualityEl.value + '%';
    wVal.textContent = maxwEl.value + 'px';
    var pngNote = formatEl.value === 'image/png';
    qualityEl.disabled = pngNote;
    qVal.textContent = pngNote ? 'N/A' : qualityEl.value + '%';
    if (currentImage) compress();
  }
  qualityEl.addEventListener('input', onControlChange);
  maxwEl.addEventListener('input', onControlChange);
  formatEl.addEventListener('input', onControlChange);
  formatEl.addEventListener('change', onControlChange);

  function compress(){
    var maxW = parseInt(maxwEl.value, 10);
    var scale = Math.min(1, maxW / currentImage.width);
    var w = Math.round(currentImage.width * scale);
    var h = Math.round(currentImage.height * scale);

    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(currentImage, 0, 0, w, h);

    var quality = parseInt(qualityEl.value, 10) / 100;
    var type = formatEl.value;

    canvas.toBlob(function(blob){
      if (!blob) return;
      compressedBlob = blob;
      var url = URL.createObjectURL(blob);
      compImg.src = url;
      openLink.href = url;
      compSize.textContent = formatBytes(blob.size);
      origSize.textContent = formatBytes(originalBytes);

      var saved = Math.max(0, Math.round((1 - blob.size / originalBytes) * 100));
      fill.style.width = saved + '%';
      pct.textContent = saved + '%';
      downloadBtn.disabled = false;
    }, type, type === 'image/png' ? undefined : quality);
  }

  function formatBytes(n){
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/(1024*1024)).toFixed(2) + ' MB';
  }

  function currentExt(){
    return formatEl.value === 'image/png' ? 'png' : (formatEl.value === 'image/webp' ? 'webp' : 'jpg');
  }

  downloadBtn.addEventListener('click', function(){
    if (!compressedBlob) return;
    var url = URL.createObjectURL(compressedBlob);
    var a = document.createElement('a');
    a.href = url;
    a.download = srcName + '-compressed.' + currentExt();
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true, view:window}));
    document.body.removeChild(a);
    openLink.href = url;
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  });

  resetBtn.addEventListener('click', function(){
    currentImage = null; compressedBlob = null;
    fileInput.value = '';
    controls.hidden = true; filmstrip.hidden = true;
    downloadBtn.disabled = true;
    openLink.href = '#';
    fill.style.width = '0%'; pct.textContent = '0%';
  });
})();
</script>
</body>
</html>
