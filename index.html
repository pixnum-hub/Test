<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>YouTube Player + Recorder Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#121216;
  --panel:#1b1b21;
  --panel2:#232329;
  --raised:#28282f;
  --line:#33333c;
  --txt:#f1ece2;
  --muted:#8d8d97;
  --amber:#ffb020;
  --amber-dim:#7a5a1c;
  --rec:#ff3b30;
  --rec-dim:#5c1b17;
  --font-d:'IBM Plex Mono',ui-monospace,monospace;
  --font-b:'Inter',system-ui,sans-serif;
}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 50% -10%, #1e1e26 0%, var(--bg) 55%);
  color:var(--txt);
  font-family:var(--font-b);
  display:flex;justify-content:center;
}
.app{width:min(100%,640px);padding:14px 12px 26px;display:flex;flex-direction:column;gap:10px}

/* ===== header / eyebrow ===== */
.masthead{padding:2px 4px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px 1px var(--rec)}
.brand h1{font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:700}
.brand .sub{font-size:.62rem;color:var(--muted);letter-spacing:.05em;margin-top:1px}
.themebar{display:flex;gap:4px}
.themebar button{
  width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
  color:var(--muted);font-size:.68rem;cursor:pointer;display:flex;align-items:center;justify-content:center
}
.themebar button:active{transform:scale(.92)}

/* ===== module (deck panel) ===== */
.module{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 10px 24px #0006, inset 0 1px 0 #ffffff08}
.module + .module{margin-top:0}
.mlabel{font-family:var(--font-d);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 9px 2px;display:flex;align-items:center;gap:7px}
.mlabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== inputs ===== */
.row{display:flex;gap:6px}
input,select{
  background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:10px 11px;font:inherit;font-size:.82rem;outline:0;width:100%;
}
input::placeholder{color:#65656d}
input:focus,select:focus{border-color:var(--amber-dim);box-shadow:0 0 0 3px #ffb02022}
button{border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--raised);color:var(--txt);border:1px solid var(--line)}
button:active{transform:scale(.96)}
.btn-go{background:var(--amber);color:#161307;border-color:var(--amber);white-space:nowrap;font-weight:700}
.searchtypes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.searchtypes button{font-size:.68rem;padding:8px 4px;background:var(--panel2)}

/* ===== player ===== */
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:2px;border:1px solid var(--line)}
iframe{width:100%;height:100%;border:0}

.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.controls button{font-size:.66rem;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.controls button span{font-size:.85rem}

.seek{display:flex;gap:8px;align-items:center;margin-top:10px;font-family:var(--font-d)}
.seek input[type=range]{padding:0;accent-color:var(--amber);background:transparent;border:0}
.time{font-size:.68rem;min-width:34px;color:var(--muted)}

.settings{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.setting{background:var(--panel2);border:1px solid var(--line);padding:7px 8px;border-radius:10px}
.setting label{display:block;margin-bottom:4px;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.setting select,.setting input{padding:6px 7px;font-size:.75rem;background:var(--raised)}

.info{font-size:.7rem;color:var(--muted);margin-top:9px;padding:8px 10px;background:var(--panel2);border-radius:9px;border:1px solid var(--line)}

/* ===== tape counter / recorder ===== */
.deck{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0e0e12;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.deck-left{display:flex;align-items:center;gap:9px}
.reclamp{width:11px;height:11px;border-radius:50%;background:var(--rec-dim);transition:background .2s}
.reclamp.live{background:var(--rec);box-shadow:0 0 12px 2px var(--rec);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status{font-family:var(--font-d);font-size:.66rem;color:var(--muted);letter-spacing:.03em}
.timer{font-family:var(--font-d);font-size:1.5rem;font-weight:600;color:var(--amber);letter-spacing:.06em;text-shadow:0 0 14px #ffb02055}

.namefield{margin-bottom:8px}
.recBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.recBtns button{font-size:.72rem}
#pause,#resume,#stop,#download,#mp4{display:none}
.recBtns .primary{background:var(--rec);border-color:var(--rec);color:#fff}
.stats{font-family:var(--font-d);font-size:.66rem;color:var(--muted);margin-top:9px;text-align:center}

.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.extra button{font-size:.68rem;padding:9px 3px}

footer{text-align:center;font-size:.62rem;color:#55555e;padding:4px 6px 0;letter-spacing:.03em}

/* ===== theme variants ===== */
body.dark{--bg:#121216;--panel:#1b1b21;--panel2:#232329}
body.oled{--bg:#000;--panel:#070708;--panel2:#101013;--raised:#161619;--line:#222}
body.hc{--bg:#000;--panel:#000;--panel2:#000;--raised:#000;--line:#fff;--muted:#fff;--txt:#fff}
body.hc button,body.hc input,body.hc select{border-width:2px}
body.hc .btn-go{color:#000}

@media(max-width:420px){
  .searchtypes{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:repeat(3,1fr)}
  .row{flex-direction:column}
  .timer{font-size:1.25rem}
}
</style>
</head>
<body>
<main class="app">

<div class="masthead">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>YT Player · Recorder</h1>
      <div class="sub">search · play · capture</div>
    </div>
  </div>
  <div class="themebar">
    <button onclick="theme('light')" title="Light">☀</button>
    <button onclick="theme('dark')" title="Dark">◐</button>
    <button onclick="theme('oled')" title="OLED">●</button>
    <button onclick="theme('hc')" title="High contrast">HC</button>
  </div>
</div>

<section class="module">
  <div class="mlabel">Source</div>
  <div class="row">
    <input id="url" placeholder="YouTube URL, Video ID or Playlist URL">
    <button class="btn-go" onclick="load()">Load</button>
  </div>
  <div class="row" style="margin-top:6px">
    <input id="search" placeholder="Search YouTube…">
    <button class="btn-go" onclick="searchYT()">Search</button>
  </div>
  <div class="searchtypes">
    <button onclick="quickSearch('music')">🎵 Music</button>
    <button onclick="quickSearch('video')">🎬 Video</button>
    <button onclick="quickSearch('podcast')">🎙 Podcast</button>
    <button onclick="quickSearch('news')">📰 News</button>
  </div>
</section>

<section class="module">
  <div class="mlabel">Player</div>
  <div class="player">
    <iframe id="yt"
      allow="autoplay;encrypted-media;picture-in-picture"
      allowfullscreen
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1"></iframe>
  </div>

  <div class="controls">
    <button onclick="cmd('playVideo')"><span>▶</span>Play</button>
    <button onclick="cmd('pauseVideo')"><span>Ⅱ</span>Pause</button>
    <button onclick="cmd('stopVideo')"><span>■</span>Stop</button>
    <button onclick="load()"><span>↻</span>Reload</button>
    <button onclick="cmd('seekTo',-10)"><span>↶</span>−10s</button>
    <button onclick="cmd('seekTo',10,true)"><span>↷</span>+10s</button>
    <button onclick="cmd('previousVideo')"><span>⏮</span>Prev</button>
    <button onclick="cmd('nextVideo')"><span>⏭</span>Next</button>
    <button onclick="cmd('mute')"><span>🔇</span>Mute</button>
    <button onclick="cmd('unMute')"><span>🔊</span>Unmute</button>
    <button onclick="pip()"><span>▣</span>PiP</button>
    <button onclick="fullscreen()"><span>⛶</span>Full</button>
  </div>

  <div class="seek">
    <span class="time" id="cur">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0">
    <span class="time" id="dur">0:00</span>
  </div>

  <div class="settings">
    <div class="setting"><label>Playback speed</label>
      <select onchange="cmd('setPlaybackRate',+this.value)">
        <option value=".25">.25×</option><option value=".5">.5×</option>
        <option value=".75">.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select></div>
    <div class="setting"><label>Volume</label>
      <input type="range" min="0" max="100" value="100" oninput="cmd('setVolume',+this.value)"></div>
    <div class="setting"><label>Record FPS</label>
      <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></div>
    <div class="setting"><label>Record quality</label>
      <select id="quality"><option>2.5</option><option selected>5</option><option>8</option><option>12</option></select></div>
    <div class="setting"><label>Countdown</label>
      <select id="count"><option>0</option><option selected>3</option><option>5</option><option>10</option></select></div>
    <div class="setting"><label>Auto stop</label>
      <select id="auto"><option value="0">Off</option><option value="60">1 min</option>
        <option value="300">5 min</option><option value="600">10 min</option></select></div>
  </div>

  <div class="info" id="info">Search YouTube • Load a result URL • Play or record</div>
</section>

<section class="module">
  <div class="mlabel">Recorder</div>

  <div class="deck">
    <div class="deck-left">
      <span class="reclamp" id="reclamp"></span>
      <div>
        <div class="status" id="status">Recorder ready</div>
      </div>
    </div>
    <div class="timer" id="timer">00:00:00</div>
  </div>

  <div class="namefield">
    <input id="name" value="youtube-recording" placeholder="Recording filename">
  </div>

  <div class="recBtns">
    <button id="start" class="primary" onclick="startRec()">● Record</button>
    <button id="pause" onclick="pauseRec()">Ⅱ Pause</button>
    <button id="resume" onclick="resumeRec()">▶ Resume</button>
    <button id="stop" onclick="stopRec()">■ Stop</button>
    <button id="download" onclick="save()">⬇ WebM</button>
    <button id="mp4" onclick="saveMP4()">⬇ MP4</button>
  </div>

  <div class="stats" id="stats">Duration: 00:00:00 • Size: 0 MB</div>
</section>

<section class="module">
  <div class="mlabel">Utility</div>
  <div class="extra">
    <button onclick="wake()">☀ Keep awake</button>
    <button onclick="historyInfo()">▣ History</button>
    <button onclick="backup()">⚙ Backup</button>
    <button onclick="restore()">↥ Restore</button>
    <button onclick="mini()">▣ Mini/PiP</button>
    <button onclick="shareURL()">↗ Share</button>
  </div>
</section>

<footer>© <span id="year"></span> Manik Roy. All rights reserved.</footer>

</main>

<script>
const $=x=>document.getElementById(x);
let rec=null,chunks=[],blob=null,t=0,timer=null,stopper=null,wlock=null;

$("year").textContent=new Date().getFullYear();
theme(localStorage.theme||"light");

function theme(x){
 document.body.className=x;
 localStorage.theme=x;
}

function searchYT(){
 let q=$("search").value.trim();
 if(!q)return alert("Enter something to search.");
 window.open(
 "https://www.youtube.com/results?search_query="+encodeURIComponent(q),
 "_blank"
 );
}

function quickSearch(type){
 let q=$("search").value.trim();

 if(!q){
  q=prompt(
   type==="music"?"Search music / audio":
   type==="video"?"Search videos":
   type==="podcast"?"Search podcasts":
   "Search news"
  );
 }

 if(!q)return;

 let prefix=
 type==="music"?"music ":
 type==="podcast"?"podcast ":
 type==="news"?"news ":"";

 window.open(
 "https://www.youtube.com/results?search_query="+
 encodeURIComponent(prefix+q),
 "_blank"
 );
}

function vid(v){
 v=v.trim();
 if(/^[\w-]{11}$/.test(v))return v;

 try{
  let u=new URL(v);

  if(u.searchParams.get("v"))
   return u.searchParams.get("v");

  if(u.hostname.includes("youtu.be"))
   return u.pathname.slice(1);

  let p=u.pathname.split("/");
  let i=p.indexOf("embed");

  return i>=0?p[i+1]:"";
 }catch(e){return ""}
}

function playlist(v){
 try{
  return new URL(v).searchParams.get("list");
 }catch(e){return ""}
}

function load(){
 let v=$("url").value;
 let id=vid(v);
 let pl=playlist(v);

 if(pl){
  $("yt").src=
  "https://www.youtube.com/embed/videoseries?list="+
  encodeURIComponent(pl)+"&enablejsapi=1";
  $("info").textContent="Playlist loaded • Previous / Next available";
 }
 else if(id){
  $("yt").src=
  "https://www.youtube.com/embed/"+id+
  "?enablejsapi=1&autoplay=1";
  $("info").textContent="Video loaded • Ready to play or record";
 }
 else{
  alert("Enter a valid YouTube URL, ID or playlist URL.");
 }
}

function cmd(f,...a){
 $("yt").contentWindow.postMessage(
 JSON.stringify({event:"command",func:f,args:a}),"*");
}

function fullscreen(){
 $("yt").requestFullscreen?.();
}

async function pip(){
 try{
  await $("yt").requestPictureInPicture();
 }catch(e){
  alert("Picture-in-Picture is unavailable in this browser/player.");
 }
}

function mini(){
 pip();
}

$("seek").oninput=function(){
 cmd("seekTo",+this.value,true);
};

function fmt(s){
 s=Math.max(0,Math.floor(s));
 return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

async function wake(){
 if(!("wakeLock" in navigator))
  return alert("Wake Lock is unavailable.");

 try{
  wlock=await navigator.wakeLock.request("screen");
  alert("Screen will stay awake during your session.");
 }catch(e){
  alert("Wake Lock permission unavailable.");
 }
}

async function startRec(){

 if(!navigator.mediaDevices?.getDisplayMedia)
  return alert("Screen recording is not supported by this browser.");

 let countdown=+$("count").value;

 if(countdown){
  $("status").textContent="Starting in "+countdown+" seconds…";
  await new Promise(r=>setTimeout(r,countdown*1000));
 }

 try{

  let screen=await navigator.mediaDevices.getDisplayMedia({
   video:{frameRate:+$("fps").value},
   audio:true
  });

  let stream=new MediaStream([
   ...screen.getVideoTracks(),
   ...screen.getAudioTracks()
  ]);

  let bitrate=+$("quality").value*1000000;

  let type=MediaRecorder.isTypeSupported(
   "video/webm;codecs=vp9,opus"
  )?"video/webm;codecs=vp9,opus":"video/webm";

  rec=new MediaRecorder(stream,{
   mimeType:type,
   videoBitsPerSecond:bitrate
  });

  chunks=[];
  blob=null;
  t=0;
  update();

  rec.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  rec.onstop=()=>{
   blob=new Blob(chunks,{type:"video/webm"});
   $("download").style.display="block";

   if(MediaRecorder.isTypeSupported("video/mp4"))
    $("mp4").style.display="block";

   $("status").textContent="Recording ready";
   $("reclamp").classList.remove("live");
   update();
  };

  rec.start(1000);

  let started=Date.now();

  timer=setInterval(()=>{
   t=Math.floor((Date.now()-started)/1000);
   update();
  },500);

  let auto=+$("auto").value;

  if(auto)
   stopper=setTimeout(stopRec,auto*1000);

  $("start").style.display="none";
  $("pause").style.display="block";
  $("stop").style.display="block";

  $("status").textContent="Recording…";
  $("reclamp").classList.add("live");

  screen.getVideoTracks()[0].onended=stopRec;

 }catch(e){
  $("status").textContent="Recording cancelled";
 }
}

function pauseRec(){
 if(rec?.state==="recording"){
  rec.pause();
  $("pause").style.display="none";
  $("resume").style.display="block";
  $("status").textContent="Recording paused";
  $("reclamp").classList.remove("live");
 }
}

function resumeRec(){
 if(rec?.state==="paused"){
  rec.resume();
  $("pause").style.display="block";
  $("resume").style.display="none";
  $("status").textContent="Recording…";
  $("reclamp").classList.add("live");
 }
}

function stopRec(){

 if(!rec||rec.state==="inactive")return;

 rec.stop();

 if(rec.stream)
  rec.stream.getTracks().forEach(x=>x.stop());

 clearInterval(timer);
 clearTimeout(stopper);

 $("start").style.display="block";
 $("pause").style.display="none";
 $("resume").style.display="none";
 $("stop").style.display="none";
 $("reclamp").classList.remove("live");
}

function update(){
 $("timer").textContent=
 new Date(t*1000).toISOString().substr(11,8);

 $("stats").textContent=
 "Duration: "+fmt(t)+" • Size: "+
 (blob?(blob.size/1048576).toFixed(2):"0")+" MB";
}

function save(){
 if(!blob)return;

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download=
 ($("name").value.trim()||"youtube-recording")+
 ".webm";

 a.click();

 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function saveMP4(){

 if(MediaRecorder.isTypeSupported("video/mp4")){
  let a=document.createElement("a");

  a.href=URL.createObjectURL(blob);
  a.download=
  ($("name").value.trim()||"youtube-recording")+
  ".mp4";

  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }else{
  alert("Native MP4 recording is unavailable. WebM recording is supported.");
 }
}

function historyInfo(){
 alert(
 "Recording history is handled locally by your browser/download manager. "+
 "No recording is uploaded to a server."
 );
}

function backup(){

 let data={
  theme:localStorage.theme||"light",
  filename:$("name").value,
  fps:$("fps").value,
  quality:$("quality").value,
  countdown:$("count").value,
  auto:$("auto").value
 };

 let a=document.createElement("a");

 a.href=URL.createObjectURL(
  new Blob([JSON.stringify(data,null,2)],
  {type:"application/json"})
 );

 a.download="youtube-player-settings.json";
 a.click();
}

function restore(){

 let i=document.createElement("input");

 i.type="file";
 i.accept=".json";

 i.onchange=async()=>{

  try{
   let d=JSON.parse(await i.files[0].text());

   theme(d.theme||"light");
   $("name").value=d.filename||"youtube-recording";
   $("fps").value=d.fps||"30";
   $("quality").value=d.quality||"5";
   $("count").value=d.countdown||"3";
   $("auto").value=d.auto||"0";

  }catch(e){
   alert("Invalid settings file.");
  }
 };

 i.click();
}

async function shareURL(){

 let id=vid($("url").value);

 if(!id)return alert("Load a YouTube video first.");

 let url="https://youtu.be/"+id;

 if(navigator.share){
  try{
   await navigator.share({
    title:"YouTube Video",
    url:url
   });
  }catch(e){}
 }else{
  navigator.clipboard?.writeText(url);
  alert("Video URL copied.");
 }
}
</script>
</body>
</html>
