<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DECK.YT — Media Player</title>
<style>
  :root{
    --radius:14px;
    --gap:12px;
  }
  [data-theme="dark"]{
    --bg:#0B0D10; --panel:#14171B; --panel2:#1B1F24; --text:#E7E9EC;
    --muted:#8A929B; --accent:#FF8A3D; --accent2:#2DD4BF; --border:#262B31;
  }
  [data-theme="light"]{
    --bg:#F5F3EF; --panel:#FFFFFF; --panel2:#ECE9E3; --text:#1A1D21;
    --muted:#6B7280; --accent:#E85D2C; --accent2:#0E8F82; --border:#DDD8CF;
  }
  [data-theme="oled"]{
    --bg:#000000; --panel:#000000; --panel2:#0A0A0A; --text:#F2F2F2;
    --muted:#8A929B; --accent:#FF8A3D; --accent2:#2DD4BF; --border:#1A1A1A;
  }
  [data-theme="hc"]{
    --bg:#000000; --panel:#000000; --panel2:#000000; --text:#FFFFFF;
    --muted:#FFFF00; --accent:#FFFF00; --accent2:#00FFFF; --border:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    transition:background .2s,color .2s;
  }
  .app{max-width:640px; width:100%; margin:0 auto; display:flex; flex-direction:column; flex:1; padding:14px; gap:16px;}

  .topbar{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-weight:800; letter-spacing:.06em; font-size:18px;}
  .brand .dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent2); margin-right:8px; box-shadow:0 0 8px var(--accent2);}
  .brand .accent{color:var(--accent);}
  .theme-btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:999px; padding:8px 14px; font-size:11px; font-weight:700;
    letter-spacing:.08em; cursor:pointer;
  }
  .theme-btn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}

  .screen{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:10px; display:flex; flex-direction:column; gap:10px;}
  .frame{position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden;}
  #player{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:13px; padding:0 20px;}

  .nowplaying{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); min-height:18px;}
  .rec{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 auto;}
  .rec.live{animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  #npTitle{color:var(--text); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .controls{display:flex; align-items:center; justify-content:center; gap:14px;}
  .controls button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    width:52px; height:52px; border-radius:50%; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #playBtn{width:64px; height:64px; background:var(--accent); color:#0B0D10; border:none; font-size:22px;}

  .inputbar{display:flex; gap:8px;}
  #queryInput{
    flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:13px 14px; font-size:15px; min-width:0;
  }
  #searchBtn{background:var(--accent2); color:#06110F; border:none; border-radius:10px; padding:0 16px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .hint{font-size:11px; color:var(--muted); padding:0 2px; margin-top:-6px;}

  .results{display:flex; flex-direction:column; gap:8px;}
  .results-head{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 0;}
  .results-head h2{font-size:11px; letter-spacing:.1em; color:var(--muted); margin:0; font-weight:700;}
  .results-close{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:4px 6px;}
  .ritem{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px; cursor:pointer;}
  .rthumb{width:76px; height:43px; flex:0 0 auto; border-radius:6px; object-fit:cover; background:var(--panel2);}
  .rmeta{flex:1; min-width:0;}
  .rtitle{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rsub{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .radd{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; font-size:15px; cursor:pointer; flex:0 0 auto;}
  .rstatus{font-size:12.5px; color:var(--muted); padding:8px 2px;}

  .queue{display:flex; flex-direction:column; gap:8px; padding-bottom:6px;}
  .queue h2{font-size:11px; letter-spacing:.1em; color:var(--muted); margin:2px 2px 0; font-weight:700;}
  .qitem{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border);
    border-left:3px solid var(--border); border-radius:10px; padding:9px 10px; cursor:pointer;
  }
  .qitem.active{border-left-color:var(--accent);}
  .ch{font-size:11px; font-weight:800; color:var(--muted); min-width:38px;}
  .qtitle{flex:1; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bars{display:flex; align-items:flex-end; gap:2px; height:14px; width:14px; flex:0 0 auto;}
  .bars span{width:3px; background:var(--accent2); animation:eq .6s ease-in-out infinite alternate;}
  .bars span:nth-child(2){animation-delay:.15s;} .bars span:nth-child(3){animation-delay:.3s;}
  @keyframes eq{from{height:4px;} to{height:14px;}}
  .rm{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 6px;}
  .empty{font-size:12.5px; color:var(--muted); padding:10px 2px;}

  .site-footer{
    margin-top:auto; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:18px 10px; border-top:1px solid var(--border); min-height:56px;
  }
  .site-footer p{margin:0; font-size:12px; color:var(--muted); line-height:1.5; display:flex; align-items:center;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="dot"></span>DECK<span class="accent">.YT</span></div>
    <button id="themeBtn" class="theme-btn" type="button">DARK</button>
  </header>

  <main style="display:flex; flex-direction:column; gap:16px;">
    <section class="screen">
      <div class="frame" id="frameWrap">
        <div id="player"></div>
        <div class="placeholder" id="placeholder">No signal — paste a link or search below</div>
      </div>
      <div class="nowplaying"><span class="rec" id="rec"></span><span id="npTitle">STANDBY</span></div>
      <div class="controls">
        <button id="prevBtn" type="button" aria-label="Previous">⏮</button>
        <button id="playBtn" type="button" aria-label="Play">▶</button>
        <button id="nextBtn" type="button" aria-label="Next">⏭</button>
      </div>
    </section>

    <section class="inputbar-wrap">
      <div class="inputbar">
        <input id="queryInput" placeholder="Search any video, song, podcast… or paste a link" />
        <button id="searchBtn" type="button">🔍 Search</button>
      </div>
      <div class="hint" id="hint">Tip: a direct link always works. Search needs a public relay and may occasionally be unavailable.</div>
    </section>

    <section class="results" id="resultsSection" style="display:none;">
      <div class="results-head">
        <h2>RESULTS</h2>
        <button class="results-close" id="resultsClose" type="button">✕ Close</button>
      </div>
      <div id="resultsList"></div>
    </section>

    <section class="queue">
      <h2>QUEUE</h2>
      <div id="queueList"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
  </footer>
</div>

<script>
(function(){
  var y1 = 2026, now = new Date().getFullYear();
  document.getElementById('year').textContent = now > y1 ? (y1 + '–' + now) : String(y1);
})();

var THEMES = ['dark','light','oled','hc'];
var themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t.toUpperCase();
  localStorage.setItem('deckyt-theme', t);
}
applyTheme(localStorage.getItem('deckyt-theme') || 'dark');
themeBtn.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = THEMES[(THEMES.indexOf(cur)+1) % THEMES.length];
  applyTheme(next);
});

var queue = [];
var currentIndex = -1;
var player, playerReady = false, isPlaying = false;

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('player', {
    height:'100%', width:'100%',
    playerVars:{ playsinline:1, rel:0 },
    events:{
      onReady:function(){ playerReady = true; },
      onStateChange:onPlayerState
    }
  });
};

function onPlayerState(e){
  isPlaying = (e.data === YT.PlayerState.PLAYING);
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
  document.getElementById('rec').classList.toggle('live', isPlaying);
  renderQueue();
  if(e.data === YT.PlayerState.ENDED) playAt(currentIndex+1);
}

function extractId(input){
  input = input.trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  var m = input.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function addToQueue(id, title, autoplay){
  var item = {id:id, title:title || ('Video ' + id)};
  queue.push(item);
  renderQueue();
  if(autoplay) playAt(queue.length - 1);
}

function playAt(i){
  if(i < 0 || i >= queue.length) return;
  currentIndex = i;
  var item = queue[i];
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('npTitle').textContent = item.title;
  if(playerReady){ player.loadVideoById(item.id); player.playVideo(); }
  renderQueue();
}

function renderQueue(){
  var list = document.getElementById('queueList');
  list.innerHTML = '';
  if(queue.length === 0){
    list.innerHTML = '<div class="empty">Queue is empty — add a video to get started.</div>';
    return;
  }
  queue.forEach(function(item, i){
    var row = document.createElement('div');
    row.className = 'qitem' + (i === currentIndex ? ' active' : '');
    var active = i === currentIndex && isPlaying;
    row.innerHTML =
      '<span class="ch">CH ' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="qtitle">' + escapeHtml(item.title) + '</span>' +
      (active ? '<span class="bars"><span></span><span></span><span></span></span>' : '') +
      '<button class="rm" aria-label="Remove">✕</button>';
    row.addEventListener('click', function(e){
      if(e.target.classList.contains('rm')){
        queue.splice(i,1);
        if(currentIndex === i){ currentIndex = -1; if(playerReady) player.stopVideo(); document.getElementById('npTitle').textContent='STANDBY'; }
        else if(currentIndex > i) currentIndex--;
        renderQueue();
      } else { playAt(i); }
    });
    list.appendChild(row);
  });
}

function escapeHtml(s){
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

document.getElementById('playBtn').addEventListener('click', function(){
  if(!playerReady || currentIndex === -1){ if(queue.length) playAt(0); return; }
  isPlaying ? player.pauseVideo() : player.playVideo();
});
document.getElementById('prevBtn').addEventListener('click', function(){ playAt(currentIndex - 1); });
document.getElementById('nextBtn').addEventListener('click', function(){ playAt(currentIndex + 1); });

var INSTANCES = ['https://yewtu.be', 'https://inv.nadeko.net', 'https://invidious.jing.rocks'];
var resultsSection = document.getElementById('resultsSection');
var resultsList = document.getElementById('resultsList');

function fmtDuration(s){
  s = s || 0;
  var m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}
function fmtViews(n){
  if(!n) return '';
  if(n >= 1e6) return (n/1e6).toFixed(1) + 'M views';
  if(n >= 1e3) return (n/1e3).toFixed(1) + 'K views';
  return n + ' views';
}

function goSearch(query){
  var direct = extractId(query);
  if(direct){ addToQueue(direct, null, true); document.getElementById('queryInput').value=''; hideResults(); return; }
  if(!query.trim()) return;
  showResultsLoading(query);
  trySearchInstance(0, query);
}

function showResultsLoading(query){
  resultsSection.style.display = 'flex';
  resultsList.innerHTML = '<div class="rstatus">Searching for “' + escapeHtml(query) + '”…</div>';
}

function hideResults(){
  resultsSection.style.display = 'none';
  resultsList.innerHTML = '';
}

function trySearchInstance(idx, query){
  if(idx >= INSTANCES.length){
    resultsList.innerHTML = '<div class="rstatus">Search relays are unreachable right now — paste a direct YouTube link instead.</div>';
    return;
  }
  fetch(INSTANCES[idx] + '/api/v1/search?q=' + encodeURIComponent(query) + '&type=all')
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(results){
      var items = results.filter(function(x){ return (x.type === 'video' || x.type === 'shortVideo') && x.videoId; });
      if(!items.length) throw 0;
      renderResults(items.slice(0, 10));
    })
    .catch(function(){ trySearchInstance(idx + 1, query); });
}

function renderResults(items){
  resultsList.innerHTML = '';
  items.forEach(function(v){
    var thumb = (v.videoThumbnails && (v.videoThumbnails.find(function(t){return t.quality==='medium';}) || v.videoThumbnails[0]));
    var row = document.createElement('div');
    row.className = 'ritem';
    row.innerHTML =
      '<img class="rthumb" loading="lazy" src="' + (thumb ? thumb.url : '') + '" alt="">' +
      '<div class="rmeta"><div class="rtitle">' + escapeHtml(v.title) + '</div>' +
      '<div class="rsub">' + escapeHtml(v.author || '') + ' · ' + fmtDuration(v.lengthSeconds) +
      (v.viewCount ? ' · ' + fmtViews(v.viewCount) : '') + '</div></div>' +
      '<button class="radd" type="button" aria-label="Add to queue">+</button>';
    row.addEventListener('click', function(e){
      var playNow = !e.target.classList.contains('radd');
      addToQueue(v.videoId, v.title, playNow);
      if(playNow) hideResults();
    });
    resultsList.appendChild(row);
  });
}

document.getElementById('searchBtn').addEventListener('click', function(){
  goSearch(document.getElementById('queryInput').value);
});
document.getElementById('queryInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') goSearch(this.value);
});
document.getElementById('resultsClose').addEventListener('click', hideResults);
</script>
</body>
</html>
