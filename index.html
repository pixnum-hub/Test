<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पञ्चांग · Panchang</title>
<style>
  :root{ --radius:16px; --gap:12px; }
  html[data-theme="dark"]{
    --bg:#12141c; --bg2:#1b1e29; --bg3:#20232f;
    --text:#eee8da; --muted:#9a9fb5;
    --accent:#e8a33d; --accent2:#8b9dee;
    --good:#4caf7d; --bad:#e5646b;
    --border:rgba(255,255,255,.08); --ring:0 0 0 3px rgba(232,163,61,.35);
  }
  html[data-theme="light"]{
    --bg:#f7f1e4; --bg2:#ffffff; --bg3:#fbf7ee;
    --text:#28221a; --muted:#75695a;
    --accent:#b96f16; --accent2:#3d4d99;
    --good:#2f8f5b; --bad:#c0394a;
    --border:rgba(40,34,26,.1); --ring:0 0 0 3px rgba(185,111,22,.25);
  }
  html[data-theme="oled"]{
    --bg:#000000; --bg2:#070707; --bg3:#0d0d0d;
    --text:#e9e6df; --muted:#8b8b8b;
    --accent:#f0a83c; --accent2:#96a6ff;
    --good:#4caf7d; --bad:#e5646b;
    --border:rgba(255,255,255,.1); --ring:0 0 0 3px rgba(240,168,60,.3);
  }
  html[data-theme="hc"]{
    --bg:#000000; --bg2:#000000; --bg3:#000000;
    --text:#ffffff; --muted:#ffffff;
    --accent:#ffe600; --accent2:#00e5ff;
    --good:#00ff6a; --bad:#ff5252;
    --border:#ffffff; --ring:0 0 0 3px #ffe600;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    transition:background .25s,color .25s;
  }
  .wrap{width:100%; max-width:640px; padding:18px 16px 8px; flex:1;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .brand{display:flex; flex-direction:column;}
  .brand .kicker{font-family:"Yatra One",cursive; font-size:1.7rem; color:var(--accent); line-height:1;}
  .brand .sub{font-size:.75rem; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:3px;}
  .btnRow{display:flex; gap:8px; flex-wrap:wrap;}
  .pillBtn{
    background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:999px; padding:9px 14px; font-size:.78rem; font-weight:600;
    cursor:pointer; letter-spacing:.03em; white-space:nowrap;
  }
  .pillBtn:focus-visible{outline:none; box-shadow:var(--ring);}
  .datebar{font-size:.85rem; color:var(--muted); margin-bottom:18px;}
  .dial-row{display:flex; flex-direction:column; align-items:center; margin:8px 0 22px;}
  .dial{
    width:150px; height:150px; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--bg3) 0);
    display:flex; align-items:center; justify-content:center; position:relative;
    border:1px solid var(--border);
  }
  .dial::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg2);}
  .dial-inner{position:relative; z-index:1; text-align:center;}
  .dial-inner .tithi{font-family:"Yatra One",cursive; font-size:1.1rem; color:var(--accent); display:block;}
  .dial-inner .paksha{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
  .dial-caption{margin-top:10px; font-size:.78rem; color:var(--muted); text-align:center;}
  .section-title{font-size:.92rem; font-weight:700; margin:24px 2px 10px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--gap);}
  .card{
    background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; flex-direction:column; gap:2px;
  }
  .card .label{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);}
  .card .value{font-size:1.05rem; font-weight:700;}
  .card .value.small{font-size:.92rem;}
  .card .value.accent{color:var(--accent);}
  .card.wide{grid-column:1/-1; flex-direction:row; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .chogh-block{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:4px 14px 12px;}
  .chogh-sub{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:12px 0 2px;}
  .chogh-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0 8px 10px; border-left:3px solid var(--muted); font-size:.85rem;}
  .chogh-row + .chogh-row{border-top:1px solid var(--border);}
  .chogh-row.good{border-left-color:var(--good);}
  .chogh-row.bad{border-left-color:var(--bad);}
  .chogh-row.neutral{border-left-color:var(--accent2);}
  .chogh-time{color:var(--muted); font-size:.78rem;}
  .note{margin-top:12px; font-size:.72rem; color:var(--muted); text-align:center;}
  .loc{margin-top:14px; font-size:.75rem; color:var(--muted); text-align:center;}
  footer{
    width:100%; margin-top:24px; padding:16px 12px 22px;
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:.78rem; color:var(--muted);
  }
  @media (min-width:600px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
    .brand .kicker{font-size:2rem;}
  }
</style>
</head>

<script>
// ---------- Theme toggle (Dark / Light / OLED true-black / High-Contrast) ----------
const THEMES = [
  {id:"dark",  en:"🌙 Dark",  bn:"🌙 ডার্ক",   hi:"🌙 डार्क"},
  {id:"light", en:"☀️ Light", bn:"☀️ লাইট",   hi:"☀️ लाइट"},
  {id:"oled",  en:"⚫ OLED",  bn:"⚫ ওএলইডি",  hi:"⚫ ओएलईडी"},
  {id:"hc",    en:"◐ High Contrast", bn:"◐ হাই কনট্রাস্ট", hi:"◐ हाई कॉन्ट्रास्ट"}
];
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
let themeIdx = Math.max(0, THEMES.findIndex(t => t.id === localStorage.getItem("panchangTheme")));
themeBtn.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  localStorage.setItem("panchangTheme", THEMES[themeIdx].id);
  applyTheme();
});
function applyTheme(){
  root.setAttribute("data-theme", THEMES[themeIdx].id);
  themeBtn.textContent = THEMES[themeIdx][lang];
}

// ---------- Language toggle (English / Bengali / Hindi) ----------
const LANGS = [
  {code:"en", name:"English"},
  {code:"bn", name:"বাংলা"},
  {code:"hi", name:"हिन्दी"}
];
const langBtn = document.getElementById("langBtn");
let langIdx = Math.max(0, LANGS.findIndex(l => l.code === localStorage.getItem("panchangLang")));
let lang = LANGS[langIdx].code;
langBtn.addEventListener("click", () => {
  langIdx = (langIdx + 1) % LANGS.length;
  lang = LANGS[langIdx].code;
  localStorage.setItem("panchangLang", lang);
  render();
});

// ---------- Footer auto-updating year ----------
document.getElementById("year").textContent = new Date().getFullYear();

const CHOGH_QUALITY = ["bad","neutral","good","good","bad","good","bad"]; // aligned to CHOGHADIYA order
const DAY_START_IDX   = [0,3,6,2,5,1,4]; // Sun..Sat -> index into CHOGHADIYA
const NIGHT_START_IDX = [5,1,4,0,3,6,2];
const RAHU_SEG   = [8,2,7,5,6,4,3];
const YAMA_SEG   = [5,4,3,2,1,7,6];
const GULIKA_SEG = [7,6,5,4,3,2,1];

// ---------- Low-precision astronomy (Meeus / Schlyter style approximations) ----------
const norm = d => ((d % 360) + 360) % 360;
const rad = d => d * Math.PI / 180;
const lonOf = (x,y) => norm(Math.atan2(y,x) * 180 / Math.PI);
const toJD = date => date.getTime() / 86400000 + 2440587.5;

function sunLongitude(jd){
  const T = (jd - 2451545) / 36525;
  const L0 = norm(280.46646 + 36000.76983 * T);
  const M = norm(357.52911 + 35999.05029 * T);
  const Mr = rad(M);
  const C = (1.914602 - 0.004817 * T) * Math.sin(Mr)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
          + 0.000289 * Math.sin(3 * Mr);
  return norm(L0 + C);
}
function moonLongitude(jd){
  const T = (jd - 2451545) / 36525;
  const Lp = norm(218.3164477 + 481267.88123421 * T);
  const D  = rad(norm(297.8501921 + 445267.1114034 * T));
  const M  = rad(norm(357.5291092 + 35999.0502909 * T));
  const Mp = rad(norm(134.9633964 + 477198.8675055 * T));
  const F  = rad(norm(93.2720950 + 483202.0175233 * T));
  const dl = 6.288774 * Math.sin(Mp)
           + 1.274027 * Math.sin(2 * D - Mp)
           + 0.658314 * Math.sin(2 * D)
           + 0.213618 * Math.sin(2 * Mp)
           - 0.185116 * Math.sin(M)
           - 0.114332 * Math.sin(2 * F)
           + 0.058793 * Math.sin(2 * D - 2 * Mp)
           + 0.057066 * Math.sin(2 * D - M - Mp)
           + 0.053322 * Math.sin(2 * D + Mp);
  return norm(Lp + dl);
}
function lahiriAyanamsha(jd){
  const yearsFromJ2000 = (jd - 2451545) / 365.25;
  return 23.85 + yearsFromJ2000 * 0.013972; // ~50.3"/yr precession
}
// Heliocentric orbital elements (Schlyter low-precision method), d = days since 1999-12-31 00:00 UT
function elementsFor(p, d){
  const E = {
    mercury:{N:48.3313+3.24587e-5*d, i:7.0047+5.00e-8*d, w:29.1241+1.01444e-5*d, a:0.387098, e:0.205635+5.59e-10*d, M:168.6562+4.0923344368*d},
    venus:  {N:76.6799+2.46590e-5*d, i:3.3946+2.75e-8*d, w:54.8910+1.38374e-5*d, a:0.723330, e:0.006773-1.302e-9*d,  M:48.0052+1.6021302244*d},
    mars:   {N:49.5574+2.11081e-5*d, i:1.8497-1.78e-8*d, w:286.5016+2.92961e-5*d, a:1.523688, e:0.093405+2.516e-9*d, M:18.6021+0.5240207766*d},
    jupiter:{N:100.4542+2.76854e-5*d, i:1.3030-1.557e-7*d, w:273.8777+1.64505e-5*d, a:5.20256, e:0.048498+4.469e-9*d, M:19.8950+0.0830853001*d},
    saturn: {N:113.6634+2.38980e-5*d, i:2.4886-1.081e-7*d, w:339.3939+2.97661e-5*d, a:9.55475, e:0.055546-9.499e-9*d, M:316.9670+0.0334442282*d}
  };
  return E[p];
}
function planetLonSidereal(el, ayan, sunLon){
  const Mr = rad(norm(el.M));
  let E = Mr;
  for (let k = 0; k < 5; k++) E -= (E - el.e * Math.sin(E) - Mr) / (1 - el.e * Math.cos(E));
  const xv = el.a * (Math.cos(E) - el.e), yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  const v = Math.atan2(yv, xv), r = Math.hypot(xv, yv);
  const Nr = rad(el.N), ir = rad(el.i), wr = rad(el.w);
  const xh = r * (Math.cos(Nr) * Math.cos(v + wr) - Math.sin(Nr) * Math.sin(v + wr) * Math.cos(ir));
  const yh = r * (Math.sin(Nr) * Math.cos(v + wr) + Math.cos(Nr) * Math.sin(v + wr) * Math.cos(ir));
  const xs = Math.cos(rad(sunLon)), ys = Math.sin(rad(sunLon));
  return norm(lonOf(xh + xs, yh + ys) - ayan);
}

// ---------- Compute today's indices once (language-independent) ----------
const now = new Date();
const idx = (function(){
  const jd = toJD(now);
  const sunLon = sunLongitude(jd);
  const moonLon = moonLongitude(jd);
  const ayan = lahiriAyanamsha(jd);
  const sunSid = norm(sunLon - ayan);
  const moonSid = norm(moonLon - ayan);
  const elong = norm(moonLon - sunLon); // ayanamsha cancels out here
  const tithiNum = Math.floor(elong / 12); // 0-29
  const karanaIndex = Math.floor(elong / 6); // 0-59
  const sunSignIdx = Math.floor(sunSid / 30);
  const moonSignIdx = Math.floor(moonSid / 30);

  const dS = jd - 2451543.5; // Schlyter epoch day-number
  const planetRashi = { sun: sunSignIdx, moon: moonSignIdx };
  ["mercury","venus","mars","jupiter","saturn"].forEach(p => {
    planetRashi[p] = Math.floor(planetLonSidereal(elementsFor(p, dS), ayan, sunLon) / 30);
  });
  const T = (jd - 2451545) / 36525;
  const rahuLon = norm(norm(125.04452 - 1934.136261 * T) - ayan);
  planetRashi.rahu = Math.floor(rahuLon / 30);
  planetRashi.ketu = Math.floor(norm(rahuLon + 180) / 30);

  const monthIdx = (sunSignIdx + 1) % 12;
  const uttarayanaSigns = [9,10,11,0,1,2];
  const ayanaIdx = uttarayanaSigns.includes(sunSignIdx) ? 0 : 1;

  return {
    weekday: now.getDay(),
    ritu: RITU_BY_MONTH[now.getMonth()],
    tithiNum, pakshaIdx: tithiNum < 15 ? 0 : 1,
    nakIndex: Math.floor(moonSid / (360 / 27)),
    yogaIndex: Math.floor(norm(moonSid + sunSid) / (360 / 27)),
    karanaIndex, moonSignIdx, sunSignIdx, planetRashi, monthIdx, ayanaIdx,
    pct: elong / 360 * 100
  };
})();

function karanaName(l){
  if (idx.karanaIndex === 0) return KARANA_FIXED[l][0];
  if (idx.karanaIndex >= 57) return KARANA_FIXED[l][idx.karanaIndex - 56];
  return KARANA_MOVABLE[l][(idx.karanaIndex - 1) % 7];
}
function tithiName(l){
  if (idx.tithiNum === 14) return PAKSHA_END[l][0];
  if (idx.tithiNum === 29) return PAKSHA_END[l][1];
  return TITHI[l][idx.tithiNum % 15];
}

// ---------- Sunrise / Sunset / Moonrise / Moonset via Open-Meteo (free, keyless) ----------
const LOCALE = { en:"en-US", bn:"bn-IN", hi:"hi-IN" };
let sunTimes = null, sunLocKey = null, kaal = null;

function computeKaal(){
  if (!sunTimes) return null;
  const sr = new Date(sunTimes.daily.sunrise[0]);
  const ss = new Date(sunTimes.daily.sunset[0]);
  const srNext = new Date(sunTimes.daily.sunrise[1] || sunTimes.daily.sunrise[0]);
  const dayPart = (ss - sr) / 8;
  const nightPart = (srNext - ss) / 8;
  const seg = n => new Date(sr.getTime() + (n - 1) * dayPart);
  const per = n => ({ start: seg(n), end: new Date(seg(n).getTime() + dayPart) });
  const muhurta = (ss - sr) / 15;
  const buildList = (startIdx, startTime, part) => {
    const list = [];
    for (let k = 0; k < 8; k++){
      const oi = (startIdx + k) % 7;
      const st = new Date(startTime.getTime() + k * part);
      list.push({ o: oi, start: st, end: new Date(st.getTime() + part) });
    }
    return list;
  };
  return {
    rahu: per(RAHU_SEG[idx.weekday]),
    yama: per(YAMA_SEG[idx.weekday]),
    gulika: per(GULIKA_SEG[idx.weekday]),
    abhijit: { start: new Date(sr.getTime() + 7 * muhurta), end: new Date(sr.getTime() + 8 * muhurta) },
    brahma: { start: new Date(sr.getTime() - 96 * 60000), end: new Date(sr.getTime() - 48 * 60000) },
    dayChogh: buildList(DAY_START_IDX[idx.weekday], sr, dayPart),
    nightChogh: buildList(NIGHT_START_IDX[idx.weekday], ss, nightPart)
  };
}
function buildChoghRows(list, containerId){
  document.getElementById(containerId).innerHTML = list.map(item => {
    const q = CHOGH_QUALITY[item.o];
    const name = CHOGHADIYA[lang][item.o];
    return `<div class="chogh-row ${q}"><span>${name}</span><span class="chogh-time">${fmtT(item.start)}–${fmtT(item.end)}</span></div>`;
  }).join("");
}
function fmtT(d){ return new Date(d).toLocaleTimeString(LOCALE[lang], { hour:"2-digit", minute:"2-digit" }); }

function renderTimings(){
  const t = UI[lang];
  if (!sunTimes){ document.getElementById("locNote").textContent = ""; return; }
  document.getElementById("vSunrise").textContent = fmtT(sunTimes.daily.sunrise[0]);
  document.getElementById("vSunset").textContent = fmtT(sunTimes.daily.sunset[0]);
  const mr = sunTimes.daily.moonrise && sunTimes.daily.moonrise[0];
  const ms = sunTimes.daily.moonset && sunTimes.daily.moonset[0];
  document.getElementById("vMoonrise").textContent = mr ? fmtT(mr) : "—";
  document.getElementById("vMoonset").textContent = ms ? fmtT(ms) : "—";
  document.getElementById("locNote").textContent = `${t.sunFor} ${sunLocKey === "gps" ? t.yourLoc : t.defaultLoc}`;
  if (!kaal) return;
  document.getElementById("vRahu").textContent = `${fmtT(kaal.rahu.start)}–${fmtT(kaal.rahu.end)}`;
  document.getElementById("vYama").textContent = `${fmtT(kaal.yama.start)}–${fmtT(kaal.yama.end)}`;
  document.getElementById("vGulika").textContent = `${fmtT(kaal.gulika.start)}–${fmtT(kaal.gulika.end)}`;
  document.getElementById("vAbhijit").textContent = `${fmtT(kaal.abhijit.start)}–${fmtT(kaal.abhijit.end)}`;
  document.getElementById("vBrahma").textContent = `${fmtT(kaal.brahma.start)}–${fmtT(kaal.brahma.end)}`;
  buildChoghRows(kaal.dayChogh, "dayChoghList");
  buildChoghRows(kaal.nightChogh, "nightChoghList");
}
function loadSunTimes(lat, lon, key){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=sunrise,sunset,moonrise,moonset&forecast_days=2&timezone=auto`;
  fetch(url).then(r => r.json()).then(data => {
    sunTimes = data; sunLocKey = key;
    kaal = computeKaal();
    renderTimings();
  }).catch(() => {
    document.getElementById("locNote").textContent = UI[lang].sunFail;
  });
}

render();
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => loadSunTimes(pos.coords.latitude.toFixed(4), pos.coords.longitude.toFixed(4), "gps"),
    () => loadSunTimes(28.6139, 77.2090, "default"),
    { timeout: 6000 }
  );
} else {
  loadSunTimes(28.6139, 77.2090, "default");
}
