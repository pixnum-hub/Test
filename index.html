<style>
:root{--bg:#14161c;--card:#1d2029;--fg:#eceef3;--mute:#9aa1b2;--acc:#ffb454;--line:#2c3040;--ok:#6fd38b;--warn:#ff8a7a;--bw:1px}
[data-theme=light]{--bg:#f6f3ec;--card:#fff;--fg:#1d1b17;--mute:#6a665c;--acc:#b34a00;--line:#ddd6c6;--ok:#17803d;--warn:#b3261e}
[data-theme=oled]{--bg:#000;--card:#000;--fg:#e8e8e8;--mute:#8a8a8a;--acc:#ffb454;--line:#242424;--ok:#5fd07f;--warn:#ff7b6b}
[data-theme=hc]{--bg:#000;--card:#000;--fg:#fff;--mute:#fff;--acc:#ffff00;--line:#fff;--ok:#00ff66;--warn:#ff6b6b;--bw:2px}
*{box-sizing:border-box;margin:0;padding:0}
.n{font-family:'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Vrinda',sans-serif;font-size:1.15em;font-weight:600;line-height:1.1;letter-spacing:.02em}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hind Siliguri','Nirmala UI','Vrinda','Noto Sans Bengali',sans-serif;font-size:1.06rem;background:var(--bg);color:var(--fg);line-height:1.55;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 0 0}
.wrap{width:100%;max-width:720px;padding:12px;display:flex;flex-direction:column;gap:12px}
header{text-align:center;position:relative}
.thm{position:absolute;top:0;right:0;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--acc);border:2px solid var(--acc);cursor:pointer}
.thm svg{width:24px;height:24px;display:block}
h1{font-size:1.6rem;font-weight:700;color:var(--acc)}
.sub{color:var(--mute);font-size:.85rem}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:14px;padding:14px}
.themes,.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
@media print{html[data-theme]{--bg:#fff;--card:#fff;--fg:#000;--mute:#333;--acc:#000;--line:#999;--ok:#000;--warn:#000}#ctrl,#tabs,#err,.themes,button{display:none!important}.card{border:0}}
@media(forced-colors:active){.cal button.cur{outline:3px solid Highlight}}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:var(--bw) solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
button{cursor:pointer;white-space:nowrap}
button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.ctl button{padding:0}
.row2{display:grid;grid-template-columns:1fr auto;gap:6px}
.sel{display:grid;grid-template-columns:1fr;gap:6px}
.big{text-align:center}
.big .d{font-size:2.1rem;font-weight:700;color:var(--acc);line-height:1.2}
.big .g{color:var(--mute)}
.badge{display:inline-block;margin-top:6px;padding:2px 10px;border:var(--bw) solid var(--acc);border-radius:99px;color:var(--acc);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
.it{border-bottom:var(--bw) solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.it:last-child{border:0}
.it b{font-weight:600}.it small{display:block;color:var(--mute);font-size:.88rem}
.it .v{text-align:right}
h2{font-size:1.1rem;color:var(--acc);margin-bottom:6px}
.note{color:var(--mute);font-size:.88rem;margin-top:8px}
.ok{color:var(--ok)}.bad{color:var(--warn)}
pre{background:var(--bg);border:var(--bw) solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:.78rem;line-height:1.45;font-family:ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px 4px;border-bottom:var(--bw) solid var(--line);text-align:left;vertical-align:top}
th{color:var(--acc);font-weight:600}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wh{text-align:center;color:var(--acc);font-size:.75rem;font-weight:600}
.cal button{min-height:72px;padding:3px 1px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;line-height:1.3;white-space:normal;word-break:break-word}
.cal .g{font-weight:700;font-size:1.15rem}.cal .sp{color:var(--acc)}
.cal button.hl{border-color:var(--acc)}.cal button.cur,.cal button.cur .sp{background:var(--acc);color:#000}
footer{width:100%;margin-top:auto;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0));border-top:var(--bw) solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--mute);font-size:.85rem}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr;column-gap:20px}.sel{grid-template-columns:1fr 1fr}h1{font-size:2rem}}
</style>

const plain = h => String(h).replace(/<br>/g, '\n').replace(/<[^>]+>/g, '');

}
function dlICS(name, evs) {
  try {
    const z = x => String(x).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n'),
      n = new Date();
    const st = '' + n.getUTCFullYear() + pad(n.getUTCMonth() + 1) + pad(n.getUTCDate()) + 'T' + pad(n.getUTCHours()) + pad(n.getUTCMinutes()) + '00Z';
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Panchi//BN//EN', 'CALSCALE:GREGORIAN'];
    evs.forEach((e, i) => {
      const a = e.iso.replace(/-/g, ''),
        nx = new Date(Date.UTC(+e.iso.slice(0, 4), +e.iso.slice(5, 7) - 1, +e.iso.slice(8, 10) + 1));
      L.push('BEGIN:VEVENT', 'UID:' + a + '-' + i + '@panchi', 'DTSTAMP:' + st, 'DTSTART;VALUE=DATE:' + a, 'DTEND;VALUE=DATE:' + nx.getUTCFullYear() + pad(nx.getUTCMonth() + 1) + pad(nx.getUTCDate()), 'SUMMARY:' + z(e.t), 'DESCRIPTION:' + z(e.d), 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    if (window.PanchiAndroid && PanchiAndroid.saveFile) {
      PanchiAndroid.saveFile(name, 'text/calendar', L.join('\r\n'));
      return;
    }
    const u = URL.createObjectURL(new Blob([L.join('\r\n')], {
        type: 'text/calendar;charset=utf-8'
      })),
      l = document.createElement('a');
    l.href = u;
    l.download = name;
    document.body.appendChild(l);
    l.click();
    setTimeout(() => {
      URL.revokeObjectURL(u);
      l.remove();
    }, 800);
  } catch (e) {
    alert('ডাউনলোড সম্ভব হয়নি');
  }
}
