<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FadeIt — Manik Roy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
<meta name="theme-color" content="#0b0f14">
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --text:#111418; --sub:#5b6570;
  --accent:#3d7cf4; --accent-text:#ffffff; --border:#dde2e7;
  --danger:#e0453f; --ok:#2fae6b; --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1b2028; --text:#eef1f5; --sub:#9aa4b2;
  --accent:#5b8def; --accent-text:#0b0f14; --border:#2a3038;
}
:root[data-theme="oled"]{
  --bg:#000000; --panel:#0a0a0a; --text:#f5f5f5; --sub:#9a9a9a;
  --accent:#5b8def; --accent-text:#000000; --border:#1c1c1c;
}
:root[data-theme="hc"]{
  --bg:#000000; --panel:#000000; --text:#ffffff; --sub:#ffffff;
  --accent:#ffff00; --accent-text:#000000; --border:#ffffff;
}
*{box-sizing:border-box;}
html,body{
  height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .2s,color .2s;
}
.wrap{
  min-height:100%; display:flex; flex-direction:column; align-items:center;
  max-width:640px; margin:0 auto; padding:16px;
}
.topbar{
  width:100%; display:flex; justify-content:space-between; align-items:center;
  padding:8px 4px 20px;
}
h1{font-size:1.25rem; margin:0; letter-spacing:.2px;}
.sub{color:var(--sub); font-size:.85rem; margin-top:2px;}
button{font-family:inherit; cursor:pointer;}
.theme-btn{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  border-radius:999px; padding:8px 14px; font-size:.85rem; font-weight:600;
}
.theme-btn:active{transform:scale(.96);}
main{width:100%; flex:1; display:flex; flex-direction:column; gap:16px;}
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px;
}
.drop{
  border:2px dashed var(--border); border-radius:var(--radius);
  padding:36px 16px; text-align:center; color:var(--sub);
  transition:border-color .15s, background .15s;
}
.drop.drag{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent);}
.drop input{display:none;}
.drop .icon{font-size:2.2rem; display:block; margin-bottom:8px;}
.pick-btn{
  background:var(--accent); color:var(--accent-text); border:none; border-radius:10px;
  padding:10px 18px; font-weight:700; font-size:.9rem; margin-top:10px;
}
.preview-grid{
  display:grid; grid-template-columns:1fr; gap:12px;
}
@media(min-width:480px){ .preview-grid.has-result{grid-template-columns:1fr 1fr;} }
.pv{
  background:
    linear-gradient(45deg,#0000 25%,#8883 25%,#8883 50%,#0000 50%,#0000 75%,#8883 75%,#8883) 0 0/16px 16px,
    var(--panel);
  border:1px solid var(--border); border-radius:10px; overflow:hidden;
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
}
.pv img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
.pv .label{position:absolute;}
.pv-wrap{position:relative;}
.pv-tag{
  position:absolute; top:8px; left:8px; background:var(--bg); color:var(--sub);
  font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--border);
}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; justify-content:center;}
.btn{
  border-radius:10px; padding:11px 20px; font-weight:700; font-size:.9rem; border:1px solid var(--border);
  background:var(--panel); color:var(--text);
}
.btn.primary{background:var(--accent); color:var(--accent-text); border-color:transparent;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.status{
  display:flex; align-items:center; gap:10px; justify-content:center;
  color:var(--sub); font-size:.85rem; min-height:20px; margin-top:12px;
}
.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--border);
  border-top-color:var(--accent); animation:spin .8s linear infinite; display:none;
}
.spinner.on{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.progressbar{
  width:100%; height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px; display:none;
}
.progressbar.on{display:block;}
.progressbar > div{height:100%; width:0%; background:var(--accent); transition:width .2s;}
.err{color:var(--danger); font-size:.85rem; text-align:center; margin-top:8px; display:none;}
.err.on{display:block;}
footer{
  width:100%; text-align:center; padding:24px 0 12px; color:var(--sub); font-size:.78rem;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.hint{font-size:.78rem; color:var(--sub); text-align:center; margin-top:6px;}
.seg{ display:flex; flex-wrap:wrap; gap:8px; }
.seg button{ flex:1 1 auto; min-width:70px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:.8rem; font-weight:600; }
.seg button.active{ background:var(--accent); color:var(--accent-text); border-color:transparent; }
.subctrl{ margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.subctrl label{ font-size:.8rem; color:var(--sub); }
input[type=color]{width:40px; height:32px; border:1px solid var(--border); border-radius:6px; background:none;}
input[type=range]{flex:1; min-width:100px;}
.file-chip{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>FadeIt</h1>
      <div class="sub">On-device · No upload · No API key</div>
    </div>
    <button class="theme-btn" id="themeBtn">🌙 Dark</button>
  </div>

  <main>
    <div class="panel">
      <div class="drop" id="drop">
        <span class="icon">🖼️</span>
        <div>Drag & drop an image here</div>
        <div class="sub" style="margin-top:4px;">JPG, PNG, or WEBP</div>
        <input type="file" id="fileInput" accept="image/*">
        <button class="pick-btn" id="pickBtn">Choose Image</button>
      </div>

      <div class="preview-grid" id="grid" style="display:none;"></div>

      <div class="progressbar" id="bar"><div id="barFill"></div></div>
      <div class="status" id="status"><span class="spinner" id="spinner"></span><span id="statusText"></span></div>
      <div class="err" id="err"></div>

      <div class="actions" id="actions" style="display:none;">
        <button class="btn primary" id="removeBtn">Remove Background</button>
        <button class="btn" id="downloadBtn" style="display:none;">Download PNG</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>

      <div id="bgSwap" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
        <div class="sub" style="margin-bottom:8px; font-weight:600;">Background</div>
        <div class="seg" id="bgSeg">
          <button data-mode="transparent" class="active">Transparent</button>
          <button data-mode="color">Color</button>
          <button data-mode="blur">Blur</button>
          <button data-mode="image">Image</button>
        </div>
        <div class="subctrl" id="colorCtrl" style="display:none;">
          <label>Pick color</label><input type="color" id="bgColor" value="#3d7cf4">
        </div>
        <div class="subctrl" id="blurCtrl" style="display:none;">
          <label>Blur amount</label><input type="range" id="blurAmt" min="2" max="30" value="12">
        </div>
        <div class="subctrl" id="imageCtrl" style="display:none;">
          <input type="file" id="bgImageInput" accept="image/*" style="display:none;">
          <button class="btn" id="bgImagePick">Choose Image</button>
          <span class="file-chip" id="bgImageName" style="display:none;"></span>
        </div>
      </div>

      <div class="hint">First run downloads the model (~40–80MB, cached after) and runs fully in your browser via Transformers.js — ONNX Runtime Web + an ISNet-based model.</div>
    </div>
  </main>

  <footer>
    <div>© Manik Roy <span id="year"></span>. All Rights Reserved.</div>
  </footer>
</div>

<script type="module">
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Theme toggle (Dark → Light → OLED → HC → Dark) ----------
const themes = [
  {key:'dark', label:'🌙 Dark'},
  {key:'light', label:'☀️ Light'},
  {key:'oled', label:'⚫ OLED'},
  {key:'hc', label:'◐ HC'}
];
const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let themeIdx = 0;
try{
  const saved = localStorage.getItem('bgr-theme');
  const found = themes.findIndex(t=>t.key===saved);
  if(found>=0) themeIdx = found;
}catch(e){}
function applyTheme(){
  const t = themes[themeIdx];
  root.setAttribute('data-theme', t.key);
  themeBtn.textContent = t.label;
  try{ localStorage.setItem('bgr-theme', t.key); }catch(e){}
}
applyTheme();
themeBtn.addEventListener('click', ()=>{
  themeIdx = (themeIdx+1) % themes.length;
  applyTheme();
});

// ---------- Elements ----------
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const grid = document.getElementById('grid');
const actions = document.getElementById('actions');
const removeBtn = document.getElementById('removeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const statusText = document.getElementById('statusText');
const spinner = document.getElementById('spinner');
const bar = document.getElementById('bar');
const barFill = document.getElementById('barFill');
const errBox = document.getElementById('err');
const bgSwap = document.getElementById('bgSwap');
const bgSeg = document.getElementById('bgSeg');
const colorCtrl = document.getElementById('colorCtrl');
const blurCtrl = document.getElementById('blurCtrl');
const imageCtrl = document.getElementById('imageCtrl');
const bgColorInput = document.getElementById('bgColor');
const blurAmt = document.getElementById('blurAmt');
const bgImageInput = document.getElementById('bgImageInput');
const bgImagePick = document.getElementById('bgImagePick');
const bgImageName = document.getElementById('bgImageName');

let bgMode = 'transparent';
let bgImageURL = null;

let originalFile = null;
let originalURL = null;
let cutoutBlob = null;
let resultURL = null;

function showError(msg){
  errBox.textContent = msg;
  errBox.classList.add('on');
}
function clearError(){
  errBox.classList.remove('on');
  errBox.textContent = '';
}
function setStatus(msg, busy){
  statusText.textContent = msg || '';
  spinner.classList.toggle('on', !!busy);
}
function setProgress(p){
  if(p==null){ bar.classList.remove('on'); return; }
  bar.classList.add('on');
  barFill.style.width = Math.max(0,Math.min(100,p)) + '%';
}

function renderGrid(){
  grid.style.display = 'grid';
  grid.classList.toggle('has-result', !!resultURL);
  grid.innerHTML = '';

  const origWrap = document.createElement('div');
  origWrap.className = 'pv-wrap';
  origWrap.innerHTML = `<div class="pv-tag">ORIGINAL</div><div class="pv"><img src="${originalURL}"></div>`;
  grid.appendChild(origWrap);

  if(resultURL){
    const resWrap = document.createElement('div');
    resWrap.className = 'pv-wrap';
    resWrap.innerHTML = `<div class="pv-tag">RESULT</div><div class="pv"><img src="${resultURL}"></div>`;
    grid.appendChild(resWrap);
  }
}

function loadFile(file){
  if(!file || !file.type.startsWith('image/')){
    showError('Please choose a valid image file.');
    return;
  }
  clearError();
  originalFile = file;
  if(originalURL) URL.revokeObjectURL(originalURL);
  if(resultURL) URL.revokeObjectURL(resultURL);
  resultURL = null;
  cutoutBlob = null;
  originalURL = URL.createObjectURL(file);
  renderGrid();
  actions.style.display = 'flex';
  downloadBtn.style.display = 'none';
  bgSwap.style.display = 'none';
  removeBtn.disabled = false;
  removeBtn.textContent = 'Remove Background';
  setStatus('');
  setProgress(null);
}

pickBtn.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', e=>{
  if(e.target.files[0]) loadFile(e.target.files[0]);
});
['dragenter','dragover'].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('drag'); });
});
['dragleave','drop'].forEach(ev=>{
  drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('drag'); });
});
drop.addEventListener('drop', e=>{
  const f = e.dataTransfer.files[0];
  if(f) loadFile(f);
});

resetBtn.addEventListener('click', ()=>{
  originalFile = null;
  if(originalURL) URL.revokeObjectURL(originalURL);
  if(resultURL) URL.revokeObjectURL(resultURL);
  originalURL = null; resultURL = null; cutoutBlob = null;
  grid.style.display = 'none';
  actions.style.display = 'none';
  bgSwap.style.display = 'none';
  bgMode = 'transparent';
  [...bgSeg.children].forEach(b=>b.classList.toggle('active', b.dataset.mode==='transparent'));
  colorCtrl.style.display = 'none';
  blurCtrl.style.display = 'none';
  imageCtrl.style.display = 'none';
  fileInput.value = '';
  clearError();
  setStatus('');
  setProgress(null);
});

// ---------- Background swap (canvas compositing on top of the raw cutout) ----------
function loadImgEl(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }

async function composite(){
  if(!cutoutBlob) return;
  const cutoutURL = URL.createObjectURL(cutoutBlob);
  const cutout = await loadImgEl(cutoutURL);
  const w = cutout.width, h = cutout.height;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  if(bgMode === 'color'){
    ctx.fillStyle = bgColorInput.value;
    ctx.fillRect(0,0,w,h);
  }else if(bgMode === 'blur'){
    const orig = await loadImgEl(originalURL);
    ctx.filter = `blur(${blurAmt.value}px)`;
    ctx.drawImage(orig,0,0,w,h);
    ctx.filter = 'none';
  }else if(bgMode === 'image' && bgImageURL){
    const bgImg = await loadImgEl(bgImageURL);
    const scale = Math.max(w/bgImg.width, h/bgImg.height);
    const bw = bgImg.width*scale, bh = bgImg.height*scale;
    ctx.drawImage(bgImg, (w-bw)/2, (h-bh)/2, bw, bh);
  }
  // 'transparent' mode: leave the canvas blank (alpha 0) before drawing the cutout

  ctx.drawImage(cutout,0,0);
  URL.revokeObjectURL(cutoutURL);
  const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(resultURL) URL.revokeObjectURL(resultURL);
  resultURL = URL.createObjectURL(blob);
  renderGrid();
}

bgSeg.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  bgMode = btn.dataset.mode;
  [...bgSeg.children].forEach(b=>b.classList.toggle('active', b===btn));
  colorCtrl.style.display = bgMode==='color' ? 'flex' : 'none';
  blurCtrl.style.display = bgMode==='blur' ? 'flex' : 'none';
  imageCtrl.style.display = bgMode==='image' ? 'flex' : 'none';
  composite();
});
bgColorInput.addEventListener('input', ()=>{ if(bgMode==='color') composite(); });
blurAmt.addEventListener('change', ()=>{ if(bgMode==='blur') composite(); });
bgImagePick.addEventListener('click', ()=>bgImageInput.click());
bgImageInput.addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  if(bgImageURL) URL.revokeObjectURL(bgImageURL);
  bgImageURL = URL.createObjectURL(f);
  bgImageName.textContent = f.name;
  bgImageName.style.display = 'inline-block';
  if(bgMode==='image') composite();
});

// ---------- Background removal engine (Transformers.js: ONNX Runtime Web + ISNet-based "ormbg" model, Apache-2.0) ----------
let segmenterPromise = null;
async function loadEngine(){
  if(segmenterPromise) return segmenterPromise;
  const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
  segmenterPromise = pipeline('background-removal', 'onnx-community/ormbg-ONNX', {
    device: 'wasm',
    dtype: 'fp16',
    progress_callback: (data) => {
      if(data.status === 'progress' && typeof data.progress === 'number'){
        setProgress(data.progress);
        setStatus(`Downloading model… ${Math.round(data.progress)}%`, true);
      } else if(data.status === 'ready'){
        setStatus('Model ready…', true);
      }
    }
  });
  return segmenterPromise;
}

removeBtn.addEventListener('click', async ()=>{
  if(!originalFile) return;
  clearError();
  removeBtn.disabled = true;
  removeBtn.textContent = 'Processing…';
  setProgress(0);
  try{
    setStatus('Loading model engine…', true);
    const segmenter = await loadEngine();
    setStatus('Removing background…', true);
    const output = await segmenter(originalURL);
    cutoutBlob = await output[0].toBlob();
    await composite();
    downloadBtn.style.display = 'inline-block';
    downloadBtn.onclick = ()=>{
      const a = document.createElement('a');
      a.href = resultURL;
      a.download = 'FadeIt-result.png';
      a.click();
    };
    bgSwap.style.display = 'block';
    setStatus('Done ✓', false);
    removeBtn.textContent = 'Re-run';
  }catch(err){
    console.error(err);
    const detail = (err && (err.message || String(err))) || 'Unknown error';
    showError('Could not process this image: ' + detail + ' — try a smaller file or a different browser (Chrome/Edge/Safari).');
    setStatus('', false);
    removeBtn.textContent = 'Remove Background';
  }finally{
    removeBtn.disabled = false;
    setProgress(null);
  }
});
</script>
</body>
</html>
