<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CodeForge — Run Code Instantly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldgutter.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/dialog/dialog.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/mode/simple.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/mode/multiplex.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/clike/clike.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/php/php.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/ruby/ruby.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/rust/rust.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/go/go.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/lua/lua.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/r/r.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/haskell/haskell.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/shell/shell.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/sql/sql.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/perl/perl.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/julia/julia.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/edit/matchbrackets.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/edit/closebrackets.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldcode.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/foldgutter.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/brace-fold.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/indent-fold.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/fold/comment-fold.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/search/searchcursor.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/search/search.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/dialog/dialog.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/selection/active-line.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#1e1f26; --bg2:#262832; --panel:#20222b; --border:#383b48;
  --text:#e7e8ee; --sub:#9195a6; --accent:#ffb000; --accent-dim:#7a5b17;
  --ok:#57d38c; --err:#ff6b6b; --gutter:#4a4d5c; --radius:10px;
  --focus:#ffb000; --cursor:#ffb000;
}
[data-theme="light"]{
  --bg:#f4f3ef; --bg2:#ffffff; --panel:#ffffff; --border:#d9d7cf;
  --text:#1c1b18; --sub:#666257; --accent:#c98a00; --accent-dim:#f0d9ab;
  --ok:#1f8a4c; --err:#c0392b; --gutter:#c9c6ba; --cursor:#c98a00;
}
[data-theme="oled"]{
  --bg:#000000; --bg2:#000000; --panel:#080808; --border:#232323;
  --text:#f2f2f2; --sub:#8a8a8a; --accent:#ffb000; --accent-dim:#3a2a08;
  --ok:#4fe08a; --err:#ff6060; --gutter:#333333; --cursor:#ffb000;
}
[data-theme="hc"]{
  --bg:#000000; --bg2:#000000; --panel:#000000; --border:#ffffff;
  --text:#ffffff; --sub:#ffffff; --accent:#ffff00; --accent-dim:#000000;
  --ok:#00ff00; --err:#ff3b3b; --gutter:#ffffff; --focus:#ffff00; --cursor:#ffff00;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:'JetBrains Mono',monospace;
  display:flex; flex-direction:column; transition:background .2s,color .2s;
}
a{color:var(--accent);}
.app{max-width:900px;width:100%;margin:0 auto;padding:14px 14px 0;flex:1;display:flex;flex-direction:column;gap:14px;}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.dots{display:flex;gap:5px;}
.dots span{width:9px;height:9px;border-radius:50%;display:block;background:var(--gutter);}
.dots span:nth-child(1){background:#ff5f56;} .dots span:nth-child(2){background:#ffbd2e;} .dots span:nth-child(3){background:#27c93f;}
[data-theme="hc"] .dots span{background:#fff;}
.brand h1{font-size:1.05rem;margin:0;letter-spacing:.5px;}
.brand h1 .prompt{color:var(--accent);}
.cursor{display:inline-block;width:8px;height:1em;background:var(--cursor);margin-left:2px;vertical-align:middle;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* theme segmented control */
.theme-toggle{display:flex;justify-self:center;margin:0 auto;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel);}
.theme-toggle button{
  border:none;background:transparent;color:var(--sub);padding:7px 12px;font-family:inherit;
  font-size:.72rem;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;
}
.theme-toggle button.active{background:var(--accent);color:#111;font-weight:700;}
.theme-toggle button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}

/* controls row */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
select,button.run{
  font-family:inherit;font-size:.85rem;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--panel);color:var(--text);padding:9px 12px;
}
select{flex:1;min-width:130px;}
button.run{
  background:var(--accent);color:#111;font-weight:700;border:1px solid var(--accent);cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
button.run:active{transform:translateY(1px);}
button.run:disabled{opacity:.6;cursor:progress;}
select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

/* editor */
.pane{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;}
.pane .bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);font-size:.7rem;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;}
.edit-tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;border-bottom:1px solid var(--border);background:var(--bg2);}
.edit-tools button{
  font-family:inherit;font-size:.72rem;border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:6px;padding:5px 9px;cursor:pointer;
}
.edit-tools button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
.CodeMirror{
  height:auto;min-height:260px;font-family:'JetBrains Mono',monospace;
  background:transparent!important;color:var(--text)!important;font-size:var(--cm-size,.88rem);
}
.CodeMirror-gutters{background:var(--bg2)!important;border-right:1px solid var(--border)!important;}
.CodeMirror-linenumber{color:var(--sub)!important;}
.CodeMirror-cursor{border-left:2px solid var(--cursor)!important;}
.CodeMirror-selected{background:var(--accent-dim)!important;}
.CodeMirror-activeline-background{background:rgba(128,128,128,.08)!important;}
.CodeMirror-matchingbracket{color:var(--ok)!important;font-weight:700;}
.CodeMirror-dialog{background:var(--panel)!important;color:var(--text)!important;}
textarea{
  width:100%;min-height:260px;resize:vertical;border:none;background:transparent;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:.88rem;line-height:1.5;padding:12px;
  tab-size:2;
}
#output{
  margin:0;padding:12px;min-height:120px;max-height:320px;overflow:auto;white-space:pre-wrap;
  font-size:.82rem;line-height:1.5;color:var(--sub);
}
#output.ok{color:var(--ok);}
#output.err{color:var(--err);}
#preview{width:100%;min-height:220px;border:none;display:block;background:#fff;}
#preview[hidden]{display:none;}
.preview-tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;border-bottom:1px solid var(--border);background:var(--bg2);}
.preview-tools button{
  font-family:inherit;font-size:.72rem;border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:6px;padding:5px 9px;cursor:pointer;
}
.preview-tools button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
.preview-wrap{
  resize:vertical;overflow:auto;min-height:220px;height:340px;max-height:80vh;
  display:flex;justify-content:center;background:var(--bg2);
  border-bottom:2px dashed var(--border);
}
.preview-wrap[hidden]{display:none;}
.preview-wrap #preview{height:100%;min-height:0;transition:width .15s ease;}
.preview-wrap.fullscreen{position:fixed;inset:0;z-index:50;height:100vh!important;max-height:100vh;resize:none;border-radius:0;}
.badge{font-size:.68rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);}

/* footer */
footer{
  border-top:1px solid var(--border);margin-top:18px;padding:14px 10px 18px;
  text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.74rem;color:var(--sub);
}
footer strong{color:var(--text);}

@media (min-width:640px){
  .app{padding:22px 22px 0;}
  header{flex-wrap:nowrap;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dots"><span></span><span></span><span></span></span>
      <h1><span class="prompt">&gt;_</span> CodeForge<span class="cursor"></span></h1>
    </div>
    <div class="theme-toggle" id="themeToggle" role="group" aria-label="Theme">
      <button data-t="dark">Dark</button>
      <button data-t="light">Light</button>
      <button data-t="oled">OLED</button>
      <button data-t="hc">HC</button>
    </div>
  </header>

  <div class="controls">
    <select id="lang" aria-label="Language"></select>
    <button class="run" id="runBtn">▶ Run</button>
  </div>

  <div class="pane">
    <div class="bar"><span>main<span id="ext"></span></span><span id="verBadge" class="badge"></span></div>
    <div class="edit-tools">
      <button id="findBtn" title="Find & replace">🔍 Find</button>
      <button id="wrapBtn" title="Toggle word wrap">↩ Wrap</button>
      <button id="fontDown" title="Decrease font size">A−</button>
      <button id="fontUp" title="Increase font size">A+</button>
      <button id="foldAll" title="Fold all blocks">▾ Fold all</button>
      <button id="unfoldAll" title="Unfold all blocks">▸ Unfold all</button>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Write your code here…"></textarea>
  </div>

  <div class="pane">
    <div class="bar"><span>Output</span><span id="status" class="badge">Idle</span></div>
    <pre id="output">Tap Run to compile &amp; execute your code. Powered by the free Piston API — no key, no signup.</pre>
    <div class="preview-tools" id="previewTools" hidden>
      <button data-w="375" class="pv-w">📱 Mobile</button>
      <button data-w="768" class="pv-w">📟 Tablet</button>
      <button data-w="100%" class="pv-w on">🖥 Desktop</button>
      <button id="pvFull">⛶ Fullscreen</button>
    </div>
    <div class="preview-wrap" id="previewWrap" hidden>
      <iframe id="preview" title="Live preview" sandbox="allow-scripts"></iframe>
    </div>
  </div>
</div>

<footer>
  <div>© <span id="year"></span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
  <div>CodeForge — a lightweight browser IDE &amp; compiler</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const langSel = $('#lang'), codeEl = $('#code'), outEl = $('#output'), runBtn = $('#runBtn'),
      statusEl = $('#status'), extEl = $('#ext'), verBadge = $('#verBadge');

$('#year').textContent = new Date().getFullYear();

// ---- Theme handling ----
const themes = ['dark','light','oled','hc'];
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  localStorage.setItem('cf-theme', t);
}
document.getElementById('themeToggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  setTheme(b.dataset.t);
});
setTheme(localStorage.getItem('cf-theme') || 'dark');

// ---- 27 popular languages: file extension, matching aliases (no demo code) ----
const langs = {
  html:       {code:'', ext:'.html', preview:'html'},
  css:        {code:'', ext:'.css', preview:'css'},
  python:     {code:'', ext:'.py', match:['python']},
  javascript: {code:'', ext:'.js', match:['javascript','node','js']},
  typescript: {code:'', ext:'.ts', match:['typescript','ts']},
  c:          {code:'', ext:'.c', match:['c']},
  cpp:        {code:'', ext:'.cpp', match:['c++','cpp']},
  csharp:     {code:'', ext:'.cs', match:['csharp','c#','cs']},
  java:       {code:'', ext:'.java', match:['java']},
  kotlin:     {code:'', ext:'.kt', match:['kotlin']},
  go:         {code:'', ext:'.go', match:['go','golang']},
  rust:       {code:'', ext:'.rs', match:['rust','rs']},
  swift:      {code:'', ext:'.swift', match:['swift']},
  php:        {code:'', ext:'.php', match:['php']},
  ruby:       {code:'', ext:'.rb', match:['ruby','rb']},
  perl:       {code:'', ext:'.pl', match:['perl','pl']},
  lua:        {code:'', ext:'.lua', match:['lua']},
  r:          {code:'', ext:'.r', match:['r']},
  haskell:    {code:'', ext:'.hs', match:['haskell','hs']},
  elixir:     {code:'', ext:'.exs', match:['elixir','exs']},
  scala:      {code:'', ext:'.scala', match:['scala']},
  dart:       {code:'', ext:'.dart', match:['dart']},
  julia:      {code:'', ext:'.jl', match:['julia','jl']},
  pascal:     {code:'', ext:'.pas', match:['pascal','fpc']},
  fortran:    {code:'', ext:'.f90', match:['fortran','f90']},
  bash:       {code:'', ext:'.sh', match:['bash','sh']},
  sql:        {code:'', ext:'.sql', match:['sqlite3','sql']}
};

// ---- CodeMirror mime type per language (falls back to plain text if unmapped) ----
const mimeMap = {
  html:'htmlmixed', css:'css', python:'python', javascript:'javascript', typescript:'text/typescript',
  c:'text/x-csrc', cpp:'text/x-c++src', csharp:'text/x-csharp', java:'text/x-java', kotlin:'text/x-kotlin',
  scala:'text/x-scala', go:'go', rust:'rust', php:'php', ruby:'ruby', perl:'perl', lua:'lua', r:'r',
  haskell:'haskell', bash:'shell', sql:'text/x-sql', julia:'julia'
};

// ---- CodeMirror editor: line numbers, highlighting, brackets, folding, search ----
// Falls back to a plain textarea if the CDN library failed to load.
const cmReady = typeof CodeMirror !== 'undefined';
const cm = cmReady ? CodeMirror.fromTextArea(codeEl, {
  lineNumbers:true, matchBrackets:true, autoCloseBrackets:true, styleActiveLine:true,
  indentUnit:2, tabSize:2, lineWrapping:false,
  foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
  extraKeys:{
    'Ctrl-F':'findPersistent','Cmd-F':'findPersistent','Ctrl-H':'replace','Cmd-Alt-F':'replace',
    'Alt-Click':'addCursorToSelection'
  }
}) : {
  getValue:()=>codeEl.value, setValue:v=>codeEl.value=v, setOption:()=>{}, getOption:()=>false,
  refresh:()=>{}, execCommand:()=>{}, getWrapperElement:()=>codeEl, lineCount:()=>0, foldCode:()=>{}
};
if(!cmReady){
  document.querySelector('.edit-tools').hidden = true;
  codeEl.hidden = false;
}
let fontSize = 88;
document.getElementById('findBtn').addEventListener('click', ()=> cm.execCommand('findPersistent'));
document.getElementById('wrapBtn').addEventListener('click', e=>{
  const on = !cm.getOption('lineWrapping');
  cm.setOption('lineWrapping', on);
  e.target.classList.toggle('on', on);
});
document.getElementById('fontUp').addEventListener('click', ()=>{
  fontSize = Math.min(fontSize+8, 160);
  cm.getWrapperElement().style.setProperty('--cm-size', (fontSize/100)+'rem');
  cm.refresh();
});
document.getElementById('fontDown').addEventListener('click', ()=>{
  fontSize = Math.max(fontSize-8, 60);
  cm.getWrapperElement().style.setProperty('--cm-size', (fontSize/100)+'rem');
  cm.refresh();
});
document.getElementById('foldAll').addEventListener('click', ()=>{
  for(let i=0;i<cm.lineCount();i++) cm.foldCode({line:i,ch:0}, null, 'fold');
});
document.getElementById('unfoldAll').addEventListener('click', ()=>{
  for(let i=0;i<cm.lineCount();i++) cm.foldCode({line:i,ch:0}, null, 'unfold');
});

let runtimes = [];
async function loadRuntimes(){
  statusEl.textContent = 'Loading…';
  Object.keys(langs).filter(n => langs[n].preview).forEach(name=>{
    const opt = document.createElement('option');
    opt.value = name; opt.dataset.lang = 'preview';
    opt.textContent = name.charAt(0).toUpperCase()+name.slice(1);
    langSel.appendChild(opt);
  });
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/runtimes');
    runtimes = await res.json();
    Object.keys(langs).filter(n => langs[n].match).forEach(name=>{
      const cands = langs[name].match;
      const match = runtimes.find(r => cands.includes(r.language) || cands.some(c => (r.aliases||[]).includes(c)));
      if(match){
        const opt = document.createElement('option');
        opt.value = name; opt.dataset.lang = match.language; opt.dataset.ver = match.version;
        opt.textContent = name.charAt(0).toUpperCase()+name.slice(1);
        langSel.appendChild(opt);
      }
    });
    statusEl.textContent = 'Idle';
    onLangChange();
  }catch(err){
    statusEl.textContent = 'Offline';
    outEl.textContent = 'Could not reach the Piston API to load languages. HTML/CSS preview still works offline.';
    outEl.className = 'err';
    onLangChange();
  }
}
function onLangChange(){
  const key = langSel.value;
  cm.setValue((langs[key] && langs[key].code) || '');
  cm.setOption('mode', mimeMap[key] || null);
  extEl.textContent = (langs[key] && langs[key].ext) || '';
  const opt = langSel.selectedOptions[0];
  const isPreview = langs[key] && langs[key].preview;
  verBadge.textContent = isPreview ? 'Live preview' : (opt ? opt.dataset.ver : '');
  $('#output').hidden = false; $('#previewWrap').hidden = true; $('#previewTools').hidden = true;
  cm.refresh();
}
langSel.addEventListener('change', onLangChange);

function renderPreview(key){
  const code = cm.getValue();
  const doc = langs[key].preview === 'css'
    ? '<!DOCTYPE html><html><head><style>'+code+'</style></head><body><div class="box"><h2>Preview</h2><p>Sample paragraph text.</p></div></body></html>'
    : code;
  $('#preview').srcdoc = doc;
  $('#previewWrap').hidden = false; $('#previewTools').hidden = false; $('#output').hidden = true;
  statusEl.textContent = 'Rendered';
}

document.querySelectorAll('.pv-w').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.pv-w').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  $('#preview').style.width = b.dataset.w === '100%' ? '100%' : b.dataset.w+'px';
}));
document.getElementById('pvFull').addEventListener('click', e=>{
  const on = document.getElementById('previewWrap').classList.toggle('fullscreen');
  e.target.classList.toggle('on', on);
});

async function runCode(){
  const opt = langSel.selectedOptions[0];
  if(!opt) return;
  if(langs[opt.value] && langs[opt.value].preview){
    renderPreview(opt.value);
    return;
  }
  runBtn.disabled = true; runBtn.textContent = '⏳ Running…';
  statusEl.textContent = 'Running';
  $('#previewWrap').hidden = true; $('#previewTools').hidden = true; $('#output').hidden = false;
  outEl.className = ''; outEl.textContent = 'Compiling & executing…';
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        language: opt.dataset.lang,
        version: opt.dataset.ver,
        files: [{ name: 'main'+((langs[opt.value]||{}).ext||''), content: cm.getValue() }]
      })
    });
    const data = await res.json();
    const run = data.run || {};
    const compile = data.compile || {};
    let text = '';
    if(compile.stderr) text += '[compile]\n'+compile.stderr+'\n';
    text += (run.stdout || '') + (run.stderr ? '\n'+run.stderr : '');
    if(!text.trim()) text = '(no output)';
    outEl.textContent = text;
    const failed = (run.code && run.code !== 0) || run.stderr || compile.stderr;
    outEl.className = failed ? 'err' : 'ok';
    statusEl.textContent = failed ? 'Error' : 'Success';
  }catch(err){
    outEl.textContent = 'Network error while contacting the execution API. Please try again.';
    outEl.className = 'err';
    statusEl.textContent = 'Error';
  }finally{
    runBtn.disabled = false; runBtn.textContent = '▶ Run';
  }
}
runBtn.addEventListener('click', runCode);
loadRuntimes();
</script>
</body>
</html>
