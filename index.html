<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gochar · Vedic Sky Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --radius:14px;
    --font-display:'Cinzel',serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-data:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  [data-theme="light"]{
    --bg:#FAF6EC; --surface:#FFFFFF; --surface2:#F1EAD9; --text:#221F33;
    --muted:#6B6480; --accent:#C97A2B; --accent2:#7A2048; --border:#E7DFC9;
    --good:#3E7D55; --bad:#B44230; --ring:rgba(201,122,43,.55);
  }
  [data-theme="dark"]{
    --bg:#131022; --surface:#1D1930; --surface2:#241F3B; --text:#F3EFE2;
    --muted:#A79FC4; --accent:#E9A23B; --accent2:#D0728F; --border:#2E2947;
    --good:#66C48A; --bad:#E3745C; --ring:rgba(233,162,59,.55);
  }
  [data-theme="oled"]{
    --bg:#000000; --surface:#0A0A0A; --surface2:#131313; --text:#F3EFE2;
    --muted:#948CB0; --accent:#E9A23B; --accent2:#D0728F; --border:#1C1C1C;
    --good:#66C48A; --bad:#E3745C; --ring:rgba(233,162,59,.5);
  }
  [data-theme="hc"]{
    --bg:#000000; --surface:#000000; --surface2:#000000; --text:#FFFFFF;
    --muted:#FFFFFF; --accent:#FFD400; --accent2:#00E5FF; --border:#FFFFFF;
    --good:#00FF6A; --bad:#FF4141; --ring:#FFD400;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:480px; padding:20px 16px 8px; flex:1;}
  h1{
    font-family:var(--font-display); font-weight:700; letter-spacing:.03em;
    font-size:1.5rem; text-align:center; margin:4px 0 2px;
  }
  .tagline{text-align:center; color:var(--muted); font-size:.85rem; margin:0 0 18px;}

  /* theme toggle */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  #themeBtn{
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:999px; padding:8px 14px; font-family:var(--font-body); font-size:.78rem;
    font-weight:600; cursor:pointer; letter-spacing:.02em;
  }
  #themeBtn:focus-visible, select:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* signature: zodiac ring */
  .ring-wrap{display:flex; justify-content:center; margin:18px 0 20px;}
  .ring{
    position:relative; width:210px; height:210px; border-radius:50%;
    background:conic-gradient(var(--surface2) 0deg 30deg, transparent 30deg 60deg,
      var(--surface2) 60deg 90deg, transparent 90deg 120deg,
      var(--surface2) 120deg 150deg, transparent 150deg 180deg,
      var(--surface2) 180deg 210deg, transparent 210deg 240deg,
      var(--surface2) 240deg 270deg, transparent 270deg 300deg,
      var(--surface2) 300deg 330deg, transparent 330deg 360deg);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .ring::before{
    content:""; position:absolute; inset:14px; border-radius:50%;
    border:1px dashed var(--ring);
  }
  .ring-center{
    position:relative; text-align:center; font-family:var(--font-display);
  }
  .ring-center .glyph{font-size:2.6rem; color:var(--accent); line-height:1;}
  .ring-center .label{font-size:.75rem; color:var(--muted); font-family:var(--font-body); margin-top:2px;}
  .ring span.deg{
    position:absolute; font-size:.68rem; color:var(--muted); font-family:var(--font-data);
  }

  /* form */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:.78rem; color:var(--muted); margin-bottom:6px; font-weight:600;}
  select, button.primary{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-family:var(--font-body); font-size:.95rem;
  }
  button.primary{
    background:var(--accent); color:#1B1420; font-weight:700; border:none; margin-top:12px;
    cursor:pointer; letter-spacing:.02em;
  }
  button.primary:disabled{opacity:.6; cursor:progress;}
  .geo-note{font-size:.72rem; color:var(--muted); margin-top:8px;}

  /* results */
  #status{text-align:center; color:var(--muted); font-size:.85rem; min-height:1.2em; margin-bottom:8px;}
  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th{
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:0 8px 8px; font-weight:600;
  }
  td{padding:10px 8px; border-top:1px solid var(--border); vertical-align:middle;}
  .planet-cell{display:flex; align-items:center; gap:8px;}
  .p-glyph{font-family:var(--font-data); color:var(--accent); width:1.2em; text-align:center;}
  .sign-name{font-family:var(--font-data); font-size:.82rem;}
  .badge{
    display:inline-block; padding:3px 9px; border-radius:999px; font-size:.68rem; font-weight:700;
    letter-spacing:.02em;
  }
  .badge.good{background:color-mix(in srgb, var(--good) 22%, transparent); color:var(--good);}
  .badge.bad{background:color-mix(in srgb, var(--bad) 22%, transparent); color:var(--bad);}

  footer{
    width:100%; max-width:480px; padding:22px 16px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:4px; color:var(--muted); font-size:.74rem;
  }
  footer strong{color:var(--text);}

  @media (prefers-reduced-motion:no-preference){
    .card, table, .ring{transition:background .25s ease, border-color .25s ease;}
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div></div>
    <button id="themeBtn" type="button" aria-label="Cycle theme">Theme: Dark</button>
  </div>
  <h1>Gochar</h1>
  <p class="tagline">Live Vedic planetary transits, relative to your Moon sign (Rāśi)</p>

  <div class="ring-wrap">
    <div class="ring" id="ring">
      <div class="ring-center">
        <div class="glyph" id="ringGlyph">♈</div>
        <div class="label" id="ringLabel">Select your Rāśi</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="moonSign">Your Janma Rāśi (Moon sign)</label>
    <select id="moonSign"></select>
    <button class="primary" id="goBtn" type="button">Show today's Gochar</button>
    <p class="geo-note" id="geoNote">Using your location for accurate transit times, when allowed.</p>
  </div>

  <p id="status" role="status"></p>

  <div class="card" id="resultsCard" style="display:none;">
    <table>
      <thead><tr><th>Graha</th><th>Transiting Sign</th><th>House</th><th>Reading</th></tr></thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</main>

<footer>
  <div>Data: VedAstro API (Lahiri Ayanamsa) · For reflection, not prediction.</div>
  <div>&copy; <span id="year"></span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
</footer>

<script>
  const SIGNS = [
    ["Aries","Mesha","♈"],["Taurus","Vrishabha","♉"],["Gemini","Mithuna","♊"],
    ["Cancer","Karka","♋"],["Leo","Simha","♌"],["Virgo","Kanya","♍"],
    ["Libra","Tula","♎"],["Scorpio","Vrischika","♏"],["Sagittarius","Dhanu","♐"],
    ["Capricorn","Makara","♑"],["Aquarius","Kumbha","♒"],["Pisces","Meena","♓"]
  ];
  const PLANETS = [
    ["Sun","Surya"],["Moon","Chandra"],["Mars","Mangal"],["Mercury","Budh"],
    ["Jupiter","Guru"],["Venus","Shukra"],["Saturn","Shani"],["Rahu","Rahu"],["Ketu","Ketu"]
  ];
  const GOOD_HOUSES = {
    Sun:[3,6,10,11], Moon:[1,3,6,7,10,11], Mars:[3,6,11],
    Mercury:[2,4,6,8,10,11], Jupiter:[2,5,7,9,11], Venus:[1,2,3,4,5,8,9,11,12],
    Saturn:[3,6,11], Rahu:[3,6,10,11], Ketu:[3,6,10,11]
  };
  const THEMES = ["dark","light","oled","hc"];
  const THEME_LABEL = {dark:"Dark", light:"Light", oled:"OLED Black", hc:"High Contrast"};

  const $ = id => document.getElementById(id);
  document.getElementById("year").textContent = new Date().getFullYear();

  // ---- theme cycling ----
  let themeIdx = 0;
  function applyTheme(){
    const t = THEMES[themeIdx];
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = "Theme: " + THEME_LABEL[t];
  }
  $("themeBtn").addEventListener("click", () => {
    themeIdx = (themeIdx + 1) % THEMES.length;
    applyTheme();
  });
  applyTheme();

  // ---- populate sign select + ring ----
  const sel = $("moonSign");
  SIGNS.forEach((s,i) => {
    const opt = document.createElement("option");
    opt.value = s[0]; opt.textContent = `${s[2]} ${s[0]} (${s[1]})`;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    const s = SIGNS.find(x => x[0] === sel.value);
    if(s){ $("ringGlyph").textContent = s[2]; $("ringLabel").textContent = `${s[0]} · ${s[1]}`; }
  });
  sel.selectedIndex = 0; sel.dispatchEvent(new Event("change"));

  // place small degree labels around the ring
  const ring = $("ring");
  SIGNS.forEach((s,i) => {
    const angle = (i * 30 - 90) * Math.PI/180;
    const r = 96;
    const x = 105 + r*Math.cos(angle), y = 105 + r*Math.sin(angle);
    const el = document.createElement("span");
    el.className = "deg"; el.textContent = s[2];
    el.style.left = (x-8)+"px"; el.style.top = (y-8)+"px";
    ring.appendChild(el);
  });

  // ---- geolocation ----
  let coords = {lat:28.6139, lon:77.2090, label:"New Delhi (default)"};
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    pos => {
      coords = {lat:pos.coords.latitude, lon:pos.coords.longitude, label:"your current location"};
      $("geoNote").textContent = "Using your current location.";
    },
    () => { $("geoNote").textContent = "Location unavailable — using New Delhi as reference."; },
    {timeout:5000}
  );

  // ---- StdTime formatting for VedAstro API ----
  function pad(n){ return String(n).padStart(2,"0"); }
  function buildStdTime(){
    const d = new Date();
    const tz = -d.getTimezoneOffset();
    const sign = tz >= 0 ? "+" : "-";
    const abs = Math.abs(tz);
    const tzStr = `${sign}${pad(Math.floor(abs/60))}:${pad(abs%60)}`;
    return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${tzStr}`;
  }

  // find a payload value by planet name, case-insensitively, however deep it's nested
  function findPlanetValue(payload, enName){
    const keys = Object.keys(payload || {});
    const direct = keys.find(k => k.toLowerCase() === enName.toLowerCase());
    if(direct) return payload[direct];
    return undefined;
  }

  function houseFromMoon(moonIdx, planetIdx){
    return ((planetIdx - moonIdx + 12) % 12) + 1;
  }

  function extractSignName(val){
    if(typeof val === "string") return val;
    if(val && typeof val === "object"){
      return val.SignName || val.Name || val.Rasi || val.RasiName || JSON.stringify(val);
    }
    return String(val);
  }

  async function fetchTransits(){
    // Body shape matches VedAstro's own documented client-side fetch() example
    const body = {
      Location: { Latitude: coords.lat, Longitude: coords.lon, Name: coords.label },
      Time: { StdTime: buildStdTime() },
      Ayanamsa: "LAHIRI"
    };
    const res = await fetch("https://api.vedastro.org/api/Calculate/AllPlanetRasiSigns", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error(`API responded with status ${res.status}`);
    const data = await res.json();
    if(data.Status !== "Pass"){
      throw new Error(typeof data.Payload === "string" ? data.Payload : "The API returned an error.");
    }
    // response nesting varies by endpoint — try the documented key, then fall back to the raw payload
    const payload = (data.Payload && (data.Payload.AllPlanetRasiSigns || data.Payload.AllPlanetRasiSign)) || data.Payload;
    if(!payload || typeof payload !== "object"){
      console.error("Unexpected VedAstro response:", data);
      throw new Error("Got an unexpected response shape from the API.");
    }
    console.log("VedAstro payload:", payload);
    return payload;
  }

  function render(payload, moonSignName){
    const moonIdx = SIGNS.findIndex(s => s[0] === moonSignName);
    const body = $("resultsBody");
    body.innerHTML = "";
    let rendered = 0;
    PLANETS.forEach(([enName, sName]) => {
      const raw = findPlanetValue(payload, enName);
      if(raw === undefined) return;
      const signName = extractSignName(raw);
      const signIdx = SIGNS.findIndex(s => s[0] === signName || s[1] === signName);
      const house = signIdx >= 0 ? houseFromMoon(moonIdx, signIdx) : null;
      const good = house !== null && (GOOD_HOUSES[enName] || []).includes(house);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><div class="planet-cell"><span class="p-glyph">${sName.slice(0,2)}</span>${enName}</div></td>
        <td class="sign-name">${signName}</td>
        <td>${house ?? "—"}</td>
        <td>${house ? `<span class="badge ${good?'good':'bad'}">${good?'Favorable':'Needs care'}</span>` : "—"}</td>`;
      body.appendChild(tr);
      rendered++;
    });
    $("resultsCard").style.display = rendered ? "block" : "none";
    return rendered;
  }

  $("goBtn").addEventListener("click", async () => {
    const btn = $("goBtn");
    btn.disabled = true;
    $("status").textContent = "Reading the sky…";
    $("resultsCard").style.display = "none";
    try{
      const payload = await fetchTransits();
      const count = render(payload, sel.value);
      $("status").textContent = count
        ? `Transits for ${coords.label}, just now.`
        : "The API responded, but no planet data was found in it — see console for the raw response.";
    }catch(err){
      console.error(err);
      $("status").textContent = "Couldn't reach the sky right now: " + err.message;
    }finally{
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
