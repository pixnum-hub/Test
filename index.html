<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiFi Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#1e1e1e;--card:#252526;--fg:#d4d4d4;--mut:#9da0a6;--acc:#3794ff;--bd:#3c3c3c;--on:#fff;--g:#4ec98a;--l:#a8d84e;--a:#f0b429;--r:#f25c5c;--bw:1px}
[data-theme=light]{--bg:#f3f3f3;--card:#fff;--fg:#1f1f1f;--mut:#616161;--acc:#0066b8;--bd:#d4d4d4;--g:#178a4c;--l:#6b9a12;--a:#b7791f;--r:#c9302c}
[data-theme=oled]{--bg:#000;--card:#000;--fg:#e6e6e6;--bd:#2a2a2a;--acc:#4da3ff}
[data-theme=hc]{--bg:#000;--card:#000;--fg:#fff;--mut:#fff;--bd:#fff;--acc:#ffff00;--on:#000;--g:#00ff7f;--l:#7fff00;--a:#ffd700;--r:#ff5050;--bw:2px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100%;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:760px;padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;text-align:center}
h1{font-size:1.4rem}h2{font-size:1rem;margin-bottom:6px}
.sub{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border:var(--bw) solid var(--bd);border-radius:14px;padding:12px}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:var(--bw) solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px}
button{cursor:pointer}
button.on,button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
textarea{width:100%;height:80px;font:12px ui-monospace,Consolas,monospace;resize:vertical;margin:8px 0}
ol{text-align:left;padding-left:20px;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.row>*{flex:1 1 130px}
#map{height:50vh;min-height:300px;border-radius:12px;border:var(--bw) solid var(--bd);z-index:0}
[data-theme=dark] .leaflet-tile-pane,[data-theme=oled] .leaflet-tile-pane,[data-theme=hc] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
[data-theme=oled] #map,[data-theme=hc] #map{background:#000}
[data-theme=oled] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.65) contrast(1.1)}
.leaflet-container{color:#222}
#list{display:flex;flex-direction:column;gap:8px;text-align:left}
.ap{display:flex;gap:10px;align-items:center;padding:10px;border:var(--bw) solid var(--bd);border-radius:12px;cursor:pointer;background:var(--card)}
.ap:hover,.ap:focus-visible{border-color:var(--acc)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--fg)}
.ap b{display:block;word-break:break-word}.ap small{color:var(--mut)}
.rs{margin-left:auto;font-weight:700;white-space:nowrap}
.stat{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
#msg{min-height:1.3em;font-size:.85rem;color:var(--acc)}
footer{width:100%;padding:16px 12px;border-top:var(--bw) solid var(--bd);text-align:center;color:var(--mut);font-size:.85rem;display:flex;align-items:center;justify-content:center;min-height:64px}
</style>
</head>
<body>
<main>
  <header>
    <h1>📶 WiFi Map</h1>
    <p class="sub">Live scan via the Windows Native Wi-Fi API · OpenStreetMap · no API key</p>
  </header>

  <div class="seg" id="themes" role="group" aria-label="Theme">
    <button data-t="light">Light+</button><button data-t="dark">Dark+</button>
    <button data-t="oled">OLED</button><button data-t="hc">HC</button>
  </div>

  <section class="card">
    <h2>Scan Wi-Fi networks</h2>
    <div class="row">
      <button id="scan" class="pri">📡 Scan now</button>
      <button id="loc">📍 My location</button>
      <label class="row" style="flex:1 1 130px;gap:6px"><input type="checkbox" id="auto" style="min-height:auto"> Auto-scan (15 s)</label>
    </div>
    <p id="msg" role="status"></p>
  </section>

  <div id="map" aria-label="Wi-Fi map"></div>
  <div class="stat"><span id="s1">0 networks</span><span id="s2">0 scans</span><span>● ≥-55 ● ≥-67 ● ≥-75 ● weaker dBm</span></div>

  <section class="card">
    <div class="row">
      <input id="q" type="search" placeholder="Search SSID or BSSID" aria-label="Search">
      <select id="band" aria-label="Band"><option value="">All bands</option><option value="2">2.4 GHz</option><option value="5">5 GHz</option><option value="6">6 GHz</option></select>
      <select id="sort" aria-label="Sort"><option value="rssi">Strongest</option><option value="ssid">Name</option><option value="ch">Channel</option></select>
    </div>
    <div class="row" style="margin-top:8px"><button id="exp">Export JSON</button><button id="clr">Clear all</button></div>
  </section>
  <div id="list"></div>
</main>
<footer><span>© Manik Roy <span id="yr">2026</span>. All Rights Reserved.</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='wifimap.v1', API=window.wifi;

let db={aps:{},scans:0,user:null};
try{Object.assign(db,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const say=t=>$('#msg').textContent=t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- theme
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('wifimap.theme',t)}catch(e){}
  document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
let st='dark';try{st=localStorage.getItem('wifimap.theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch(e){}
theme(st);
$('#themes').onclick=e=>e.target.dataset.t&&theme(e.target.dataset.t);
$('#yr').textContent=new Date().getFullYear();

// ---- helpers
const band=f=>f<3000?'2':f<5900?'5':'6';
const chan=f=>f<3000?Math.round((f-2407)/5):f<5900?Math.round((f-5000)/5):Math.round((f-5950)/5);
const col=r=>getComputedStyle(document.documentElement).getPropertyValue(r>=-55?'--g':r>=-67?'--l':r>=-75?'--a':'--r').trim();
const dist=(r,f)=>Math.min(300,Math.max(1,Math.pow(10,((15-r)-20*Math.log10(f)+27.55)/20)));
function est(ap){let w=0,la=0,ln=0;ap.obs.forEach(o=>{const k=Math.pow(10,o.rssi/10);w+=k;la+=o.lat*k;ln+=o.lng*k});return[la/w,ln/w]}

// ---- map
const map=L.map('map',{zoomControl:true}).setView([22.5726,88.3639],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);let me=null;
function setMe(lat,lng){db.user=[lat,lng];if(me)me.setLatLng([lat,lng]);else me=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#3794ff',fillOpacity:1}).addTo(map).bindTooltip('You');save()}
async function locate(cb){say('Getting location…');let p=null;
  try{p=API?await API.locate():await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(x=>ok([x.coords.latitude,x.coords.longitude]),no,{enableHighAccuracy:true,timeout:12000}))}catch(e){}
  if(p){setMe(p[0],p[1]);map.setView(p,17)}else say('Location unavailable — using last known position.');
  cb(p||db.user)}
$('#loc').onclick=()=>locate(()=>say('Location updated.'));

// ---- scan
if(!API){$('#scan').disabled=true;$('#auto').disabled=true;say('Browsers cannot read Wi-Fi. Run the Windows desktop app to enable scanning.')}
let busy=false;
async function scan(){
  if(!API||busy)return;busy=true;const b=$('#scan');b.disabled=true;b.textContent='Scanning…';say('Scanning with wlanapi.dll…');
  try{
    const [nets,pos]=await Promise.all([API.scan(),API.locate().catch(()=>null)]);
    const arr=(Array.isArray(nets)?nets:[nets]).filter(x=>x&&x.bssid&&typeof x.rssi==='number');
    if(!arr.length)say('No networks found. Check that Wi-Fi is on and Location is enabled in Windows.');
    else{
      if(pos){setMe(pos[0],pos[1])}
      const [lat,lng]=pos||db.user||[map.getCenter().lat,map.getCenter().lng];const t=Date.now();
      arr.forEach(x=>{const id=String(x.bssid).toUpperCase();
        const ap=db.aps[id]||(db.aps[id]={bssid:id,obs:[]});
        Object.assign(ap,{ssid:x.ssid||'(hidden)',rssi:x.rssi,q:x.q,freq:x.freq||2437,sec:!!x.sec,t});
        ap.obs.push({lat,lng,rssi:x.rssi,t});if(ap.obs.length>40)ap.obs.shift()});
      db.scans++;save();render(!$('#auto').checked);
      say('Found '+arr.length+' networks'+(pos?'.':' (no GPS fix — used last known position).'));
    }
  }catch(e){say('Scan failed: '+(e.message||e))}
  b.disabled=false;b.textContent='📡 Scan now';busy=false;
}
$('#scan').onclick=scan;
let timer=null;$('#auto').onchange=e=>{clearInterval(timer);if(e.target.checked){scan();timer=setInterval(scan,15000)}};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='wifi-map-export.json';a.click()};
$('#clr').onclick=()=>{if(confirm('Delete all saved networks?')){db.aps={};db.scans=0;save();render()}};

// ---- render
function view(){const q=$('#q').value.toLowerCase(),b=$('#band').value,s=$('#sort').value;
  const a=Object.values(db.aps).filter(x=>(!q||x.ssid.toLowerCase().includes(q)||x.bssid.toLowerCase().includes(q))&&(!b||band(x.freq)===b));
  a.sort((x,y)=>s==='rssi'?y.rssi-x.rssi:s==='ssid'?x.ssid.localeCompare(y.ssid):chan(x.freq)-chan(y.freq));return a}
function render(fit){
  const a=view();layer.clearLayers();const pts=[];
  a.forEach(ap=>{const p=est(ap),c=col(ap.rssi);pts.push(p);
    L.circle(p,{radius:dist(ap.rssi,ap.freq),color:c,weight:1,fillColor:c,fillOpacity:.08}).addTo(layer);
    L.circleMarker(p,{radius:Math.max(6,14+ap.rssi/6),color:'#fff',weight:2,fillColor:c,fillOpacity:.95}).addTo(layer)
     .bindPopup('<b>'+esc(ap.ssid)+'</b><br>'+esc(ap.bssid)+'<br>'+ap.rssi+' dBm · Ch '+chan(ap.freq)+' ('+ap.freq+' MHz)<br>'+(ap.sec?'🔒 Secured':'🔓 Open')+'<br>~'+Math.round(dist(ap.rssi,ap.freq))+' m est. · '+ap.obs.length+' sample(s)')});
  if(fit&&pts.length)map.fitBounds(L.latLngBounds(pts).pad(.4),{maxZoom:18});
  $('#s1').textContent=a.length+' networks';$('#s2').textContent=db.scans+' scans';
  $('#list').innerHTML=a.length?a.map(ap=>'<div class="ap" tabindex="0" data-id="'+ap.bssid+'"><span class="dot" style="background:'+col(ap.rssi)+'"></span><div><b>'+esc(ap.ssid)+'</b><small>'+esc(ap.bssid)+' · Ch '+chan(ap.freq)+' · '+(ap.sec?'🔒':'🔓')+' · ~'+Math.round(dist(ap.rssi,ap.freq))+' m</small></div><span class="rs">'+ap.rssi+' dBm</span></div>').join(''):'<p class="sub">No networks yet — tap Scan now.</p>';
}
$('#list').onclick=e=>{const r=e.target.closest('.ap');if(!r)return;const ap=db.aps[r.dataset.id];map.flyTo(est(ap),18);$('#map').scrollIntoView({behavior:'smooth',block:'center'})};
$('#list').onkeydown=e=>{if(e.key==='Enter')e.target.click()};
['q','band','sort'].forEach(i=>$('#'+i).addEventListener('input',()=>render()));
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(db.user)setMe(...db.user);
render(true);
</script>
</body>
</html>
