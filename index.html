<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bridge — Language Converter</title>
<style>
  :root{
    --radius:14px;
    --dur:180ms;
  }
  html[data-theme="light"]{
    --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#EFEBE1; --ink:#16181D; --ink-dim:#5B5F68;
    --line:#DDD7C8; --accent:#0F6E5C; --accent-ink:#FFFFFF; --focus:#0F6E5C;
  }
  html[data-theme="dark"]{
    --bg:#14161A; --surface:#1D2027; --surface-2:#252932; --ink:#E9E7E1; --ink-dim:#9A9DA6;
    --line:#31353F; --accent:#3ED9B0; --accent-ink:#08211B; --focus:#3ED9B0;
  }
  html[data-theme="oled"]{
    --bg:#000000; --surface:#0A0A0A; --surface-2:#141414; --ink:#EDEDED; --ink-dim:#8C8C8C;
    --line:#242424; --accent:#3ED9B0; --accent-ink:#000000; --focus:#3ED9B0;
  }
  html[data-theme="hc"]{
    --bg:#000000; --surface:#000000; --surface-2:#000000; --ink:#FFFFFF; --ink-dim:#FFFFFF;
    --line:#FFFFFF; --accent:#FFEB00; --accent-ink:#000000; --focus:#FFEB00;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    transition:background var(--dur) ease, color var(--dur) ease;
  }
  .app{flex:1; width:100%; max-width:640px; margin:0 auto; padding:20px 16px 12px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{display:flex; align-items:flex-end; gap:3px; height:26px;}
  .brand-mark i{display:block; width:4px; background:var(--accent); border-radius:2px; animation:pulse 1.6s ease-in-out infinite;}
  .brand-mark i:nth-child(1){height:10px; animation-delay:0s;}
  .brand-mark i:nth-child(2){height:22px; animation-delay:.2s;}
  .brand-mark i:nth-child(3){height:14px; animation-delay:.4s;}
  @keyframes pulse{0%,100%{transform:scaleY(.5);}50%{transform:scaleY(1);}}
  .brand-text h1{font-size:1.3rem; margin:0; letter-spacing:.01em;}
  .brand-text p{margin:0; font-size:.72rem; color:var(--ink-dim);}

  .theme-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); color:var(--ink);
    border:1.5px solid var(--line); border-radius:999px; padding:7px 12px; font-size:.75rem;
    cursor:pointer; font-weight:600;
  }
  .theme-btn svg{width:15px; height:15px; stroke:var(--accent); flex-shrink:0;}

  .card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:14px;
  }
  html[data-theme="hc"] .card, html[data-theme="hc"] .theme-btn{border-width:2px;}

  .lang-row{display:flex; align-items:center; gap:8px;}
  .search-row{display:flex; gap:8px; margin-bottom:6px;}
  .lang-search{width:100%; min-width:0; background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; font-size:.75rem;}
  .search-spacer{width:38px; flex-shrink:0;}
  .lang-field{display:flex; align-items:center; gap:4px; flex:1; min-width:0;}
  .star-btn{background:none; border:none; font-size:1.05rem; line-height:1; cursor:pointer; color:var(--ink-dim); flex-shrink:0; padding:2px;}
  .star-btn.active{color:var(--accent);}
  .detect-row{display:flex; align-items:center; gap:6px; margin-top:-4px; font-size:.72rem; color:var(--ink-dim);}
  .detect-row input{accent-color:var(--accent);}
  select{
    flex:1; min-width:0; background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line);
    border-radius:10px; padding:10px 8px; font-size:.85rem; font-weight:600; appearance:none;
  }
  .swap-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform var(--dur) ease;
  }
  .swap-btn svg{width:17px; height:17px; stroke:var(--accent);}
  .swap-btn.spin{transform:rotate(180deg);}

  .panels{display:flex; flex-direction:column; gap:10px;}
  .panel{background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;}
  textarea{
    width:100%; min-height:96px; resize:vertical; border:none; background:transparent; color:var(--ink);
    font-size:1rem; font-family:inherit; outline:none; padding:0;
  }
  textarea::placeholder{color:var(--ink-dim);}
  .output{min-height:96px; font-size:1rem; line-height:1.45; white-space:pre-wrap; word-break:break-word;}
  .panel-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:.72rem; color:var(--ink-dim);}
  .icon-btn{background:none; border:none; color:var(--accent); cursor:pointer; padding:3px; display:flex; align-items:center; justify-content:center; border-radius:6px;}
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn:disabled{color:var(--ink-dim); cursor:not-allowed; opacity:.5;}
  .icon-btn.listening{animation:mic-pulse 1s ease-in-out infinite;}
  @keyframes mic-pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .foot-actions{display:flex; align-items:center; gap:10px; position:relative;}
  .panel.drop-active{outline:2px dashed var(--accent); outline-offset:2px;}
  .file-input{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;}
  .thumb-row{display:none; align-items:center; gap:8px; margin-bottom:8px;}
  .thumb-row.show{display:flex;}
  .thumb-row img{width:34px; height:34px; object-fit:cover; border-radius:6px; border:1.5px solid var(--line);}
  .thumb-row span{font-size:.72rem; color:var(--ink-dim); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .thumb-row button{background:none; border:none; color:var(--ink-dim); font-size:1rem; cursor:pointer; line-height:1;}

  .wave{display:flex; align-items:center; justify-content:center; gap:4px; height:16px;}
  .wave span{width:3px; height:5px; background:var(--line); border-radius:2px; transition:background var(--dur) ease;}
  .wave.active span{background:var(--accent); animation:bounce .9s ease-in-out infinite;}
  .wave span:nth-child(1){animation-delay:0s;} .wave span:nth-child(2){animation-delay:.1s;}
  .wave span:nth-child(3){animation-delay:.2s;} .wave span:nth-child(4){animation-delay:.3s;}
  .wave span:nth-child(5){animation-delay:.4s;}
  @keyframes bounce{0%,100%{height:5px;}50%{height:16px;}}

  .primary-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:13px; font-size:.95rem; font-weight:700; cursor:pointer; letter-spacing:.01em;
  }
  .primary-btn:disabled{opacity:.5; cursor:not-allowed;}

  .formality-row{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.7rem; color:var(--ink-dim);}
  .seg-toggle{display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; flex-shrink:0;}
  .seg-btn{background:var(--surface-2); color:var(--ink-dim); border:none; padding:6px 10px; font-size:.7rem; font-weight:700; cursor:pointer;}
  .seg-btn.active{background:var(--accent); color:var(--accent-ink);}

  .spell-box, .alt-box{display:none; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .spell-box.show, .alt-box.show{display:flex;}
  .spell-chip, .alt-chip{background:var(--surface); border:1.5px solid var(--accent); color:var(--accent); font-size:.68rem; padding:4px 9px; border-radius:999px; cursor:pointer; font-weight:600;}
  .phonetic{font-size:.8rem; color:var(--ink-dim); font-style:italic; margin-top:4px;}
  .def-box{display:none; font-size:.74rem; color:var(--ink-dim); line-height:1.5; margin-top:8px; border-top:1px solid var(--line); padding-top:8px;}
  .def-box.show{display:block;}
  .def-box b{color:var(--ink);}

  button:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2.5px solid var(--focus); outline-offset:2px;
  }

  .site-footer{
    display:flex; align-items:center; justify-content:center; text-align:center;
    min-height:52px; padding:10px 16px; border-top:1.5px solid var(--line); color:var(--ink-dim); font-size:.72rem;
  }
  .site-footer p{margin:0;}

  @media (min-width:560px){
    .panels{flex-direction:row; align-items:stretch;}
    .panel{flex:1;}
    .wave{flex-direction:column; height:auto; width:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    .brand-mark i, .wave span, .swap-btn{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="brand-text">
        <h1>Bridge</h1>
        <p>Translate across languages, instantly</p>
      </div>
    </div>
    <button id="themeBtn" class="theme-btn" type="button" aria-label="Change theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
      <span id="themeLabel">Light</span>
    </button>
  </header>

  <main class="card">
    <div class="search-row">
      <input id="fromSearch" class="lang-search" type="text" placeholder="Search language…" autocomplete="off" aria-label="Search source language">
      <span class="search-spacer" aria-hidden="true"></span>
      <input id="toSearch" class="lang-search" type="text" placeholder="Search language…" autocomplete="off" aria-label="Search target language">
    </div>
    <div class="lang-row">
      <div class="lang-field">
        <select id="fromLang" aria-label="Translate from"></select>
        <button id="fromFav" class="star-btn" type="button" aria-label="Favorite this language" title="Favorite">☆</button>
      </div>
      <button id="swapBtn" class="swap-btn" type="button" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10h13l-4-4"></path><path d="M17 14H4l4 4"></path></svg>
      </button>
      <div class="lang-field">
        <select id="toLang" aria-label="Translate to"></select>
        <button id="toFav" class="star-btn" type="button" aria-label="Favorite this language" title="Favorite">☆</button>
      </div>
    </div>
    <label class="detect-row"><input type="checkbox" id="autoDetect"> Auto-detect source language</label>

    <div class="panels">
      <div class="panel" id="sourcePanel">
        <div id="thumbRow" class="thumb-row">
          <img id="thumbImg" alt="Uploaded image preview">
          <span id="thumbName"></span>
          <button id="thumbClear" type="button" aria-label="Remove image">✕</button>
        </div>
        <textarea id="sourceText" placeholder="Type, paste, speak, or drop an image…" maxlength="500"></textarea>
        <div id="spellBox" class="spell-box"></div>
        <div class="panel-foot">
          <div class="foot-actions">
            <button id="clearBtn" class="icon-btn" type="button" aria-label="Clear text" title="Clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>
            </button>
            <button id="pasteBtn" class="icon-btn" type="button" aria-label="Paste from clipboard" title="Paste">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="16" rx="2"></rect><path d="M9 4V3h6v1"></path></svg>
            </button>
            <button id="micBtn" class="icon-btn" type="button" aria-label="Speak to translate" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
            </button>
            <button id="spellBtn" class="icon-btn" type="button" aria-label="Check spelling and grammar" title="Check spelling">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            </button>
            <button id="imageBtn" class="icon-btn" type="button" aria-label="Upload images" title="Upload image(s)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5.5-5.5L5 21"></path></svg>
            </button>
            <input id="imageInput" class="file-input" type="file" accept="image/*" multiple>
          </div>
          <span id="charCount" class="count">0 words · 0/500</span>
        </div>
      </div>

      <div class="wave" id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

      <div class="panel">
        <div id="outputText" class="output" aria-live="polite"></div>
        <div id="phoneticText" class="phonetic"></div>
        <div id="altBox" class="alt-box"></div>
        <div id="defBox" class="def-box"></div>
        <div class="panel-foot">
          <div class="foot-actions">
            <button id="copyBtn" class="icon-btn" type="button" aria-label="Copy translation" title="Copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
            </button>
            <button id="speakBtn" class="icon-btn" type="button" aria-label="Read translation aloud" title="Listen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"></path><path d="M16 8a5 5 0 0 1 0 8"></path></svg>
            </button>
          </div>
          <span id="statusMsg" class="status"></span>
        </div>
      </div>
    </div>

    <div class="formality-row">
      <span>Tone (best-effort, EU languages)</span>
      <div class="seg-toggle" role="group" aria-label="Formality">
        <button id="informalBtn" class="seg-btn active" type="button">Informal</button>
        <button id="formalBtn" class="seg-btn" type="button">Formal</button>
      </div>
    </div>
    <button id="translateBtn" class="primary-btn" type="button">Translate</button>
  </main>
</div>

<footer class="site-footer">
  <p>© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/transliteration@2/dist/browser/bundle.umd.min.js"></script>
<script>
  var INDIAN_LANGS = [
    ["as","Assamese"],["bn","Bengali"],["brx","Bodo"],["doi","Dogri"],["gu","Gujarati"],
    ["hi","Hindi"],["kn","Kannada"],["ks","Kashmiri"],["kok","Konkani"],["mai","Maithili"],
    ["ml","Malayalam"],["mni","Manipuri (Meitei)"],["mr","Marathi"],["ne","Nepali"],["or","Odia"],
    ["pa","Punjabi"],["sa","Sanskrit"],["sat","Santali"],["sd","Sindhi"],["ta","Tamil"],
    ["te","Telugu"],["ur","Urdu"]
  ];
  var WORLD_LANGS = [
    ["en","English"],["zh-CN","Mandarin Chinese"],["hi","Hindi"],["es","Spanish"],["fr","French"],
    ["ar","Arabic"],["bn","Bengali"],["pt","Portuguese"],["ru","Russian"],["ur","Urdu"],
    ["id","Indonesian"],["de","German"],["ja","Japanese"],["sw","Swahili"],["mr","Marathi"],
    ["te","Telugu"],["tr","Turkish"],["ta","Tamil"],["yue","Cantonese"],["vi","Vietnamese"],
    ["ko","Korean"],["it","Italian"],["fa","Persian"],["jv","Javanese"],["gu","Gujarati"],
    ["pl","Polish"],["uk","Ukrainian"],["ml","Malayalam"],["kn","Kannada"],["th","Thai"],
    ["my","Burmese"],["am","Amharic"],["pa","Punjabi"],["su","Sundanese"],["ro","Romanian"],
    ["nl","Dutch"],["so","Somali"],["ha","Hausa"],["ms","Malay"],["uz","Uzbek"],
    ["ig","Igbo"],["yo","Yoruba"],["zu","Zulu"],["xh","Xhosa"],["el","Greek"],
    ["cs","Czech"],["hu","Hungarian"],["sv","Swedish"],["tl","Filipino"],["he","Hebrew"]
  ];
  var indianCodes = INDIAN_LANGS.map(function(l){ return l[0]; });
  var WORLD_ONLY = WORLD_LANGS.filter(function(l){ return indianCodes.indexOf(l[0]) === -1; });

  var fromLang = document.getElementById('fromLang');
  var toLang = document.getElementById('toLang');
  var sourceText = document.getElementById('sourceText');
  var outputText = document.getElementById('outputText');
  var translateBtn = document.getElementById('translateBtn');
  var swapBtn = document.getElementById('swapBtn');
  var clearBtn = document.getElementById('clearBtn');
  var copyBtn = document.getElementById('copyBtn');
  var charCount = document.getElementById('charCount');
  var statusMsg = document.getElementById('statusMsg');
  var wave = document.getElementById('wave');
  var imageInput = document.getElementById('imageInput');
  var imageBtn = document.getElementById('imageBtn');
  var thumbRow = document.getElementById('thumbRow');
  var thumbImg = document.getElementById('thumbImg');
  var thumbName = document.getElementById('thumbName');
  var thumbClear = document.getElementById('thumbClear');
  var sourcePanel = document.getElementById('sourcePanel');
  var autoDetect = document.getElementById('autoDetect');
  var pasteBtn = document.getElementById('pasteBtn');
  var micBtn = document.getElementById('micBtn');
  var speakBtn = document.getElementById('speakBtn');
  var fromSearch = document.getElementById('fromSearch');
  var toSearch = document.getElementById('toSearch');
  var fromFav = document.getElementById('fromFav');
  var toFav = document.getElementById('toFav');
  var spellBtn = document.getElementById('spellBtn');
  var spellBox = document.getElementById('spellBox');
  var altBox = document.getElementById('altBox');
  var defBox = document.getElementById('defBox');
  var phoneticText = document.getElementById('phoneticText');
  var informalBtn = document.getElementById('informalBtn');
  var formalBtn = document.getElementById('formalBtn');
  var themeBtn = document.getElementById('themeBtn');
  var themeIcon = document.getElementById('themeIcon');
  var themeLabel = document.getElementById('themeLabel');

  var favCodes = [];
  var recentCodes = [];
  var ALL_LANGS_MAP = {};
  INDIAN_LANGS.concat(WORLD_LANGS).forEach(function(l){ ALL_LANGS_MAP[l[0]] = l[1]; });
  function langName(code){ return ALL_LANGS_MAP[code] || code; }

  function buildGroup(select, label, list){
    if(!list.length) return;
    var group = document.createElement('optgroup');
    group.label = label;
    list.forEach(function(l){
      var opt = document.createElement('option');
      opt.value = l[0]; opt.textContent = l[1];
      group.appendChild(opt);
    });
    select.appendChild(group);
  }
  function matchesQuery(l, q){
    if(!q) return true;
    return l[1].toLowerCase().indexOf(q) !== -1 || l[0].toLowerCase() === q;
  }
  function renderLangSelect(select, query){
    var q = (query || '').trim().toLowerCase();
    var prev = select.value;
    select.innerHTML = '';
    var favList = favCodes.filter(function(c){ return matchesQuery([c, langName(c)], q); }).map(function(c){ return [c, langName(c)]; });
    var recentList = recentCodes.filter(function(c){ return favCodes.indexOf(c) === -1 && matchesQuery([c, langName(c)], q); }).map(function(c){ return [c, langName(c)]; });
    buildGroup(select, '★ Favorites', favList);
    buildGroup(select, '🕓 Recent', recentList);
    buildGroup(select, 'Indian Official Languages', INDIAN_LANGS.filter(function(l){ return matchesQuery(l, q); }));
    buildGroup(select, 'World Languages', WORLD_ONLY.filter(function(l){ return matchesQuery(l, q); }));
    if(select.querySelector('option[value="' + prev + '"]')) select.value = prev;
    else if(select.options.length) select.selectedIndex = 0;
  }
  function renderBothSelects(){
    renderLangSelect(fromLang, fromSearch.value);
    renderLangSelect(toLang, toSearch.value);
    updateStars();
  }
  function updateStars(){
    fromFav.classList.toggle('active', favCodes.indexOf(fromLang.value) !== -1);
    fromFav.textContent = favCodes.indexOf(fromLang.value) !== -1 ? '★' : '☆';
    toFav.classList.toggle('active', favCodes.indexOf(toLang.value) !== -1);
    toFav.textContent = favCodes.indexOf(toLang.value) !== -1 ? '★' : '☆';
  }
  function addRecent(code){
    recentCodes = recentCodes.filter(function(c){ return c !== code; });
    recentCodes.unshift(code);
    if(recentCodes.length > 6) recentCodes.length = 6;
  }

  renderBothSelects();
  fromLang.value = 'en';
  toLang.value = 'hi';
  updateStars();

  fromSearch.addEventListener('input', function(){ renderLangSelect(fromLang, fromSearch.value); updateStars(); });
  toSearch.addEventListener('input', function(){ renderLangSelect(toLang, toSearch.value); updateStars(); });
  fromFav.addEventListener('click', function(){
    var c = fromLang.value;
    var i = favCodes.indexOf(c);
    if(i === -1) favCodes.push(c); else favCodes.splice(i, 1);
    renderBothSelects();
  });
  toFav.addEventListener('click', function(){
    var c = toLang.value;
    var i = favCodes.indexOf(c);
    if(i === -1) favCodes.push(c); else favCodes.splice(i, 1);
    renderBothSelects();
  });

  var OCR_LANGS = {
    en:'eng', es:'spa', fr:'fra', de:'deu', it:'ita', pt:'por', ru:'rus', 'zh-CN':'chi_sim', yue:'chi_tra',
    ja:'jpn', ko:'kor', ar:'ara', tr:'tur', vi:'vie', th:'tha', nl:'nld', pl:'pol', sv:'swe', el:'ell',
    he:'heb', id:'ind', ms:'msa', uk:'ukr', cs:'ces', ro:'ron', hu:'hun', fa:'fas', sw:'swa', jv:'jav',
    my:'mya', am:'amh', su:'sun', uz:'uzb', yo:'yor', tl:'fil',
    as:'asm', bn:'ben', gu:'guj', hi:'hin', kn:'kan', ml:'mal', mr:'mar', ne:'nep', or:'ori',
    pa:'pan', sa:'san', sd:'snd', ta:'tam', te:'tel', ur:'urd'
  };
  var SPEECH_LANGS = {
    en:'en-US', es:'es-ES', fr:'fr-FR', de:'de-DE', it:'it-IT', pt:'pt-PT', ru:'ru-RU', 'zh-CN':'zh-CN', yue:'zh-HK',
    ja:'ja-JP', ko:'ko-KR', ar:'ar-SA', tr:'tr-TR', vi:'vi-VN', th:'th-TH', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE',
    el:'el-GR', he:'he-IL', id:'id-ID', ms:'ms-MY', uk:'uk-UA', cs:'cs-CZ', ro:'ro-RO', hu:'hu-HU', fa:'fa-IR',
    sw:'sw-KE', jv:'jv-ID', my:'my-MM', am:'am-ET', su:'su-ID', uz:'uz-UZ', yo:'yo-NG', tl:'fil-PH',
    so:'so-SO', ha:'ha-NG', ig:'ig-NG', zu:'zu-ZA', xh:'xh-ZA',
    as:'as-IN', bn:'bn-IN', gu:'gu-IN', hi:'hi-IN', kn:'kn-IN', ml:'ml-IN', mr:'mr-IN', ne:'ne-NP',
    or:'or-IN', pa:'pa-IN', ta:'ta-IN', te:'te-IN', ur:'ur-IN'
  };
  var SPELLCHECK_LANGS = {
    en:'en-US', es:'es', fr:'fr', de:'de-DE', pt:'pt-PT', it:'it', nl:'nl', pl:'pl-PL', ru:'ru-RU',
    uk:'uk-UA', el:'el-GR', ro:'ro-RO', da:'da-DK', fa:'fa', ar:'ar', ja:'ja-JP', 'zh-CN':'zh-CN', tl:'tl-PH'
  };
  var SCRIPT_TESTS = [
    [/[\u4e00-\u9fff]/, 'zh-CN'], [/[\u3040-\u30ff]/, 'ja'], [/[\uac00-\ud7af]/, 'ko'],
    [/[\u0600-\u06ff]/, 'ar'], [/[\u0590-\u05ff]/, 'he'], [/[\u0400-\u04ff]/, 'ru'],
    [/[\u0370-\u03ff]/, 'el'], [/[\u0e00-\u0e7f]/, 'th'], [/[\u0900-\u097f]/, 'hi'],
    [/[\u0980-\u09ff]/, 'bn']
  ];
  var STOPWORDS = {
    en:['the','and','is','you','are','to','of','in'], es:['el','la','de','que','y','los','es','en'],
    fr:['le','la','de','et','les','est','vous','pour'], de:['der','die','und','das','ist','nicht','ich','du'],
    it:['il','la','di','che','è','per','non','un'], pt:['o','a','de','que','é','para','não','um'],
    nl:['de','het','en','een','van','is','niet','je']
  };
  function detectLanguage(text){
    text = text.trim();
    if(!text) return null;
    for(var i=0;i<SCRIPT_TESTS.length;i++){ if(SCRIPT_TESTS[i][0].test(text)) return SCRIPT_TESTS[i][1]; }
    var words = text.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
    var best = null, bestScore = 0;
    Object.keys(STOPWORDS).forEach(function(lang){
      var score = words.filter(function(w){ return STOPWORDS[lang].indexOf(w) !== -1; }).length;
      if(score > bestScore){ bestScore = score; best = lang; }
    });
    return best || 'en';
  }

  document.getElementById('year').textContent = new Date().getFullYear();

  var ICONS = {
    sun:'<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>',
    moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>',
    oled:'<circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path>',
    hc:'<circle cx="12" cy="12" r="9"></circle><path d="M12 6v12"></path><path d="M6 12h12"></path>'
  };
  var THEMES = [
    {key:'dark', label:'Dark', icon:'moon'},
    {key:'light', label:'Light', icon:'sun'},
    {key:'oled', label:'OLED', icon:'oled'},
    {key:'hc', label:'High Contrast', icon:'hc'}
  ];
  var themeIndex = 0;

  function applyTheme(i){
    themeIndex = i;
    var t = THEMES[i];
    document.documentElement.setAttribute('data-theme', t.key);
    themeIcon.innerHTML = ICONS[t.icon];
    themeLabel.textContent = t.label;
  }
  themeBtn.addEventListener('click', function(){
    applyTheme((themeIndex + 1) % THEMES.length);
  });
  applyTheme(0);

  function updateCount(){
    var v = sourceText.value;
    var words = v.trim() ? v.trim().split(/\s+/).length : 0;
    charCount.textContent = words + ' words · ' + v.length + '/500';
  }

  sourceText.addEventListener('input', function(){
    updateCount();
    scheduleTranslate();
  });
  clearBtn.addEventListener('click', function(){
    sourceText.value = '';
    outputText.textContent = '';
    updateCount();
    statusMsg.textContent = '';
    sourceText.focus();
  });
  copyBtn.addEventListener('click', function(){
    var text = outputText.textContent;
    if(!text) return;
    navigator.clipboard.writeText(text).then(function(){
      statusMsg.textContent = 'Copied';
      setTimeout(function(){ statusMsg.textContent = ''; }, 1500);
    });
  });
  swapBtn.addEventListener('click', function(){
    swapBtn.classList.add('spin');
    setTimeout(function(){ swapBtn.classList.remove('spin'); }, 220);
    var f = fromLang.value; fromLang.value = toLang.value; toLang.value = f;
    updateStars();
    var out = outputText.textContent;
    if(out){ sourceText.value = out; updateCount(); }
    doTranslate();
  });
  var currentImgUrl = null;

  function handleFiles(files){
    files = Array.prototype.filter.call(files, function(f){ return f.type.indexOf('image/') === 0; });
    if(!files.length) return;
    if(currentImgUrl) URL.revokeObjectURL(currentImgUrl);
    currentImgUrl = URL.createObjectURL(files[0]);
    thumbImg.src = currentImgUrl;
    thumbName.textContent = files.length > 1 ? files[0].name + ' +' + (files.length - 1) + ' more' : files[0].name;
    thumbRow.classList.add('show');
    setLoading(true);

    var ocrLang = OCR_LANGS[fromLang.value] || 'eng';
    var results = [];
    var chain = Promise.resolve();
    files.forEach(function(file, idx){
      chain = chain.then(function(){
        statusMsg.textContent = 'Reading image ' + (idx + 1) + ' of ' + files.length + '…';
        return Tesseract.recognize(file, ocrLang).then(function(res){
          var t = ((res.data && res.data.text) || '').trim();
          if(t) results.push(t);
        });
      });
    });
    chain
      .then(function(){
        var text = results.join('\n').slice(0, 500);
        sourceText.value = text;
        updateCount();
        if(text){ statusMsg.textContent = ''; doTranslate(); }
        else{ statusMsg.textContent = 'No text found in image.'; }
      })
      .catch(function(){
        statusMsg.textContent = 'Could not read image.';
      })
      .finally(function(){
        setLoading(false);
      });
  }

  imageBtn.addEventListener('click', function(){
    imageInput.click();
  });
  imageInput.addEventListener('change', function(e){
    handleFiles(e.target.files);
  });

  ['dragover','dragenter'].forEach(function(evt){
    sourcePanel.addEventListener(evt, function(e){ e.preventDefault(); sourcePanel.classList.add('drop-active'); });
  });
  ['dragleave','dragend'].forEach(function(evt){
    sourcePanel.addEventListener(evt, function(){ sourcePanel.classList.remove('drop-active'); });
  });
  sourcePanel.addEventListener('drop', function(e){
    e.preventDefault();
    sourcePanel.classList.remove('drop-active');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){ handleFiles(e.dataTransfer.files); }
  });

  thumbClear.addEventListener('click', function(){
    if(currentImgUrl) URL.revokeObjectURL(currentImgUrl);
    currentImgUrl = null;
    imageInput.value = '';
    thumbRow.classList.remove('show');
  });

  pasteBtn.addEventListener('click', function(){
    if(!navigator.clipboard || !navigator.clipboard.readText){
      statusMsg.textContent = 'Clipboard access unavailable.'; return;
    }
    navigator.clipboard.readText().then(function(text){
      if(!text) return;
      sourceText.value = text.slice(0, 500);
      updateCount();
      doTranslate();
    }).catch(function(){
      statusMsg.textContent = 'Could not read clipboard.';
    });
  });

  spellBtn.addEventListener('click', function(){
    var text = sourceText.value;
    spellBox.innerHTML = ''; spellBox.classList.remove('show');
    var ltLang = SPELLCHECK_LANGS[fromLang.value];
    if(!text.trim()){ return; }
    if(!ltLang){ statusMsg.textContent = 'Spell check unavailable for this language.'; return; }
    statusMsg.textContent = 'Checking…';
    fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: 'text=' + encodeURIComponent(text) + '&language=' + ltLang
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        statusMsg.textContent = '';
        var matches = (data && data.matches) || [];
        if(!matches.length){ statusMsg.textContent = 'No issues found.'; return; }
        matches.slice(0, 6).forEach(function(m){
          var suggestion = m.replacements && m.replacements[0] && m.replacements[0].value;
          var chip = document.createElement('button');
          chip.type = 'button'; chip.className = 'spell-chip';
          chip.textContent = suggestion ? (text.substr(m.offset, m.length) + ' → ' + suggestion) : m.message;
          if(suggestion){
            chip.addEventListener('click', function(){
              sourceText.value = text.substring(0, m.offset) + suggestion + text.substring(m.offset + m.length);
              text = sourceText.value;
              updateCount();
              chip.remove();
              if(!spellBox.children.length) spellBox.classList.remove('show');
            });
          }
          spellBox.appendChild(chip);
        });
        if(spellBox.children.length) spellBox.classList.add('show');
      })
      .catch(function(){
        statusMsg.textContent = 'Spell check unavailable right now.';
      });
  });

  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizer = null, listening = false;
  if(!SpeechRec){ micBtn.disabled = true; micBtn.title = 'Voice input not supported in this browser'; }
  micBtn.addEventListener('click', function(){
    if(!SpeechRec) return;
    if(listening){ recognizer && recognizer.stop(); return; }
    recognizer = new SpeechRec();
    recognizer.lang = SPEECH_LANGS[fromLang.value] || 'en-US';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onstart = function(){ listening = true; micBtn.classList.add('listening'); statusMsg.textContent = 'Listening…'; };
    recognizer.onresult = function(e){
      var transcript = e.results[0][0].transcript;
      sourceText.value = transcript.slice(0, 500);
      updateCount();
      doTranslate();
    };
    recognizer.onerror = function(){ statusMsg.textContent = 'Could not hear you clearly.'; };
    recognizer.onend = function(){ listening = false; micBtn.classList.remove('listening'); if(statusMsg.textContent === 'Listening…') statusMsg.textContent = ''; };
    recognizer.start();
  });

  if(!('speechSynthesis' in window)){ speakBtn.disabled = true; speakBtn.title = 'Speech playback not supported'; }
  speakBtn.addEventListener('click', function(){
    var text = outputText.textContent;
    if(!text || !('speechSynthesis' in window)) return;
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEECH_LANGS[toLang.value] || 'en-US';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  });

  fromLang.addEventListener('change', function(){ updateStars(); doTranslate(); });
  toLang.addEventListener('change', function(){ updateStars(); doTranslate(); });
  translateBtn.addEventListener('click', doTranslate);

  var debounceId;
  var LATIN_CODES = ['en','es','fr','de','it','pt','nl','id','ms','sw','tr','vi','pl','cs','hu','ro',
    'sv','uz','tl','su','jv','ha','yo','ig','zu','xh','so'];

  var FORMALITY_RULES = {
    fr: [[/\bt'es\b/gi,"vous êtes"],[/\btu\b/gi,'vous'],[/\bton\b/gi,'votre'],[/\bta\b/gi,'votre'],[/\btes\b/gi,'vos']],
    de: [[/\bdu\b/gi,'Sie'],[/\bdich\b/gi,'Sie'],[/\bdir\b/gi,'Ihnen'],[/\bdein\b/gi,'Ihr'],[/\bdeine\b/gi,'Ihre']],
    es: [[/\btú\b/gi,'usted'],[/\btu\b/gi,'su'],[/\btus\b/gi,'sus']],
    it: [[/\btu\b/gi,'Lei'],[/\btuo\b/gi,'Suo'],[/\btua\b/gi,'Sua']],
    pt: [[/\bvocê\b/gi,'o senhor'],[/\bteu\b/gi,'seu'],[/\btua\b/gi,'sua']],
    nl: [[/\bje\b/gi,'u'],[/\bjij\b/gi,'u'],[/\bjouw\b/gi,'uw']]
  };
  var formalMode = false;
  informalBtn.addEventListener('click', function(){
    formalMode = false; informalBtn.classList.add('active'); formalBtn.classList.remove('active'); doTranslate();
  });
  formalBtn.addEventListener('click', function(){
    formalMode = true; formalBtn.classList.add('active'); informalBtn.classList.remove('active'); doTranslate();
  });
  function applyFormality(text, code){
    var rules = FORMALITY_RULES[code];
    if(!formalMode || !rules) return text;
    rules.forEach(function(r){ text = text.replace(r[0], r[1]); });
    return text;
  }

  function renderAlternatives(matches, primary){
    altBox.innerHTML = ''; altBox.classList.remove('show');
    if(!matches || !matches.length) return;
    var seen = {}; seen[primary.trim().toLowerCase()] = true;
    var alts = [];
    matches.forEach(function(m){
      var t = (m.translation || '').trim();
      var key = t.toLowerCase();
      if(t && !seen[key]){ seen[key] = true; alts.push(t); }
    });
    alts = alts.slice(0, 3);
    if(!alts.length) return;
    alts.forEach(function(a){
      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'alt-chip'; chip.textContent = a;
      chip.addEventListener('click', function(){
        outputText.textContent = a;
        renderPhonetic(a, toLang.value);
      });
      altBox.appendChild(chip);
    });
    altBox.classList.add('show');
  }

  function renderPhonetic(text, code){
    phoneticText.textContent = '';
    if(!text || LATIN_CODES.indexOf(code) !== -1 || typeof transliterate !== 'function') return;
    try{
      var romanized = transliterate(text);
      if(romanized && romanized.trim().toLowerCase() !== text.trim().toLowerCase()){
        phoneticText.textContent = romanized;
      }
    }catch(e){}
  }

  function renderDefinitions(word, code){
    defBox.innerHTML = ''; defBox.classList.remove('show');
    if(code !== 'en' || !word || /\s/.test(word)) return;
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if(!data || !data[0] || !data[0].meanings) return;
        var html = '';
        data[0].meanings.slice(0, 2).forEach(function(m){
          var def = m.definitions && m.definitions[0];
          if(!def) return;
          html += '<div><b>' + m.partOfSpeech + '</b> — ' + def.definition + '</div>';
          if(m.synonyms && m.synonyms.length){
            html += '<div>Synonyms: ' + m.synonyms.slice(0, 5).join(', ') + '</div>';
          }
        });
        if(html){ defBox.innerHTML = html; defBox.classList.add('show'); }
      })
      .catch(function(){});
  }

  function scheduleTranslate(){
    clearTimeout(debounceId);
    debounceId = setTimeout(doTranslate, 700);
  }

  function setLoading(on){
    wave.classList.toggle('active', on);
    translateBtn.disabled = on;
  }

  function doTranslate(){
    var text = sourceText.value.trim();
    statusMsg.textContent = '';
    altBox.classList.remove('show'); altBox.innerHTML = '';
    defBox.classList.remove('show'); defBox.innerHTML = '';
    phoneticText.textContent = '';
    if(!text){ outputText.textContent = ''; return; }
    var from = fromLang.value;
    if(autoDetect.checked){
      var detected = detectLanguage(text);
      if(detected){ from = detected; fromLang.value = detected; updateStars(); }
    }
    var to = toLang.value;
    if(from === to){
      var same = applyFormality(text, to);
      outputText.textContent = same;
      renderPhonetic(same, to);
      return;
    }

    setLoading(true);
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;

    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        var translated = data && data.responseData && data.responseData.translatedText;
        if(translated){
          translated = applyFormality(translated, to);
          outputText.textContent = translated;
          renderPhonetic(translated, to);
          renderAlternatives(data.matches, translated);
          renderDefinitions(text, from);
          addRecent(from); addRecent(to);
          renderBothSelects();
        }
        else { statusMsg.textContent = 'No translation found.'; }
      })
      .catch(function(){
        statusMsg.textContent = 'Connection error. Try again.';
      })
      .finally(function(){
        setLoading(false);
      });
  }
</script>
</body>
</html>
