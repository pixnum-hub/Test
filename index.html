<style>
:root{
  --bg:#FBF3E3; --surface:#FFF9EE; --text:#2B1608; --muted:#7A5A3A;
  --accent:#C1440E; --gold:#B8860B; --line:rgba(193,68,14,.25); --shadow:rgba(43,22,8,.12);
  --verse-scale:1;
}
[data-theme="dark"]{
  --bg:#1B120A; --surface:#241A10; --text:#F1E4C9; --muted:#C9AE84;
  --accent:#FF7A3D; --gold:#E8B84B; --line:rgba(255,122,61,.3); --shadow:rgba(0,0,0,.4);
}
[data-theme="oled"]{
  --bg:#000000; --surface:#0A0A0A; --text:#EDE0C8; --muted:#B39D7A;
  --accent:#FF8A4C; --gold:#E8B84B; --line:rgba(255,138,76,.3); --shadow:rgba(0,0,0,.6);
}
[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --text:#FFFFFF; --muted:#FFFFFF;
  --accent:#FFD400; --gold:#FFD400; --line:#FFFFFF; --shadow:rgba(0,0,0,0);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
body{
  font-family:"Noto Serif",serif; min-height:100vh; display:flex; flex-direction:column;
  transition:background .3s,color .3s; padding-bottom:env(safe-area-inset-bottom);
}
[lang="hi"] .verse, [lang="hi"] .subtitle{font-family:"Noto Serif Devanagari","Kohinoor Devanagari","Mangal",serif;}
[lang="bn"] .verse, [lang="bn"] .subtitle{font-family:"Noto Serif Bengali","Vrinda","Siyam Rupali","Noto Sans Bengali",serif;}
[lang="hi"] h1{font-family:"Noto Serif Devanagari","Yatra One",cursive;}
[lang="bn"] h1{font-family:"Noto Serif Bengali","Yatra One",cursive;}
header{
  text-align:center; padding:28px 16px 14px; position:relative;
}
h1{
  font-family:"Yatra One",cursive; font-weight:400; font-size:clamp(2.2rem,9vw,3.2rem);
  margin:0; color:var(--accent); letter-spacing:.5px;
}
.subtitle{color:var(--muted); font-size:1rem; margin-top:4px; letter-spacing:1px; text-transform:uppercase;}
.divider{width:64px; height:3px; background:var(--gold); margin:14px auto; border-radius:2px;}
.controls{
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0 12px 18px;
}
.group{
  display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:4px; box-shadow:0 2px 8px var(--shadow);
}
.group button{
  border:none; background:transparent; color:var(--muted); font-size:1rem; font-weight:600;
  padding:9px 16px; border-radius:999px; cursor:pointer; transition:all .25s; font-family:inherit;
}
.group button.active{background:var(--accent); color:var(--bg);}
[data-theme="hc"] .group button.active{color:#000;}
main{
  flex:1; max-width:640px; width:100%; margin:0 auto; padding:0 16px 30px;
}
.doha{
  background:var(--surface); border-left:4px solid var(--gold); border-radius:8px;
  padding:18px 20px; margin:0 0 18px; box-shadow:0 2px 10px var(--shadow); font-style:italic;
}
.chaupai-list{list-style:none; margin:0; padding:0; counter-reset:v;}
.chaupai-list li{
  position:relative; padding:14px 16px 14px 46px; margin-bottom:10px; border-radius:8px;
  background:var(--surface); box-shadow:0 1px 6px var(--shadow); counter-increment:v;
}
.chaupai-list li::before{
  content:counter(v); position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--bg);
  font-size:.78rem; font-family:"Noto Serif",serif; display:flex; align-items:center; justify-content:center;
}
[data-theme="hc"] .chaupai-list li::before{color:#000;}
.verse{font-size:calc(1.18rem * var(--verse-scale)); line-height:1.8;}
footer{
  text-align:center; padding:18px 12px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); font-size:.9rem; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
footer strong{color:var(--accent);}
@media (min-width:480px){ .verse{font-size:calc(1.3rem * var(--verse-scale));} }
.sizeBtn{
  border:none; background:transparent; color:var(--muted); font-weight:700; cursor:pointer;
  padding:9px 14px; border-radius:999px; font-family:inherit; font-size:1rem;
}
.sizeBtn:first-child{font-size:.8rem;}
.sizeBtn:last-child{font-size:1.2rem;}
#speakGroup button{
  border:none; background:var(--accent); color:var(--bg); width:34px; height:34px; border-radius:50%;
  font-size:.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
  margin:0 2px;
}
[data-theme="hc"] #speakGroup button{color:#000;}
#teleGroup{ padding:8px 10px; gap:4px; }
#teleGroup #teleBtn{
  border:none; background:var(--accent); color:var(--bg); width:48px; height:48px; border-radius:50%;
  font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
  margin:0 4px;
}
[data-theme="hc"] #teleGroup #teleBtn{color:#000;}
#teleGroup .teleStep{
  border:none; background:var(--accent); color:var(--bg); width:42px; height:42px; border-radius:50%;
  font-size:1.2rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex:none; margin:0 6px;
}
[data-theme="hc"] #teleGroup .teleStep{color:#000;}
#teleSpeedVal{ font-size:1.05rem; font-weight:700; color:var(--text); min-width:44px; text-align:center; }
#installBtn{
  background:var(--accent) !important; color:var(--bg) !important; font-weight:700;
  padding:9px 18px !important; border-radius:999px;
}
[data-theme="hc"] #installBtn{color:#000 !important;}
#speechSettingsBtn{
  border:none; background:transparent; color:var(--muted); width:30px; height:30px; border-radius:50%;
  font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;
}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px;
  box-shadow:0 4px 14px var(--shadow); flex-basis:100%; width:100%; max-width:340px;
  display:flex; flex-direction:column; gap:8px; margin:0 auto;
}
.panelRow{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.panelLabel{ font-size:.85rem; color:var(--muted); font-weight:600; }
.miniGroup{ display:flex; background:var(--bg); border-radius:999px; padding:2px; }
.miniGroup button{
  border:none; background:transparent; color:var(--muted); font-size:.8rem; font-weight:600;
  padding:5px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
}
.miniGroup button.active{ background:var(--accent); color:var(--bg); }
[data-theme="hc"] .miniGroup button.active{ color:#000; }
.miniStep{
  border:none; background:var(--accent); color:var(--bg); width:26px; height:26px; border-radius:50%;
  font-size:.9rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
[data-theme="hc"] .miniStep{ color:#000; }
#rateVal, #pitchVal{ font-size:.85rem; font-weight:700; min-width:36px; text-align:center; }
</style>
</head>
<body data-theme="dark">
<header>
  <h1 id="title">হনূমা</h1>
  <div class="subtitle" id="subtitle">হনুমান চালিসা</div>
  <div class="divider"></div>
  <div class="controls">
    <div class="group" id="langGroup">
      <button data-lang="hi">हिंदी</button>
      <button data-lang="en">English</button>
      <button data-lang="bn" class="active">বাংলা</button>
    </div>
    <div class="group" id="themeGroup">
      <button data-theme="light">Light</button>
      <button data-theme="dark" class="active">Dark</button>
      <button data-theme="oled">OLED</button>
      <button data-theme="hc">HC</button>
    </div>
    <div class="group" id="sizeGroup">
      <button class="sizeBtn" data-step="-1" aria-label="Decrease text size">A−</button>
      <button class="sizeBtn" data-step="1" aria-label="Increase text size">A+</button>
    </div>
    <div class="group" id="speakGroup">
      <button id="speakBtn" aria-label="Speak mantra">🔊</button>
      <button id="speechSettingsBtn" aria-label="Speech settings">⚙</button>
    </div>
    <div id="speechPanel" class="panel" hidden>
      <div class="panelRow">
        <span class="panelLabel">Voice</span>
        <div class="miniGroup" id="voiceGenderGroup">
          <button data-gender="male" class="active">Male</button>
          <button data-gender="female">Female</button>
        </div>
      </div>
      <div class="panelRow">
        <span class="panelLabel">Speed</span>
        <button class="miniStep" data-target="rate" data-step="-0.05">−</button>
        <span id="rateVal">0.80</span>
        <button class="miniStep" data-target="rate" data-step="0.05">+</button>
      </div>
      <div class="panelRow">
        <span class="panelLabel">Pitch</span>
        <button class="miniStep" data-target="pitch" data-step="-0.05">−</button>
        <span id="pitchVal">0.92</span>
        <button class="miniStep" data-target="pitch" data-step="0.05">+</button>
      </div>
    </div>
    <div style="flex-basis:100%; height:0;"></div>
    <div class="group" id="teleGroup">
      <button id="teleBtn" aria-label="Toggle teleprompter">▶</button>
      <button class="teleStep" data-step="-0.1" aria-label="Decrease scroll speed">−</button>
      <span id="teleSpeedVal">1.0</span>
      <button class="teleStep" data-step="0.1" aria-label="Increase scroll speed">+</button>
    </div>
    <div class="group" id="installGroup" style="display:none;">
      <button id="installBtn">⬇ Install App</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer>
  <div>© <span id="year"></span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
</footer>

        "বিদ্যাবান গুণী অতি চাতুর। রাম কাজ করিবে কো আতুর॥",

        "লায় সজীবন লখন জিয়ায়ে। শ্রীরঘুবীর হরষি উর লায়ে॥",

        "সহস বদন তুমহারে জস গাবৈঁ। অস কহি শ্রীপতি কণ্ঠ লগাবৈঁ॥",
        "সনকাদিক ব্রহ্মাদি মুনীসা। নারদ সারদ সহিত অহীসা॥",
        "জম কুবের দিগপাল জহাঁ তে। কবি কোবিদ কহি সকে কহাঁ তে॥",
        "তুম উপকার সুগ্রীবহিঁ কীন্হা। রাম মিলায় রাজ পদ দীন্হা॥",
        "তুমহারে মন্ত্র বিভীষণ মানা। লঙ্কেস্বর ভয়ে সব জগ জানা॥",
        "যুগ সহস্র যোজন পর ভানূ। লীল্যো তাহি মধুর ফল জানূ॥",
        "প্রভু মুদ্রিকা মেলি মুখ মাহীঁ। জলধি লাঁঘি গয়ে অচরজ নাহীঁ॥",
        "দুর্গম কাজ জগৎ কে জেতে। সুগম অনুগ্রহ তুম্হরে তেতে॥",
        "রাম দুআরে তুম রখওয়ারে। হোত ন আজ্ঞা বিনু পৈসারে॥",
        "সব সুখ লহৈ তুমহারি সরনা। তুম রচ্ছক কাহূ কো ডরনা॥",
        "আপন তেজ সমহারে আপৈ। তীনোঁ লোক হাঁক তেঁ কাঁপৈ॥",
        "ভূত পিশাচ নিকট নহিঁ আবৈ। মহাবীর জব নাম সুনাবৈ॥",
        "নাসৈ রোগ হরৈ সব পীরা। জপত নিরন্তর হনুমত বীরা॥",
        "সংকট তেঁ হনুমান ছুড়াবৈ। মন ক্রম বচন ধ্যান জো লাবৈ॥",
        "সব পর রাম তপস্বী রাজা। তিন কে কাজ সকল তুম সাজা॥",
        "ঔর মনোরথ জো কোই লাবৈ। সোই অমিত জীবন ফল পাবৈ॥",
        "চারোঁ যুগ পরতাপ তুম্হারা। হৈ পরসিদ্ধ জগৎ উজিয়ারা॥",
        "সাধু সন্ত কে তুম রখওয়ারে। অসুর নিকন্দন রাম দুলারে॥",
        "অষ্ট সিদ্ধি নৌ নিধি কে দাতা। অস বর দীন জানকী মাতা॥",
        "রাম রসায়ন তুম্হরে পাসা। সদা রহো রঘুপতি কে দাসা॥",
        "তুম্হরে ভজন রাম কো পাবৈ। জনম জনম কে দুখ বিসরাবৈ॥",
        "অন্তকাল রঘুবর পুর জাই। জহাঁ জন্ম হরিভক্ত কহাই॥",
        "ঔর দেবতা চিত্ত ন ধরই। হনুমত সেই সর্ব সুখ করই॥",
        "সংকট কটৈ মিটৈ সব পীরা। জো সুমিরৈ হনুমত বলবীরা॥",
        "জয় জয় জয় হনুমান গোসাইঁ। কৃপা করহু গুরুদেব কী নাইঁ॥",
        "জো সত বার পাঠ কর কোই। ছূটহি বন্দি মহা সুখ হোই॥",
        "জো যহ পড়ে হনুমান চালীসা। হোয় সিদ্ধি সাখী গৌরীসা॥",
        "তুলসীদাস সদা হরি চেরা। কীজৈ নাথ হৃদয় মহঁ ডেরা॥"],
    df: "পবনতনয় সংকট হরন মঙ্গল মূরতি রূপ। রাম লখন সীতা সহিত হৃদয় বসহু সুর ভূপ॥"
  }
};
const TITLES = { hi:["हनुमान चालीसा","श्री हनुमान चालीसा"], en:["Hanuman Chalisa","Sri Hanuman Chalisa"], bn:["হনুমান চালিসা","শ্রী হনুমান চালিসা"] };
const APP_NAME = { hi:"हनुमा", en:"Hanuma", bn:"হনূমা" };

let lang = "bn";

function render(){
  const d = DATA[lang];
  const main = document.getElementById("main");
  let html = `<div class="doha verse">${d.d1}</div><div class="doha verse">${d.d2}</div><ol class="chaupai-list">`;
  d.c.forEach(v => html += `<li class="verse">${v}</li>`);
  html += `</ol><div class="doha verse">${d.df}</div>`;
  main.innerHTML = html;
  document.getElementById("title").textContent = APP_NAME[lang];
  document.getElementById("subtitle").textContent = TITLES[lang][0];
  document.documentElement.lang = lang;
}

document.getElementById("langGroup").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  lang = btn.dataset.lang;
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b===btn));
  if("speechSynthesis" in window) stopSpeak();
  render();
});

document.getElementById("themeGroup").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  document.body.setAttribute("data-theme", btn.dataset.theme);
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b===btn));
});

let verseScale = 1;
document.getElementById("sizeGroup").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  verseScale = Math.min(1.6, Math.max(0.75, verseScale + parseInt(btn.dataset.step) * 0.1));
  document.documentElement.style.setProperty("--verse-scale", verseScale);
});

document.getElementById("year").textContent = new Date().getFullYear();
render();

let teleRAF = null, teleSpeed = 1;
const teleBtn = document.getElementById("teleBtn");

function teleStep(){
  window.scrollBy(0, teleSpeed);
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 2;
  if(atBottom){ stopTele(); return; }
  teleRAF = requestAnimationFrame(teleStep);
}
function startTele(){ teleBtn.textContent = "⏸"; teleRAF = requestAnimationFrame(teleStep); }
function stopTele(){ teleBtn.textContent = "▶"; if(teleRAF) cancelAnimationFrame(teleRAF); teleRAF = null; }

teleBtn.addEventListener("click", () => { teleRAF ? stopTele() : startTele(); });
const teleSpeedVal = document.getElementById("teleSpeedVal");
document.querySelectorAll(".teleStep").forEach(btn => {
  btn.addEventListener("click", () => {
    teleSpeed = Math.min(3, Math.max(0.3, Math.round((teleSpeed + parseFloat(btn.dataset.step)) * 10) / 10));
    teleSpeedVal.textContent = teleSpeed.toFixed(1);
  });
});
["wheel","touchstart"].forEach(evt => window.addEventListener(evt, e => {
  if(teleRAF && !e.target.closest("#teleGroup")) stopTele();
}, {passive:true}));

const speakBtn = document.getElementById("speakBtn");
const voiceLang = { hi:"hi-IN", en:"en-IN", bn:"bn-IN" };
let speaking = false;
const speechOK = ("speechSynthesis" in window) && (typeof SpeechSynthesisUtterance !== "undefined");
if(!speechOK) speakBtn.style.opacity = "0.6";

let speechQueue = [];
let queueIndex = 0;
let currentUtterance = null;   // keep a persistent reference so Chrome doesn't garbage-collect mid-speech
let voiceGender = "male";
let speechRate = 0.80;   // slower pace reads as more devotional/solemn
let speechPitch = 0.92;  // slightly deeper pitch for a more authentic, resonant chant tone

const MALE_HINTS = ["male","prabhat","hemant","ravi","david","mark","daniel","rishi","amit","aditya"];
const FEMALE_HINTS = ["female","heera","lekha","kalpana","susan","samantha","zira","priya"];

function pickVoice(langCode){
  const voices = speechSynthesis.getVoices();
  const base = langCode.split("-")[0];
  const matching = voices.filter(v => v.lang === langCode || (v.lang && v.lang.startsWith(base)));
  if(matching.length === 0) return null;
  const hints = voiceGender === "male" ? MALE_HINTS : FEMALE_HINTS;
  const preferred = matching.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
  return preferred || matching[0];
}

function speakNextChunk(){
  if(queueIndex >= speechQueue.length){ stopSpeak(); return; }
  const text = speechQueue[queueIndex];
  const utter = new SpeechSynthesisUtterance(text);
  const langCode = voiceLang[lang];
  utter.lang = langCode;
  const voice = pickVoice(langCode);
  if(voice) utter.voice = voice;
  utter.rate = speechRate;
  utter.pitch = speechPitch;
  utter.onend = () => { queueIndex++; speakNextChunk(); };
  utter.onerror = () => {
    if(queueIndex === 0){
      stopSpeak();
      alert("Couldn't start speech. Your browser may not have a voice installed for this language.");
    } else {
      queueIndex++; speakNextChunk();
    }
  };
  currentUtterance = utter;              // persistent reference, prevents silent GC failure
  speechSynthesis.speak(utter);
}

function stopSpeak(){
  speechSynthesis.cancel();
  speaking = false;
  currentUtterance = null;
  speakBtn.textContent = "🔊";
}

function startSpeak(){
  const d = DATA[lang];
  speechQueue = [d.d1, d.d2, ...d.c, d.df];
  queueIndex = 0;
  speaking = true;
  speakBtn.textContent = "⏸";
  speakNextChunk();
}

speakBtn.addEventListener("click", () => {
  if(!speechOK){ alert("Speech isn't supported in this browser. Please open this file in Chrome, Safari or Edge."); return; }
  if(speaking){ stopSpeak(); return; }
  try{ startSpeak(); }
  catch(err){
    console.error("Speech error:", err);
    alert("Speech playback failed to start.");
  }
});

if(speechOK && speechSynthesis.getVoices().length === 0){
  speechSynthesis.addEventListener("voiceschanged", () => {}, { once:true });
}

const speechPanel = document.getElementById("speechPanel");
document.getElementById("speechSettingsBtn").addEventListener("click", () => {
  speechPanel.hidden = !speechPanel.hidden;
});

document.getElementById("voiceGenderGroup").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  voiceGender = btn.dataset.gender;
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b===btn));
});

const rateVal = document.getElementById("rateVal");
const pitchVal = document.getElementById("pitchVal");
document.querySelectorAll(".miniStep").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.step);
    if(btn.dataset.target === "rate"){
      speechRate = Math.min(1.2, Math.max(0.5, Math.round((speechRate + step) * 100) / 100));
      rateVal.textContent = speechRate.toFixed(2);
    } else {
      speechPitch = Math.min(1.4, Math.max(0.6, Math.round((speechPitch + step) * 100) / 100));
      pitchVal.textContent = speechPitch.toFixed(2);
    }
  });
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

let deferredInstall = null;
const installGroup = document.getElementById("installGroup");
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstall = e;
  installGroup.style.display = "flex";
});

installBtn?.addEventListener("click", async () => {
  if(!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  installGroup.style.display = "none";
});

window.addEventListener("appinstalled", () => { installGroup.style.display = "none"; });
</script>
