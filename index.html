<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QR Forge — Free QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --radius: 14px;
    --gap: 16px;
    --ff-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    --ff-body: 'Inter', system-ui, -apple-system, sans-serif;
  }

  [data-theme="light"]{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --text:#14171A;
    --text-dim:#5B6570; --accent:#2F6FED; --accent-text:#FFFFFF;
    --border:#DDE2E8; --danger:#D93A3A; --focus:#2F6FED;
  }
  [data-theme="dark"]{
    --bg:#12151B; --surface:#1B1F27; --surface-2:#232833; --text:#E8EAED;
    --text-dim:#94A0AD; --accent:#5B9DFF; --accent-text:#0A0E14;
    --border:#2A2F3A; --danger:#FF6B6B; --focus:#5B9DFF;
  }
  [data-theme="oled"]{
    --bg:#000000; --surface:#000000; --surface-2:#0B0B0B; --text:#EDEDED;
    --text-dim:#8A8F98; --accent:#4DA3FF; --accent-text:#000000;
    --border:#1C1C1C; --danger:#FF6B6B; --focus:#4DA3FF;
  }
  [data-theme="hc"]{
    --bg:#000000; --surface:#000000; --surface-2:#000000; --text:#FFFFFF;
    --text-dim:#FFFFFF; --accent:#FFEB0B; --accent-text:#000000;
    --border:#FFFFFF; --danger:#FF3B3B; --focus:#FFEB0B;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--ff-body);
    min-height:100dvh; display:flex; flex-direction:column;
    transition:background .25s ease, color .25s ease;
  }
  [data-theme="hc"] *{ transition:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  a{ color:var(--accent); }

  .wrap{
    width:100%; max-width:480px; margin:0 auto; flex:1;
    padding:28px max(20px, env(safe-area-inset-right)) 20px max(20px, env(safe-area-inset-left));
  }

  /* Header */
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .mark{ width:34px; height:34px; flex-shrink:0; }
  .mark rect{ fill:none; stroke:var(--accent); stroke-width:8; }
  .brand h1{
    font-family:var(--ff-display); font-size:1.15rem; font-weight:800;
    letter-spacing:.02em; margin:0; color:var(--text);
  }
  .brand span{ color:var(--accent); }

  .theme-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface-2);
    border:1px solid var(--border); color:var(--text); font-family:var(--ff-body);
    font-size:.72rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    border-radius:999px; padding:8px 12px; cursor:pointer;
  }
  [data-theme="hc"] .theme-btn{ border-width:2px; }
  .theme-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  .theme-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }

  .tagline{ color:var(--text-dim); font-size:.92rem; line-height:1.5; margin:0 0 20px; }

  /* Card */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  label{ display:block; font-size:.75rem; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px; }
  label:first-child{ margin-top:0; }

  input[type="text"], select{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:12px 12px; font-size:.95rem; font-family:var(--ff-body);
  }
  textarea{
    width:100%; min-height:76px; resize:vertical; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:12px; font-size:.95rem; font-family:var(--ff-body);
  }

  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .color-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .color-field{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .color-field input[type="color"]{ width:32px; height:32px; border:none; background:none; padding:0; border-radius:6px; cursor:pointer; }
  .color-field span{ font-size:.82rem; color:var(--text-dim); font-family:var(--ff-display); }

  .slider-row{ display:flex; align-items:center; gap:12px; }
  .slider-row input[type="range"]{
    flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:999px;
    background:var(--border); outline:none; margin:0;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:3px solid var(--surface);
    box-shadow:0 0 0 1px var(--border);
  }
  .slider-row input[type="range"]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:var(--accent); cursor:pointer;
    border:3px solid var(--surface); box-shadow:0 0 0 1px var(--border);
  }
  [data-theme="hc"] .slider-row input[type="range"]::-webkit-slider-thumb{ border-color:var(--text); }
  .slider-value{
    min-width:34px; text-align:right; font-family:var(--ff-display); font-weight:700;
    font-size:.85rem; color:var(--text); flex-shrink:0;
  }

  .generate-btn{
    width:100%; margin-top:18px; background:var(--accent); color:var(--accent-text);
    border:none; border-radius:10px; padding:14px; font-size:.95rem; font-weight:700;
    font-family:var(--ff-display); letter-spacing:.02em; cursor:pointer;
  }
  .generate-btn:active{ transform:scale(.98); }
  [data-theme="hc"] .generate-btn{ border:2px solid var(--text); }

  .error-msg{ color:var(--danger); font-size:.82rem; margin-top:10px; display:none; }

  /* Preview */
  .preview-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 18px; text-align:center;
  }
  .frame{
    position:relative; width:min(260px, 100%); aspect-ratio:1/1; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; background:var(--surface-2);
    border-radius:10px; overflow:hidden;
  }
  .corner{ position:absolute; width:22px; height:22px; border:4px solid var(--accent); }
  .corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
  .frame img{ width:78%; height:78%; object-fit:contain; border-radius:4px; display:none; }
  .placeholder{ color:var(--text-dim); font-size:.85rem; padding:0 20px; }

  .download-btn{
    display:inline-flex; align-items:center; gap:8px; background:none; color:var(--accent);
    border:1px solid var(--accent); border-radius:999px; padding:10px 20px; font-weight:600;
    font-size:.88rem; cursor:pointer; font-family:var(--ff-body);
  }
  .download-btn[disabled]{ opacity:.4; cursor:not-allowed; }

  /* Footer */
  footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:4px; padding:26px 16px 22px; color:var(--text-dim); font-size:.78rem;
  }
  footer .fmark{ width:16px; height:16px; opacity:.7; }
  footer .fmark rect{ fill:none; stroke:currentColor; stroke-width:8; }
  footer strong{ color:var(--text); font-weight:600; }

  @media (min-width:600px){
    .wrap{ padding-top:48px; padding-bottom:32px; }
    .card, .preview-card{ padding:24px; }
  }
  @media (min-width:900px){
    .wrap{ padding-top:64px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40"><rect x="4" y="4" width="14" height="14" rx="2"/><rect x="22" y="4" width="14" height="14" rx="2"/><rect x="4" y="22" width="14" height="14" rx="2"/></svg>
      <h1>QR<span>Forge</span></h1>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <span class="theme-dot"></span><span id="themeLabel">Dark</span>
    </button>
  </header>

  <p class="tagline">Turn any text or link into a scannable QR code — instantly, free, no API key or sign-up needed.</p>

  <div class="card">
    <label for="dataInput">Text or URL</label>
    <textarea id="dataInput" placeholder="https://example.com or any text..."></textarea>

    <div class="row">
      <div>
        <label for="sizeSelect">Size</label>
        <select id="sizeSelect">
          <option value="200">200 × 200</option>
          <option value="300" selected>300 × 300</option>
          <option value="400">400 × 400</option>
          <option value="500">500 × 500</option>
        </select>
      </div>
      <div>
        <label for="eccSelect">Error correction</label>
        <select id="eccSelect">
          <option value="L">Low (L)</option>
          <option value="M" selected>Medium (M)</option>
          <option value="Q">Quartile (Q)</option>
          <option value="H">High (H)</option>
        </select>
      </div>
    </div>

    <label>Colors</label>
    <div class="color-row">
      <div class="color-field">
        <input type="color" id="fgColor" value="#000000">
        <span>Code</span>
      </div>
      <div class="color-field">
        <input type="color" id="bgColor" value="#ffffff">
        <span>Background</span>
      </div>
    </div>

    <label for="marginSlider">Quiet zone margin</label>
    <div class="slider-row">
      <input type="range" id="marginSlider" min="0" max="50" step="1" value="20">
      <span class="slider-value" id="marginValue">20px</span>
    </div>

    <button class="generate-btn" id="generateBtn" type="button">Generate QR Code</button>
    <p class="error-msg" id="errorMsg">Please enter some text or a URL first.</p>
  </div>

  <div class="preview-card">
    <div class="frame" id="frame">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div>
      <p class="placeholder" id="placeholder">Your QR code will appear here</p>
      <img id="qrImage" alt="Generated QR code">
    </div>
    <button class="download-btn" id="downloadBtn" type="button" disabled>⬇ Download PNG</button>
  </div>
</div>

<footer>
  <svg class="fmark" viewBox="0 0 40 40"><rect x="4" y="4" width="14" height="14" rx="2"/><rect x="22" y="4" width="14" height="14" rx="2"/><rect x="4" y="22" width="14" height="14" rx="2"/></svg>
  <div>© <span id="year">2026</span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
</footer>

<script>
  // ---- Theme handling ----
  var themes = ["dark","light","oled","hc"];
  var labels = { dark:"Dark", light:"Light", oled:"OLED", hc:"High Contrast" };
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  var themeLabel = document.getElementById("themeLabel");

  function applyTheme(name){
    root.setAttribute("data-theme", name);
    themeLabel.textContent = labels[name];
  }

  var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(prefersLight ? "light" : "dark");

  themeBtn.addEventListener("click", function(){
    var current = root.getAttribute("data-theme");
    var next = themes[(themes.indexOf(current) + 1) % themes.length];
    applyTheme(next);
  });

  // ---- Footer year ----
  var startYear = 2026;
  var now = new Date().getFullYear();
  document.getElementById("year").textContent = now > startYear ? (startYear + "–" + now) : startYear;

  // ---- QR generation (api.qrserver.com — free, no key/registration) ----
  var dataInput = document.getElementById("dataInput");
  var sizeSelect = document.getElementById("sizeSelect");
  var eccSelect = document.getElementById("eccSelect");
  var fgColor = document.getElementById("fgColor");
  var bgColor = document.getElementById("bgColor");
  var marginSlider = document.getElementById("marginSlider");
  var marginValue = document.getElementById("marginValue");
  var generateBtn = document.getElementById("generateBtn");
  var downloadBtn = document.getElementById("downloadBtn");
  var qrImage = document.getElementById("qrImage");
  var placeholder = document.getElementById("placeholder");
  var errorMsg = document.getElementById("errorMsg");
  var currentUrl = "";

  marginSlider.addEventListener("input", function(){
    marginValue.textContent = marginSlider.value + "px";
  });

  function hexNoHash(v){ return v.replace("#",""); }

  function buildUrl(){
    var size = sizeSelect.value;
    var text = encodeURIComponent(dataInput.value.trim());
    var ecc = eccSelect.value;
    var fg = hexNoHash(fgColor.value);
    var bg = hexNoHash(bgColor.value);
    var margin = marginSlider.value;
    return "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size +
           "&data=" + text + "&ecc=" + ecc + "&color=" + fg + "&bgcolor=" + bg + "&margin=" + margin;
  }

  function generate(){
    var text = dataInput.value.trim();
    if(!text){
      errorMsg.style.display = "block";
      return;
    }
    errorMsg.style.display = "none";
    currentUrl = buildUrl();
    qrImage.src = currentUrl;
    qrImage.style.display = "block";
    placeholder.style.display = "none";
    downloadBtn.disabled = false;
  }

  generateBtn.addEventListener("click", generate);
  dataInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
  });

  downloadBtn.addEventListener("click", function(){
    if(!currentUrl) return;
    fetch(currentUrl, { mode: "cors" })
      .then(function(res){ return res.blob(); })
      .then(function(blob){
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = objUrl;
        a.download = "qr-forge-code.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(objUrl);
      })
      .catch(function(){
        window.open(currentUrl, "_blank", "noopener");
      });
  });
</script>
</body>
</html>
