<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouMax — Play &amp; Record</title>
<style>
:root{
  --bg:#0b0d10; --surface:#14171c; --surface2:#1b1f26; --text:#e8eaed; --muted:#8b93a1;
  --border:#262b33; --accent:#ff4d5e; --accent2:#34d399; --focus:#ffb020; --radius:14px;
}
html[data-theme="light"]{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eef0f3; --text:#1b1e23; --muted:#5b6270;
  --border:#dde1e6; --accent:#e63946; --accent2:#0f9d78; --focus:#c9770b;
}
html[data-theme="oled"]{
  --bg:#000000; --surface:#0a0a0a; --surface2:#111111; --text:#eaeaea; --muted:#8a8a8a;
  --border:#1d1d1d; --accent:#ff4d5e; --accent2:#2ee6a6; --focus:#ffb020;
}
html[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --surface2:#000000; --text:#ffffff; --muted:#ffffff;
  --border:#ffffff; --accent:#ffff00; --accent2:#00ffbf; --focus:#00ffff; --radius:4px;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
button:focus-visible, .dropzone:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0;
  background:var(--bg); z-index:5;
}
.brand{font-weight:700; letter-spacing:.02em; display:flex; align-items:center; gap:8px;}
.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
.theme-btn{
  background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:999px; padding:7px 14px; font-size:.8rem; cursor:pointer;
}
.tabs{display:flex; gap:8px; padding:12px 16px 0;}
.tab{
  flex:1; padding:10px; border-radius:10px 10px 0 0; border:1px solid var(--border);
  border-bottom:none; background:var(--surface); color:var(--muted); font-weight:600;
  cursor:pointer; font-size:.9rem;
}
.tab.active{color:var(--text); background:var(--surface2); border-color:var(--accent);}
main{flex:1; max-width:640px; width:100%; margin:0 auto; padding:0 16px 24px;}
.panel{display:none; background:var(--surface2); border:1px solid var(--border); border-top:none;
  border-radius:0 0 var(--radius) var(--radius); padding:16px;}
.panel.active{display:block;}
.dropzone{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:2px dashed var(--border); border-radius:var(--radius); padding:22px 12px;
  color:var(--muted); cursor:pointer; text-align:center; font-size:.85rem;
}
.dropzone.drag{border-color:var(--accent); color:var(--text);}
.dz-icon{font-size:1.6rem; color:var(--accent);}
.stage{margin-top:14px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;}
video{width:100%; display:block; background:#000; aspect-ratio:16/9;}
#ytFrame{width:100%; aspect-ratio:16/9; border:0; display:none;}
.yt-input{display:flex; gap:8px; margin-bottom:12px;}
.yt-input input{
  flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:.85rem;
}
.yt-input button{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px;
  font-weight:600; cursor:pointer; font-size:.85rem;
}
.now-playing{padding:10px 12px; font-size:.85rem; color:var(--muted); text-align:center;}
.list{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
.list li{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px;
  font-size:.85rem;
}
.list .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.list button{background:none; border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:5px 9px; font-size:.75rem; cursor:pointer;}
.mode-switch{display:flex; gap:8px; margin-bottom:14px;}
.mode{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--muted); font-weight:600; cursor:pointer;}
.mode.active{color:var(--bg); background:var(--accent2); border-color:var(--accent2);}
#recordPanel .stage{position:relative;}
#recordPanel video{display:none;}
#recordPanel.video-mode video{display:block;}
.meter{display:flex; align-items:flex-end; gap:3px; height:56px; padding:10px 12px; justify-content:center;}
.meter .bar{width:5px; min-height:3px; background:var(--accent2); border-radius:2px; transition:height .05s linear;}
.timer{text-align:center; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:1.8rem; letter-spacing:.05em; margin-top:12px;}
.rec-controls{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px;}
.rec-btn{
  width:64px; height:64px; border-radius:50%; border:3px solid var(--accent);
  background:var(--surface); position:relative; cursor:pointer;
}
.rec-btn::after{content:""; position:absolute; inset:14px; border-radius:50%; background:var(--accent);}
.rec-btn.live{animation:pulse 1.2s infinite;}
.rec-btn.live::after{border-radius:5px;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.5);}50%{box-shadow:0 0 0 10px rgba(255,77,94,0);}}
.ctrl-btn{padding:11px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-weight:600; cursor:pointer;}
.ctrl-btn:disabled{opacity:.4; cursor:not-allowed;}
.site-footer{
  text-align:center; padding:18px 16px 22px; border-top:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.site-footer p{margin:0; font-size:.8rem; color:var(--muted);}
.site-footer .sub{font-size:.72rem; opacity:.75;}
@media (min-width:480px){.rec-btn{width:72px; height:72px;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>YouMax</div>
  <button id="themeBtn" class="theme-btn" type="button">Dark</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="play" type="button">▶ Play</button>
  <button class="tab" data-tab="record" type="button">● Record</button>
</nav>

<main>
  <section id="playPanel" class="panel active">
    <div class="yt-input">
      <input type="url" id="ytInput" placeholder="Paste a YouTube link…" inputmode="url">
      <button id="ytLoadBtn" type="button">Load</button>
    </div>
    <label id="dropZone" class="dropzone" for="fileInput" tabindex="0">
      <span class="dz-icon">+</span>
      <span>Drop audio or video files, or tap to browse</span>
      <input type="file" id="fileInput" accept="audio/*,video/*" multiple hidden>
    </label>
    <div class="stage">
      <video id="player" controls playsinline></video>
      <iframe id="ytFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <div id="nowPlaying" class="now-playing">No file loaded</div>
    </div>
    <ul id="playlist" class="list"></ul>
  </section>

  <section id="recordPanel" class="panel">
    <div class="mode-switch">
      <button class="mode active" data-mode="audio" type="button">Audio</button>
      <button class="mode" data-mode="video" type="button">Video</button>
      <button class="mode" data-mode="screen" type="button">Screen</button>
    </div>
    <div class="stage">
      <video id="preview" muted playsinline></video>
      <div class="meter" id="meter"></div>
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="rec-controls">
      <button id="pauseBtn" class="ctrl-btn" type="button" disabled>Pause</button>
      <button id="recBtn" class="rec-btn" type="button" aria-label="Start recording"></button>
      <button id="stopBtn" class="ctrl-btn" type="button" disabled>Stop</button>
    </div>
    <ul id="recordings" class="list"></ul>
  </section>
</main>

<footer class="site-footer">
  <p>© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
  <p class="sub">YouMax — local playback &amp; recording studio</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- Theme ---------- */
const themes = ['dark','light','oled','hc'];
const themeLabels = {dark:'Dark', light:'Light', oled:'OLED', hc:'HC'};
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  html.setAttribute('data-theme', t);
  themeBtn.textContent = themeLabels[t];
  localStorage.setItem('youmax-theme', t);
}
setTheme(localStorage.getItem('youmax-theme') || 'dark');
themeBtn.addEventListener('click', () => {
  const next = themes[(themes.indexOf(html.getAttribute('data-theme')) + 1) % themes.length];
  setTheme(next);
});

/* ---------- Tabs ---------- */
const tabs = document.querySelectorAll('.tab');
const panels = {play: document.getElementById('playPanel'), record: document.getElementById('recordPanel')};
tabs.forEach(tab => tab.addEventListener('click', () => {
  tabs.forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  Object.values(panels).forEach(p => p.classList.remove('active'));
  panels[tab.dataset.tab].classList.add('active');
  if (tab.dataset.tab !== 'record') stopStream();
}));

/* ---------- Play panel ---------- */
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const player = document.getElementById('player');
const nowPlaying = document.getElementById('nowPlaying');
const playlist = document.getElementById('playlist');

function addToPlaylist(file){
  const url = URL.createObjectURL(file);
  const li = document.createElement('li');
  const nameSpan = document.createElement('span');
  nameSpan.className = 'name';
  nameSpan.textContent = file.name;
  const btn = document.createElement('button');
  btn.textContent = 'Play';
  btn.type = 'button';
  btn.addEventListener('click', () => loadIntoPlayer(url, file.name));
  li.append(nameSpan, btn);
  playlist.appendChild(li);
  if (playlist.children.length === 1) loadIntoPlayer(url, file.name);
}
function loadIntoPlayer(url, name){
  ytFrame.style.display = 'none';
  ytFrame.src = '';
  player.style.display = 'block';
  player.src = url;
  player.play().catch(() => {});
  nowPlaying.textContent = name;
}

/* ---------- YouTube embed ---------- */
const ytInput = document.getElementById('ytInput');
const ytLoadBtn = document.getElementById('ytLoadBtn');
const ytFrame = document.getElementById('ytFrame');

function extractYouTubeId(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function loadYouTube(){
  const id = extractYouTubeId(ytInput.value.trim());
  if (!id){ alert('That doesn\'t look like a valid YouTube link.'); return; }
  player.pause();
  player.style.display = 'none';
  ytFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  ytFrame.style.display = 'block';
  nowPlaying.textContent = `YouTube: ${id}`;
}
ytLoadBtn.addEventListener('click', loadYouTube);
ytInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadYouTube(); });
fileInput.addEventListener('change', e => [...e.target.files].forEach(addToPlaylist));
['dragover','dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, e => {
  e.preventDefault();
  dropZone.classList.toggle('drag', evt === 'dragover');
}));
dropZone.addEventListener('drop', e => [...e.dataTransfer.files].forEach(addToPlaylist));
dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

/* ---------- Record panel ---------- */
const modeBtns = document.querySelectorAll('.mode');
const recordPanel = document.getElementById('recordPanel');
const preview = document.getElementById('preview');
const meter = document.getElementById('meter');
const timerEl = document.getElementById('timer');
const recBtn = document.getElementById('recBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const recordings = document.getElementById('recordings');

const BAR_COUNT = 24;
for (let i = 0; i < BAR_COUNT; i++){
  const bar = document.createElement('div');
  bar.className = 'bar';
  meter.appendChild(bar);
}
const bars = meter.querySelectorAll('.bar');

let mode = 'audio';
let stream, mediaRecorder, chunks = [], recordedMime = '';
let audioCtx, analyser, dataArray, rafId;
let seconds = 0, timerId = null;

modeBtns.forEach(btn => btn.addEventListener('click', () => {
  modeBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  recordPanel.classList.toggle('video-mode', mode !== 'audio');
  stopStream();
}));

async function getStream(){
  if (mode === 'screen'){
    return navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
  }
  const constraints = mode === 'video' ? {audio:true, video:{facingMode:'user'}} : {audio:true, video:false};
  return navigator.mediaDevices.getUserMedia(constraints);
}
function stopStream(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  cancelAnimationFrame(rafId);
  bars.forEach(b => b.style.height = '3px');
}
function drawMeter(){
  analyser.getByteFrequencyData(dataArray);
  const step = Math.floor(dataArray.length / BAR_COUNT);
  bars.forEach((bar, i) => {
    const v = dataArray[i * step] || 0;
    bar.style.height = Math.max(3, (v / 255) * 56) + 'px';
  });
  rafId = requestAnimationFrame(drawMeter);
}
function startTimer(){
  seconds = 0;
  timerEl.textContent = '00:00';
  timerId = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2,'0');
    const s = String(seconds % 60).padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}
function stopTimer(){ clearInterval(timerId); }

function pickMimeType(){
  const options = mode === 'audio'
    ? ['audio/webm;codecs=opus','audio/webm']
    : ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return options.find(o => MediaRecorder.isTypeSupported(o)) || '';
}

/* ---------- Download helper (Web Share fallback for mobile) ---------- */
async function downloadBlob(blob, filename){
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title: filename}); return; }
    catch(e){ /* user cancelled share sheet — fall back to direct download */ }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

recBtn.addEventListener('click', async () => {
  try{
    stream = await getStream();
  } catch(err){
    alert(mode === 'screen'
      ? 'Screen sharing was cancelled or unavailable.'
      : 'Microphone/camera access was denied or unavailable.');
    return;
  }
  if (mode === 'video' || mode === 'screen'){
    preview.srcObject = stream;
    preview.play().catch(() => {});
  }
  if (mode === 'screen' && !stream.getAudioTracks().length){
    alert('No audio was shared. Redo it and pick "Chrome Tab" (not a window or your entire screen), then check "Share tab audio" in the picker — otherwise the recording will be silent.');
  }
  if (stream.getAudioTracks().length){
    const track = stream.getAudioTracks()[0];
    if (track.muted){
      alert('Your microphone track is muted at the system level — check your OS sound settings or another app holding exclusive access to it, then try again.');
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    if (audioCtx.state === 'suspended') audioCtx.resume();
    drawMeter();
  }
  stream.getVideoTracks()[0]?.addEventListener('ended', () => { if (mediaRecorder?.state !== 'inactive') stopBtn.click(); });

  chunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = new MediaRecorder(stream, mimeType ? {mimeType} : undefined);
  recordedMime = mediaRecorder.mimeType || mimeType || (mode === 'audio' ? 'audio/webm' : 'video/webm');
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    saveRecording();
    stopStream();
    if (audioCtx){ audioCtx.close(); audioCtx = null; }
    preview.srcObject = null;
  };
  mediaRecorder.start();
  startTimer();

  recBtn.classList.add('live');
  recBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
});

pauseBtn.addEventListener('click', () => {
  if (mediaRecorder.state === 'recording'){
    mediaRecorder.pause(); stopTimer(); pauseBtn.textContent = 'Resume';
  } else if (mediaRecorder.state === 'paused'){
    mediaRecorder.resume(); startTimer(); pauseBtn.textContent = 'Pause';
  }
});

stopBtn.addEventListener('click', () => {
  mediaRecorder.stop();
  stopTimer();
  recBtn.classList.remove('live');
  recBtn.disabled = false;
  pauseBtn.disabled = true;
  pauseBtn.textContent = 'Pause';
  stopBtn.disabled = true;
});

function saveRecording(){
  const blob = new Blob(chunks, {type: recordedMime});
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');
  const ext = recordedMime.includes('mp4') ? 'mp4' : 'webm';
  const filename = `youmax-${mode}-${stamp}.${ext}`;

  const li = document.createElement('li');
  const nameSpan = document.createElement('span');
  nameSpan.className = 'name';
  nameSpan.textContent = filename;

  const playBtn = document.createElement('button');
  playBtn.type = 'button'; playBtn.textContent = 'Play';
  playBtn.addEventListener('click', () => loadIntoPlayer(url, filename));

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button'; dlBtn.textContent = 'Save';
  dlBtn.addEventListener('click', () => downloadBlob(blob, filename));

  li.append(nameSpan, playBtn, dlBtn);
  recordings.prepend(li);
}
</script>
</body>
</html>
