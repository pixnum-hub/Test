<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>NutriValue - Food Nutrition Calculator</title>
<style>
:root{
  --bg:#f4f7f9;--card:#fff;--text:#18212b;--muted:#687582;
  --accent:#159957;--border:#dce3e8;--input:#f8fafb;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:var(--bg);color:var(--text);display:flex;
  flex-direction:column;align-items:center;
}
body.dark{--bg:#121212;--card:#1d1d1d;--text:#f2f2f2;--muted:#aaa;
--border:#333;--input:#292929}
body.oled{--bg:#000;--card:#000;--text:#fff;--muted:#bbb;
--border:#333;--input:#080808}
body.hc{--bg:#000;--card:#000;--text:#fff;--muted:#fff;
--accent:#ffff00;--border:#fff;--input:#000}
header,main,footer{width:min(94%,700px)}
header{text-align:center;padding:24px 0 12px}
.logo{font-size:32px;font-weight:800}
.logo span{color:var(--accent)}
.tag{color:var(--muted);margin:7px 0 0}
.controls{display:flex;gap:7px;justify-content:center;
flex-wrap:wrap;margin:15px 0}
button{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer
}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px;box-shadow:0 4px 18px #00000012
}
.row{display:flex;gap:8px}
input{
  width:100%;min-width:0;padding:13px;border-radius:10px;
  border:1px solid var(--border);background:var(--input);
  color:var(--text);font-size:16px;outline:0
}
.searchBtn{background:var(--accent);color:#fff;border:0}
#status{text-align:center;color:var(--muted);margin:18px 0}
.results{display:grid;gap:12px;margin:15px 0}
.item{
  background:var(--card);border:1px solid var(--border);border-radius:15px;
  padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer
}
.item img{width:62px;height:62px;object-fit:contain;border-radius:10px;
background:#eee}
.item b{display:block;margin-bottom:5px}
.item small{color:var(--muted)}
.nutrition{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin:15px 0
}
.product{text-align:center}
.product img{width:120px;height:120px;object-fit:contain;border-radius:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.nut{
  border:1px solid var(--border);border-radius:12px;padding:13px;
  text-align:center
}
.nut strong{display:block;font-size:19px;color:var(--accent);margin-top:5px}
.back{margin-top:15px;width:100%}
footer{
  text-align:center;color:var(--muted);padding:25px 10px;margin-top:auto;
  font-size:13px
}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <div class="logo">🥗 <span>NutriValue</span></div>
  <div class="tag">Food Nutrition Value Finder</div>
  <div class="controls">
    <button onclick="setMode('light')" id="light">☀️ Light</button>
    <button onclick="setMode('dark')" id="dark">🌙 Dark</button>
    <button onclick="setMode('oled')" id="oled">⬛ OLED</button>
    <button onclick="setMode('hc')" id="hc">◐ HC</button>
  </div>
</header>

<main>
<section class="search">
  <div class="row">
    <input id="query" placeholder="Search food, e.g. milk, rice, apple"
           onkeydown="if(event.key==='Enter')searchFood()">
    <button class="searchBtn" onclick="searchFood()">Search</button>
  </div>
</section>

<div id="status">Search the Open Food Facts database for nutrition values.</div>
<div id="results" class="results"></div>
<div id="nutrition"></div>
</main>

<footer>© <span id="year"></span> Manik Roy 2026. All Rights Reserved.</footer>

<script>
const API="https://world.openfoodfacts.org/cgi/search.pl";
const results=document.getElementById("results");
const nutrition=document.getElementById("nutrition");
const status=document.getElementById("status");

document.getElementById("year").textContent=new Date().getFullYear();

function setMode(mode){
  document.body.className=mode==="light"?"":mode;
  document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("active"));
  document.getElementById(mode).classList.add("active");
  localStorage.setItem("nutriMode",mode);
}
setMode(localStorage.getItem("nutriMode")||"light");

function val(n,u="g"){
  return n==null||n===""||isNaN(n)?"—":(+n).toFixed(1)+" "+u;
}

async function searchFood(){
  const q=document.getElementById("query").value.trim();
  if(!q)return;
  results.innerHTML="";nutrition.innerHTML="";
  status.textContent="Searching nutrition database…";
  try{
    const url=API+"?search_terms="+encodeURIComponent(q)+
      "&search_simple=1&action=process&json=1&page_size=12"+
      "&fields=code,product_name,brands,image_front_small_url";
    const r=await fetch(url);
    const data=await r.json();
    const products=(data.products||[]).filter(x=>x.product_name);
    if(!products.length){status.textContent="No food found. Try another search.";return}
    status.textContent=products.length+" foods found. Select one:";
    products.forEach(p=>{
      const el=document.createElement("div");
      el.className="item";
      el.innerHTML=`<img src="${p.image_front_small_url||''}" alt="">
      <div><b>${escapeHTML(p.product_name)}</b>
      <small>${escapeHTML(p.brands||"Brand unavailable")}</small></div>`;
      el.onclick=()=>showNutrition(p.code);
      results.appendChild(el);
    });
  }catch(e){status.textContent="Unable to connect. Check your internet connection."}
}

async function showNutrition(code){
  status.textContent="Loading nutrition information…";
  try{
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+
      encodeURIComponent(code)+".json");
    const d=await r.json(),p=d.product,n=p.nutriments||{};
    if(!p){status.textContent="Nutrition information unavailable.";return}
    const image=p.image_front_url||p.image_url||"";
    nutrition.innerHTML=`
    <section class="nutrition">
      <div class="product">
        ${image?`<img src="${image}" alt="">`:""}
        <h2>${escapeHTML(p.product_name||"Food")}</h2>
        <p>${escapeHTML(p.brands||"")}</p>
        <small>Nutrition values generally shown per 100 g/ml</small>
      </div>
      <div class="grid">
        ${card("🔥 Calories",val(n["energy-kcal_100g"],"kcal"))}
        ${card("💪 Protein",val(n.proteins_100g))}
        ${card("🍞 Carbohydrates",val(n.carbohydrates_100g))}
        ${card("🥑 Fat",val(n.fat_100g))}
        ${card("🌾 Fiber",val(n.fiber_100g))}
        ${card("🍬 Sugars",val(n.sugars_100g))}
        ${card("🧂 Salt",val(n.salt_100g))}
        ${card("💧 Saturated Fat",val(n["saturated-fat_100g"]))}
      </div>
      <button class="back" onclick="nutrition.innerHTML=''">
        ✕ Close Nutrition
      </button>
    </section>`;
    status.textContent="Nutrition details";
    nutrition.scrollIntoView({behavior:"smooth"});
  }catch(e){status.textContent="Could not load product information."}
}

function card(title,value){
  return `<div class="nut">${title}<strong>${value}</strong></div>`;
}
function escapeHTML(s){
  return String(s||"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
</script>
</body>
</html>
