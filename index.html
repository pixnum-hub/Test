<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sangrah — Torrent Client</title>
<meta name="theme-color" content="#1e1e1e">
<style>
[data-theme=dark]{--bg:#1e1e1e;--panel:#252526;--line:#3c3c3c;--tx:#d4d4d4;--dim:#9a9a9a;--ac:#4ec9b0;--ac2:#569cd6;--on:#10241f;--bad:#f48771}
[data-theme=light]{--bg:#fff;--panel:#f3f3f3;--line:#d0d0d0;--tx:#1f1f1f;--dim:#5c5c5c;--ac:#00796b;--ac2:#0066b8;--on:#fff;--bad:#c4311f}
[data-theme=oled]{--bg:#000;--panel:#0b0b0b;--line:#242424;--tx:#e6e6e6;--dim:#8a8a8a;--ac:#4ec9b0;--ac2:#569cd6;--on:#001a14;--bad:#f48771}
[data-theme=hc]{--bg:#000;--panel:#000;--line:#6fc3df;--tx:#fff;--dim:#fff;--ac:#ffff00;--ac2:#6fc3df;--on:#000;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main,header,footer{width:100%;max-width:760px;padding:0 14px}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:18px;text-align:center}
h1{margin:0;font-size:1.7rem;letter-spacing:.01em;font-weight:600}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--dim);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
button,input,select{font:inherit;color:inherit}
.btn,.seg button,.tab{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-height:44px;cursor:pointer}
.btn:hover,.seg button:hover,.tab:hover{border-color:var(--ac2)}
.seg button[aria-pressed=true],.tab[aria-selected=true]{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.btn.sm{min-height:36px;padding:4px 12px}
.btn.del{color:var(--bad)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
[data-theme=hc] :focus-visible{outline-color:#ffff00}
nav{display:flex;gap:8px;margin:16px 0}
.tab{flex:1}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:44px;width:100%}
form{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px;word-break:break-word}
.card h3{margin:0;font-size:1rem;font-weight:600}
.meta{color:var(--dim);font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
a{color:var(--ac2)}
.empty{color:var(--dim);text-align:center;padding:24px 8px}
.files{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.file{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:.9rem;margin-bottom:6px}
#player{margin:10px 0}#player video,#player audio{width:100%;max-height:60vh;border-radius:8px;background:#000}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:9}
#toast.on{opacity:1}
[hidden]{display:none!important}
footer{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-top:auto;padding:28px 14px 20px;color:var(--dim);font-size:.85rem}
footer p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Sangrah<small>Torrent client for the Internet Archive</small></h1>
  <div class="seg" id="themes" role="group" aria-label="Theme"></div>
</header>

<main>
  <nav role="tablist">
    <button class="tab" role="tab" id="t-search" aria-selected="true">Search</button>
    <button class="tab" role="tab" id="t-dl" aria-selected="false">Downloads (<span id="cnt">0</span>)</button>
  </nav>

  <section id="p-search">
    <form id="sf">
      <input id="q" type="search" placeholder="Search the Internet Archive" aria-label="Search" autocomplete="off">
      <div class="row">
        <select id="mt" aria-label="Media type">
          <option value="">All media</option><option value="movies">Video</option><option value="audio">Audio</option>
          <option value="texts">Books and texts</option><option value="software">Software</option><option value="image">Images</option>
        </select>
        <select id="sort" aria-label="Sort by">
          <option value="downloads desc">Most downloaded</option><option value="date desc">Newest</option><option value="addeddate desc">Recently added</option>
        </select>
      </div>
      <button class="btn pri" type="submit">Search</button>
    </form>
    <div id="results"></div>
    <button class="btn" id="more" hidden style="width:100%">Load more</button>
  </section>

  <section id="p-dl" hidden>
    <div class="stats"><span>Down <b id="sd">0 B/s</b></span><span>Up <b id="su">0 B/s</b></span></div>
    <div class="card" id="loc">
      <span class="meta" id="locT"></span>
      <div class="acts"><button class="btn sm" id="pick" type="button" hidden>Choose download folder</button></div>
    </div>
    <form id="mf">
      <input id="mag" placeholder="Paste a magnet link or .torrent URL" aria-label="Magnet link">
      <div class="row">
        <button class="btn pri" type="submit">Add link</button>
        <label class="btn" style="text-align:center">Open .torrent file<input id="file" type="file" accept=".torrent" hidden></label>
      </div>
    </form>
    <div id="player" hidden></div>
    <div id="list"></div>
  </section>
</main>

<footer>
  <p>© Manik Roy <span id="yr"></span>. All Rights Reserved.</p>
  <p>Search by Internet Archive · Transfers by WebTorrent</p>
  <p id="warn"></p>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@1.9.7/webtorrent.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [n, v] of Object.entries(a)) {
    if (n === 'class') e.className = v;
    else if (n.startsWith('on')) e.addEventListener(n.slice(2), v);
    else e.setAttribute(n, v);
  }
  e.append(...k.filter(x => x != null));
  return e;
};
const bytes = n => {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.min(4, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / 1024 ** i).toFixed(i ? 1 : 0) + ' ' + u[i];
};
const eta = ms => {
  if (!isFinite(ms) || ms <= 0) return '—';
  const s = Math.round(ms / 1000);
  return s > 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm' : s > 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's';
};
let tt;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3500); };

/* ---------- Footer year + themes ---------- */
$('#yr').textContent = new Date().getFullYear();
const THEMES = [['dark', 'Dark+'], ['light', 'Light+'], ['oled', 'OLED Black'], ['hc', 'High contrast']];
const COLORS = { dark: '#1e1e1e', light: '#ffffff', oled: '#000000', hc: '#000000' };
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = COLORS[t];
  document.querySelectorAll('#themes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  try { localStorage.setItem('sangrah_theme', t); } catch (e) {}
}
THEMES.forEach(([k, l]) => $('#themes').append(h('button', { 'data-t': k, onclick: () => setTheme(k) }, l)));
let saved = 'dark';
try { saved = localStorage.getItem('sangrah_theme') || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark'); } catch (e) {}
setTheme(THEMES.some(t => t[0] === saved) ? saved : 'dark');

/* ---------- Tabs ---------- */
function tab(which) {
  const s = which === 'search';
  $('#p-search').hidden = !s; $('#p-dl').hidden = s;
  $('#t-search').setAttribute('aria-selected', s); $('#t-dl').setAttribute('aria-selected', !s);
}
$('#t-search').onclick = () => tab('search');
$('#t-dl').onclick = () => tab('dl');

/* ---------- Internet Archive search (free, no key) ---------- */
let page = 1, shown = 0;
async function search(more) {
  const q = $('#q').value.trim();
  if (!q) return toast('Enter a search term');
  if (!more) { page = 1; shown = 0; $('#results').replaceChildren(); }
  const mt = $('#mt').value;
  const p = new URLSearchParams({ q: `(${q})` + (mt ? ` AND mediatype:${mt}` : ''), rows: 15, page, output: 'json', sort: $('#sort').value });
  ['identifier', 'title', 'downloads', 'item_size', 'mediatype'].forEach(f => p.append('fl[]', f));
  $('#more').hidden = true;
  $('#results').append(h('p', { class: 'empty', id: 'busy' }, 'Searching…'));
  try {
    const r = await fetch('https://archive.org/advancedsearch.php?' + p);
    if (!r.ok) throw new Error('Archive returned ' + r.status);
    const { response } = await r.json();
    $('#busy')?.remove();
    if (!response.docs.length && !shown) $('#results').append(h('p', { class: 'empty' }, 'No results. Try fewer or different words.'));
    response.docs.forEach(d => $('#results').append(resultCard(d)));
    shown += response.docs.length; page++;
    $('#more').hidden = shown >= response.numFound;
  } catch (e) {
    $('#busy')?.remove();
    $('#results').append(h('p', { class: 'empty' }, 'Search failed: ' + e.message + '. Check your connection and try again.'));
  }
}
function resultCard(d) {
  const title = Array.isArray(d.title) ? d.title[0] : d.title || d.identifier;
  return h('div', { class: 'card' },
    h('h3', {}, title),
    h('div', { class: 'meta' }, `${d.mediatype || 'item'} · ${d.item_size ? bytes(d.item_size) : 'size unknown'} · ${(d.downloads || 0).toLocaleString()} downloads`),
    h('div', { class: 'acts' },
      h('button', { class: 'btn sm pri', onclick: () => addArchive(d.identifier) }, 'Download'),
      h('a', { class: 'btn sm', href: 'https://archive.org/details/' + encodeURIComponent(d.identifier), target: '_blank', rel: 'noopener', style: 'text-decoration:none;display:inline-flex;align-items:center' }, 'View on Archive')));
}
$('#sf').onsubmit = e => { e.preventDefault(); search(false); };
$('#more').onclick = () => search(true);

/* ---------- WebTorrent ---------- */
const client = typeof WebTorrent !== 'undefined' ? new WebTorrent() : null;
if (!client) $('#warn').textContent = 'WebTorrent failed to load. Check your connection and reload.';
else client.on('error', e => toast('Torrent error: ' + (e.message || e)));
const added = new Set();

async function addArchive(id) {
  if (!client) return toast('WebTorrent is not loaded');
  if (added.has(id)) { tab('dl'); return toast('Already in downloads'); }
  toast('Fetching torrent…');
  try {
    const r = await fetch(`https://archive.org/download/${encodeURIComponent(id)}/${encodeURIComponent(id)}_archive.torrent`);
    if (!r.ok) throw new Error('No torrent file for this item (' + r.status + ')');
    const blob = await r.blob(); // WebTorrent accepts Blob/File, not a bare Uint8Array
    added.add(id);
    start(blob);
    tab('dl');
  } catch (e) {
    toast(e.message === 'Failed to fetch' ? 'Blocked by the browser. Open the item on Archive, save its .torrent, then use “Open .torrent file”.' : e.message);
  }
}
function start(src) {
  if (!client) return toast('WebTorrent is not loaded');
  try {
    const t = client.add(src, {}, tor => { tor.deselect(0, tor.pieces.length - 1, false); toast('Ready. Choose a file to download.'); });
    t.on('error', e => toast(e.message || String(e)));
    tick();
  } catch (e) { toast(e.message || 'Could not add torrent'); }
}
$('#mf').onsubmit = e => {
  e.preventDefault();
  const v = $('#mag').value.trim();
  if (!v) return toast('Paste a magnet link or .torrent URL');
  start(v); $('#mag').value = '';
};
$('#file').onchange = e => {
  const f = e.target.files[0];
  if (f) start(f);
  e.target.value = '';
};

/* ---------- Downloads list (updated in place so buttons stay clickable) ---------- */
const cards = new Map();
const MEDIA = /\.(mp4|webm|m4v|mkv|mov|mp3|ogg|oga|wav|flac|m4a|opus)$/i;

function play(f) {
  const box = $('#player');
  box.replaceChildren(); box.hidden = false;
  f.appendTo(box, { autoplay: true, controls: true }, err => { if (err) toast('Cannot play this file here. Save it instead.'); });
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
/* ---------- Save to device storage ---------- */
const canPick = 'showDirectoryPicker' in window;
let dirHandle = null;
const idb = () => new Promise((ok, bad) => { const r = indexedDB.open('sangrah', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); });
const kv = async (m, k, v) => { const d = await idb(); return new Promise((ok, bad) => { const st = d.transaction('kv', m === 'get' ? 'readonly' : 'readwrite').objectStore('kv'), q = m === 'get' ? st.get(k) : st.put(v, k); q.onsuccess = () => ok(q.result); q.onerror = () => bad(q.error); }); };
function locText() {
  $('#locT').textContent = dirHandle ? 'Saving to folder: ' + dirHandle.name
    : canPick ? 'No folder chosen. Files go to your browser Downloads folder.' : 'Files save to your device Downloads folder.';
}
async function perm() {
  if (!dirHandle) return false;
  try {
    if (await dirHandle.queryPermission({ mode: 'readwrite' }) === 'granted') return true;
    return await dirHandle.requestPermission({ mode: 'readwrite' }) === 'granted';
  } catch (e) { return false; }
}
if (canPick) {
  $('#pick').hidden = false;
  $('#pick').onclick = async () => {
    try { dirHandle = await showDirectoryPicker({ id: 'sangrah', mode: 'readwrite' }); kv('put', 'dir', dirHandle).catch(() => {}); locText(); }
    catch (e) { if (e.name !== 'AbortError') toast(e.message); }
  };
  kv('get', 'dir').then(d => { if (d) { dirHandle = d; locText(); } }).catch(() => {});
}
locText();
async function toFolder(f) {
  const w = await (await dirHandle.getFileHandle(f.name, { create: true })).createWritable();
  const rs = f.createReadStream();
  try {
    await new Promise((ok, bad) => {
      rs.on('data', c => { rs.pause(); w.write(c).then(() => rs.resume(), bad); });
      rs.on('end', ok); rs.on('error', bad);
    });
    await w.close();
    toast('Saved to ' + dirHandle.name + ': ' + f.name);
  } catch (e) { try { await w.abort(); } catch (x) {} throw e; }
}
function blobSave(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = h('a', { href: u, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function save(f) {
  if (await perm()) return toFolder(f).catch(e => toast(e.message));
  f.getBlob((err, b) => err ? toast(err.message) : blobSave(b, f.name));
}
async function httpSave(url, f) {
  let w = null;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = +r.headers.get('content-length') || f.length, rd = r.body.getReader(), parts = [];
    let got = 0;
    if (await perm()) w = await (await dirHandle.getFileHandle(f.name, { create: true })).createWritable();
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      got += value.length;
      if (w) await w.write(value); else parts.push(value);
      f._msg = `${bytes(got)} of ${bytes(total)} · direct`;
    }
    if (w) { await w.close(); toast('Saved to ' + dirHandle.name + ': ' + f.name); }
    else { blobSave(new Blob(parts, { type: 'application/octet-stream' }), f.name); toast('Saved to Downloads: ' + f.name); }
  } catch (e) {
    if (w) try { await w.abort(); } catch (x) {}
    toast('Direct download blocked. Opening the link instead.');
    window.open(url, '_blank', 'noopener');
  } finally { f._msg = ''; }
}
function makeCard(t) {
  const name = h('h3', {}, 'Fetching metadata…'), meta = h('div', { class: 'meta' }), fill = h('i'), bar = h('div', { class: 'bar' }, fill);
  const files = h('div', { class: 'files', hidden: '' });
  const pb = h('button', { class: 'btn sm', onclick: () => { t.paused ? t.resume() : t.pause(); upd(); } }, 'Pause');
  const rb = h('button', { class: 'btn sm del', onclick: () => t.destroy(() => toast('Removed')) }, 'Remove');
  const el = h('div', { class: 'card' }, name, bar, meta, h('div', { class: 'acts' }, h('button', { class: 'btn sm', onclick: () => { (t.files || []).forEach(f => { f._want = true; f._saved = true; f.select(); }); toast('Downloading all files'); } }, 'Download all'), pb, rb), files);
  let built = false, list = [];
  function upd() {
    if (t.name) name.textContent = t.name;
    fill.style.width = (t.progress * 100).toFixed(1) + '%';
    pb.textContent = t.paused ? 'Resume' : 'Pause';
    meta.textContent = t.done ? `Complete · ${bytes(t.length)} · seeding to ${t.numPeers} peers`
      : `${(t.progress * 100).toFixed(1)}% of ${bytes(t.length)} · ↓ ${bytes(t.downloadSpeed)}/s · ↑ ${bytes(t.uploadSpeed)}/s · ${t.numPeers} peers · ETA ${eta(t.timeRemaining)}`;
    if (t.files && t.files.length && !built) {
      built = true; files.hidden = false;
      const junk = /(_meta\.xml|_files\.xml|_reviews\.xml|_meta\.sqlite|\.torrent|__ia_thumb\.jpg)$/i;
      const rank = f => junk.test(f.name) ? 3 : /\.pdf$/i.test(f.name) ? 0 : MEDIA.test(f.name) ? 1 : 2;
      list = [...t.files].sort((x, y) => rank(x) - rank(y)).slice(0, 100);
      files.append(h('p', { class: 'meta' }, 'Choose the file you want. Only selected files are downloaded.'));
      list.forEach(f => {
        f._pr = h('span', { class: 'meta' });
        f._btn = h('button', { class: 'btn sm pri', onclick: async () => {
          if (f.progress >= 1) return save(f);
          f._want = true; f._saved = false; f.select();
          if (await perm()) { f._saved = true; toFolder(f).catch(e => toast(e.message)); }
          toast('Downloading ' + f.name);
        } }, 'Download');
        const acts = h('div', { class: 'acts' }, f._btn);
        if (MEDIA.test(f.name)) acts.append(h('button', { class: 'btn sm', onclick: () => { f.select(); play(f); } }, 'Play'));
        const direct = 'https://archive.org/download/' + encodeURIComponent(t.name) + '/' + f.path.split('/').slice(1).map(encodeURIComponent).join('/');
        acts.append(h('button', { class: 'btn sm', onclick: () => httpSave(direct, f) }, 'Direct download'));
        files.append(h('div', { class: 'file' }, h('span', {}, f.name), f._pr, acts));
      });
      if (t.files.length > 100) files.append(h('p', { class: 'meta' }, `+ ${t.files.length - 100} more files not listed`));
    }
    list.forEach(f => {
      const pct = Math.floor(f.progress * 100);
      f._pr.textContent = f._msg || `${bytes(f.length)} · ${pct}%`;
      f._btn.textContent = f.progress >= 1 ? 'Save' : f._want ? `Downloading ${pct}%` : 'Download';
      if (f._want && !f._saved && f.progress >= 1) { f._saved = true; save(f); }
    });
  }
  return { el, upd };
}
function tick() {
  if (!client) return;
  const list = $('#list');
  for (const t of client.torrents) {
    if (!cards.has(t)) { const c = makeCard(t); cards.set(t, c); list.prepend(c.el); }
    cards.get(t).upd();
  }
  for (const [t, c] of cards) if (!client.torrents.includes(t)) { c.el.remove(); cards.delete(t); }
  $('#cnt').textContent = client.torrents.length;
  $('#sd').textContent = bytes(client.downloadSpeed) + '/s';
  $('#su').textContent = bytes(client.uploadSpeed) + '/s';
  if (!client.torrents.length) {
    if (!$('#none')) list.append(h('p', { class: 'empty', id: 'none' }, 'No downloads yet. Search the Internet Archive or add a magnet link.'));
  } else $('#none')?.remove();
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
