<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF0EC">
<title>Loupe — Digital Magnifier</title>
<style>
  :root{
    --bg:#EEF0EC; --surface:#FFFFFF; --ink:#132420; --sub:#54615C;
    --accent:#B8823A; --line:rgba(19,36,32,0.14); --ring-tick:rgba(19,36,32,0.16);
    --shadow:0 10px 30px rgba(19,36,32,0.12); --bw:1px;
  }
  html[data-theme="dark"]{
    --bg:#101615; --surface:#182220; --ink:#F2F0EA; --sub:#9AA39D;
    --accent:#D9A354; --line:rgba(242,240,234,0.12); --ring-tick:rgba(242,240,234,0.18);
    --shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  html[data-theme="oled"]{
    --bg:#000000; --surface:#050505; --ink:#F5F5F5; --sub:#8C8C8C;
    --accent:#D9A354; --line:rgba(245,245,245,0.10); --ring-tick:rgba(245,245,245,0.16);
    --shadow:0 0 0 1px rgba(255,255,255,0.06);
  }
  html[data-theme="hc"]{
    --bg:#000000; --surface:#000000; --ink:#FFFFFF; --sub:#FFFFFF;
    --accent:#FFE600; --line:#FFFFFF; --ring-tick:#FFFFFF; --bw:2px;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    transition:background .25s ease, color .25s ease;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:var(--bw) solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand b{
    font-size:20px; letter-spacing:0.02em; font-weight:800;
  }
  .brand span{font-size:11px; color:var(--sub); letter-spacing:0.14em; text-transform:uppercase;}
  #themeBtn{
    border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding:20px 16px 8px; gap:14px;
  }
  .lens-wrap{
    position:relative; width:min(84vw, 380px); aspect-ratio:1/1;
    border-radius:50%;
    padding:14px;
    background:
      repeating-conic-gradient(var(--ring-tick) 0deg 1.2deg, transparent 1.2deg 9deg);
    display:flex; align-items:center; justify-content:center;
  }
  .lens{
    position:relative; width:100%; height:100%; border-radius:50%;
    overflow:hidden; background:#000; box-shadow:var(--shadow);
    border:3px solid var(--accent);
  }
  canvas{width:100%; height:100%; object-fit:cover; display:block;}
  .crosshair{
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .crosshair::before, .crosshair::after{
    content:""; position:absolute; background:var(--accent); opacity:.55;
  }
  .crosshair::before{width:22px; height:1.5px;}
  .crosshair::after{width:1.5px; height:22px;}
  .readout{
    font-variant-numeric:tabular-nums; font-weight:700; font-size:26px;
    letter-spacing:0.02em;
  }
  .readout small{font-size:12px; font-weight:600; color:var(--sub); margin-left:4px;}
  .status{font-size:12px; color:var(--sub); text-align:center; min-height:16px;}
  .zoomRow{
    width:min(84vw,380px); display:flex; align-items:center; gap:10px;
  }
  input[type=range]{
    -webkit-appearance:none; flex:1; height:var(--bw); background:var(--line);
    border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:var(--accent); border:var(--bw) solid var(--surface); cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; background:var(--accent);
    border:var(--bw) solid var(--surface); cursor:pointer;
  }
  .zoomLbl{font-size:12px; color:var(--sub); width:34px; text-align:center;}
  .controls{
    display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; justify-content:center;
  }
  .ctrlBtn{
    border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:14px; padding:10px 16px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:8px; cursor:pointer; min-width:96px;
    justify-content:center;
  }
  .ctrlBtn.active{background:var(--accent); color:#1a1206; border-color:var(--accent);}
  .ctrlBtn:disabled{opacity:.4; cursor:not-allowed;}
  button:focus-visible, input:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }
  footer{
    border-top:var(--bw) solid var(--line); padding:14px 12px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    min-height:52px;
  }
  footer p{
    margin:0; font-size:12px; color:var(--sub); line-height:1.5;
    display:flex; align-items:center; justify-content:center;
  }
  @media (min-width:640px){
    .lens-wrap{width:min(60vw,420px);}
    .zoomRow{width:min(60vw,420px);}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>Loupe</b><span>Digital Magnifier</span></div>
  <button id="themeBtn" type="button" aria-label="Change theme">☀ Light</button>
</header>

<main>
  <div class="lens-wrap">
    <div class="lens" id="lens">
      <canvas id="canvas"></canvas>
      <div class="crosshair"></div>
    </div>
  </div>
  <div class="readout" id="readout">1.0<small>×</small></div>
  <div class="status" id="status">Point your camera at something small</div>

  <div class="zoomRow">
    <span class="zoomLbl">1×</span>
    <input id="zoom" type="range" min="1" max="6" step="0.1" value="1" aria-label="Zoom level">
    <span class="zoomLbl">6×</span>
  </div>

  <div class="controls">
    <button class="ctrlBtn" id="torchBtn" type="button" disabled>🔦 Torch</button>
    <button class="ctrlBtn" id="freezeBtn" type="button">⏸ Freeze</button>
    <button class="ctrlBtn" id="flipBtn" type="button">🔄 Flip</button>
  </div>
</main>

<footer>
  <p>&copy; <span id="year"></span> Manik Roy. All Rights Reserved.</p>
</footer>

<script>
(function(){
  var video = document.createElement('video');
  video.playsInline = true; video.muted = true; video.autoplay = true;
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var lens = document.getElementById('lens');
  var zoomInput = document.getElementById('zoom');
  var readout = document.getElementById('readout');
  var status = document.getElementById('status');
  var torchBtn = document.getElementById('torchBtn');
  var freezeBtn = document.getElementById('freezeBtn');
  var flipBtn = document.getElementById('flipBtn');
  var themeBtn = document.getElementById('themeBtn');

  var stream = null, track = null, frozen = false, facing = 'environment';
  var zoom = 1;

  document.getElementById('year').textContent = new Date().getFullYear();

  var themes = [
    {id:'light', label:'☀ Light', color:'#EEF0EC'},
    {id:'dark',  label:'🌙 Dark',  color:'#101615'},
    {id:'oled',  label:'⬛ OLED',  color:'#000000'},
    {id:'hc',    label:'◐ HC',    color:'#000000'}
  ];
  var themeIdx = 0;
  function applyTheme(){
    var t = themes[themeIdx];
    document.documentElement.setAttribute('data-theme', t.id);
    themeBtn.textContent = t.label;
    document.querySelector('meta[name=theme-color]').setAttribute('content', t.color);
  }
  themeBtn.addEventListener('click', function(){
    themeIdx = (themeIdx + 1) % themes.length;
    applyTheme();
  });
  applyTheme();

  function fitCanvas(){
    var r = lens.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', fitCanvas);

  function stopStream(){
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; track = null; }
  }

  function startCamera(){
    stopStream();
    status.textContent = 'Requesting camera…';
    var constraints = { video: { facingMode: { ideal: facing }, width:{ideal:1920}, height:{ideal:1080} }, audio:false };
    navigator.mediaDevices.getUserMedia(constraints).then(function(s){
      stream = s; track = s.getVideoTracks()[0];
      video.srcObject = s;
      video.onloadedmetadata = function(){ video.play(); fitCanvas(); status.textContent=''; };
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      torchBtn.disabled = !(caps && caps.torch);
    }).catch(function(err){
      status.textContent = 'Camera unavailable: ' + err.message;
    });
  }

  function draw(){
    requestAnimationFrame(draw);
    if (frozen || !video.videoWidth) return;
    var vw = video.videoWidth, vh = video.videoHeight;
    var side = Math.min(vw, vh) / zoom;
    var sx = (vw - side) / 2, sy = (vh - side) / 2;
    var cw = canvas.width, ch = canvas.height;
    ctx.save();
    if (facing === 'user'){ ctx.translate(cw,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, side, side, 0, 0, cw, ch);
    ctx.restore();
  }
  requestAnimationFrame(draw);

  zoomInput.addEventListener('input', function(){
    zoom = parseFloat(zoomInput.value);
    readout.innerHTML = zoom.toFixed(1) + '<small>×</small>';
  });

  // pinch to zoom
  var pinchStart = null, zoomStart = 1;
  lens.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      pinchStart = dist(e.touches[0], e.touches[1]);
      zoomStart = zoom;
    }
  }, {passive:true});
  lens.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && pinchStart){
      var d = dist(e.touches[0], e.touches[1]);
      var next = clamp(zoomStart * (d / pinchStart), 1, 6);
      zoom = next; zoomInput.value = next.toFixed(1);
      readout.innerHTML = next.toFixed(1) + '<small>×</small>';
    }
  }, {passive:true});
  function dist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  freezeBtn.addEventListener('click', function(){
    frozen = !frozen;
    freezeBtn.textContent = frozen ? '▶ Resume' : '⏸ Freeze';
    freezeBtn.classList.toggle('active', frozen);
  });

  flipBtn.addEventListener('click', function(){
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  torchBtn.addEventListener('click', function(){
    if (!track) return;
    var on = torchBtn.classList.toggle('active');
    track.applyConstraints({ advanced: [{ torch: on }] }).catch(function(){
      torchBtn.classList.toggle('active');
      status.textContent = 'Torch not supported on this device';
    });
  });

  fitCanvas();
  startCamera();
})();
</script>
</body>
</html>
