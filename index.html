<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="description" content="Free Indian Hindi Bengali Bollywood News Devotional Retro Radio">
<title>Free Radio</title>
<style>
*{box-sizing:border-box}
:root{--bg:#10131a;--card:#191e28;--text:#f4f7fb;--muted:#9da6b5;--a:#5cc8ff;--bd:#ffffff18}
[data-theme=light]{--bg:#f3f6fa;--card:#fff;--text:#17202a;--muted:#657181;--a:#0078d4;--bd:#0002}
[data-theme=oled]{--bg:#000;--card:#080808;--text:#fff;--muted:#aaa;--a:#00e5ff;--bd:#fff3}
[data-theme=hc]{--bg:#000;--card:#000;--text:#fff;--muted:#fff;--a:#ff0;--bd:#fff}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;text-align:center}
.app{width:min(100%,680px);min-height:100vh;padding:12px;display:flex;flex-direction:column;gap:12px}
header{padding:8px}h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:12px}
.box,.station{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px}
.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
button,input,select{border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--text);padding:10px;font:inherit}
button{cursor:pointer;min-width:44px}button:active{transform:scale(.96)}button.active{background:var(--a);color:#000}
.search{display:flex;gap:8px}.search input{flex:1;min-width:0}select{width:100%}
.player{display:flex;flex-direction:column;align-items:center;gap:8px}
.cover{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#222;border:2px solid var(--a)}
.now{font-weight:700;font-size:17px}.status{font-size:12px;color:var(--muted);min-height:18px}
.playerBtns{display:flex;gap:10px;align-items:center}.play{font-size:22px;background:var(--a);color:#000}
input[type=range]{accent-color:var(--a);width:160px;padding:0}
.list{display:flex;flex-direction:column;gap:9px}.station{display:flex;align-items:center;gap:9px;text-align:left;padding:9px}
.station img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#222;flex:none}
.info{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:5px}
.actions button{padding:7px;min-width:38px}.empty{padding:28px;color:var(--muted)}
.more{padding:18px;color:var(--muted);font-size:12px}
footer{margin-top:auto;padding:12px 5px;color:var(--muted);font-size:11px}
@media(max-width:420px){.app{padding:9px}h1{font-size:25px}.station img{width:42px;height:42px}}
</style>
</head>

<body>
<main class="app">

<header>
<h1>📻 Free Radio</h1>
<div class="sub">Hindi • Bengali • Bollywood • News • Devotional • Retro</div>
</header>

<section class="box controls">
<button data-t="dark" class="active">🌙</button>
<button data-t="light">☀️</button>
<button data-t="oled">🖤</button>
<button data-t="hc">HC</button>
</section>

<section class="box search">
<input id="search" placeholder="Search radio station...">
<button id="find">🔎</button>
</section>

<select id="category">
<option value="india">🇮🇳 Indian Radio</option>
<option value="hindi">🎵 Hindi Radio</option>
<option value="bengali">🪷 Bengali Radio</option>
<option value="bollywood">🎬 Bollywood Radio</option>
<option value="news">📰 News Radio</option>
<option value="devotional">🕉️ Devotional Radio</option>
<option value="retro">🎶 Retro Radio</option>
<option value="favorites">❤️ Favorites</option>
</select>

<section class="box player">
<img id="cover" class="cover" alt="Radio">
<div id="now" class="now">Select a station</div>
<div id="status" class="status">Ready</div>

<div class="playerBtns">
<button id="prev">⏮</button>
<button id="play" class="play">▶</button>
<button id="next">⏭</button>
</div>

<label>🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></label>
<audio id="audio" preload="none"></audio>
</section>

<section id="list" class="list"></section>
<div id="more" class="more">Loading stations...</div>

<footer>© <span id="year"></span> Manik Roy 2026. All Rights Reserved.</footer>

</main>

<script>
const API="https://de1.api.radio-browser.info/json/stations/search";
const audio=document.getElementById("audio");
const list=document.getElementById("list");
const more=document.getElementById("more");
const now=document.getElementById("now");
const status=document.getElementById("status");
const cover=document.getElementById("cover");
const search=document.getElementById("search");
const category=document.getElementById("category");
const play=document.getElementById("play");
const volume=document.getElementById("volume");
const year=document.getElementById("year");

const BATCH=100;
let stations=[],index=-1,offset=0,busy=false,end=false;

year.textContent=new Date().getFullYear();
audio.volume=.8;

document.querySelectorAll("[data-t]").forEach(b=>{
 b.onclick=()=>{
  document.documentElement.dataset.theme=b.dataset.t;
  document.querySelectorAll("[data-t]")
   .forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  localStorage.theme=b.dataset.t;
 };
});

if(localStorage.theme){
 document.documentElement.dataset.theme=localStorage.theme;
 document.querySelectorAll("[data-t]").forEach(b=>
  b.classList.toggle("active",b.dataset.t===localStorage.theme)
 );
}

volume.oninput=e=>audio.volume=e.target.value;

function params(){
 let c=category.value,q=search.value.trim();

 let p={
  countrycode:"IN",
  is_https:"true",
  hidebroken:"true",
  order:"clickcount",
  reverse:"true",
  limit:BATCH,
  offset:offset
 };

 if(c==="hindi")p.language="hindi";
 if(c==="bengali")p.language="bengali";
 if(c==="bollywood")p.tag="bollywood";
 if(c==="news")p.tag="news";
 if(c==="devotional")p.tag="devotional";
 if(c==="retro")p.tag="retro";
 if(q)p.name=q;

 return new URLSearchParams(p);
}

async function load(reset=false){

 if(category.value==="favorites"){
  if(reset)loadFav();
  return;
 }

 if(busy||end)return;

 if(reset){
  offset=0;
  end=false;
  stations=[];
  index=-1;
  list.innerHTML="";
  more.textContent="Loading stations...";
 }

 busy=true;

 try{

  let r=await fetch(API+"?"+params());

  if(!r.ok)throw Error();

  let incoming=(await r.json())
   .filter(x=>x.url_resolved||x.url);

  let ids=new Set(stations.map(x=>x.stationuuid));

  incoming=incoming.filter(x=>!ids.has(x.stationuuid));

  stations.push(...incoming);
  offset+=BATCH;

  render(incoming);

  if(incoming.length<BATCH){

   end=true;

   more.textContent=
    `End of available stations • ${stations.length} loaded`;

  }else{

   more.textContent=
    `${stations.length} stations loaded • Scroll for more`;
  }

 }catch(e){

  more.textContent=
   "Unable to load more stations. Try again.";

 }

 busy=false;
}

function render(items){

 if(!items.length&&!stations.length){

  list.innerHTML=
   '<div class="empty">No stations found.</div>';

  return;
 }

 items.forEach(s=>{

  let i=stations.indexOf(s);
  let el=document.createElement("article");
  let fav=favorites().includes(s.stationuuid);

  el.className="station";

  el.innerHTML=`
  <img src="${s.favicon||""}"
       onerror="this.style.visibility='hidden'">

  <div class="info">
   <div class="name">${esc(s.name)}</div>
   <div class="meta">
    ${esc(s.country||"India")} • ${esc(s.codec||"Radio")}
   </div>
  </div>

  <div class="actions">
   <button data-play>▶</button>
   <button data-fav>${fav?"❤️":"♡"}</button>
  </div>`;

  el.querySelector("[data-play]")
   .onclick=()=>playStation(i);

  el.querySelector("[data-fav]")
   .onclick=()=>favStation(i);

  list.appendChild(el);
 });
}

function esc(x){

 return String(x||"").replace(/[&<>"']/g,m=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 }[m]));
}

function playStation(i){

 if(!stations[i])return;

 index=i;

 let s=stations[i];

 audio.src=s.url_resolved||s.url;

 audio.play().then(()=>{

  now.textContent=s.name;

  status.textContent=
   "● LIVE • "+(s.codec||"Stream");

  cover.src=s.favicon||"";

  play.textContent="⏸";

 }).catch(()=>{

  status.textContent=
   "Stream unavailable — try another station.";

 });
}

play.onclick=()=>{

 if(!audio.src&&stations.length)
  return playStation(0);

 if(audio.paused){

  audio.play().catch(()=>{});

  play.textContent="⏸";

 }else{

  audio.pause();

  play.textContent="▶";
 }
};

document.getElementById("next").onclick=()=>{

 if(stations.length)
  playStation((index+1)%stations.length);

};

document.getElementById("prev").onclick=()=>{

 if(stations.length)
  playStation((index-1+stations.length)%stations.length);

};

function favorites(){

 return JSON.parse(
  localStorage.favorites||"[]"
 );
}

function favStation(i){

 let s=stations[i];
 let a=favorites();
 let n=a.indexOf(s.stationuuid);

 n>-1?a.splice(n,1):a.push(s.stationuuid);

 localStorage.favorites=
  JSON.stringify(a);

 if(category.value==="favorites")
  loadFav();
 else
  refreshFavoritesUI();
}

function refreshFavoritesUI(){

 document.querySelectorAll(".station")
 .forEach((el,i)=>{

  let b=el.querySelector("[data-fav]");

  if(b&&stations[i])
   b.textContent=
    favorites().includes(stations[i].stationuuid)
     ?"❤️":"♡";
 });
}

async function loadFav(){

 list.innerHTML="";
 more.textContent="Loading favorites...";

 let ids=favorites();

 if(!ids.length){

  list.innerHTML=
   '<div class="empty">No favorite stations yet.</div>';

  more.textContent="";

  return;
 }

 stations=[];
 index=-1;

 for(let id of ids){

  try{

   let r=await fetch(
    "https://de1.api.radio-browser.info/json/stations/byuuid/"+id
   );

   let x=await r.json();

   if(x[0])stations.push(x[0]);

  }catch(e){}
 }

 render(stations);

 more.textContent=
  `${stations.length} favorite stations`;
}

category.onchange=()=>{

 search.value="";

 load(true);
};

document.getElementById("find").onclick=()=>{
 load(true);
};

search.onkeydown=e=>{

 if(e.key==="Enter")
  load(true);

};

audio.onpause=()=>{
 play.textContent="▶";
};

audio.onerror=()=>{

 status.textContent=
  "Stream error — choose another station";

};

const observer=new IntersectionObserver(entries=>{

 if(entries[0].isIntersecting&&!busy&&!end)
  load(false);

},{rootMargin:"500px"});

observer.observe(more);

load(true);
</script>

</body>
</html>
