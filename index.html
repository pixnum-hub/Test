<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#159957">
<title>NutriValue – Food Nutrition</title>
<style>
:root{
--bg:#f4f7f9;--card:#fff;--text:#17212b;--muted:#66737e;
--accent:#159957;--border:#d8e0e5;--input:#f8fafb
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;display:flex;flex-direction:column;
align-items:center;text-align:center
}
body.dark{--bg:#121212;--card:#1d1d1d;--text:#f4f4f4;--muted:#aaa;
--border:#363636;--input:#292929}
body.oled{--bg:#000;--card:#000;--text:#fff;--muted:#bbb;
--border:#333;--input:#080808}
body.hc{--bg:#000;--card:#000;--text:#fff;--muted:#fff;
--accent:#ff0;--border:#fff;--input:#000}
header,main,footer{width:min(94%,720px)}
header{padding:25px 0 14px}
.logo{font-size:31px;font-weight:800}
.logo span{color:var(--accent)}
.tag{color:var(--muted);margin-top:6px}
.controls{display:flex;justify-content:center;gap:7px;
flex-wrap:wrap;margin:17px 0}
button{
padding:10px 13px;border:1px solid var(--border);border-radius:10px;
background:var(--card);color:var(--text);font-weight:bold;cursor:pointer
}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{
background:var(--card);border:1px solid var(--border);
border-radius:18px;padding:16px
}
.row{display:flex;gap:8px}
input{
width:100%;padding:14px;border:1px solid var(--border);
border-radius:11px;background:var(--input);color:var(--text);
font-size:16px;outline:none
}
.searchBtn{background:var(--accent);color:#fff;border:0}
#status{color:var(--muted);margin:18px 5px}
.results{display:grid;gap:11px;margin:15px 0}
.item{
display:flex;align-items:center;text-align:left;gap:13px;
padding:13px;background:var(--card);border:1px solid var(--border);
border-radius:15px;cursor:pointer
}
.item img{width:64px;height:64px;object-fit:contain;
border-radius:10px;background:#eee}
.item b{display:block;margin-bottom:5px}
.item small{color:var(--muted)}
.nutrition{
background:var(--card);border:1px solid var(--border);
border-radius:18px;padding:18px;margin:15px 0
}
.product img{width:125px;height:125px;object-fit:contain;
border-radius:15px;background:#eee}
.product p,.product small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);
gap:10px;margin-top:17px}
.nut{border:1px solid var(--border);border-radius:12px;padding:13px}
.nut strong{display:block;color:var(--accent);font-size:18px;margin-top:6px}
.close{width:100%;margin-top:15px}
footer{margin-top:auto;padding:25px 10px;color:var(--muted);font-size:13px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>
<header>
<div class="logo">🥗 <span>NutriValue</span></div>
<div class="tag">Food Nutrition Value Finder</div>

<div class="controls">
<button id="light" onclick="setMode('light')">☀️ Light</button>
<button id="dark" onclick="setMode('dark')">🌙 Dark</button>
<button id="oled" onclick="setMode('oled')">⬛ OLED</button>
<button id="hc" onclick="setMode('hc')">◐ HC</button>
</div>
</header>

<main>
<section class="search">
<div class="row">
<input id="query" placeholder="Search food: apple, rice, milk..."
onkeydown="if(event.key==='Enter')searchFood()">
<button class="searchBtn" onclick="searchFood()">Search</button>
</div>
</section>

<div id="status">Search for a food to see its nutrition.</div>
<div id="results" class="results"></div>
<div id="nutrition"></div>
</main>

<footer>
© <span id="year"></span> Manik Roy 2026. All Rights Reserved.
</footer>

<script>
const API="https://world.openfoodfacts.org/api/v2/search";
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

function setMode(mode){
document.body.className=mode==="light"?"":mode;
document.querySelectorAll(".controls button")
.forEach(x=>x.classList.remove("active"));
$(mode).classList.add("active");
localStorage.setItem("nutriMode",mode);
}
setMode(localStorage.getItem("nutriMode")||"light");

function clean(x){
return String(x||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[c]));
}

function number(x,u){
return x==null||x===""||isNaN(x)?"—":(+x).toFixed(1)+" "+u;
}

async function searchFood(){
let q=$("query").value.trim();
if(!q)return;

$("results").innerHTML="";
$("nutrition").innerHTML="";
$("status").textContent="Searching…";

try{
let url=API+"?search_terms="+encodeURIComponent(q)+
"&page_size=12&page=1&fields=code,product_name,brands,"+
"image_front_small_url";

let response=await fetch(url,{
headers:{"Accept":"application/json"}
});

if(!response.ok)throw Error("HTTP "+response.status);

let data=await response.json();
let foods=(data.products||[]).filter(x=>x.product_name);

if(!foods.length){
$("status").textContent="No food found. Try another name.";
return;
}

$("status").textContent=foods.length+" results found.";

foods.forEach(p=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=
`<img src="${p.image_front_small_url||""}" alt="">
<div><b>${clean(p.product_name)}</b>
<small>${clean(p.brands||"Brand unavailable")}</small></div>`;
el.onclick=()=>getFood(p.code);
$("results").appendChild(el);
});

}catch(e){
console.error(e);
$("status").innerHTML=
"⚠️ Connection failed.<br><small>Open the app from HTTPS hosting "+
"(GitHub Pages/Netlify) and try again.</small>";
}
}

async function getFood(code){
$("status").textContent="Loading nutrition…";

try{
let response=await fetch(
"https://world.openfoodfacts.org/api/v2/product/"+
encodeURIComponent(code)+".json",
{headers:{"Accept":"application/json"}}
);

if(!response.ok)throw Error("HTTP "+response.status);

let data=await response.json();
let p=data.product;

if(!p){
$("status").textContent="Nutrition data unavailable.";
return;
}

let n=p.nutriments||{};
let img=p.image_front_url||p.image_url||"";

$("nutrition").innerHTML=`
<section class="nutrition">
<div class="product">
${img?`<img src="${img}" alt="">`:""}
<h2>${clean(p.product_name||"Food")}</h2>
<p>${clean(p.brands||"")}</p>
<small>Values are generally per 100 g / 100 ml</small>
</div>

<div class="grid">
${card("🔥 Calories",number(n["energy-kcal_100g"],"kcal"))}
${card("💪 Protein",number(n.proteins_100g,"g"))}
${card("🍞 Carbs",number(n.carbohydrates_100g,"g"))}
${card("🥑 Fat",number(n.fat_100g,"g"))}
${card("🌾 Fiber",number(n.fiber_100g,"g"))}
${card("🍬 Sugar",number(n.sugars_100g,"g"))}
${card("🧂 Salt",number(n.salt_100g,"g"))}
${card("💧 Sat. Fat",number(n["saturated-fat_100g"],"g"))}
</div>

<button class="close" onclick="$('nutrition').innerHTML=''">
✕ Close Nutrition
</button>
</section>`;

$("status").textContent="Nutrition information";
$("nutrition").scrollIntoView({behavior:"smooth"});
}catch(e){
console.error(e);
$("status").textContent="Unable to load nutrition data.";
}
}

function card(a,b){
return `<div class="nut">${a}<strong>${b}</strong></div>`;
}
</script>
</body>
</html>
