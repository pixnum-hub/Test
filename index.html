<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-Engine OCR Scanner</title>
<script type="importmap">
{"imports":{
"@paddleocr/paddleocr-js":"https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/dist/index.mjs",
"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/ort.bundle.min.mjs",
"js-yaml":"https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm",
"clipper-lib":"https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/+esm",
"@techstark/opencv-js":"https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/+esm"
}}
</script>
<style>
:root{--bg:#12141a;--card:#1b1e27;--text:#e8eaf0;--mute:#9aa1b2;--line:#2c3040;--acc:#6ea8ff;--onacc:#06101f;--ok:#4ade80;--err:#f87171;--r:14px}
[data-theme=light]{--bg:#f3f5f9;--card:#fff;--text:#161a23;--mute:#5b6475;--line:#d9dee8;--acc:#1f5fd6;--onacc:#fff;--ok:#15803d;--err:#b91c1c}
[data-theme=oled]{--bg:#000;--card:#000;--text:#f2f2f2;--mute:#8c8c8c;--line:#262626;--acc:#5aa2ff;--onacc:#000;--ok:#4ade80;--err:#f87171}
[data-theme=hc]{--bg:#000;--card:#000;--text:#fff;--mute:#fff;--line:#fff;--acc:#ffff00;--onacc:#000;--ok:#00ff66;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .2s}
header,main,footer{width:100%;max-width:760px;padding:14px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
h1{font-size:1.4rem}
.sub{color:var(--mute);font-size:.9rem}
.themes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
button,select,input[type=text]{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.themes button[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.primary:disabled{opacity:.5;cursor:not-allowed}
[data-theme=hc] button,[data-theme=hc] select,[data-theme=hc] .card,[data-theme=hc] .drop{border-width:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
h2{font-size:1rem}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer;color:var(--mute)}
.drop.over{border-color:var(--acc);color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.row>*{flex:1 1 140px}
#preview{max-width:100%;max-height:300px;object-fit:contain;border-radius:10px;align-self:center;display:none}
.engines{display:flex;flex-direction:column;gap:8px}
.engines label,.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px;border:1px solid var(--line);border-radius:10px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.engines small{color:var(--mute);display:block}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.cfg{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cfg label{font-size:.85rem;color:var(--mute)}
.cfg input{width:100%}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#status{text-align:center;color:var(--mute);font-size:.9rem;min-height:1.4em}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:0 0 auto}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
textarea{width:100%;min-height:220px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
.meta{font-size:.85rem;color:var(--mute);text-align:center}
.ok{color:var(--ok)}.err{color:var(--err)}
footer{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:var(--mute);font-size:.85rem;margin-top:auto;padding-top:20px;padding-bottom:24px}
@media(min-width:700px){h1{font-size:1.8rem}.engines{flex-direction:row}.engines label{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Multi-Engine OCR Scanner</h1>
  <div class="themes" role="group" aria-label="Theme">
    <button data-t="dark" aria-pressed="true">Dark+</button>
    <button data-t="light" aria-pressed="false">Light+</button>
    <button data-t="oled" aria-pressed="false">OLED Black</button>
    <button data-t="hc" aria-pressed="false">High Contrast</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>1. Add an image</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose or drop an image">
      Tap to choose, drag &amp; drop, or paste an image
    </div>
    <div class="row">
      <button id="btnPick">📁 Gallery</button>
      <button id="btnCam">📷 Camera</button>
      <button id="btnClear">✖ Clear</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <img id="preview" alt="Selected image preview">
  </section>

  <section class="card">
    <h2>2. Engines</h2>
    <div class="engines">
      <label><input type="checkbox" id="eT" checked><span>Tesseract<small>In-browser (WASM)</small></span></label>
      <label><input type="checkbox" id="eP"><span>PaddleOCR<small>In-browser (PP-OCR, ONNX)</small></span></label>
      <label><input type="checkbox" id="eE"><span>EasyOCR<small>In-browser (CRAFT + CRNN, ONNX)</small></span></label>
    </div>
    <label class="opt"><span>Language (Tesseract)</span>
      <select id="lang">
        <option value="eng">English</option><option value="ben">Bengali</option><option value="hin">Hindi</option>
        <option value="spa">Spanish</option><option value="fra">French</option><option value="deu">German</option>
        <option value="ara">Arabic</option><option value="chi_sim">Chinese (Simpl.)</option><option value="jpn">Japanese</option>
        <option value="eng+ben">English + Bengali</option>
      </select>
    </label>
    <label class="opt"><input type="checkbox" id="enh" checked><span>Enhance image for Tesseract (grayscale + contrast)</span></label>
    <p class="meta">Everything runs in your browser. First scan downloads the models (Paddle ~15 MB, EasyOCR ~100 MB) and caches them.</p>
    <button class="primary" id="run" disabled>🔍 Scan text</button>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card" id="out" hidden>
    <h2>3. Results</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <textarea id="txt" aria-label="Recognized text"></textarea>
    <div class="meta" id="meta"></div>
    <div class="row">
      <button id="copy">📋 Copy</button>
      <button id="dl">⬇ Download .txt</button>
    </div>
  </section>
</main>

<footer>
  <span id="copyright"></span>
  <span>Built with HTML, CSS &amp; JavaScript</span>
</footer>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- Footer (auto-updating year) ---------- */
$('copyright').textContent = '© Manik Roy ' + new Date().getFullYear() + '. All Rights Reserved.';

/* ---------- Theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.themes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  store.set('ocr-theme', t);
}
document.querySelectorAll('.themes button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
setTheme(store.get('ocr-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

/* ---------- Image input ---------- */
let current = null;
function setImage(f) {
  if (!f || !f.type.startsWith('image/')) return status('Please choose an image file.', 'err');
  current = f;
  const p = $('preview');
  p.src = URL.createObjectURL(f);
  p.style.display = 'block';
  $('run').disabled = false;
  status('Image ready: ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)');
}
function clearAll() {
  current = null; results = {};
  $('preview').style.display = 'none'; $('preview').removeAttribute('src');
  $('run').disabled = true; $('out').hidden = true; $('file').value = ''; $('cam').value = '';
  status('');
}
$('btnPick').onclick = () => $('file').click();
$('btnCam').onclick = () => $('cam').click();
$('btnClear').onclick = clearAll;
$('drop').onclick = () => $('file').click();
$('drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => setImage(e.target.files[0]);
$('cam').onchange = e => setImage(e.target.files[0]);
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) setImage(it.getAsFile());
});

/* ---------- UI helpers ---------- */
function status(msg, cls) { const s = $('status'); s.textContent = msg; s.className = cls || ''; }
function progress(p) { $('bar').style.display = p == null ? 'none' : 'block'; $('fill').style.width = (p || 0) + '%'; }

/* ---------- Preprocessing ---------- */
async function prepare(file, enhance) {
  const bmp = await createImageBitmap(file);
  const max = 2200, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  if (enhance) {
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, f = 1.35;
    for (let i = 0; i < p.length; i += 4) {
      let g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
      g = Math.max(0, Math.min(255, (g - 128) * f + 128));
      p[i] = p[i + 1] = p[i + 2] = g;
    }
    x.putImageData(d, 0, 0);
  }
  return new Promise(r => c.toBlob(b => r(new File([b], 'scan.png', { type: 'image/png' })), 'image/png'));
}

/* ---------- Engine: Tesseract (browser) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.Tesseract) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load Tesseract.js (check connection)'));
    document.head.appendChild(s);
  });
}
async function runTesseract(img, onP) {
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const r = await Tesseract.recognize(img, $('lang').value, {
    logger: m => { if (m.status === 'recognizing text') onP(Math.round(m.progress * 100)); }
  });
  return { text: r.data.text.trim(), conf: Math.round(r.data.confidence) };
}

/* ---------- Shared ---------- */
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/';
const sel = () => $('lang').value.split('+')[0];
function groupLines(bx) {            // bx: {x,y,w,h,t}
  bx.sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
  const lines = [];
  for (const b of bx) {
    const cy = b.y + b.h / 2, L = lines.find(l => Math.abs(cy - l.cy) < 0.6 * l.h);
    if (L) { L.items.push(b); L.cy = (L.cy * (L.items.length - 1) + cy) / L.items.length; L.h = Math.max(L.h, b.h); }
    else lines.push({ cy, h: b.h, items: [b] });
  }
  return lines.sort((a, b) => a.cy - b.cy).map(l => l.items.sort((a, b) => a.x - b.x).map(i => i.t).join(' ')).join('\n');
}

/* ---------- Engine: PaddleOCR (PP-OCRv5 via PaddleOCR.js, in-browser) ---------- */
const PLANG = { eng: 'en', fra: 'fr', deu: 'de', spa: 'es', chi_sim: 'ch', jpn: 'japan' };
const paddle = {};
async function runPaddle(img, onP) {
  const lang = PLANG[sel()] || 'ch';
  if (!paddle[lang]) {
    status('Loading PaddleOCR engine & models (first run only)…');
    const { PaddleOCR } = await import('@paddleocr/paddleocr-js');
    const opts = { ocrVersion: 'PP-OCRv5', ortOptions: { backend: 'wasm', wasmPaths: ORT, numThreads: 1 } };
    try { paddle[lang] = await PaddleOCR.create({ ...opts, lang }); }
    catch (e) { if (lang === 'ch') throw e; paddle[lang] = await PaddleOCR.create({ ...opts, lang: 'ch' }); }
  }
  onP(40); status('Running PaddleOCR…');
  const [res] = await paddle[lang].predict(img);
  const pt = p => Array.isArray(p) ? p : [p.x, p.y];
  const bx = [], sc = [];
  for (const it of res.items || []) {
    let poly = it.poly || []; if (typeof poly[0] === 'number') poly = poly.reduce((a, v, i) => (i % 2 ? a[a.length - 1].push(v) : a.push([v]), a), []);
    const xs = poly.map(p => pt(p)[0]), ys = poly.map(p => pt(p)[1]);
    const x = Math.min(...xs), y = Math.min(...ys);
    bx.push({ x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y, t: it.text }); sc.push(it.score);
  }
  return { text: groupLines(bx), conf: sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length) * 100 : null };
}

/* ---------- Engine: EasyOCR (official CRAFT + CRNN models as ONNX, in-browser) ---------- */
const EGROUP = { eng: 'english', spa: 'latin', fra: 'latin', deu: 'latin', ara: 'arabic', hin: 'devanagari', chi_sim: 'zh_sim', jpn: 'japanese' };
const HF = 'https://huggingface.co/runemic-ai/easyocr-onnx/resolve/main/';
const easy = {}; let ortP;
function getOrt() {
  return ortP || (ortP = import('onnxruntime-web').then(m => {
    const o = m.InferenceSession ? m : m.default;
    o.env.wasm.wasmPaths = ORT; o.env.wasm.numThreads = 1; return o;
  }));
}
async function loadModel(ort, url, label) {
  const r = await fetch(url); if (!r.ok) throw new Error('Download failed: ' + label);
  const total = +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = []; let got = 0;
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    parts.push(value); got += value.length;
    status('Downloading ' + label + ' ' + (total ? Math.round(got / total * 100) + '%' : (got / 1048576).toFixed(0) + ' MB'));
  }
  const buf = new Uint8Array(got); let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; }
  return ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
}
async function runEasy(img, onP) {
  const grp = EGROUP[sel()] || 'english', ort = await getOrt();
  if (!easy.craft) easy.craft = await loadModel(ort, HF + 'craft.onnx', 'EasyOCR detector');
  if (!easy[grp]) {
    const meta = await (await fetch(HF + 'rec_' + grp + '.json')).json();
    easy[grp] = { meta, s: await loadModel(ort, HF + 'rec_' + grp + '.onnx', 'EasyOCR ' + grp + ' model') };
  }
  status('Running EasyOCR…'); onP(20);
  const bmp = await createImageBitmap(img), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const W = Math.max(64, Math.ceil(bmp.width * k / 32) * 32), H = Math.max(64, Math.ceil(bmp.height * k / 32) * 32);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = 'rgb(124,116,104)'; x.fillRect(0, 0, W, H);
  x.drawImage(bmp, 0, 0, Math.round(bmp.width * k), Math.round(bmp.height * k));
  const px = x.getImageData(0, 0, W, H).data, inp = new Float32Array(3 * W * H), mean = [123.675, 116.28, 103.53], std = [58.395, 57.12, 57.375];
  for (let i = 0; i < W * H; i++) for (let ch = 0; ch < 3; ch++) inp[ch * W * H + i] = (px[i * 4 + ch] - mean[ch]) / std[ch];
  const dout = await easy.craft.run({ [easy.craft.inputNames[0]]: new ort.Tensor('float32', inp, [1, 3, H, W]) });
  const sc = dout[easy.craft.outputNames[0]].data, w = W / 2, h = H / 2, N = w * h;
  const T = i => sc[2 * i], Lk = i => sc[2 * i + 1], seen = new Uint8Array(N), boxes = [];
  for (let s0 = 0; s0 < N; s0++) {                       // connected components over text|link maps
    if (seen[s0] || !(T(s0) > 0.4 || Lk(s0) > 0.4)) continue;
    const st = [s0]; seen[s0] = 1; let size = 0, mt = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    while (st.length) {
      const i = st.pop(), cx = i % w, cy = (i / w) | 0; size++;
      if (T(i) > mt) mt = T(i);
      if (T(i) > 0.4) { if (cx < x0) x0 = cx; if (cx > x1) x1 = cx; if (cy < y0) y0 = cy; if (cy > y1) y1 = cy; }
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx; if (!seen[j] && (T(j) > 0.4 || Lk(j) > 0.4)) { seen[j] = 1; st.push(j); }
      }
    }
    if (size < 10 || mt < 0.7 || x1 < 0) continue;
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, pad = Math.floor(Math.sqrt(size * Math.min(bw, bh) / (bw * bh)) * 2);
    boxes.push({ x: Math.max(0, x0 - pad) * 2 / k, y: Math.max(0, y0 - pad) * 2 / k, w: (bw + 2 * pad) * 2 / k, h: (bh + 2 * pad) * 2 / k });
  }
  const { meta, s } = easy[grp], chars = meta.characters, out = [], confs = [];
  for (let n = 0; n < boxes.length; n++) {
    onP(20 + 70 * n / boxes.length);
    const b = boxes[n], mx = b.h * 0.1, bx = Math.max(0, b.x - mx), by = Math.max(0, b.y - 2);
    const bw = Math.min(bmp.width - bx, b.w + 2 * mx), bh = Math.min(bmp.height - by, b.h + 4);
    if (bw < 4 || bh < 4) continue;
    const Wc = Math.min(1024, Math.max(32, Math.round(64 * bw / bh / 4) * 4)), rc = document.createElement('canvas');
    rc.width = Wc; rc.height = 64;
    const rx = rc.getContext('2d', { willReadFrequently: true });
    rx.fillStyle = '#fff'; rx.fillRect(0, 0, Wc, 64); rx.drawImage(bmp, bx, by, bw, bh, 0, 0, Wc, 64);
    const d = rx.getImageData(0, 0, Wc, 64).data, g = new Float32Array(Wc * 64);
    for (let i = 0; i < g.length; i++) g[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255 * 2 - 1;
    const r = await s.run({ [s.inputNames[0]]: new ort.Tensor('float32', g, [1, 1, 64, Wc]) });
    const lg = r[s.outputNames[0]], [, Tn, C] = lg.dims, ld = lg.data; let prev = 0, txt = '';
    for (let t = 0; t < Tn; t++) {                       // greedy CTC decode
      let best = 0, bv = -1e9, sum = 0;
      for (let q = 0; q < C; q++) { const v = ld[t * C + q]; if (v > bv) { bv = v; best = q; } }
      if (best !== 0 && best !== prev) {
        for (let q = 0; q < C; q++) sum += Math.exp(ld[t * C + q] - bv);
        confs.push(1 / sum); txt += chars[best] ?? '';
      }
      prev = best;
    }
    if (txt.trim()) out.push({ ...b, t: txt.trim() });
  }
  return { text: groupLines(out), conf: confs.length ? confs.reduce((a, b) => a + b, 0) / confs.length * 100 : null };
}

/* ---------- Run ---------- */
let results = {}, active = null, imgs = {};
$('run').onclick = async () => {
  if (!current) return;
  const jobs = [];
  if ($('eT').checked) jobs.push(['Tesseract', (i, p) => runTesseract(imgs.enh, p)]);
  if ($('eP').checked) jobs.push(['PaddleOCR', (i, p) => runPaddle(i, p)]);
  if ($('eE').checked) jobs.push(['EasyOCR', (i, p) => runEasy(i, p)]);
  if (!jobs.length) return status('Select at least one engine.', 'err');

  $('run').disabled = true; results = {}; progress(0);
  try {
    status('Preparing image…');
    const img = await prepare(current, false);
    imgs = { plain: img, enh: $('enh').checked ? await prepare(current, true) : img };
    let done = 0;
    for (const [name, fn] of jobs) {
      status('Running ' + name + ' (' + (done + 1) + '/' + jobs.length + ')…');
      const t0 = performance.now();
      try {
        const r = await fn(img, p => progress(((done + p / 100) / jobs.length) * 100));
        results[name] = { ...r, ms: Math.round(performance.now() - t0) };
      } catch (e) {
        results[name] = { text: '', error: e.message || String(e), ms: Math.round(performance.now() - t0) };
      }
      progress(((++done) / jobs.length) * 100);
    }
    const okCount = Object.values(results).filter(r => !r.error).length;
    status(okCount + ' of ' + jobs.length + ' engine(s) finished.', okCount ? 'ok' : 'err');
    showResults();
  } catch (e) {
    status('Error: ' + e.message, 'err');
  } finally {
    $('run').disabled = false;
    setTimeout(() => progress(null), 600);
  }
};

/* ---------- Results ---------- */
function showResults() {
  const names = Object.keys(results);
  $('out').hidden = !names.length;
  const tabs = $('tabs'); tabs.innerHTML = '';
  names.forEach(n => {
    const b = document.createElement('button');
    b.textContent = n + (results[n].error ? ' ⚠' : '');
    b.setAttribute('role', 'tab');
    b.onclick = () => select(n);
    tabs.appendChild(b);
  });
  const best = names.find(n => !results[n].error && results[n].text) || names[0];
  if (best) select(best);
}
function select(n) {
  active = n;
  [...$('tabs').children].forEach(b => b.setAttribute('aria-selected', b.textContent.startsWith(n)));
  const r = results[n];
  $('txt').value = r.error ? '' : (r.text || '(No text detected)');
  $('meta').className = 'meta' + (r.error ? ' err' : '');
  $('meta').textContent = r.error
    ? n + ' failed: ' + r.error
    : n + ' · ' + (r.text ? r.text.split(/\s+/).length : 0) + ' words · ' + (r.ms / 1000).toFixed(1) + 's' +
      (r.conf != null ? ' · confidence ' + r.conf + '%' : '');
}
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('txt').value); }
  catch (e) { $('txt').select(); document.execCommand('copy'); }
  status('Copied to clipboard.', 'ok');
};
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('txt').value], { type: 'text/plain' }));
  a.download = 'ocr-' + (active || 'result').toLowerCase() + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
};
</script>
