<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wi-Fi Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#12141a;--panel:#1b1e27;--text:#e8eaf0;--mute:#9aa1b2;--line:#2c3040;--acc:#4da3ff;--onacc:#001528;--ok:#3ddc84;--bad:#ff6b6b;--tile:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
[data-theme=light]{--bg:#f3f5f9;--panel:#fff;--text:#161a24;--mute:#5b6478;--line:#d9deea;--acc:#0b63ce;--onacc:#fff;--ok:#12813f;--bad:#c62828;--tile:none}
[data-theme=oled]{--bg:#000;--panel:#000;--text:#f2f2f2;--mute:#8a8a8a;--line:#222;--acc:#4da3ff;--onacc:#000;--tile:invert(1) hue-rotate(180deg) brightness(.7) contrast(.95)}
[data-theme=hc]{--bg:#000;--panel:#000;--text:#fff;--mute:#fff;--line:#fff;--acc:#ffe600;--onacc:#000;--ok:#00ff6a;--bad:#ff5c5c;--tile:grayscale(1) invert(1) contrast(1.6)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:12px 14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
h1{font-size:1.25rem}
.pill{font-size:.75rem;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--bad);border-color:var(--bad)}
.themes{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;cursor:pointer}
.themes button{border:0;border-radius:0;padding:8px 12px;min-height:40px}
.themes button[aria-pressed=true],button.primary{background:var(--acc);color:var(--onacc);font-weight:600}
button:focus-visible,select:focus-visible,.row:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[data-theme=hc] *{border-width:2px}
main{flex:1;display:grid;grid-template-rows:minmax(300px,48dvh) auto;gap:10px;padding:0 10px 10px;min-height:0}
#map{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);z-index:0}
.leaflet-tile-pane{filter:var(--tile)}
.heat{position:absolute;top:0;left:0;pointer-events:none}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.bar label{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.85rem}
#list{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:42dvh}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.row[aria-selected=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute);font-size:.78rem}
.sig{grid-row:span 2;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;width:70px}
.meter i{display:block;height:100%}
.legend{height:8px;border-radius:4px;background:linear-gradient(90deg,#00f,#0ff,#0f0,#ff0,#f00);width:min(220px,70%);margin:0 auto}
.lg{display:flex;justify-content:space-between;width:min(220px,70%);margin:0 auto;font-size:.72rem;color:var(--mute)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;line-height:1;padding:3px 7px;border-radius:99px;border:1px solid currentColor;margin-right:4px;white-space:nowrap}
.b2{color:#ff9f43}.b5{color:#4da3ff}.b6{color:#b980ff}.bg{color:var(--mute)}
[data-theme=light] .b2{color:#b45f06}[data-theme=light] .b5{color:#0b63ce}[data-theme=light] .b6{color:#7a2fd0}
[data-theme=hc] .b2,[data-theme=hc] .b5,[data-theme=hc] .b6,[data-theme=hc] .bg{color:#fff;border-width:2px}
#counts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.msg{text-align:center;color:var(--mute);font-size:.85rem}
footer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:14px;color:var(--mute);font-size:.82rem;border-top:1px solid var(--line)}
@media(min-width:900px){main{grid-template-columns:1fr 380px;grid-template-rows:calc(100dvh - 190px)}#list{max-height:none;flex:1}aside{overflow:hidden}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>📶 Wi-Fi Map</h1>
  <span id="status" class="pill">checking bridge…</span>
  <div class="themes" role="group" aria-label="Theme">
    <button data-t="dark" aria-pressed="true">Dark</button>
    <button data-t="light" aria-pressed="false">Light</button>
    <button data-t="oled" aria-pressed="false">OLED</button>
    <button data-t="hc" aria-pressed="false">HC</button>
  </div>
</header>

<main>
  <div id="map" role="application" aria-label="Wi-Fi signal heatmap"></div>
  <aside>
    <div class="bar">
      <button id="scan" class="primary">Scan now</button>
      <label><input type="checkbox" id="auto"> Auto 10s</label>
      <label><input type="checkbox" id="gps" checked> GPS</label>
    </div>
    <div class="bar">
      <select id="band" aria-label="Band filter"><option value="0">All bands</option><option value="2">2.4G (2.4 GHz)</option><option value="5">5G (5 GHz)</option><option value="6">6G (6 GHz)</option></select>
      <button id="export">Export</button>
      <button id="clear">Clear</button>
    </div>
    <div id="counts" aria-live="polite"></div>
    <div><div class="legend"></div><div class="lg"><span>−95 dBm</span><span>−35 dBm</span></div></div>
    <div id="msg" class="msg">Tap the map to set your position (turn GPS off for indoor mapping).</div>
    <div id="list" role="listbox" aria-label="Access points"></div>
  </aside>
</main>

<footer>
  <span>© Manik Roy <span id="year">2026</span>. All Rights Reserved.</span>
  <span>Map data © OpenStreetMap contributors</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const BRIDGE = location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
$('#year').textContent = new Date().getFullYear();

/* ---------- theme ---------- */
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
function setTheme(t){
  document.documentElement.dataset.theme = t; store.set('wm-theme', t);
  document.querySelectorAll('.themes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
}
document.querySelectorAll('.themes button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
setTheme(store.get('wm-theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

/* ---------- state ---------- */
let samples = store.get('wm-samples-live', []);   // {lat,lng,t,b:[[bssid,ssid,rssi,freq],...]}
let last = [], sel = null, pin = null, busy = false, timer = null, pinMarker = null;

/* ---------- map (OpenStreetMap tiles: free, no API key) ---------- */
const map = L.map('map', { zoomControl: true }).setView(samples.length ? [samples.at(-1).lat, samples.at(-1).lng] : [22.5726, 88.3639], samples.length ? 18 : 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
map.on('click', e => { pin = e.latlng; setPin(); $('#gps').checked = false; msg('Position pinned. Scan to record signal here.'); });
function setPin(){ if (pinMarker) pinMarker.remove(); if (pin) pinMarker = L.circleMarker(pin, { radius: 7, color: '#fff', weight: 2, fillColor: '#4da3ff', fillOpacity: 1 }).addTo(map); }
const msg = t => $('#msg').textContent = t;

/* ---------- canvas heatmap layer ---------- */
const palette = (() => {
  const c = document.createElement('canvas'); c.width = 1; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  [[0,'#0000ff'],[.3,'#00ffff'],[.55,'#00ff00'],[.78,'#ffff00'],[1,'#ff0000']].forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, 1, 256); return g.getImageData(0, 0, 1, 256).data;
})();
const Heat = L.Layer.extend({
  onAdd(m){ this._c = L.DomUtil.create('canvas', 'heat'); m.getPane('overlayPane').appendChild(this._c);
    m.on('moveend zoomend resize', this.draw, this); this.draw(); },
  onRemove(m){ this._c.remove(); m.off('moveend zoomend resize', this.draw, this); },
  draw(){
    const m = this._map, s = m.getSize(), c = this._c;
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    c.width = s.x; c.height = s.y;
    const g = c.getContext('2d'), z = m.getZoom(), pts = visiblePoints();
    const mpp = 156543.03 * Math.cos(m.getCenter().lat * Math.PI / 180) / 2 ** z;
    const r = Math.max(16, 30 / mpp), stamp = document.createElement('canvas');
    stamp.width = stamp.height = r * 2;
    const sg = stamp.getContext('2d'), rg = sg.createRadialGradient(r, r, 0, r, r, r);
    rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    sg.fillStyle = rg; sg.fillRect(0, 0, r * 2, r * 2);
    pts.forEach(p => { const q = m.latLngToContainerPoint([p.lat, p.lng]);
      g.globalAlpha = Math.max(.08, p.v * .75); g.drawImage(stamp, q.x - r, q.y - r); });
    g.globalAlpha = 1;
    const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
    for (let i = 3; i < d.length; i += 4) { const a = d[i]; if (a) { const j = Math.min(255, a * 1.4 | 0) * 4;
      d[i-3] = palette[j]; d[i-2] = palette[j+1]; d[i-1] = palette[j+2]; d[i] = Math.min(255, a * 1.6 + 40); } }
    g.putImageData(img, 0, 0);
  }
});
const heat = new Heat().addTo(map);

const bandOf = f => f < 3000 ? 2 : f >= 5925 ? 6 : 5;
const norm = r => Math.max(0, Math.min(1, (r + 95) / 60));
function visiblePoints(){
  const band = +$('#band').value, out = [];
  for (const s of samples) {
    let best = -200;
    for (const [, ssid, rssi, f] of s.b) if ((!sel || ssid === sel) && (!band || bandOf(f) === band) && rssi > best) best = rssi;
    if (best > -200) out.push({ lat: s.lat, lng: s.lng, v: norm(best) });
  }
  return out;
}

/* ---------- scanning ---------- */
async function getScan(){
  const r = await fetch(BRIDGE + '/scan', { cache: 'no-store' });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  setStatus(true, `live · ${j.count} BSS`);
  return j;
}
function setStatus(ok, t){ const s = $('#status'); s.textContent = t; s.className = 'pill ' + (ok ? 'on' : 'off'); }
function locate(){
  return new Promise(res => {
    const fallback = () => res(pin || map.getCenter());
    if (!$('#gps').checked || !navigator.geolocation) return fallback();
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), fallback, { enableHighAccuracy: true, timeout: 5000 });
  });
}
async function scan(){
  if (busy) return; busy = true; const b = $('#scan'); b.disabled = true; b.textContent = 'Scanning…';
  let data;
  try { data = await getScan(); }
  catch (e) {
    setStatus(false, 'bridge offline');
    msg('Cannot reach the Wi-Fi bridge. Run "python wifi_bridge.py" on Windows, then open http://127.0.0.1:8765. (' + (e.message || e) + ')');
    b.disabled = false; b.textContent = 'Scan now'; busy = false; return;
  }
  const p = await locate();
  last = data.bss.sort((a, c) => c.rssi - a.rssi);
  samples.push({ lat: p.lat, lng: p.lng, t: Date.now(), b: last.map(x => [x.bssid, x.ssid, x.rssi, x.freq]) });
  if (samples.length > 1500) samples.shift();
  store.set('wm-samples-live', samples);
  if ($('#gps').checked && p.lat) map.setView([p.lat, p.lng], Math.max(map.getZoom(), 17));
  msg(`${samples.length} sample points · ${last.length} access points`);
  render(); heat.draw(); b.disabled = false; b.textContent = 'Scan now'; busy = false;
}

/* ---------- list ---------- */
const BL = { 2: '2.4G', 5: '5G', 6: '6G' };
const bBadge = f => { const b = bandOf(f); return `<span class="badge b${b}">${BL[b]}</span>`; };
const gen = p => { const m = /Wi-Fi (\d)/.exec(p); return `<span class="badge bg">${m ? 'Wi-Fi ' + m[1] : esc(p)}</span>`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function render(){
  const band = +$('#band').value, el = $('#list');
  const rows = last.filter(x => !band || bandOf(x.freq) === band);
  const n = { 2: 0, 5: 0, 6: 0 }; last.forEach(x => n[bandOf(x.freq)]++);
  $('#counts').innerHTML = last.length ? [2, 5, 6].map(b => `<span class="badge b${b}">${BL[b]}: ${n[b]}</span>`).join('') : '';
  el.innerHTML = rows.map(x => {
    const v = norm(x.rssi), col = `hsl(${Math.round(v * 120)} 85% 50%)`, name = x.ssid || '(hidden network)';
    return `<div class="row" role="option" tabindex="0" data-s="${esc(x.ssid)}" aria-selected="${sel === x.ssid}">
      <b>${esc(name)} ${x.secure === false ? '🔓' : '🔒'}</b><span class="sig" style="color:${col}">${x.rssi} dBm<div class="meter"><i style="width:${v * 100}%;background:${col}"></i></div></span>
      <small>${bBadge(x.freq)}${gen(x.phy)}ch ${x.channel} · ${x.freq} MHz · ${esc(x.bssid)}</small></div>`;
  }).join('') || '<div class="msg">No networks yet — press Scan now.</div>';
}
$('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; pick(r.dataset.s); });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const r = e.target.closest('.row'); if (r) pick(r.dataset.s); } });
function pick(s){ sel = sel === s ? null : s; render(); heat.draw(); msg(sel ? `Heatmap filtered to "${sel || 'hidden'}" — tap again to clear` : 'Showing strongest signal at each point'); }

/* ---------- controls ---------- */
$('#scan').onclick = scan;
$('#band').onchange = () => { render(); heat.draw(); };
$('#auto').onchange = e => { clearInterval(timer); if (e.target.checked) { scan(); timer = setInterval(scan, 10000); } };
$('#clear').onclick = () => { if (confirm('Delete all recorded samples?')) { samples = []; store.set('wm-samples-live', []); heat.draw(); msg('Samples cleared.'); } };
$('#export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(samples, null, 1)], { type: 'application/json' }));
  a.download = 'wifi-samples.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
new ResizeObserver(() => map.invalidateSize()).observe($('#map'));
fetch(BRIDGE + '/scan', { method: 'OPTIONS' }).then(() => setStatus(true, 'bridge ready'), () => setStatus(false, 'bridge offline'));
render(); if (samples.length) msg(`${samples.length} saved sample points loaded.`);
</script>
</body>
</html>
