<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CodeForge — Run Code Instantly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1f26; --bg2:#262832; --panel:#20222b; --border:#383b48;
  --text:#e7e8ee; --sub:#9195a6; --accent:#ffb000; --accent-dim:#7a5b17;
  --ok:#57d38c; --err:#ff6b6b; --gutter:#4a4d5c; --radius:10px;
  --focus:#ffb000; --cursor:#ffb000;
}
[data-theme="light"]{
  --bg:#f4f3ef; --bg2:#ffffff; --panel:#ffffff; --border:#d9d7cf;
  --text:#1c1b18; --sub:#666257; --accent:#c98a00; --accent-dim:#f0d9ab;
  --ok:#1f8a4c; --err:#c0392b; --gutter:#c9c6ba; --cursor:#c98a00;
}
[data-theme="oled"]{
  --bg:#000000; --bg2:#000000; --panel:#080808; --border:#232323;
  --text:#f2f2f2; --sub:#8a8a8a; --accent:#ffb000; --accent-dim:#3a2a08;
  --ok:#4fe08a; --err:#ff6060; --gutter:#333333; --cursor:#ffb000;
}
[data-theme="hc"]{
  --bg:#000000; --bg2:#000000; --panel:#000000; --border:#ffffff;
  --text:#ffffff; --sub:#ffffff; --accent:#ffff00; --accent-dim:#000000;
  --ok:#00ff00; --err:#ff3b3b; --gutter:#ffffff; --focus:#ffff00; --cursor:#ffff00;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font-family:'JetBrains Mono',monospace;
  display:flex; flex-direction:column; transition:background .2s,color .2s;
}
a{color:var(--accent);}
.app{max-width:900px;width:100%;margin:0 auto;padding:14px 14px 0;flex:1;display:flex;flex-direction:column;gap:14px;}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.dots{display:flex;gap:5px;}
.dots span{width:9px;height:9px;border-radius:50%;display:block;background:var(--gutter);}
.dots span:nth-child(1){background:#ff5f56;} .dots span:nth-child(2){background:#ffbd2e;} .dots span:nth-child(3){background:#27c93f;}
[data-theme="hc"] .dots span{background:#fff;}
.brand h1{font-size:1.05rem;margin:0;letter-spacing:.5px;}
.brand h1 .prompt{color:var(--accent);}
.cursor{display:inline-block;width:8px;height:1em;background:var(--cursor);margin-left:2px;vertical-align:middle;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* theme segmented control */
.theme-toggle{display:flex;justify-self:center;margin:0 auto;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel);}
.theme-toggle button{
  border:none;background:transparent;color:var(--sub);padding:7px 12px;font-family:inherit;
  font-size:.72rem;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;
}
.theme-toggle button.active{background:var(--accent);color:#111;font-weight:700;}
.theme-toggle button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}

/* controls row */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
select,button.run{
  font-family:inherit;font-size:.85rem;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--panel);color:var(--text);padding:9px 12px;
}
select{flex:1;min-width:130px;}
button.run{
  background:var(--accent);color:#111;font-weight:700;border:1px solid var(--accent);cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
button.run:active{transform:translateY(1px);}
button.run:disabled{opacity:.6;cursor:progress;}
select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

/* editor */
.pane{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);overflow:hidden;}
.pane .bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);font-size:.7rem;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;}
textarea{
  width:100%;min-height:260px;resize:vertical;border:none;background:transparent;color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:.88rem;line-height:1.5;padding:12px;
  tab-size:2;
}
#output{
  margin:0;padding:12px;min-height:120px;max-height:320px;overflow:auto;white-space:pre-wrap;
  font-size:.82rem;line-height:1.5;color:var(--sub);
}
#output.ok{color:var(--ok);}
#output.err{color:var(--err);}
#preview{width:100%;min-height:220px;border:none;display:block;background:#fff;}
#preview[hidden]{display:none;}
.badge{font-size:.68rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);}

/* footer */
footer{
  border-top:1px solid var(--border);margin-top:18px;padding:14px 10px 18px;
  text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.74rem;color:var(--sub);
}
footer strong{color:var(--text);}

@media (min-width:640px){
  .app{padding:22px 22px 0;}
  header{flex-wrap:nowrap;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dots"><span></span><span></span><span></span></span>
      <h1><span class="prompt">&gt;_</span> CodeForge<span class="cursor"></span></h1>
    </div>
    <div class="theme-toggle" id="themeToggle" role="group" aria-label="Theme">
      <button data-t="dark">Dark</button>
      <button data-t="light">Light</button>
      <button data-t="oled">OLED</button>
      <button data-t="hc">HC</button>
    </div>
  </header>

  <div class="controls">
    <select id="lang" aria-label="Language"></select>
    <button class="run" id="runBtn">▶ Run</button>
  </div>

  <div class="pane">
    <div class="bar"><span>main<span id="ext"></span></span><span id="verBadge" class="badge"></span></div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
  </div>

  <div class="pane">
    <div class="bar"><span>Output</span><span id="status" class="badge">Idle</span></div>
    <pre id="output">Tap Run to compile &amp; execute your code. Powered by the free Piston API — no key, no signup.</pre>
    <iframe id="preview" title="Live preview" sandbox="allow-scripts" hidden></iframe>
  </div>
</div>

<footer>
  <div>© <span id="year"></span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
  <div>CodeForge — a lightweight browser IDE &amp; compiler</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const langSel = $('#lang'), codeEl = $('#code'), outEl = $('#output'), runBtn = $('#runBtn'),
      statusEl = $('#status'), extEl = $('#ext'), verBadge = $('#verBadge');

$('#year').textContent = new Date().getFullYear();

// ---- Theme handling ----
const themes = ['dark','light','oled','hc'];
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  localStorage.setItem('cf-theme', t);
}
document.getElementById('themeToggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  setTheme(b.dataset.t);
});
setTheme(localStorage.getItem('cf-theme') || 'dark');

// ---- 27 popular languages: snippet, file extension, matching aliases ----
const langs = {
  html:       {code:'<!DOCTYPE html>\n<html>\n<head><title>Demo</title></head>\n<body>\n  <h1>Hello, World!</h1>\n  <p>Edit me and hit Run.</p>\n</body>\n</html>', ext:'.html', preview:'html'},
  css:        {code:'body{\n  font-family: sans-serif;\n  background: #0f172a;\n  color: #f8fafc;\n  display:flex; align-items:center; justify-content:center; height:100vh; margin:0;\n}\n.box{\n  padding: 24px 32px; border-radius: 12px; background:#334155;\n}', ext:'.css', preview:'css'},
  python:     {code:'print("Hello, World!")', ext:'.py', match:['python']},
  javascript: {code:'console.log("Hello, World!");', ext:'.js', match:['javascript','node','js']},
  typescript: {code:'console.log("Hello, World!" as string);', ext:'.ts', match:['typescript','ts']},
  c:          {code:'#include <stdio.h>\nint main(){\n  printf("Hello, World!\\n");\n  return 0;\n}', ext:'.c', match:['c']},
  cpp:        {code:'#include <iostream>\nint main(){\n  std::cout << "Hello, World!" << std::endl;\n  return 0;\n}', ext:'.cpp', match:['c++','cpp']},
  csharp:     {code:'using System;\nclass Main {\n  static void Main(){\n    Console.WriteLine("Hello, World!");\n  }\n}', ext:'.cs', match:['csharp','c#','cs']},
  java:       {code:'public class Main {\n  public static void main(String[] args){\n    System.out.println("Hello, World!");\n  }\n}', ext:'.java', match:['java']},
  kotlin:     {code:'fun main(){\n  println("Hello, World!")\n}', ext:'.kt', match:['kotlin']},
  go:         {code:'package main\nimport "fmt"\nfunc main(){\n  fmt.Println("Hello, World!")\n}', ext:'.go', match:['go','golang']},
  rust:       {code:'fn main(){\n  println!("Hello, World!");\n}', ext:'.rs', match:['rust','rs']},
  swift:      {code:'print("Hello, World!")', ext:'.swift', match:['swift']},
  php:        {code:'<?php\necho "Hello, World!\\n";', ext:'.php', match:['php']},
  ruby:       {code:'puts "Hello, World!"', ext:'.rb', match:['ruby','rb']},
  perl:       {code:'print "Hello, World!\\n";', ext:'.pl', match:['perl','pl']},
  lua:        {code:'print("Hello, World!")', ext:'.lua', match:['lua']},
  r:          {code:'cat("Hello, World!\\n")', ext:'.r', match:['r']},
  haskell:    {code:'main = putStrLn "Hello, World!"', ext:'.hs', match:['haskell','hs']},
  elixir:     {code:'IO.puts("Hello, World!")', ext:'.exs', match:['elixir','exs']},
  scala:      {code:'object Main extends App {\n  println("Hello, World!")\n}', ext:'.scala', match:['scala']},
  dart:       {code:'void main(){\n  print("Hello, World!");\n}', ext:'.dart', match:['dart']},
  julia:      {code:'println("Hello, World!")', ext:'.jl', match:['julia','jl']},
  pascal:     {code:'program Main;\nbegin\n  writeln(\'Hello, World!\');\nend.', ext:'.pas', match:['pascal','fpc']},
  fortran:    {code:'program main\n  print *, "Hello, World!"\nend program main', ext:'.f90', match:['fortran','f90']},
  bash:       {code:'echo "Hello, World!"', ext:'.sh', match:['bash','sh']},
  sql:        {code:"SELECT 'Hello, World!';", ext:'.sql', match:['sqlite3','sql']}
};

let runtimes = [];
async function loadRuntimes(){
  statusEl.textContent = 'Loading…';
  Object.keys(langs).filter(n => langs[n].preview).forEach(name=>{
    const opt = document.createElement('option');
    opt.value = name; opt.dataset.lang = 'preview';
    opt.textContent = name.charAt(0).toUpperCase()+name.slice(1);
    langSel.appendChild(opt);
  });
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/runtimes');
    runtimes = await res.json();
    Object.keys(langs).filter(n => langs[n].match).forEach(name=>{
      const cands = langs[name].match;
      const match = runtimes.find(r => cands.includes(r.language) || cands.some(c => (r.aliases||[]).includes(c)));
      if(match){
        const opt = document.createElement('option');
        opt.value = name; opt.dataset.lang = match.language; opt.dataset.ver = match.version;
        opt.textContent = name.charAt(0).toUpperCase()+name.slice(1);
        langSel.appendChild(opt);
      }
    });
    statusEl.textContent = 'Idle';
    onLangChange();
  }catch(err){
    statusEl.textContent = 'Offline';
    outEl.textContent = 'Could not reach the Piston API to load languages. HTML/CSS preview still works offline.';
    outEl.className = 'err';
    onLangChange();
  }
}
function onLangChange(){
  const key = langSel.value;
  codeEl.value = (langs[key] && langs[key].code) || '';
  extEl.textContent = (langs[key] && langs[key].ext) || '';
  const opt = langSel.selectedOptions[0];
  const isPreview = langs[key] && langs[key].preview;
  verBadge.textContent = isPreview ? 'Live preview' : (opt ? opt.dataset.ver : '');
  $('#output').hidden = false; $('#preview').hidden = true;
}
langSel.addEventListener('change', onLangChange);

function renderPreview(key){
  const code = codeEl.value;
  const doc = langs[key].preview === 'css'
    ? '<!DOCTYPE html><html><head><style>'+code+'</style></head><body><div class="box"><h2>Preview</h2><p>Sample paragraph text.</p></div></body></html>'
    : code;
  $('#preview').srcdoc = doc;
  $('#preview').hidden = false; $('#output').hidden = true;
  statusEl.textContent = 'Rendered';
}

async function runCode(){
  const opt = langSel.selectedOptions[0];
  if(!opt) return;
  if(langs[opt.value] && langs[opt.value].preview){
    renderPreview(opt.value);
    return;
  }
  runBtn.disabled = true; runBtn.textContent = '⏳ Running…';
  statusEl.textContent = 'Running';
  $('#preview').hidden = true; $('#output').hidden = false;
  outEl.className = ''; outEl.textContent = 'Compiling & executing…';
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        language: opt.dataset.lang,
        version: opt.dataset.ver,
        files: [{ name: 'main'+((langs[opt.value]||{}).ext||''), content: codeEl.value }]
      })
    });
    const data = await res.json();
    const run = data.run || {};
    const compile = data.compile || {};
    let text = '';
    if(compile.stderr) text += '[compile]\n'+compile.stderr+'\n';
    text += (run.stdout || '') + (run.stderr ? '\n'+run.stderr : '');
    if(!text.trim()) text = '(no output)';
    outEl.textContent = text;
    const failed = (run.code && run.code !== 0) || run.stderr || compile.stderr;
    outEl.className = failed ? 'err' : 'ok';
    statusEl.textContent = failed ? 'Error' : 'Success';
  }catch(err){
    outEl.textContent = 'Network error while contacting the execution API. Please try again.';
    outEl.className = 'err';
    statusEl.textContent = 'Error';
  }finally{
    runBtn.disabled = false; runBtn.textContent = '▶ Run';
  }
}
runBtn.addEventListener('click', runCode);
loadRuntimes();
</script>
</body>
</html>
