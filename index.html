<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCR Scanner</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--ac:#2563eb;--act:#fff;--bd:#d8dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1e1e;--card:#252526;--tx:#d4d4d4;--mut:#9aa;--ac:#569cd6;--act:#111;--bd:#3c3c3c}}
:root[data-theme="light"]{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--ac:#2563eb;--act:#fff;--bd:#d8dce6}
:root[data-theme="dark"]{--bg:#1e1e1e;--card:#252526;--tx:#d4d4d4;--mut:#9aa;--ac:#569cd6;--act:#111;--bd:#3c3c3c}
:root[data-theme="oled"]{--bg:#000;--card:#000;--tx:#e6e6e6;--mut:#999;--ac:#4ea1ff;--act:#000;--bd:#2a2a2a}
:root[data-theme="hc"]{--bg:#000;--card:#000;--tx:#fff;--mut:#fff;--ac:#ffeb3b;--act:#000;--bd:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{width:100%;max-width:720px;padding:12px 14px}
header{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
h1{margin:0;font-size:1.5rem}
.sub{color:var(--mut);font-size:.85rem;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button[aria-pressed="true"]{outline:2px solid var(--ac)}
button:disabled{opacity:.5}
#drop{border:2px dashed var(--bd);border-radius:14px;padding:22px 12px;text-align:center;color:var(--mut)}
#drop.on{border-color:var(--ac)}
#pv{max-width:100%;max-height:300px;object-fit:contain;align-self:center;border-radius:8px;display:none}
textarea{width:100%;min-height:200px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;resize:vertical}
progress{width:100%;height:10px;accent-color:var(--ac)}
#log{font-size:.8rem;color:var(--mut);white-space:pre-wrap;max-height:130px;overflow:auto;margin:0}
.lbl{font-size:.8rem;color:var(--mut)}
footer{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;margin-top:auto;color:var(--mut);font-size:.85rem}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <h1>OCR Scanner</h1>
  <p class="sub">Free, keyless, in-browser text recognition</p>
  <div class="row" role="group" aria-label="Theme" id="themes"></div>
</header>
<main>
  <div class="card">
    <div id="drop">Drop, paste or pick an image</div>
    <div class="row">
      <button class="p" id="pick">Choose image</button>
      <button id="cam">Camera</button>
    </div>
    <input type="file" id="f" accept="image/*"><input type="file" id="fc" accept="image/*" capture="environment">
    <img id="pv" alt="Preview">
  </div>
  <div class="card">
    <label class="lbl" for="eng">Engine</label>
    <select id="eng">
      <option value="auto">Auto (best available, with fallback)</option>
      <option value="tess">Tesseract.js</option>
      <option value="wasm">tesseract-wasm</option>
      <option value="ppv5">PaddleOCR PP-OCRv5</option>
      <option value="paddle">PaddleOCR.js</option>
      <option value="trocr">TrOCR printed (single line)</option>
      <option value="hand">Handwriting (TrOCR, line by line)</option>
    </select>
    <label class="lbl" for="lang">Language (Tesseract.js)</label>
    <select id="lang">
      <option value="eng">English</option><option value="hin">Hindi</option><option value="ben">Bengali</option>
      <option value="spa">Spanish</option><option value="fra">French</option><option value="deu">German</option>
      <option value="eng+hin">English + Hindi</option>
    </select>
    <button class="p" id="run" disabled>Scan text</button>
    <progress id="bar" value="0" max="1" hidden></progress>
    <pre id="log"></pre>
  </div>
  <div class="card">
    <label class="lbl" for="out">Result <span id="meta"></span></label>
    <textarea id="out" placeholder="Recognized text appears here"></textarea>
    <div class="row">
      <button id="copy">Copy</button><button id="dl">Download .txt</button><button id="clr">Clear</button>
    </div>
  </div>
</main>
<footer>
  <span>&copy; Manik Roy <span id="yr">2026</span>. All Rights Reserved.</span>
</footer>
<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
let file=null,url=null;

/* Themes */
const T=[["light","Light+"],["dark","Dark+"],["oled","OLED"],["hc","HC"]];
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem("ocr-theme",t)}catch(e){}
  document.querySelectorAll("#themes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t))}
T.forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.t=k;b.onclick=()=>setTheme(k);$("themes").appendChild(b)});
let st=null;try{st=localStorage.getItem("ocr-theme")}catch(e){}
setTheme(st||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("yr").textContent=new Date().getFullYear();

const log=m=>{$("log").textContent+=m+"\n";$("log").scrollTop=1e6};
document.addEventListener("securitypolicyviolation",e=>log("BLOCKED by page security policy: "+e.blockedURI));
addEventListener("unhandledrejection",e=>log("Error: "+((e.reason&&e.reason.message)||e.reason)));
addEventListener("error",e=>log("Error: "+e.message));
if(location.hostname.endsWith("claude.ai")||location.hostname.endsWith("claudeusercontent.com"))log("Note: this hosted preview blocks most model downloads. For full OCR, save index.html and open it from localhost or your own hosting.");
const prog=v=>{$("bar").hidden=false;$("bar").value=v};

/* Image input */
function setFile(f){
  if(!f||!f.type.startsWith("image/"))return;
  file=f;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
  $("pv").src=url;$("pv").style.display="block";$("run").disabled=false;$("log").textContent="";
}
$("pick").onclick=()=>$("f").click();$("cam").onclick=()=>$("fc").click();
$("f").onchange=e=>setFile(e.target.files[0]);$("fc").onchange=e=>setFile(e.target.files[0]);
const d=$("drop");
["dragover","dragenter"].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add("on")}));
["dragleave","drop"].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove("on")}));
d.addEventListener("drop",e=>setFile(e.dataTransfer.files[0]));
d.onclick=()=>$("f").click();
addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(it)setFile(it.getAsFile())});

const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();
  const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Script blocked/failed"));document.head.appendChild(s)});
const imgEl=()=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=url});
const CDN="https://cdn.jsdelivr.net/npm/";

/* Engines: each returns {text, conf 0-100} */
const E={
  async tess(){
    await loadScript(CDN+"tesseract.js@5.1.1/dist/tesseract.min.js");
    const w=await Tesseract.createWorker($("lang").value,1,{logger:m=>{if(m.progress!=null)prog(m.progress)}});
    try{const r=await w.recognize(file);return{text:r.data.text,conf:r.data.confidence}}finally{await w.terminate()}
  },
  async wasm(){
    const m=await import(CDN+"tesseract-wasm@0.11.0/+esm");
    const eng=await m.createOCREngine();
    log("tesseract-wasm: loading model");
    const buf=await (await fetch("https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata_fast@4.1.0/eng.traineddata")).arrayBuffer();
    eng.loadModel(new Uint8Array(buf));
    eng.loadImage(await createImageBitmap(file));
    const text=eng.getText();
    let conf=text.trim()?70:0;
    try{const b=eng.getTextBoxes("word");if(b.length)conf=b.reduce((a,x)=>a+x.confidence,0)/b.length*100}catch(e){}
    return{text,conf}
  },
  async ppv5(){
    const m=await import(CDN+"@gutenye/ocr-browser@1.4.8/+esm");
    const J=CDN+"pdfmarkdown-ppocrv5-models@1.0.0/",H="RapidAI/RapidOCR/resolve/main/onnx/PP-OCRv5/";
    const grab=async(label,urls,min)=>{let last="";
      log("PP-OCRv5: downloading "+label);
      for(const u of urls){try{
        const r=await fetch(u);
        if(!r.ok){last=u.split("/")[2]+" HTTP "+r.status;continue}
        const b=await r.blob();
        if(b.size<min){last=u.split("/")[2]+" returned "+b.size+" bytes";continue}
        return URL.createObjectURL(b)}catch(e){last=u.split("/")[2]+" "+(e.message||e)}}
      throw new Error("PP-OCRv5 "+label+" download failed ("+last+")")};
    const det=await grab("detector",[J+"detection/PP-OCRv5_mobile_det_infer.ort","https://huggingface.co/"+H+"det/ch_PP-OCRv5_mobile_det.onnx","https://hf-mirror.com/"+H+"det/ch_PP-OCRv5_mobile_det.onnx"],1e5);
    const rec=await grab("recognizer",[J+"recognition/PP-OCRv5_mobile_rec_infer.onnx","https://huggingface.co/"+H+"rec/ch_PP-OCRv5_rec_mobile_infer.onnx","https://hf-mirror.com/"+H+"rec/ch_PP-OCRv5_rec_mobile_infer.onnx"],1e6);
    const dict=await grab("dictionary",[J+"recognition/ppocrv5_dict.txt","https://cdn.jsdelivr.net/gh/PaddlePaddle/PaddleOCR@main/ppocr/utils/dict/ppocrv5_dict.txt"],1e3);
    log("PP-OCRv5: initializing runtime");
    const ocr=await (m.default||m.Ocr||m).create({models:{detectionPath:det,recognitionPath:rec,dictionaryPath:dict}});
    const lines=await ocr.detect(url);
    const text=lines.map(l=>l.text).join("\n");
    const conf=lines.length?lines.reduce((a,l)=>a+(l.mean||0.7),0)/lines.length*100:0;
    return{text,conf}
  },
  async paddle(){
    const m=await import(CDN+"@paddlejs-models/ocr@1.2.4/+esm");
    log("PaddleOCR.js: initializing");
    await m.init();
    const r=await m.recognize(await imgEl());
    const text=(r.text||[]).join("\n");
    return{text,conf:text.trim()?65:0}
  },
  async hand(){
    const {pipeline,env}=await import(CDN+"@huggingface/transformers@3.0.2/+esm");
    env.allowLocalModels=false;
    const im=await imgEl(),sc=Math.min(1,1400/im.width),W=Math.round(im.width*sc),H=Math.round(im.height*sc);
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});
    x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);
    const px=x.getImageData(0,0,W,H).data,g=new Float32Array(W*H);let sum=0;
    for(let i=0;i<W*H;i++){g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];sum+=g[i]}
    const th=sum/(W*H)*.8,rows=[];
    for(let y=0;y<H;y++){let n=0;for(let xx=0;xx<W;xx++)if(g[y*W+xx]<th)n++;rows.push(n>W*.004)}
    let bands=[],st=-1;
    for(let y=0;y<=H;y++){if(rows[y]&&st<0)st=y;if(!rows[y]&&st>=0){bands.push([st,y]);st=-1}}
    const mg=[];for(const b of bands){const l=mg[mg.length-1];if(l&&b[0]-l[1]<Math.max(8,H*.012))l[1]=b[1];else mg.push(b.slice())}
    let lines=mg.filter(b=>b[1]-b[0]>=10);if(!lines.length)lines=[[0,H]];
    log("Handwriting: "+lines.length+" line(s) detected; loading model");
    const p=await pipeline("image-to-text","Xenova/trocr-small-handwritten",{progress_callback:q=>{if(q.progress!=null)prog(q.progress/100)}});
    const out=[];
    for(let i=0;i<lines.length;i++){
      const pad=6,y0=Math.max(0,lines[i][0]-pad),h=Math.min(H,lines[i][1]+pad)-y0;
      const t=document.createElement("canvas");t.width=W;t.height=h;
      const tx=t.getContext("2d");tx.fillStyle="#fff";tx.fillRect(0,0,W,h);tx.drawImage(c,0,y0,W,h,0,0,W,h);
      log("Reading line "+(i+1)+"/"+lines.length);prog((i+1)/lines.length);
      const r=await p(t.toDataURL("image/png"));out.push((r[0]?.generated_text||"").trim());
    }
    const text=out.filter(Boolean).join("\n");
    return{text,conf:text?80:0}
  },
  async trocr(){
    const {pipeline,env}=await import(CDN+"@huggingface/transformers@3.0.2/+esm");
    env.allowLocalModels=false;
    log("TrOCR: loading model (first run is large)");
    const p=await pipeline("image-to-text","Xenova/trocr-small-printed",{progress_callback:x=>{if(x.progress!=null)prog(x.progress/100)}});
    const r=await p(url);
    const text=(r[0]?.generated_text||"").trim();
    return{text,conf:text?60:0}
  }
};
const NAMES={tess:"Tesseract.js",wasm:"tesseract-wasm",ppv5:"PaddleOCR PP-OCRv5",paddle:"PaddleOCR.js",trocr:"TrOCR",hand:"TrOCR handwriting"};
const ORDER=["tess","wasm","ppv5","paddle","trocr"];
const THRESH=60;

$("run").onclick=async()=>{
  if(!file)return;
  const sel=$("eng").value,list=sel==="auto"?ORDER:[sel];
  $("run").disabled=true;$("log").textContent="";$("out").value="";$("meta").textContent="";
  let best=null,bestName="";
  for(const k of list){
    log("Trying "+NAMES[k]+"...");prog(0);
    try{
      const t0=performance.now(),r=await E[k]();
      log(`${NAMES[k]}: ${r.text.trim().length} chars, ${Math.round(r.conf)}% (${((performance.now()-t0)/1000).toFixed(1)}s)`);
      if(!best||r.conf>best.conf){best=r;bestName=NAMES[k]}
      if(r.text.trim()&&r.conf>=THRESH)break;
      if(list.length>1)log("Low confidence, falling back...");
    }catch(err){log(NAMES[k]+" unavailable: "+(err.message||err))}
  }
  $("bar").hidden=true;$("run").disabled=false;
  if(best&&best.text.trim()){
    $("out").value=best.text.trim();
    $("meta").textContent=`(${bestName}, ${Math.round(best.conf)}%)`;
    try{const h=JSON.parse(localStorage.getItem("ocr-hist")||"[]");h.unshift(best.text.trim().slice(0,2000));localStorage.setItem("ocr-hist",JSON.stringify(h.slice(0,10)))}catch(e){}
  }else log("No text recognized. Try a clearer image or another engine.");
};

$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").value)}catch(e){$("out").select();document.execCommand("copy")}log("Copied")};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("out").value],{type:"text/plain"}));a.download="ocr-result.txt";a.click()};
$("clr").onclick=()=>{$("out").value="";$("meta").textContent=""};
</script>
</body>
</html>
