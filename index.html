<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumori — Photo Editor</title>
<style>
:root{--bg:#1e1e1e;--pn:#252526;--tx:#d4d4d4;--mu:#8a8a8a;--ac:#4fa3e0;--on:#0b0b0b;--bd:#3c3c3c;--ok:#4ec9b0;--er:#f48771;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#fff;--pn:#f3f3f3;--tx:#1f1f1f;--mu:#616161;--ac:#0066b8;--on:#fff;--bd:#d0d0d0;--ok:#107c10;--er:#c4314b}
:root[data-theme=oled]{--bg:#000;--pn:#0a0a0a;--tx:#e8e8e8;--mu:#8a8a8a;--ac:#4fc1ff;--on:#000;--bd:#222}
:root[data-theme=hc]{--bg:#000;--pn:#000;--tx:#fff;--mu:#fff;--ac:#ffff00;--on:#000;--bd:#fff;--ok:#00ff88;--er:#ff6b6b}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));justify-content:center;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
main,header{width:100%;max-width:880px;padding:10px 14px}
header{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.theme-btn{position:absolute;top:10px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--pn);color:var(--ac);font-size:1.2rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.theme-btn:hover{border-color:var(--ac)}
#crop{position:absolute;border:2px solid var(--ac);background:linear-gradient(#fff5,#fff5) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff5,#fff5) 0 66.66%/100% 1px no-repeat;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move;z-index:2}
#crop[hidden]{display:none}
#crop i{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--ac);border:2px solid var(--on)}
#crop i[data-h=n],#crop i[data-h=s]{width:34px;height:18px;margin:-9px -17px;border-radius:9px}#crop i[data-h=w],#crop i[data-h=e]{width:18px;height:34px;margin:-17px -9px;border-radius:9px}
#crop i[data-h=n]{top:0;left:50%;cursor:ns-resize}#crop i[data-h=s]{top:100%;left:50%;cursor:ns-resize}#crop i[data-h=w]{top:50%;left:0;cursor:ew-resize}#crop i[data-h=e]{top:50%;left:100%;cursor:ew-resize}
#cnum label{font-size:.75rem;color:var(--mu);display:flex;flex-direction:column;gap:2px}#cnum input{width:100%;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
#crop i[data-h=nw]{top:0;left:0;cursor:nwse-resize}#crop i[data-h=ne]{top:0;left:100%;cursor:nesw-resize}#crop i[data-h=sw]{top:100%;left:0;cursor:nesw-resize}#crop i[data-h=se]{top:100%;left:100%;cursor:nwse-resize}
h1{margin:0;font-size:1.35rem;letter-spacing:.3px}h1 span{color:var(--ac)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{background:var(--pn);color:var(--tx);border:0;border-right:1px solid var(--bd);padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:40px}
.seg button:last-child{border:0}.seg button.on{background:var(--ac);color:var(--on);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:.72rem;padding:3px 9px;border:1px solid var(--bd);border-radius:20px;color:var(--mu)}
.chip[data-s=ready]{color:var(--ok);border-color:var(--ok)}.chip[data-s=fallback]{color:var(--er);border-color:var(--er)}
.stage{background:var(--pn);border:1px solid var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:240px;max-height:52vh;overflow:hidden;position:relative;padding:6px}
canvas{max-width:100%;max-height:calc(52vh - 14px);object-fit:contain;touch-action:none;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/16px 16px}
#empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--mu);padding:20px}#empty p{margin:0}#empty[hidden],canvas[hidden]{display:none}#dim{position:absolute;right:8px;bottom:6px;font-size:.7rem;color:var(--mu)}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.panel[hidden]{display:none}
#p-adj,#p-fil,#p-tool,#p-fx,#p-bg,#p-face,#p-exp{min-height:330px}
#tabs button{border-bottom:1px solid var(--bd)}#tabs button:nth-child(4n){border-right:0}#tabs button:nth-last-child(-n+3){border-bottom:0}
.row{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;margin:6px 0}
.row label{font-size:.85rem}.row output{font-size:.8rem;color:var(--mu);text-align:right}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.btn{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
.btn:hover,.btn.on{border-color:var(--ac)}.btn:disabled{opacity:.4;cursor:default}.btn.on{color:var(--ac);font-weight:700}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
footer{margin-top:0;padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--mu);font-size:.8rem;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--on);padding:8px 16px;border-radius:20px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Lum<span>ori</span></h1>
  <button id="themeBtn" class="theme-btn" aria-label="Change theme"></button>
</header>
<main>
  <div class="stage" id="stage"><div id="empty"><p>Open a photo to start editing</p><button class="btn pri" id="openBtn">Open photo</button><small>or drop an image here</small></div><canvas id="cv" aria-label="Photo preview" hidden></canvas><div id="crop" hidden><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i><i data-h="n"></i><i data-h="s"></i><i data-h="w"></i><i data-h="e"></i></div><span id="dim"></span></div>
  <div class="panel" id="cropbar" hidden><div class="grid" id="cnum" style="grid-template-columns:repeat(4,1fr)"><label>X<input type="number" id="cx" inputmode="numeric" min="0"></label><label>Y<input type="number" id="cy" inputmode="numeric" min="0"></label><label>W<input type="number" id="cw" inputmode="numeric" min="8"></label><label>H<input type="number" id="ch" inputmode="numeric" min="8"></label></div><div class="grid" id="cacts" style="margin:8px 0"><button class="btn" data-a="full">Full</button><button class="btn" data-a="center">Center</button><button class="btn" data-a="swap">⇄ Swap</button></div><div class="grid" id="ratios"><button class="btn on" data-r="0">Free</button><button class="btn" data-r="1">1:1</button><button class="btn" data-r="1.3333">4:3</button><button class="btn" data-r="1.7778">16:9</button><button class="btn" data-r="0.75">3:4</button><button class="btn" data-r="0.5625">9:16</button></div><div class="grid" style="margin-top:8px"><button class="btn" id="cropCancel">Cancel</button><button class="btn pri" id="cropOk">Apply crop</button></div></div>
  <div class="grid" id="urbar" style="margin-top:10px;grid-template-columns:1fr 1fr"><button class="btn" id="undoBtn" disabled>↶ Undo</button><button class="btn" id="redoBtn" disabled>↷ Redo</button></div>
  <div class="seg" id="tabs" style="margin-top:10px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)">
    <button data-p="adj" class="on" style="flex:1;padding:8px 2px">Adjust</button><button data-p="fil" style="flex:1;padding:8px 2px">Filters</button><button data-p="tool" style="flex:1;padding:8px 2px">Tools</button><button data-p="fx" style="flex:1;padding:8px 2px">Effects</button><button data-p="bg" style="flex:1;padding:8px 2px">Background</button><button data-p="face" style="flex:1;padding:8px 2px">Face</button><button data-p="exp" style="flex:1;padding:8px 2px">Export</button>
  </div>
  <section class="panel" id="p-adj"></section>
  <section class="panel" id="p-fil" hidden><div class="grid" id="fgrid"></div><button class="btn" id="frst" style="margin-top:8px;width:100%">Reset</button></section>
  <section class="panel" id="p-tool" hidden><div class="grid" id="tgrid"></div></section>
  <section class="panel" id="p-fx" hidden>
    <div class="row"><label for="fxs">Strength</label><input id="fxs" type="range" min="0" max="100" value="50"><output id="fxo">50</output></div>
    <div class="row"><label for="fxa">Angle</label><input id="fxa" type="range" min="0" max="180" value="0"><output id="fxao">0</output></div>
    <div class="row" style="grid-template-columns:96px 1fr"><label for="fxc">Splash colour</label><input id="fxc" type="color" value="#ff2d2d"></div>
    <div class="grid" id="fxgrid" style="margin-top:8px"></div>
    <button class="btn" id="fxrst" style="margin-top:8px;width:100%">Reset</button>
  </section>
  <section class="panel" id="p-bg" hidden>
    <div class="row"><label for="bgs">Strength</label><input id="bgs" type="range" min="0" max="100" value="50"><output id="bgo">50</output></div>
    <div class="row"><label for="bga">Angle</label><input id="bga" type="range" min="0" max="180" value="0"><output id="bgao">0</output></div>
    <div class="row" style="grid-template-columns:96px 1fr 1fr"><label>Colours</label><input id="bgc" type="color" value="#3b82f6"><input id="bgc2" type="color" value="#f472b6"></div>
    <div class="grid" id="bggrid" style="margin-top:8px"></div>
    <button class="btn" id="bgrst" style="margin-top:8px;width:100%">Reset</button>
  </section>
  <section class="panel" id="p-face" hidden>
    <div class="row"><label for="fas">Strength</label><input id="fas" type="range" min="0" max="100" value="50"><output id="fso">50</output></div>
    <div class="row"><label for="faa">Angle / side</label><input id="faa" type="range" min="-30" max="30" value="10"><output id="fao">10</output></div>
    <div class="grid" id="fagrid" style="margin-top:8px"></div>
    <button class="btn" id="farst" style="margin-top:8px;width:100%">Reset</button>
  </section>
  <section class="panel" id="p-exp" hidden>
    <div class="row" style="grid-template-columns:96px 1fr"><label for="fmt">Format</label>
      <select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div>
    <div class="row"><label for="q">Quality</label><input id="q" type="range" min="40" max="100" value="92"><output id="qo">92</output></div>
    <div class="grid" style="margin-top:8px"><button class="btn pri" id="save">⬇ Download</button><button class="btn" id="share">Share</button></div>
  </section>
  <input type="file" id="file" accept="image/*" hidden><input type="file" id="file2" accept="image/*" hidden><input type="file" id="file3" accept="image/*" hidden><input type="file" id="file4" accept="image/*" hidden>
</main>
<footer>
  <span>© Manik Roy <span id="yr">2026</span>. All Rights Reserved.</span>
</footer>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const CDN={cv:'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js',
 vips:'https://cdn.jsdelivr.net/npm/wasm-vips@0.0.11/lib/',ck:'https://cdn.jsdelivr.net/npm/canvaskit-wasm@0.39.1/bin/'};
const eng={cv:null,vips:null,ck:null},NAMES={cv:'OpenCV',vips:'libvips',ck:'Skia'};
const cvEl=$('#cv'),ctx=cvEl.getContext('2d',{willReadFrequently:true});
let base=null,orig=null,hist=[],redoS=[],preset='none',raf=0;
const adj={b:0,c:0,s:0,blur:0,sharp:0,denoise:0};
const MAXD=1600;

/* ---------- utils ---------- */
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)};
const chip=()=>{};
const mk=id=>{const c=document.createElement('canvas');c.width=id.width;c.height=id.height;c.getContext('2d').putImageData(id,0,0);return c};
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('script'));document.head.appendChild(s)});
const timeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);

/* ---------- theme + footer year ---------- */
const THEMES=[['dark','Dark+','☾'],['light','Light+','☀'],['oled','OLED','●'],['hc','HC','◐']];
function setTheme(t){const x=THEMES.find(a=>a[0]===t)||THEMES[0],b=$('#themeBtn');document.documentElement.dataset.theme=x[0];b.textContent=x[2];b.title='Theme: '+x[1]+' (tap to change)';b.setAttribute('aria-label',b.title);try{localStorage.setItem('lumio-theme',x[0])}catch(e){}}
let th=null;try{th=localStorage.getItem('lumio-theme')}catch(e){}
setTheme(th||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
$('#themeBtn').onclick=()=>{const i=THEMES.findIndex(a=>a[0]===document.documentElement.dataset.theme),n=THEMES[(i+1)%THEMES.length];setTheme(n[0]);toast(n[1])};
const year=()=>$('#yr').textContent=new Date().getFullYear();
year();setInterval(year,3600e3);document.addEventListener('visibilitychange',year);

/* ---------- engines (lazy, each falls back gracefully) ---------- */
let cvP=null;
async function initCV(){chip('cv','loading');try{
  await timeout(loadScript(CDN.cv),60000);
  const c=window.cv;if(c&&!c.Mat&&typeof c.then==='function')c.then(m=>{window.cv=m});
  await timeout(new Promise(ok=>{const t=setInterval(()=>{if(window.cv&&window.cv.Mat){clearInterval(t);ok()}},150)}),60000);
  eng.cv=window.cv;chip('cv','ready')}catch(e){chip('cv','fallback')}render()}
async function initVips(){try{
  await timeout(loadScript(CDN.vips+'vips.js'),40000);
  eng.vips=await timeout(window.Vips({dynamicLibraries:[],locateFile:f=>CDN.vips+f}),40000);chip('vips','ready')}catch(e){chip('vips','fallback')}}
async function initCK(){try{
  await timeout(loadScript(CDN.ck+'canvaskit.js'),40000);
  eng.ck=await timeout(window.CanvasKitInit({locateFile:f=>CDN.ck+f}),40000);chip('ck','ready')}catch(e){chip('ck','fallback')}render()}

/* ---------- Skia / JS colour matrix ---------- */
const sat=s=>{const[l,g,b]=[.2126,.7152,.0722];return[[l*(1-s)+s,g*(1-s),b*(1-s)],[l*(1-s),g*(1-s)+s,b*(1-s)],[l*(1-s),g*(1-s),b*(1-s)+s]]};
const mul=(A,B)=>A.map(r=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
const ID=[[1,0,0],[0,1,0],[0,0,1]];
const PRE={none:ID,bw:sat(0),sepia:[[.393,.769,.189],[.349,.686,.168],[.272,.534,.131]],vivid:sat(1.6),warm:[[1.1,0,0],[0,1,0],[0,0,.88]],cool:[[.88,0,0],[0,1,0],[0,0,1.12]],edges:ID};
function matrix(){
  const k=1+adj.c/100,M=mul(PRE[preset],sat(1+adj.s/100)),off=.5*(1-k)+adj.b/100,m=[];
  M.forEach(r=>m.push(r[0]*k,r[1]*k,r[2]*k,0,off));m.push(0,0,0,1,0);return m}
function skia(id,m){
  const K=eng.ck,w=id.width,h=id.height,img=K.MakeImageFromCanvasImageSource(mk(id)),sf=K.MakeSurface(w,h),p=new K.Paint();
  p.setColorFilter(K.ColorFilter.MakeMatrix(m));sf.getCanvas().drawImage(img,0,0,p);sf.flush();
  const px=sf.makeImageSnapshot().readPixels(0,0,{width:w,height:h,colorType:K.ColorType.RGBA_8888,alphaType:K.AlphaType.Unpremul,colorSpace:K.ColorSpace.SRGB});
  img.delete();sf.delete();p.delete();return new ImageData(new Uint8ClampedArray(px),w,h)}
function jsColor(id,m){
  const o=new ImageData(new Uint8ClampedArray(id.data),id.width,id.height),d=o.data,c=v=>v<0?0:v>255?255:v;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];
    d[i]=c(m[0]*r+m[1]*g+m[2]*b+m[4]*255);d[i+1]=c(m[5]*r+m[6]*g+m[7]*b+m[9]*255);d[i+2]=c(m[10]*r+m[11]*g+m[12]*b+m[14]*255)}
  return o}
function color(id){const m=matrix();if(eng.ck){try{return skia(id,m)}catch(e){}}return jsColor(id,m)}

/* ---------- OpenCV stage ---------- */
function cvStage(id){
  if(!(adj.blur||adj.sharp||adj.denoise||preset==='edges'))return id;
  if(!eng.cv){if(!cvP)cvP=initCV();return id}
  const c=eng.cv,del=[],M=()=>{const m=new c.Mat();del.push(m);return m};
  try{
    let cur=c.matFromImageData(id);del.push(cur);c.cvtColor(cur,cur,c.COLOR_RGBA2RGB);
    if(adj.denoise){const o=M();c.bilateralFilter(cur,o,7,adj.denoise*1.5,adj.denoise*1.5);cur=o}
    if(adj.blur){const o=M(),k=adj.blur*2+1;c.GaussianBlur(cur,o,new c.Size(k,k),0);cur=o}
    if(adj.sharp){const o=M(),bl=M(),a=adj.sharp/50;c.GaussianBlur(cur,bl,new c.Size(0,0),1.5);c.addWeighted(cur,1+a,bl,-a,0,o);cur=o}
    if(preset==='edges'){const g=M(),e=M();c.cvtColor(cur,g,c.COLOR_RGB2GRAY);c.Canny(g,e,60,140);c.bitwise_not(e,e);c.cvtColor(e,e,c.COLOR_GRAY2RGB);cur=e}
    const rgba=M();c.cvtColor(cur,rgba,c.COLOR_RGB2RGBA);
    return new ImageData(new Uint8ClampedArray(rgba.data),id.width,id.height)
  }catch(e){return id}finally{del.forEach(m=>{try{m.delete()}catch(e){}})}}

/* ---------- render ---------- */
function process(){return color(cvStage(base))}
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  if(!base)return;$('#cv').hidden=false;$('#empty').hidden=true;const id=process();cvEl.width=id.width;cvEl.height=id.height;ctx.putImageData(id,0,0);$('#dim').textContent=id.width+'×'+id.height;if(crop)cropShow()})}

/* ---------- geometry (libvips, canvas fallback) ---------- */
function geoCanvas(op){
  const w=base.width,h=base.height,s=mk(base),c=document.createElement('canvas'),g=c.getContext('2d');
  if(op==='r90'||op==='r270'){c.width=h;c.height=w;g.translate(h/2,w/2);g.rotate(op==='r90'?Math.PI/2:-Math.PI/2);g.drawImage(s,-w/2,-h/2)}
  else if(op==='fh'||op==='fv'){c.width=w;c.height=h;g.translate(op==='fh'?w:0,op==='fv'?h:0);g.scale(op==='fh'?-1:1,op==='fv'?-1:1);g.drawImage(s,0,0)}
  else if(op==='sq'){const m=Math.min(w,h);c.width=c.height=m;g.drawImage(s,(w-m)/2,(h-m)/2,m,m,0,0,m,m)}
  else if(op==='crop'){const q=cropPx;c.width=q.w;c.height=q.h;g.drawImage(s,q.x,q.y,q.w,q.h,0,0,q.w,q.h)}
  else{c.width=Math.max(1,w>>1);c.height=Math.max(1,h>>1);g.drawImage(s,0,0,c.width,c.height)}
  return g.getImageData(0,0,c.width,c.height)}
function geoVips(op){
  const v=eng.vips;let im=v.Image.newFromMemory(new Uint8Array(base.data.buffer.slice(0)),base.width,base.height,4,v.BandFormat.uchar),n;
  if(op==='r90')n=im.rot('d90');else if(op==='r270')n=im.rot('d270');
  else if(op==='fh')n=im.flip('horizontal');else if(op==='fv')n=im.flip('vertical');
  else if(op==='sq'){const m=Math.min(im.width,im.height);n=im.extractArea((im.width-m)>>1,(im.height-m)>>1,m,m)}
  else if(op==='crop')n=im.extractArea(cropPx.x,cropPx.y,cropPx.w,cropPx.h);
  else n=im.resize(.5);
  const o=n.writeToMemory(),r=new ImageData(new Uint8ClampedArray(o),n.width,n.height);n.delete();im.delete();return r}
function geo(op){
  if(!base)return;let r;
  if(eng.vips){try{r=geoVips(op)}catch(e){r=null}}
  if(!r)r=geoCanvas(op);

$('#fagrid').innerHTML=[['fa_rev','Reverse Head Movement'],['fa_l2r','Left-to-Right Head Turn'],['fa_r2l','Right-to-Left Head Turn'],['fa_tilt','Head Tilt'],['fa_rot','Face Rotation'],['fa_dir','Face Direction Changer'],['fa_gaze','Eye Gaze Direction'],['fa_contact','Eye Contact Correction'],['fa_smile','Smile'],['fa_brow','Eyebrow Movement'],['fa_mouth','Mouth Expression Change'],['fa_blink','Blink Effect'],['fa_sym','Face Symmetry Adjustment'],['fa_xfer','Facial Expression Transfer'],['fa_depth','Portrait Depth Reconstruction']].map(([k,l])=>`<button class="btn" data-x="${k}">${l}</button>`).join('');
$('#fagrid').onclick=async e=>{const k=e.target.dataset.x;if(!k)return;if(!base){toast('Open a photo first');return}endCrop();if(liq)liquifyOn();if(k==='fa_xfer'){toast('Choose a photo with the expression to copy');$('#file4').click();return}
  toast('Working\u2026');await new Promise(r=>setTimeout(r,30));try{const r=await FA[k]();if(r){commit(r);toast('Done')}}catch(err){toast('Effect failed')}};
$('#file4').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=async()=>{URL.revokeObjectURL(u);toast('Working\u2026');try{const r=await xfer(i);if(r){commit(r);toast('Done')}}catch(err){toast('Effect failed')}};i.src=u};
$('#farst').onclick=()=>{fxUndo();$('#fas').value=50;$('#fso').textContent=50;$('#faa').value=10;$('#fao').textContent=10;toast('Face effects reset')};
$('#p-face').addEventListener('input',e=>{if(e.target.id==='fas')$('#fso').textContent=e.target.value;if(e.target.id==='faa')$('#fao').textContent=e.target.value});

const SL=[['b','Brightness',-100,100],['c','Contrast',-60,100],['s','Saturation',-100,100],['blur','Blur',0,10],['sharp','Sharpen',0,100],['denoise','Denoise',0,50]];
$('#p-adj').innerHTML=SL.map(([k,l,a,b])=>`<div class="row"><label for="s-${k}">${l}</label><input id="s-${k}" data-k="${k}" type="range" min="${a}" max="${b}" value="0"><output id="o-${k}">0</output></div>`).join('')+
 '<div class="grid" style="margin-top:8px"><button class="btn" id="rst">Reset</button><button class="btn pri" id="bake">Apply edits</button></div>';
$('#p-adj').oninput=e=>{const k=e.target.dataset.k;if(!k)return;adj[k]=+e.target.value;$('#o-'+k).textContent=e.target.value;render()};
function resetSliders(){Object.keys(adj).forEach(k=>{adj[k]=0;$('#s-'+k).value=0;$('#o-'+k).textContent=0})}
function resetAdj(){resetSliders();setPreset('none')}
function setPreset(p){preset=p;$$('#fgrid .btn').forEach(b=>b.classList.toggle('on',b.dataset.f===p))}
$('#fgrid').innerHTML=[['none','Original'],['bw','B&W'],['sepia','Sepia'],['vivid','Vivid'],['warm','Warm'],['cool','Cool'],['edges','Edges']].map(([k,l])=>`<button class="btn" data-f="${k}">${l}</button>`).join('');
$('#fgrid').onclick=e=>{if(e.target.dataset.f){push();setPreset(e.target.dataset.f);render()}};
$('#frst').onclick=()=>{push();setPreset('none');render()};
$('#tgrid').innerHTML=[['r270','⟲ Rotate left'],['r90','⟳ Rotate right'],['fh','↔ Reverse Head Movement'],['fv','⇅ Flip V'],['crop','✂ Crop'],['sq','Square crop'],['half','Half size'],['undo','Undo'],['reset','Reset'],['open','Open photo']].map(([k,l])=>`<button class="btn" data-o="${k}">${l}</button>`).join('');
$('#tgrid').onclick=e=>{const o=e.target.dataset.o;if(!o)return;if(o!=='crop')endCrop();
  if(o==='undo'){undo();}
  else if(o==='reset'){if(liq)liquifyOn();if(orig){push();base=orig;mc=null;fxSnap=null;resetAdj();render()}}
  else if(o==='open')$('#file').click();else if(o==='crop')startCrop();else geo(o)};
let adjDirty=false;
$('#p-adj').addEventListener('input',e=>{if(e.target.dataset.k&&!adjDirty){push();adjDirty=true}},true);
$('#p-adj').addEventListener('change',()=>{adjDirty=false});
$('#p-adj').addEventListener('click',e=>{if(e.target.id==='rst'){push();resetSliders();render()}if(e.target.id==='bake')bake()});
$('#openBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>openFile(e.target.files[0]);
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();openFile(e.dataTransfer.files[0])});
$('#tabs').onclick=e=>{const p=e.target.dataset.p;if(!p)return;$$('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));$$('.panel[id^=p-]').forEach(x=>x.hidden=x.id!=='p-'+p)};
$('#q').oninput=e=>$('#qo').textContent=e.target.value;
function flat(){const c=cv2(cvEl.width,cvEl.height),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(cvEl,0,0);return c}
function save(share){
  if(!base)return;const f=$('#fmt').value,q=$('#q').value/100;
  (f==='image/jpeg'?flat():cvEl).toBlob(async b=>{const file=new File([b],'lumori.'+f.split('/')[1],{type:f});
    if(share){if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}}else toast('Sharing not supported here');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded')},f,q)}
$('#save').onclick=()=>save(false);$('#share').onclick=()=>save(true);

$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||/INPUT|SELECT/.test(e.target.tagName)&&e.target.type!=='range')return;const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}});
initCK();initVips();
