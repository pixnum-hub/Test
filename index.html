<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101827">
<title>FlightTrack Pro</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
:root{
 --bg:#edf2f7;--card:#fff;--text:#172033;--muted:#667085;
 --line:#d6dce6;--accent:#1769e0
}
[data-theme=dark]{
 --bg:#101827;--card:#182235;--text:#f7f9fc;
 --muted:#aeb8c8;--line:#303b50
}
[data-theme=oled]{
 --bg:#000;--card:#050505;--text:#fff;
 --muted:#aaa;--line:#292929
}
[data-theme=hc]{
 --bg:#000;--card:#fff;--text:#000;
 --muted:#111;--line:#000;--accent:#00e
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;text-align:center
}
.app{
 width:min(100%,760px);margin:auto;padding:10px;
 display:flex;flex-direction:column;gap:9px
}
header,.panel,.stats,.flight{
 background:var(--card);border:1px solid var(--line);
 border-radius:16px;padding:13px
}
h1{margin:0;font-size:25px}
.sub{margin-top:5px;color:var(--muted);font-size:12px}
.controls{display:flex;flex-direction:column;gap:7px}
input,button{
 width:100%;min-height:44px;padding:9px;
 border:1px solid var(--line);border-radius:10px;
 background:var(--card);color:var(--text);font-size:14px
}
button{
 background:var(--accent);color:white;border:0;
 font-weight:bold
}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.modes button{font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{
 border:1px solid var(--line);border-radius:10px;padding:8px
}
.stat b{display:block;font-size:18px}
.stat span{font-size:10px;color:var(--muted)}
#map{
 width:100%;height:390px;border-radius:16px;
 overflow:hidden;border:1px solid var(--line)
}
.status{
 padding:10px;border-radius:10px;
 font-size:12px;color:var(--muted)
}
#status.live{color:#07883b}
#status.error{color:#d11}
.flight{
 text-align:left;cursor:pointer
}
.flight b{font-size:16px}
.flight small{
 color:var(--muted);line-height:1.7
}
.tag{
 display:inline-block;background:var(--accent);
 color:#fff;border-radius:20px;
 padding:3px 7px;font-size:9px;margin-left:5px
}
footer{
 padding:8px;color:var(--muted);font-size:10px
}
@media(max-width:450px){
 #map{height:330px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .modes{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="app">

<header>
 <h1>✈️ FlightTrack Pro</h1>
 <div class="sub">Live ADS-B Aircraft Tracker</div>
</header>

<div class="panel controls">

<input id="search"
placeholder="Search callsign, ICAO or registration">

<button onclick="loadFlights()">
 🔄 Get Live Aircraft
</button>

<button onclick="startLive()">
 ▶️ Start Live Tracking
</button>

<button onclick="stopLive()">
 ⏹ Stop Live Tracking
</button>

<button onclick="locateMe()">
 📍 Center On My Location
</button>

<div class="modes">
<button onclick="theme('light')">☀️ Light</button>
<button onclick="theme('dark')">🌙 Dark</button>
<button onclick="theme('oled')">⚫ OLED</button>
<button onclick="theme('hc')">♿ HC</button>
</div>

</div>

<div class="stats">
<div class="stat"><b id="total">0</b><span>AIRCRAFT</span></div>
<div class="stat"><b id="air">0</b><span>IN AIR</span></div>
<div class="stat"><b id="ground">0</b><span>GROUND</span></div>
<div class="stat"><b id="updated">--</b><span>UPDATED</span></div>
</div>

<div id="map"></div>

<div class="panel">
<b>Connection</b>
<div id="status" class="status">
Ready — press Get Live Aircraft.
</div>
</div>

<div class="panel">
<b>Aircraft Details</b>
<div id="details" class="status">
Select an aircraft marker or flight.
</div>
</div>

<div id="list"></div>

<footer>
© Manik Roy <span id="year"></span>. All Rights Reserved.
</footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const API="https://api.adsb.lol/v2";
let map;
let markers=[];
let planes=[];
let timer=null;
let busy=false;

let center={
 lat:22.5726,
 lon:88.3639
};

function init(){

 map=L.map("map").setView(
  [center.lat,center.lon],6
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:18,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);

 document.getElementById("year").textContent=
  new Date().getFullYear();

 theme(
  localStorage.getItem("flightTheme")||"dark"
 );
}

function theme(t){
 document.documentElement.dataset.theme=t;
 localStorage.setItem("flightTheme",t);
}

function status(msg,type=""){
 const x=document.getElementById("status");
 x.textContent=msg;
 x.className="status "+type;
}

function clean(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function altitude(x){
 if(x==="ground")return"Ground";
 if(x==null)return"N/A";
 return Math.round(Number(x)*0.3048)+" m";
}

function speed(x){
 if(x==null)return"N/A";
 return Math.round(Number(x)*1.852)+" km/h";
}

function heading(x){
 if(x==null)return"N/A";
 return Math.round(Number(x))+"°";
}

function normalize(a){

 return{
  hex:a.hex||"",
  flight:(a.flight||"UNKNOWN").trim(),
  reg:a.r||"N/A",
  type:a.t||"N/A",
  lat:a.lat,
  lon:a.lon,
  alt:a.alt_baro,
  gs:a.gs,
  track:a.track,
  ground:a.alt_baro==="ground"
 };
}

function clearMarkers(){

 markers.forEach(m=>map.removeLayer(m));
 markers=[];
}

function draw(){

 clearMarkers();

 planes.forEach((p,i)=>{

  if(p.lat==null||p.lon==null)return;

  const m=L.marker(
   [p.lat,p.lon]
  ).addTo(map);

  m.bindPopup(
   "<b>✈️ "+clean(p.flight)+"</b><br>"+
   "ICAO: "+clean(p.hex)+"<br>"+
   "Registration: "+clean(p.reg)+"<br>"+
   "Type: "+clean(p.type)+"<br>"+
   "Altitude: "+altitude(p.alt)+"<br>"+
   "Speed: "+speed(p.gs)+"<br>"+
   "Heading: "+heading(p.track)
  );

  m.on("click",()=>details(i));

  markers.push(m);
 });
}

function details(i){

 const p=planes[i];

 if(!p)return;

 document.getElementById("details").innerHTML=
 "<b>✈️ "+clean(p.flight)+"</b><br>"+
 "ICAO24: "+clean(p.hex)+"<br>"+
 "Registration: "+clean(p.reg)+"<br>"+
 "Aircraft: "+clean(p.type)+"<br>"+
 "Latitude: "+Number(p.lat).toFixed(4)+"<br>"+
 "Longitude: "+Number(p.lon).toFixed(4)+"<br>"+
 "Altitude: "+altitude(p.alt)+"<br>"+
 "Speed: "+speed(p.gs)+"<br>"+
 "Heading: "+heading(p.track)+"<br>"+
 "Status: "+(p.ground?"On Ground":"In Flight");
}

function render(){

 const q=document
  .getElementById("search")
  .value.toLowerCase();

 const list=planes.filter(p=>
  !q||
  p.flight.toLowerCase().includes(q)||
  p.hex.toLowerCase().includes(q)||
  p.reg.toLowerCase().includes(q)
 );

 document.getElementById("list").innerHTML=
 list.slice(0,100).map(p=>{

  const i=planes.indexOf(p);

  return `
  <div class="flight" onclick="details(${i})">
   <b>✈️ ${clean(p.flight)}</b>
   <span class="tag">
    ${p.ground?"GROUND":"AIR"}
   </span>
   <br>
   <small>
    ICAO: ${clean(p.hex)}<br>
    Reg: ${clean(p.reg)} |
    Type: ${clean(p.type)}<br>
    Alt: ${altitude(p.alt)} |
    Speed: ${speed(p.gs)} |
    HDG: ${heading(p.track)}
   </small>
  </div>`;
 }).join("");

 document.getElementById("total").textContent=
  planes.length;

 document.getElementById("air").textContent=
  planes.filter(p=>!p.ground).length;

 document.getElementById("ground").textContent=
  planes.filter(p=>p.ground).length;
}

async function loadFlights(){

 if(busy){
  status("A request is already running.");
  return;
 }

 busy=true;
 status("Connecting to ADSB.lol…");

 /*
  Radius is nautical miles.
  250nm is the maximum documented radius.
 */
 const url=
  API+
  "/lat/"+center.lat+
  "/lon/"+center.lon+
  "/dist/250";

 try{

  const response=await fetch(
   url,
   {
    method:"GET",
    cache:"no-store"
   }
  );

  if(!response.ok){
   throw new Error(
    "HTTP "+response.status
   );
  }

  const data=await response.json();

  const raw=
   Array.isArray(data.ac)?
   data.ac:
   Array.isArray(data.aircraft)?
   data.aircraft:
   [];

  planes=raw
   .map(normalize)
   .filter(p=>
    p.lat!=null&&
    p.lon!=null
   );

  draw();
  render();

  document.getElementById("updated")
   .textContent=
   new Date().toLocaleTimeString();

  status(
   "LIVE • "+planes.length+
   " aircraft received",
   "live"
  );

 }catch(e){

  console.error(e);

  status(
   "Live API unavailable: "+
   e.message+
   ". Try again later.",
   "error"
  );

 }finally{

  busy=false;
 }
}

function startLive(){

 if(timer){
  status("Live tracking is already running.");
  return;
 }

 loadFlights();

 timer=setInterval(
  loadFlights,
  30000
 );

 status(
  "LIVE TRACKING ON • Refreshing every 30 seconds."
 );
}

function stopLive(){

 if(timer){
  clearInterval(timer);
  timer=null;
 }

 status(
  "Live tracking stopped. Manual refresh remains available."
 );
}

function locateMe(){

 if(!navigator.geolocation){

  status(
   "Geolocation is not supported.",
   "error"
  );

  return;
 }

 status("Requesting your location…");

 navigator.geolocation.getCurrentPosition(

  pos=>{

   center.lat=
    Number(pos.coords.latitude.toFixed(4));

   center.lon=
    Number(pos.coords.longitude.toFixed(4));

   map.setView(
    [center.lat,center.lon],
    7
   );

   L.circleMarker(
    [center.lat,center.lon],
    {
     radius:8,
     color:"#1769e0",
     fillOpacity:.9
    }
   )
   .addTo(map)
   .bindPopup("📍 Your location")
   .openPopup();

   status(
    "Location set. Press Get Live Aircraft."
   );
  },

  ()=>{
   status(
    "Location permission denied.",
    "error"
   );
  }
 );
}

document
 .getElementById("search")
 .addEventListener(
  "input",
  render
 );

init();
</script>

</body>
</html>
