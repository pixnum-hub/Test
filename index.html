<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TUNE — Free Internet Radio</title>
<style>
  :root{
    --radius:14px;
    --gap:14px;
  }
  html[data-theme="dark"]{
    --bg:#15130f; --panel:#1e1b16; --panel2:#262218; --edge:#332e22;
    --fg:#f2ead9; --muted:#a89e8a; --accent:#e8a33d; --accent2:#4fa39a; --danger:#e35c5c;
  }
  html[data-theme="light"]{
    --bg:#f4efe4; --panel:#ffffff; --panel2:#efe8d8; --edge:#ddd3ba;
    --fg:#221e15; --muted:#736a56; --accent:#c1721f; --accent2:#217d76; --danger:#c94848;
  }
  html[data-theme="oled"]{
    --bg:#000000; --panel:#0a0a0a; --panel2:#111111; --edge:#232323;
    --fg:#f5f5f5; --muted:#8f8f8f; --accent:#ffb547; --accent2:#56d6c9; --danger:#ff6b6b;
  }
  html[data-theme="hc"]{
    --bg:#000000; --panel:#000000; --panel2:#000000; --edge:#ffffff;
    --fg:#ffffff; --muted:#ffffff; --accent:#ffff00; --accent2:#00ffff; --danger:#ff3b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    transition:background .25s,color .25s;
  }
  .app{max-width:640px;margin:0 auto;width:100%;padding:16px;flex:1;display:flex;flex-direction:column;gap:var(--gap);}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:22px;letter-spacing:2px;margin:0;font-weight:800;}
  .brand span{color:var(--accent);}
  .theme-btn{
    background:var(--panel);border:1px solid var(--edge);color:var(--fg);
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
  }
  .theme-btn:active{transform:scale(.94);}
  .deck{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:16px;}
  .lcd{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;}
  .lcd-row{display:flex;align-items:center;gap:8px;overflow:hidden;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;}
  .dot.live{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .marquee{overflow:hidden;white-space:nowrap;flex:1;}
  #stationName{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;letter-spacing:.5px;}
  .lcd-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;}
  .eq{display:flex;align-items:flex-end;gap:3px;height:20px;margin-top:10px;}
  .eq i{width:4px;background:var(--accent2);border-radius:2px;height:4px;}
  .eq.playing i{animation:bounce 900ms ease-in-out infinite;}
  .eq i:nth-child(2){animation-delay:.1s;} .eq i:nth-child(3){animation-delay:.2s;}
  .eq i:nth-child(4){animation-delay:.3s;} .eq i:nth-child(5){animation-delay:.15s;}
  @keyframes bounce{0%,100%{height:4px;}50%{height:18px;}}
  .controls{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .play-btn{
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:#111;border:none;
    font-size:20px;cursor:pointer;flex:none;
  }
  .play-btn:active{transform:scale(.95);}
  input[type="range"]{flex:1;accent-color:var(--accent);}
  .search-wrap input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--edge);
    background:var(--panel);color:var(--fg);font-size:15px;
  }
  .search-wrap input:focus{outline:2px solid var(--accent);}
  .tabs{display:flex;gap:8px;margin-bottom:8px;}
  .tab{
    background:transparent;border:1px solid var(--edge);color:var(--muted);
    padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;
  }
  .tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600;}
  .list-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
  .station-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;max-height:46vh;}
  .station-list li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px;border-bottom:1px solid var(--edge);cursor:pointer;
  }
  .station-list li:active{background:var(--panel2);}
  .station-list li.hint{color:var(--muted);justify-content:center;cursor:default;}
  .st-name{font-size:14px;font-weight:600;}
  .st-tags{font-size:11px;color:var(--muted);}
  .st-play{color:var(--accent2);font-size:16px;flex:none;}
  .footer{
    text-align:center;padding:16px 8px 10px;color:var(--muted);font-size:12px;
    display:flex;align-items:center;justify-content:center;min-height:40px;
  }
  @media (min-width:600px){
    .app{padding:24px;}
    .station-list{max-height:52vh;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1 class="brand">TUNE<span>.</span></h1>
    <button id="themeBtn" class="theme-btn" aria-label="Toggle theme">◐</button>
  </header>

  <section class="deck">
    <div class="lcd">
      <div class="lcd-row">
        <span class="dot" id="liveDot"></span>
        <div class="marquee"><span id="stationName">Select a station to tune in</span></div>
      </div>
      <div class="lcd-meta">
        <span id="stationTags">—</span>
        <span id="stationBitrate">—</span>
      </div>
      <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="controls">
      <button id="playBtn" class="play-btn" aria-label="Play or pause">▶</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
    </div>
  </section>

  <section class="search-wrap">
    <input id="searchInput" type="search" placeholder="Search station, genre, or country…">
  </section>

  <section class="list-wrap">
    <div class="tabs">
      <button class="tab active" data-mode="top">Popular</button>
      <button class="tab" data-mode="search">Results</button>
    </div>
    <ul id="stationList" class="station-list"><li class="hint">Loading stations…</li></ul>
  </section>

  <footer class="footer">
    <p>© Manik Roy <span id="year"></span>. All Rights Reserved.</p>
  </footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
  // ---------- Theme ----------
  const THEMES = ['dark','light','oled','hc'];
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  let theme = localStorage.getItem('tune-theme') || 'dark';
  applyTheme(theme);
  function applyTheme(t){
    root.setAttribute('data-theme', t);
    localStorage.setItem('tune-theme', t);
    themeBtn.textContent = {dark:'◐',light:'☀',oled:'●',hc:'◆'}[t];
  }
  themeBtn.addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme)+1) % THEMES.length];
    applyTheme(theme);
  });

  // ---------- Footer year ----------
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---------- Radio Browser API (free, no key/signup) ----------
  const HOSTS = [
    'https://de1.api.radio-browser.info',
    'https://at1.api.radio-browser.info',
    'https://nl1.api.radio-browser.info'
  ];
  async function apiFetch(path){
    for (const h of HOSTS){
      try{
        const res = await fetch(h + path, { headers:{'User-Agent':'TuneRadioApp/1.0'} });
        if (res.ok) return await res.json();
      }catch(e){ /* try next host */ }
    }
    return [];
  }

  const listEl = document.getElementById('stationList');
  const tabs = document.querySelectorAll('.tab');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const eq = document.getElementById('eq');
  const liveDot = document.getElementById('liveDot');
  const nameEl = document.getElementById('stationName');
  const tagsEl = document.getElementById('stationTags');
  const bitrateEl = document.getElementById('stationBitrate');
  const volume = document.getElementById('volume');

  let topStations = [];
  let searchStations = [];
  let activeMode = 'top';

  function render(stations){
    listEl.innerHTML = '';
    if (!stations.length){
      listEl.innerHTML = '<li class="hint">No stations found.</li>';
      return;
    }
    stations.forEach(st => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <div class="st-name">${escapeHtml(st.name || 'Untitled station')}</div>
          <div class="st-tags">${escapeHtml((st.tags||'').split(',').slice(0,3).join(' · ') || st.country || '')}</div>
        </div>
        <span class="st-play">▶</span>`;
      li.addEventListener('click', () => playStation(st));
      listEl.appendChild(li);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadTop(){
    listEl.innerHTML = '<li class="hint">Loading stations…</li>';
    topStations = await apiFetch('/json/stations/topclick/40');
    if (activeMode === 'top') render(topStations);
  }

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(async () => {
      if (!q){ setMode('top'); return; }
      setMode('search');
      listEl.innerHTML = '<li class="hint">Searching…</li>';
      searchStations = await apiFetch('/json/stations/search?limit=40&hidebroken=true&order=clickcount&reverse=true&name=' + encodeURIComponent(q));
      if (activeMode === 'search') render(searchStations);
    }, 450);
  });

  tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
  function setMode(mode){
    activeMode = mode;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    render(mode === 'top' ? topStations : searchStations);
  }

  async function playStation(st){
    nameEl.textContent = st.name || 'Loading…';
    tagsEl.textContent = (st.tags || st.country || '—').split(',').slice(0,3).join(' · ');
    bitrateEl.textContent = st.bitrate ? st.bitrate + ' kbps' : '—';
    try{
      const resolved = await apiFetch('/json/url/' + st.stationuuid);
      const streamUrl = (resolved && resolved.url) ? resolved.url : st.url_resolved || st.url;
      audio.src = streamUrl;
      await audio.play();
      setPlaying(true);
    }catch(err){
      nameEl.textContent = 'Could not play "' + (st.name || 'station') + '"';
      setPlaying(false);
    }
  }

  function setPlaying(isPlaying){
    playBtn.textContent = isPlaying ? '❚❚' : '▶';
    eq.classList.toggle('playing', isPlaying);
    liveDot.classList.toggle('live', isPlaying);
  }

  playBtn.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused){ audio.play(); setPlaying(true); }
    else { audio.pause(); setPlaying(false); }
  });
  audio.addEventListener('waiting', () => nameEl.textContent && liveDot.classList.remove('live'));
  audio.addEventListener('playing', () => liveDot.classList.add('live'));
  audio.addEventListener('error', () => setPlaying(false));

  volume.addEventListener('input', () => { audio.volume = parseFloat(volume.value); });
  audio.volume = parseFloat(volume.value);

  loadTop();
</script>
</body>
</html>
