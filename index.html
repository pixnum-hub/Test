<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Aperture — Camera</title>
<style>
  :root{
    --bg:#121214; --surface:#1c1c1f; --text:#f2f0eb; --sub:#9a978f;
    --accent:#d4a24c; --border:#2c2c30; --danger:#e2574c; --shutter:#f2f0eb;
  }
  [data-theme="light"]{
    --bg:#f4f2ee; --surface:#ffffff; --text:#1c1a17; --sub:#6b675f;
    --accent:#b8823a; --border:#e2ded4; --danger:#c0392b; --shutter:#1c1a17;
  }
  [data-theme="oled"]{
    --bg:#000000; --surface:#000000; --text:#ffffff; --sub:#8e8b85;
    --accent:#d4a24c; --border:#151515; --danger:#ff6b5e; --shutter:#ffffff;
  }
  [data-theme="hc"]{
    --bg:#000000; --surface:#000000; --text:#ffffff; --sub:#ffffff;
    --accent:#ffe100; --border:#ffffff; --danger:#ff4136; --shutter:#ffe100;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    overscroll-behavior:none; transition:background .25s,color .25s;
  }
  .mono{font-family:"SF Mono",ui-monospace,"Courier New",monospace; letter-spacing:.03em;}

  /* --- Film-strip sprocket border, the app's signature element --- */
  .sprockets{
    height:14px; flex-shrink:0; background-color:var(--accent);
    background-image:radial-gradient(circle at 10px 7px, var(--bg) 4.2px, transparent 4.6px);
    background-size:20px 14px; background-repeat:repeat-x;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .iconbtn{
    background:transparent; border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:10px; font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.92);}
  .headerbtns{display:flex; gap:8px;}

  main{
    flex:1; position:relative; background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center; min-height:0;
  }
  #video{width:100%; height:100%; object-fit:cover; display:block;}
  #canvas{display:none;}
  .flash-anim{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .flash-anim.on{animation:flash .28s ease-out;}
  @keyframes flash{0%{opacity:.9;} 100%{opacity:0;}}

  .status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:#eee; font-size:14px; background:#000;
  }
  .status.hidden{display:none;}

  .readout{
    position:absolute; top:12px; left:12px; font-size:11px; color:#eee;
    background:rgba(0,0,0,.35); padding:4px 8px; border-radius:6px;
  }

  footer.controls{
    background:var(--surface); border-top:1px solid var(--border);
    padding:12px 14px 16px; flex-shrink:0;
  }
  .strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}
  .thumb{
    width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0;
    border:1px solid var(--border); cursor:pointer;
  }
  .empty-note{font-size:12px; color:var(--sub); padding:4px 2px 10px;}

  .shutter-row{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  }
  .last-thumb-wrap{justify-self:start;}
  .last-thumb{
    width:44px; height:44px; border-radius:9px; object-fit:cover;
    border:1px solid var(--border); cursor:pointer; background:var(--bg);
  }
  #shutter{
    width:74px; height:74px; border-radius:50%; background:transparent;
    border:3px solid var(--shutter); display:flex; align-items:center; justify-content:center;
    cursor:pointer; justify-self:center;
  }
  #shutter .inner{width:58px; height:58px; border-radius:50%; background:var(--shutter);}
  #shutter:active .inner{width:50px; height:50px;}
  .flip-btn{justify-self:end;}

  .site-footer{
    text-align:center; font-size:11px; color:var(--sub);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:8px 10px 12px; background:var(--surface);
  }

  /* Modal */
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.9); display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:20;
  }
  .modal.open{display:flex;}
  .modal img{max-width:92vw; max-height:70vh; border-radius:10px;}
  .modal .row{display:flex; gap:10px;}
  .modal a, .modal button{
    text-decoration:none; padding:10px 16px; border-radius:8px; font-size:13px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;
  }
  .modal .del{color:var(--danger); border-color:var(--danger);}
</style>
</head>
<body data-theme="dark">

<div class="sprockets"></div>

<header>
  <div class="brand"><span class="dot"></span>Aperture</div>
  <div class="headerbtns">
    <button class="iconbtn" id="flashBtn" title="Torch" hidden>⚡</button>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
  </div>
</header>

<main>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="flash-anim" id="flashAnim"></div>
  <div class="readout mono" id="readout">f/1.8 · READY</div>
  <div class="status" id="status">Requesting camera access…</div>
</main>

<div class="sprockets"></div>

<footer class="controls">
  <div class="strip" id="strip"></div>
  <div class="empty-note" id="emptyNote">No shots yet — tap the shutter to capture.</div>
  <div class="shutter-row">
    <div class="last-thumb-wrap">
      <img class="last-thumb" id="lastThumb" hidden alt="Last photo">
    </div>
    <button id="shutter" title="Capture"><span class="inner"></span></button>
    <button class="iconbtn flip-btn" id="flipBtn" title="Switch camera">⟲</button>
  </div>
</footer>

<div class="site-footer">
  <div>© <span id="year"></span> Manik Roy. All Rights Reserved.</div>
</div>

<div class="modal" id="modal">
  <img id="modalImg" alt="Captured photo">
  <div class="row">
    <a id="downloadLink" download="aperture-photo.jpg">Download</a>
    <button class="del" id="deleteBtn">Delete</button>
    <button id="closeModal">Close</button>
  </div>
</div>

<script>
(function(){
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---------- Theme cycle: dark -> light -> oled -> hc ----------
  var themes = ['dark','light','oled','hc'];
  var themeIcons = {dark:'◐', light:'☀', oled:'●', hc:'◆'};
  var themeBtn = document.getElementById('themeBtn');
  var saved = localStorage.getItem('aperture-theme') || 'dark';
  applyTheme(saved);
  themeBtn.addEventListener('click', function(){
    var i = (themes.indexOf(document.body.getAttribute('data-theme')) + 1) % themes.length;
    applyTheme(themes[i]);
  });
  function applyTheme(t){
    document.body.setAttribute('data-theme', t);
    themeBtn.textContent = themeIcons[t];
    localStorage.setItem('aperture-theme', t);
  }

  // ---------- Camera ----------
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var status = document.getElementById('status');
  var readout = document.getElementById('readout');
  var flashBtn = document.getElementById('flashBtn');
  var flipBtn = document.getElementById('flipBtn');
  var shutterBtn = document.getElementById('shutter');
  var flashAnim = document.getElementById('flashAnim');

  var facingMode = 'environment';
  var currentStream = null;
  var torchOn = false;
  var photos = JSON.parse(sessionStorage.getItem('aperture-photos') || '[]');

  function startCamera(){
    if(currentStream){ currentStream.getTracks().forEach(function(t){t.stop();}); }
    status.textContent = 'Requesting camera access…';
    status.classList.remove('hidden');
    flashBtn.hidden = true;
    var constraints = { video:{ facingMode:{ideal:facingMode} }, audio:false };
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      currentStream = stream;
      video.srcObject = stream;
      status.classList.add('hidden');
      var track = stream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      flashBtn.hidden = !(caps.torch);
      readout.textContent = 'f/1.8 · READY';
    }).catch(function(err){
      status.textContent = 'Camera unavailable: ' + (err.message || err.name) +
        '. Check browser permissions and try again.';
    });
  }

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    startCamera();
  } else {
    status.textContent = 'This browser does not support camera access.';
  }

  flipBtn.addEventListener('click', function(){
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  flashBtn.addEventListener('click', function(){
    if(!currentStream) return;
    var track = currentStream.getVideoTracks()[0];
    torchOn = !torchOn;
    track.applyConstraints({ advanced:[{ torch: torchOn }] }).catch(function(){
      torchOn = !torchOn;
    });
    flashBtn.style.color = torchOn ? 'var(--accent)' : '';
  });

  shutterBtn.addEventListener('click', capture);

  function capture(){
    if(!currentStream) return;
    var w = video.videoWidth, h = video.videoHeight;
    if(!w || !h) return;
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    if(facingMode === 'user'){ ctx.translate(w,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, w, h);
    var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    photos.unshift(dataUrl);
    if(photos.length > 12) photos.pop();
    persistAndRender();
    flashAnim.classList.remove('on'); void flashAnim.offsetWidth; flashAnim.classList.add('on');
    readout.textContent = 'f/1.8 · CAPTURED';
    setTimeout(function(){ readout.textContent = 'f/1.8 · READY'; }, 900);
  }

  function persistAndRender(){
    try{ sessionStorage.setItem('aperture-photos', JSON.stringify(photos)); }catch(e){}
    renderStrip();
  }

  var strip = document.getElementById('strip');
  var emptyNote = document.getElementById('emptyNote');
  var lastThumb = document.getElementById('lastThumb');

  function renderStrip(){
    strip.innerHTML = '';
    emptyNote.hidden = photos.length > 0;
    lastThumb.hidden = photos.length === 0;
    if(photos.length){ lastThumb.src = photos[0]; }
    photos.forEach(function(src, idx){
      var img = document.createElement('img');
      img.className = 'thumb'; img.src = src; img.alt = 'Photo ' + (idx+1);
      img.addEventListener('click', function(){ openModal(idx); });
      strip.appendChild(img);
    });
  }
  lastThumb.addEventListener('click', function(){ if(photos.length) openModal(0); });

  // ---------- Modal / gallery ----------
  var modal = document.getElementById('modal');
  var modalImg = document.getElementById('modalImg');
  var downloadLink = document.getElementById('downloadLink');
  var deleteBtn = document.getElementById('deleteBtn');
  var activeIdx = -1;

  function openModal(idx){
    activeIdx = idx;
    modalImg.src = photos[idx];
    downloadLink.href = photos[idx];
    downloadLink.download = 'aperture-' + Date.now() + '.jpg';
    modal.classList.add('open');
  }
  document.getElementById('closeModal').addEventListener('click', function(){
    modal.classList.remove('open');
  });
  deleteBtn.addEventListener('click', function(){
    if(activeIdx > -1){ photos.splice(activeIdx, 1); persistAndRender(); }
    modal.classList.remove('open');
  });

  renderStrip();
})();
</script>
</body>
</html>
