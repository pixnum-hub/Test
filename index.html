<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<title>Pancha - Vedic Astrology Calculator</title>
<style>
:root{--bg:#121417;--fg:#e6e8eb;--mut:#9aa3ad;--card:#1b1f24;--bd:#2c333b;--ac:#f5a524;--in:#0f1215;--bw:1px}
[data-theme=light]{--bg:#f6f4ef;--fg:#1d2127;--mut:#5b6572;--card:#fff;--bd:#d9d4c8;--ac:#b45309;--in:#fff}
[data-theme=oled]{--bg:#000;--fg:#f2f2f2;--mut:#9a9a9a;--card:#000;--bd:#2a2a2a;--ac:#ffb020;--in:#000}
[data-theme=hc]{--bg:#000;--fg:#fff;--mut:#fff;--card:#000;--bd:#fff;--ac:#ff0;--in:#000;--bw:2px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{width:100%;max-width:760px;padding:16px 14px;flex:1}
h1{margin:8px 0 0;font-size:1.9rem;letter-spacing:.12em;color:var(--ac)}
h2{margin:0 0 10px;font-size:1.05rem;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:var(--bw) solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.themes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
button,input,select{font:inherit;color:var(--fg);background:var(--in);border:var(--bw) solid var(--bd);border-radius:10px;padding:10px 12px;min-height:44px}
button{cursor:pointer}
button[aria-pressed=true],.go{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
form{display:grid;grid-template-columns:1fr;gap:10px;text-align:left}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mut)}
input,select{width:100%;font-size:16px}
.row{display:flex;gap:8px}.row>input{flex:1}
.g3{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.g3{grid-template-columns:1fr 1fr 1fr}}
.msg{min-height:1.4em;color:var(--mut);font-size:.88rem;margin:4px 0}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{padding:7px 6px;border-bottom:var(--bw) solid var(--bd);text-align:center;white-space:nowrap}
th{color:var(--mut);font-weight:600}
tr.now td{color:var(--ac);font-weight:700}
svg{width:100%;max-width:420px;height:auto;color:var(--fg)}
svg text{fill:var(--fg);font-size:15px}svg .n{fill:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border:var(--bw) solid var(--bd);border-radius:10px;padding:8px}
.kv b{display:block;color:var(--ac)}
ul{list-style:none;margin:0;padding:0}li{padding:6px 0;border-bottom:var(--bw) solid var(--bd)}li:last-child{border:0}
.eng{color:var(--mut);font-size:.78rem}
footer{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;gap:.3em;white-space:nowrap;padding:18px 14px;color:var(--mut);font-size:.85rem;border-top:var(--bw) solid var(--bd);width:100%}
#tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}
#tabs button{min-height:36px;padding:5px 10px;font-size:.78rem;border-radius:8px}
#prt{display:none;--bg:#fff;--fg:#000;--card:#fff;--bd:#999;--mut:#333;--ac:#000;background:#fff;color:#000}
@media print{body>*:not(#prt){display:none!important}#prt{display:block}}
#tg{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);z-index:20;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--ac);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.3)}
@media print{#tg{display:none!important}}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>
<body>
<main>
<h1>PANCHA</h1>
<p class="sub">Vedic astrology calculator &middot; Lahiri sidereal &middot; whole-sign houses</p>
<button id="tg" type="button" aria-label="Change theme"></button>
<section class="card">
<form id="f" autocomplete="off">
<label class="full">Name (optional)<input id="nm" placeholder="Native name"></label>
<label>Birth date<input id="dt" type="date" required></label>
<label>Birth time (local)<input id="tm" type="time" step="60" value="12:00" required></label>
<label class="full">Birth place
<div class="row"><input id="pl" placeholder="City, e.g. Kolkata"><button type="button" id="find">Find</button></div></label>
<select id="res" class="full" hidden aria-label="Place results"></select>
<div class="g3 full">
<label>Latitude<input id="la" type="number" step="any" min="-90" max="90" required></label>
<label>Longitude (east +)<input id="lo" type="number" step="any" min="-180" max="180" required></label>
<label>Timezone (IANA)<input id="tz" required></label>
</div>
<label>Partner birth date (optional)<input id="pdt" type="date"></label>
<label>Partner birth time<input id="ptm" type="time" value="12:00"></label>
<label class="full">Native is<select id="pr"><option value="g">Groom</option><option value="b">Bride</option></select></label>
<button class="go full" type="submit">Calculate chart</button>
</form>
<p class="msg" id="msg" aria-live="polite"></p>
</section>
<div id="out"></div>
</main>
<footer><span>&copy; Manik Roy <span id="yr">2026</span>.</span><span>All Rights Reserved.</span></footer>
<script>
"use strict";
/* Swiss Ephemeris WASM (free, keyless, jsDelivr). If it cannot load, a built-in
   Meeus/Schlyter-style engine takes over so the app always works. */
const SWE_URL="https://cdn.jsdelivr.net/npm/swisseph-wasm@0.0.4/src/swisseph.js";
const $=s=>document.querySelector(s),mod=(x,n=360)=>((x%n)+n)%n,R=Math.PI/180;
const sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),tan=x=>Math.tan(x*R);
const SG=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const NK=["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];
const GR=["Ketu","Venus","Sun","Moon","Mars","Rahu","Jupiter","Saturn","Mercury"],DY=[7,20,6,10,7,18,16,19,17];
const TT=["Pratipada","Dwitiya","Tritiya","Chaturthi","Panchami","Shashthi","Saptami","Ashtami","Navami","Dashami","Ekadashi","Dwadashi","Trayodashi","Chaturdashi"];
const YG=["Vishkambha","Priti","Ayushman","Saubhagya","Shobhana","Atiganda","Sukarma","Dhriti","Shula","Ganda","Vriddhi","Dhruva","Vyaghata","Harshana","Vajra","Siddhi","Vyatipata","Variyan","Parigha","Shiva","Siddha","Sadhya","Shubha","Shukla","Brahma","Indra","Vaidhriti"];
const VR=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const PL=[["Sun","Su"],["Moon","Mo"],["Mars","Ma"],["Mercury","Me"],["Jupiter","Ju"],["Venus","Ve"],["Saturn","Sa"],["Rahu","Ra"],["Ketu","Ke"]];
const SID={Sun:0,Moon:1,Mercury:2,Venus:3,Mars:4,Jupiter:5,Saturn:6,Rahu:10};
/* --- fallback engine: [N0,N1,i0,i1,w0,w1,a,e0,e1,M0,M1], d = days since 1999-12-31.0 --- */
const EL={Sun:[0,0,0,0,282.9404,4.70935e-5,1,.016709,-1.151e-9,356.047,.9856002585],
Mercury:[48.3313,3.24587e-5,7.0047,5e-8,29.1241,1.01444e-5,.387098,.205635,5.59e-10,168.6562,4.0923344368],
Venus:[76.6799,2.4659e-5,3.3946,2.75e-8,54.891,1.38374e-5,.72333,.006773,-1.302e-9,48.0052,1.6021302244],
Mars:[49.5574,2.11081e-5,1.8497,-1.78e-8,286.5016,2.92961e-5,1.523688,.093405,2.516e-9,18.6021,.5240207766],
Jupiter:[100.4542,2.76854e-5,1.303,-1.557e-7,273.8777,1.64505e-5,5.20256,.048498,4.469e-9,19.895,.0830853001],
Saturn:[113.6634,2.3898e-5,2.4886,-1.081e-7,339.3939,2.97661e-5,9.55475,.055546,-9.499e-9,316.967,.0334442282]};
function orb(N,i,w,a,e,M){const E0=mod(M)*R;let E=E0+e*Math.sin(E0)*(1+e*Math.cos(E0));
 for(let k=0;k<6;k++)E-=(E-e*Math.sin(E)-E0)/(1-e*Math.cos(E));
 const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),u=Math.atan2(yv,xv)/R+w,r=Math.hypot(xv,yv);
 return[r*(cos(N)*cos(u)-sin(N)*sin(u)*cos(i)),r*(sin(N)*cos(u)+cos(N)*sin(u)*cos(i)),r*sin(u)*sin(i)]}
const el=(t,d)=>[t[0]+t[1]*d,t[2]+t[3]*d,t[4]+t[5]*d,t[6],t[7]+t[8]*d,t[9]+t[10]*d];
const lonOf=p=>mod(Math.atan2(p[1],p[0])/R);
function trop(n,d){const sun=orb(...el(EL.Sun,d));
 if(n==="Sun")return lonOf(sun);
 if(n==="Rahu")return mod(125.1228-.0529538083*d);
 if(n==="Moon"){const N=125.1228-.0529538083*d,w=318.0634+.1643573223*d,M=115.3654+13.0649929509*d,
  Ms=356.047+.9856002585*d,Ls=282.9404+4.70935e-5*d+Ms,Lm=N+w+M,D=Lm-Ls,F=Lm-N;
  return mod(lonOf(orb(N,5.1454,w,60.2666,.0549,M))-1.274*sin(M-2*D)+.658*sin(2*D)-.186*sin(Ms)-.059*sin(2*M-2*D)-.057*sin(M-2*D+Ms)+.053*sin(M+2*D)+.046*sin(2*D-Ms)+.041*sin(M-Ms)-.035*sin(D)-.031*sin(M+Ms)-.015*sin(2*F-2*D)+.011*sin(M-4*D))}
 const h=orb(...el(EL[n],d));return lonOf([h[0]+sun[0],h[1]+sun[1],h[2]+sun[2]])}
const ayanF=jd=>23.857+(jd-2451545)/365.25*.013969;
let SW=null;
async function initSwiss(){try{const m=await Promise.race([import(SWE_URL),new Promise((_,j)=>setTimeout(j,8000))]);
 SW=new m.default();await SW.initSwissEph();SW.set_sid_mode(1,0,0)}catch(e){SW=null}}
async function planets(jd){const L={},Rt={};let ay=ayanF(jd),eng="Built-in Meeus/Schlyter fallback (approx.)";
 if(SW){try{for(const[n]of PL){if(n==="Ketu")continue;const r=SW.calc_ut(jd,SID[n],4|256|65536);L[n]=mod(r[0]);Rt[n]=n==="Rahu"||r[3]<0}
  try{ay=SW.get_ayanamsa_ut(jd)}catch(e){}eng="Swiss Ephemeris (WASM, Moshier) + Lahiri"}catch(e){SW=null}}
 if(!SW){const d=jd-2451543.5;for(const[n]of PL){if(n==="Ketu")continue;L[n]=mod(trop(n,d)-ay);
  Rt[n]=n==="Rahu"||(!["Sun","Moon"].includes(n)&&mod(trop(n,d+.5)-trop(n,d-.5)+180)-180<0)}}
 L.Ketu=mod(L.Rahu+180);Rt.Ketu=true;return{L,Rt,ay,eng}}
function lagna(jd,lat,lon,ay){const T=(jd-2451545)/36525,ra=mod(280.46061837+360.98564736629*(jd-2451545)+.000387933*T*T+lon),
 ep=23.4393-.0130042*T;return mod(Math.atan2(cos(ra),-(sin(ra)*cos(ep)+tan(lat)*sin(ep)))/R-ay)}
/* --- helpers --- */
const fmt=x=>Math.floor(x)+"&deg;"+String(Math.floor(x%1*60)).padStart(2,"0")+"'";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nakOf=l=>{const k=l/(40/3),i=Math.floor(k);return{i,n:NK[i],p:Math.floor((k-i)*4)+1}};
function tzOff(tz,ms){const o={};new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"})
 .formatToParts(new Date(ms)).forEach(p=>o[p.type]=+p.value);return(Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second)-Math.floor(ms/1000)*1000)/6e4}
function toUTC(dt,tm,tz){const[y,m,d]=dt.split("-").map(Number),[h,mi]=tm.split(":").map(Number),g=Date.UTC(y,m-1,d,h,mi);let u=g;
 for(let k=0;k<3;k++)u=g-tzOff(tz,u)*6e4;return u}
function chart(ls,pl){const P=[[200,100],[100,48],[48,100],[100,200],[48,300],[100,352],[200,300],[300,352],[352,300],[300,200],[352,100],[300,48]];
 let s='<svg viewBox="0 0 400 400" role="img" aria-label="Rasi chart"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="396" height="396"/><path d="M2 2L398 398M398 2L2 398M200 2L2 200L200 398L398 200Z"/></g>';
 P.forEach((p,h)=>{const sg=(ls+h)%12,g=pl.filter(q=>q.sg===sg).map(q=>q.ab+(q.r&&q.ab!=="Ra"&&q.ab!=="Ke"?"*":""));
  s+=`<text class="n" x="${p[0]}" y="${p[1]-18}" text-anchor="middle">${sg+1}</text><text text-anchor="middle">`;
  for(let i=0;i<g.length;i+=2)s+=`<tspan x="${p[0]}" y="${p[1]+i*8}">${g.slice(i,i+2).join(" ")}</tspan>`;s+="</text>"});
 return s+"</svg>"}
function yogas(pl,ls){const g=n=>pl.find(q=>q.n===n),hs=n=>(g(n).sg-ls+12)%12+1,fm=(a,b)=>(g(b).sg-g(a).sg+12)%12+1,out=[];
 if([1,4,7,10].includes(fm("Moon","Jupiter")))out.push(["Gajakesari","Jupiter is in a kendra from the Moon: wisdom, reputation, lasting prosperity."]);
 if(g("Sun").sg===g("Mercury").sg)out.push(["Budhaditya","Sun and Mercury share a sign: sharp intellect and skill in communication."]);
 if(g("Moon").sg===g("Mars").sg)out.push(["Chandra-Mangala","Moon with Mars: drive and earning ability, often self-made wealth."]);
 [["Mars","Ruchaka",[0,7,9]],["Mercury","Bhadra",[2,5]],["Jupiter","Hamsa",[8,11,3]],["Venus","Malavya",[1,6,11]],["Saturn","Shasha",[9,10,6]]]
  .forEach(([n,y,s])=>{if(s.includes(g(n).sg)&&[1,4,7,10].includes(hs(n)))out.push([y+" (Pancha Mahapurusha)",n+" is strong and placed in a kendra from the ascendant."])});
 if([1,2,4,7,8,12].includes(hs("Mars")))out.push(["Mangal Dosha","Mars in house "+hs("Mars")+" from the ascendant: consider in marriage matching."]);
 const nb=["Mars","Mercury","Jupiter","Venus","Saturn"].some(n=>[2,12,1].includes(fm("Moon",n)));
 if(!nb)out.push(["Kemadruma","No planet beside the Moon in the 2nd, 12th or same sign: needs supportive dashas."]);
 return out.length?out:[["None prominent","None of the classical yogas checked here are formed."]]}
function dasha(moon,ut){const yr=365.2425*864e5,k=moon/(40/3),i=Math.floor(k);let li=i%9,s=ut-(k-i)*DY[li]*yr,now=Date.now(),rows="",ad="";
 for(let j=0;j<9;j++){const x=(li+j)%9,e=s+DY[x]*yr,cur=now>=s&&now<e;
  rows+=`<tr class="${cur?"now":""}"><td>${GR[x]}</td><td>${new Date(Math.max(s,ut)).toISOString().slice(0,10)}</td><td>${new Date(e).toISOString().slice(0,10)}</td><td>${cur?"running":""}</td></tr>`;
  if(cur){let t=s;for(let q=0;q<9;q++){const y=(x+q)%9,len=DY[x]*DY[y]/120*yr;if(now>=t&&now<t+len){ad=GR[x]+" / "+GR[y]+" until "+new Date(t+len).toISOString().slice(0,10);break}t+=len}}
  s=e}
 return`<div class="wrap"><table><tr><th>Mahadasha</th><th>From</th><th>To</th><th></th></tr>${rows}</table></div>`+(ad?`<p class="msg">Current Vimshottari (Maha / Antar): <b>${ad}</b></p>`:"")}
/* --- UI --- */
const msg=t=>$("#msg").textContent=t;let G=[];
const TH=["dark","light","oled","hc"];
function setTheme(t){document.documentElement.dataset.theme=t;{const i=TH.indexOf(t),g=$("#tg");g.innerHTML=["&#9790;","&#9728;","&#9679;","&#9681;"][i];g.title=g.ariaLabel="Theme: "+["Dark+","Light+","OLED True Black","High Contrast"][i]+" (tap to change)"}
 $('meta[name=theme-color]').content={dark:"#121417",light:"#f6f4ef",oled:"#000000",hc:"#000000"}[t];try{localStorage.setItem("pancha-theme",t)}catch(e){}}
$("#tg").onclick=()=>setTheme(TH[(TH.indexOf(document.documentElement.dataset.theme)+1)%4]);
let th="dark";try{th=localStorage.getItem("pancha-theme")||"dark"}catch(e){}if(!TH.includes(th))th="dark";setTheme(th);
$("#yr").textContent=new Date().getFullYear();
$("#tz").value=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
function pick(i){const g=G[i];$("#la").value=g.latitude;$("#lo").value=g.longitude;if(g.timezone)$("#tz").value=g.timezone;msg("Using "+[g.name,g.admin1,g.country].filter(Boolean).join(", "))}
$("#res").onchange=e=>pick(+e.target.value);
$("#find").onclick=async()=>{const q=$("#pl").value.trim();if(!q)return;msg("Searching...");
 try{const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&format=json&name="+encodeURIComponent(q))).json();
  G=j.results||[];$("#res").innerHTML=G.map((g,i)=>`<option value="${i}">${esc([g.name,g.admin1,g.country].filter(Boolean).join(", "))}</option>`).join("");
  $("#res").hidden=!G.length;G.length?pick(0):msg("No place found - enter latitude and longitude manually.")}
 catch(e){msg("Place search failed - enter latitude and longitude manually.")}};
$("#f").onsubmit=async e=>{e.preventDefault();msg("Calculating...");
 try{const lat=+$("#la").value,lon=+$("#lo").value,tz=$("#tz").value.trim(),ut=toUTC($("#dt").value,$("#tm").value,tz),jd=ut/864e5+2440587.5;
  if(!SW)await initSwiss();
  const{L,Rt,ay,eng}=await planets(jd),la=lagna(jd,lat,lon,ay),ls=Math.floor(la/30);
  const pl=PL.map(([n,ab])=>({n,ab,l:L[n],sg:Math.floor(L[n]/30),r:Rt[n],nk:nakOf(L[n])}));
  const mo=pl[1],sn=pl[0],ti=Math.floor(mod(mo.l-sn.l)/12),yg=Math.floor(mod(mo.l+sn.l)/(40/3)),ln=nakOf(la);
  const vr=VR[new Date(ut+tzOff(tz,ut)*6e4).getUTCDay()];
  const rows=pl.map(p=>`<tr><td>${p.n}${p.r&&p.ab!=="Ra"&&p.ab!=="Ke"?" (R)":""}</td><td>${SG[p.sg]}</td><td>${fmt(p.l%30)}</td><td>${p.nk.n} ${p.nk.p}</td><td>${(p.sg-ls+12)%12+1}</td></tr>`).join("");
  const nm=$("#nm").value.trim();
  C={pl,ls,la,ay,eng,ut,jd,lat,lon,tz,mo,sn,ti,yg,vr,ln,nm};C.sec=`
<section class="card"><h2>${nm?esc(nm)+" - ":""}Birth Summary</h2><div class="kv">
<div><b>Lagna</b>${SG[ls]} ${fmt(la%30)}<br>${ln.n} ${ln.p}</div>
<div><b>Moon sign (Rashi)</b>${SG[mo.sg]}<br>${mo.nk.n} pada ${mo.nk.p}</div>
<div><b>Tithi</b>${ti<15?"Shukla ":"Krishna "}${ti%15===14?(ti<15?"Purnima":"Amavasya"):TT[ti%15]}</div>
<div><b>Yoga / Vara</b>${YG[yg]} / ${vr}</div></div>
<p class="eng">Ayanamsa (Lahiri): ${fmt(ay)} &middot; Engine: ${esc(eng)}</p></section>
<section class="card"><h2>Rasi Chart (North Indian)</h2>${chart(ls,pl)}<p class="eng">Numbers are sign numbers (1 = Aries). * = retrograde. House 1 is the top diamond.</p></section>
<section class="card"><h2>Planetary Positions</h2><div class="wrap"><table><tr><th>Planet</th><th>Sign</th><th>Degree</th><th>Nakshatra</th><th>House</th></tr>${rows}</table></div></section>
<section class="card"><h2>Vimshottari Dasha</h2>${dasha(mo.l,ut)}</section>
<section class="card"><h2>Yogas &amp; Doshas</h2><ul>${yogas(pl,ls).map(y=>`<li><b>${esc(y[0])}</b><br>${esc(y[1])}</li>`).join("")}</ul></section>`.split("</section>").slice(0,5).map(x=>x+"</section>");await buildTabs();
  msg("");$("#out").scrollIntoView({behavior:"smooth"})}
 catch(err){msg("Could not calculate: check date, time, coordinates and timezone (e.g. Asia/Kolkata).")}};
/* ===== 46-tab extension ===== */
